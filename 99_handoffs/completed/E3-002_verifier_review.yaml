architecture_failure_falsifiability_vectors: >-
  Semantic test vectors only (hypothetical; no empirical claim), re-derived per protocol from the
  committed outcome_reachability_sanity_test records and rules: (A) each protocol's
  tested_scope_pass path yields VALIDATED_FOR_TESTED_SCOPE_ONLY on complete frozen-cell evidence;
  (B) each configuration_failure_evidence path (e.g. E3V-001 flush/codec loses an acknowledged
  record with a prospectively recorded materially distinct durable-acknowledgement candidate;
  E3V-002 discovery misses a grandchild with a distinct observer/supervisor candidate) yields
  IMPLEMENTATION_CONFIGURATION_FAILURE; (C) each architecture_classification_required_evidence
  path (canonical reproducible violations) forces mandatory independent classification — one
  buggy implementation is never automatically architecture failure, and equally never
  automatically configuration failure; (D) each canonical_architecture_handback_evidence path
  (independently reviewed named-assumption disproof or required-property failure inside the
  claimed design envelope) reaches ARCHITECTURE_HANDBACK with the exact set-equal canonical ADR
  set — reachable without exhausting an infinite implementation universe; (E) each
  inconclusive_evidence path yields EVIDENCE_MISSING_FAIL_CLOSED; (F) each
  unsupported_scope_evidence path yields PRODUCT_CLASS_UNSUPPORTED without favorable credit. A
  purely speculative alternative cannot block review indefinitely: an unnamed route is
  insufficient for configuration labeling, and absence of a concrete admitted candidate stops the
  lane for mandatory independent architecture classification
  (EVIDENCE_MISSING_FAIL_CLOSED_PENDING_INDEPENDENT_ARCHITECTURE_REVIEW).
