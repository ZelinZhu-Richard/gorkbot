  architecture_requirements: "65 unique AR IDs; 59 HARD_CONSTRAINT with Hard constraint YES and 6 WEIGHTED_PREFERENCE with NO; 13/13 fields per AR; 296 source references all canonical; every AR maps to 1-5 of the 25 domains; every AR has a required observable property and a prohibited outcome that name concrete fail conditions; every AR has an evaluation linkage resolving to suite cases/oracles/fixtures/protocols or E2-003 comparison, and an E3 obligation in E3V-001..008 or NONE (AR-COR-002, AR-PRF-002, AR-PRF-004 are paper-resolvable); 0 orphan AR. Semantic-duplicate check: AR-SEC-003 (recipient/use boundary) versus AR-SEC-006 (acquisition/takeover boundary), AR-DUR-003 (operation idempotency) versus AR-APR-002 (effect lifecycle), AR-PERF-001 (limits) versus AR-FAIL-002 (post-exhaustion reserve), AR-OBS-001 (structured state) versus AR-OBS-002 (explanations) each carry distinct properties and prohibited outcomes. Mechanism check: every Uncertainty/Provenance line leaves the mechanism unselected; AR-VER-001's separate execution context is verbatim contract §11.3."
  uf11_protected_entry: "AR-SEC-006 carries all eight required properties (protected path distinct from chat/model context, human takeover/protected entry, capture suspension/exclusion, raw value excluded from model context/transcript/evidence/logs, explicit recipient/use boundary via AR-SEC-003, fail-to-WAITING_FOR_USER/blocker, durable non-secret receipt, no replay on recovery); no technology named; UF-11 is in two AR source lists and primary in the CSV; TB-05/08/20, §14 fields 5/18, AQ-010, E3V-006, and domain questions D01/D08/D09/D11/D20 reference protected entry."
  traceability_equality: "296 edges both directions; 0 AR-only; 0 CSV-only; 127 primary, 169 secondary; primary/supporting restricted to hard ARs and secondary to weighted ARs; the equality rule is stated in §1 and mechanically checkable from the two files alone."
  fr025_fr026: "Primaries AR-COR-005 / AR-EVD-001 own the frozen semantics; AR-VER-002 and AR-TST-001 supporting; no other AR lists FR-025/FR-026."
  source_anchors: "127/127 anchors point to the section containing the row or heading; 0 stale forms; 0 invented sections; ID and anchor agree on every row; the only broad anchors are the UF headings, which are unique per flow."
  e2_002_contract: "30 fields; three-way stage classification (field 21) and comparative contributor burden (field 22) present; hard candidate details preserved in fields 2-20, 23-30; invalidity clause enforces them."
  level_b_reconciliation: "19 rows; every charter §16.2 bullet and §19 comparison subject explicitly included; groups/automation, updater, desktop blueprint, deterministic release, and Level C identifiers explicitly subsumed/deferred/excluded; no row is a required mechanism."
  e3_boundary: "8 obligations each stating property, bounded scope, evidence, E4/E5 remainder, validating outcome, handback outcome, and owner class; handback rules define when E2/ADR reopens versus implementation/model/configuration failure; E3V-006/E3V-007 no longer require the full suite; no E2 feasibility blocker is deferred (AQ-003/004/010 flagged for E2-003/E2-004)."
  lifecycle_semantics: "Duplicate delivery (AR-COR-001, TB-17, TB-19), resume revalidation (AR-DUR-002), external-event correlation (AR-DUR-002), and agent retirement/disable (AR-DUR-004) present; no multi-agent implementation required."
  threat_boundary_model: "20 rows x 9 semantic fields; all requested boundaries present; no security technology named; candidate contract imports the table."
  hard_preference_model: "Each of the 59 hard ARs traces to a frozen FR/RR/FC/UF/NEG semantic whose violation would violate E1 (compatibility floors AR-FUT-001..003 and local-first AR-PKG-001 trace to FC-001..009, FR-069, UF-16); each of the 6 preferences (latency, complexity, migration/reversibility, remote/concurrency adaptation, evidence overhead, contributor burden) could be violated by an E1-compliant architecture; §2/§8/§5 forbid compensation; no Level B mechanism is hard; no security/correctness AR was demoted (all SEC/COR/DUR/APR/VER/EVD/WSP/EXE/GIT ARs are hard)."
  decision_domains: "25/25 domains have 3-25 material ARs and an ownership question; §7 equals the inverse of AR bodies; no domain is covered solely by a generic catch-all (minimum sets: D15 CTX-001/CTX-002/DAT-001; D22 FUT-001/PKG-001/PRF-003/PRF-004; D23 COR-007/FUT-002/PRF-004/WSP-005)."
  architecture_neutrality: "0 hits for the technology/vendor/mechanism scan over both deliverables; §16 nonselection statement covers client, language, runtime, database, event store, workflow engine, queue, sandbox, container, VM, cloud, agent/model framework, provider, model, verifier occupant, packaging, concurrency, protected-entry mechanism, and Git invocation; candidates 0, accepted ADRs 0, architecture NOT_SELECTED in PROJECT_STATE and the requirements document."
  correctness_recovery: "AR-COR-004..007, AR-DUR-001..005, AR-VER-003, AR-APR-002 unchanged or strengthened; deleted-line review found no weakened clause; truthful completion, exact revision binding, stale verification, independent verification, predicate adequacy, partial completion, operation/effect identity, external-effect ambiguity, restart/recovery, lost acknowledgement, duplicate operations, stale workspace, partial writes, pause/resume, stop/force stop, and verification invalidation each remain hard."
  security_regression: "AR-SEC-001..006, AR-EXE-001/004, AR-WSP-001..005, AR-GIT-001, AR-APR-001/003, AR-MOD-002, AR-EVD-003 remain hard; prompt injection, authority hierarchy, filesystem scope, secret boundaries, protected entry, network, package scripts, Git hooks, destructive actions, external effects, approvals, provider boundary, tool boundary, and evidence integrity are each structurally required; AR-SEC-001, §5 item 3, §5.1 closing rule, and §14 field 18 forbid LLM-judgment-only enforcement."
  evidence_verification: "AR-EVD-001..003, AR-VER-001..003, AR-DAT-002, AR-MOD-002, AR-COR-005/006 make exact state/revision inspection, executor-independent evidence, deterministic rerun, effect/approval provenance, routing provenance, adequacy evaluation, stale-verification detection, and rejection of executor-summary-only proof structurally required."
  testability: "AR-TST-001..003 and §10 name seams for 170 cases, 18 oracles, 11 fixtures, 23 NEG families, 16 repository conditions, 30 Git/effect rows, 9 adequacy variants, 16 compositions, and 8 protocols; failure injection, recovery, approval simulation, lost acknowledgement, secret-surface observation, provider failure, model failure, process termination, revision mutation, stale state, and effect reconciliation seams are each named in AR-TST-001, §10, or the relevant AR's required observable property; every non-standard linkage identifier (OR-*, FIX-*, VER-ADQ, COMP, PROT-SLO/MET, EVR, RC/GE, ORDER-PREMATURE-MUTATING-REPRODUCTION, BOUND-CORRECTION-EXHAUSTION) resolves in the suite or checkpoint."
  e1_preservation: "Nine frozen artifacts blob-identical to the E1 gate commit c2f7093 and to the fixer-recorded IDs; the release checkpoint's only change since the reviewed E1 gate commit 7bbfebd is the E1 gate commit's own status transition; no diff since c2f7093 across 03_product, 06_evaluation, 10_checkpoints, 02_research, DECISION_LOG, MODEL_REGISTRY, SOURCE_LEDGER."

