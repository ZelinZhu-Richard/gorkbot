  against the committed bytes at 0d702b8, not against the fixer's labels. All six E2-001
  acceptance criteria PASS and all four required tests were re-run and pass. Every headline
  count reproduces from source: 127 canonical E1 IDs (56 FR / 15 RR / 9 FC / 4 SLO / 4 MET /
