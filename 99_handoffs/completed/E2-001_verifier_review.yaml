original_finding_dispositions:
  - finding_id: F-E2-001-01
    severity: MEDIUM
    disposition: RESOLVED
    evidence: >-
      AR-SEC-006 "Protected human acquisition and takeover boundary" exists as HARD_CONSTRAINT
      with sources FR-046, FR-047, NEG-SECRET-01, NEG-CRED-01, UF-11 and domains D01/D08/D09/
      D11/D20. Its description requires: a protected human-entry/takeover path distinct from
      ordinary conversation, repository content, model working context, and ordinary tool/
      terminal input; suspension or exclusion of agent/model/tool capture of keystrokes,
      clipboard, screen/screenshot, accessibility state, terminal stream, and the raw value
      during acquisition; raw value crossing only the AR-SEC-003 recipient/use boundary with
      every other surface receiving only a non-secret receipt; fail-closed to WAITING_FOR_USER
      or a blocker with zero improvised acquisition; durable non-secret identity/scope/outcome/
      denial/revocation/reconciliation record without the value; no recovery replay and resume
      only after full revalidation. Prohibited outcomes name conversational approval of raw
      reveal and fabricated receipts. Uncertainty states that the path, takeover presentation,
      carrier, and delivery mechanism are unselected. UF-11 appears in the AR-SEC-006 and
      AR-SEC-003 source lists; the CSV UF-11 row is primary AR-SEC-006 / supporting AR-SEC-003
      with a UF-11-specific implied_architecture_property; §14 fields 5 (TB-05/TB-08/TB-20) and
      18 require every candidate to answer protected entry/takeover, capture suspension,
      fail-to-wait, non-secret evidence, and non-replay; AQ-010 and E3V-006 carry the
      feasibility and focused-validation ownership. The strings takeover, protected entry, and
      capture suspension now occur in the requirements document (0 occurrences at 349a9f0).
      The 12-surface secret-marker seam of AR-SEC-003 is unchanged.
