  row's decision_domain_ids and e3_validation_obligation_ids equal the union over its mapped
  ARs; the §7 domain table equals the inverse of the AR bodies for all 25 domains; 8 E3V rows,
  19 Level B rows, 30 numbered §14 fields (exactly 1..30), 10 AQ rows, and 20 TB rows parse;
