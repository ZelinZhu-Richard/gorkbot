decisions_made:
  - "Scope authority: direct user instruction to fix the three supplied PR #1 review findings and run validator regressions in the existing workflow. This is repository maintenance, not an E3 task execution."
  - "The user explicitly prohibits TASK_REGISTRY/PROJECT_STATE changes and permits only this new maintenance handoff. No fictional task ID, lifecycle/status update, historical handoff rewrite, architecture/protocol change, model assignment, eligibility result, QPA change, autonomy transition, or E3 execution is recorded."
  - "Replace READY-cardinality routing with validation of the actual EXECUTE_TASK target against TASK_REGISTRY. Only exact READY or CLAIMED status permits this route; the broader active summary class does not. Dependency completion, summary classification, route eligibility, and empirical admission remain separate."
  - "README must have one designated current-command marker and an immediately following fenced text block. Parse exactly one leading MODE command from that block and PROJECT_STATE.next_recommended_action; reject absent, malformed, ambiguous, mismatched, or unknown execution targets. Historical/incidental modes outside the block and commented-out instructions cannot select a route. Preserve review, verification, fix, planning, status/resume and stage commands without execution-status coercion."
  - "Use dedicated Git-aware security enumeration; retain the general YAML/CSV/JSON walker. The mandatory set is git ls-files --full-name -z --cached --stage, with argument arrays and cwd=ROOT. Never apply EXCLUDED_DIRS or ignore rules to that set."
  - "Local supplemental coverage uses a separate git ls-files --full-name -z --others --exclude-standard listing. Standard Git ignores may omit untracked generated/local content only. Deduplicate the union. Fail closed on Git errors, malformed enumeration and repository/index environment overrides."
  - "Inspect working-tree bytes at indexed paths, not staged blob contents or history. Reject symlink/gitlink/unmerged indexed entries, missing/unreadable files and nonregular worktree entries. No-follow directory descriptors prevent the security scanner from following leaf or ancestor symlinks outside ROOT; FIFO opens are nonblocking before type rejection."
  - "Deliberate binary policy change: the previous test accepting skipped binary content now asserts rejection. Incrementally scan strict UTF-8 text; undecodable or NUL-bearing content fails explicitly even without a credential. No binary-extension/directory exemption, decode replacement, NUL stripping, file-size cutoff or undecodable-content discard was introduced."
  - "Keep the existing one-million-character line limit, bounded readline calls, universal newlines and secret patterns. Unsupported real binary assets require a separately reviewed scanning strategy."
  - "Run the security scan before format parsing in main(), so malformed tracked YAML cannot echo a detected credential and tracked YAML symlinks are rejected before a parser reads them. Real temporary-Git main() regressions exercise both paths."
  - "Add exactly the unconditional Run governance regression tests step after dependency installation: python -m unittest discover -s tests -v. Preserve all other workflow bytes, including validator, committed-diff whitespace step, permissions, triggers, versions, concurrency and timeout."
