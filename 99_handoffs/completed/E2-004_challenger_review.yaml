  checks:
    all_candidates_define_protected_entry_seam: "YES - C01 f04 protected_delivery_path + f18 protected_human_entry; C02 f04 protected_delivery_path (protected_entry_begins, ordinary_capture_stops, scope_validator, delivery, forbidden_raw_observers, persisted_receipt, worker_replacement, crash_semantics, replay_rule, revocation_and_fencing) + TB-05/TB-08/TB-20 + f18; C03 f08 protected_and_external_payload_ordering + f18 protected_entry"
    protected_entry_outside_normal_model_chat_context: "YES - each f18 states the path leaves ordinary chat/model/telemetry/command/event pipelines"
    observation_capture_exclusion_required: "YES - keystroke/clipboard/screen/accessibility/terminal/model/transcript/log/evidence named per AR-SEC-006 and UF-11 step 3"
    unauthorized_raw_value_paths_prohibited: "YES - C02 forbidden_raw_observers list; C03 raw_protected_payload_in_durable_history false; C01 transient protected memory only"
    fail_to_wait_exists: "YES - each f18: WAITING_FOR_USER or hard blocker when exclusion cannot be guaranteed; contract line 641; UF-11 step 2"
    no_selected_client_technology_at_e2: "YES - D-016 'final client technology ... is not yet selected'; E2-001 section 16; f27 E4 client/runtime items; 0 technology tokens"
    e2_cannot_meaningfully_test_real_client_surface: "YES - the E2-002 SPQ-02 contract required observers on keystroke/clipboard/screen/accessibility/terminal surfaces with no declared client/host; either the harness defines its own surfaces (prototype theater) or mandatory observers are missing (INCONCLUSIVE_BLOCKING), as the E2-003 challenger showed and the E2-003 verifier independently confirmed"
    candidate_topology_does_not_change_basic_acquisition_feasibility: "YES - the acquisition surface is the client in all three; topology changes only the delivery half (SPQ-03/04/05)"
    e3v_006_validates_selected_client_execution_configuration: "YES - register E3V-006 required_evidence (synthetic sentinel; complete named observer inventory for the selected client/execution configuration; exact binding; crash/replacement/revocation/expiry/recovery; raw-value absence scans; exact supported/unsupported scope); closure 7.2"
    implementation_failure_vs_architecture_failure_distinguishable: "YES - IMPLEMENTATION_CONFIGURATION_FAILURE / PRODUCT_CLASS_UNSUPPORTED / ARCHITECTURE_ASSUMPTION_DISPROVEN split in register, closure 7.2/11, handoff e3v_006_status"
    architecture_handback_trigger_exists: "YES - E3_HAND_BACK_TO_E2 when no conforming realization can satisfy a required protected-entry property under the linked ADR (ADR-E2-005 in register; ADR-E2-001/005 in closure 7.2; superset in closure 9/handoff - see F-E2-004-05)"
  aggressive_question: "If protected acquisition turns out infeasible on the intended product platform, does that invalidate all candidate architectures equally?"
  aggressive_answer: >-
    It affects all three equally and invalidates none. All candidates leave the client surface
    unselected and share the same acquisition seam; the product-internal protected path (route
    entry outside the product's own agent/model/tool capture channels) is realisable by any
    client class, so the genuine uncertainty is complete exclusion on the selected surface. If
    a selected client/platform class had no safe mechanism, frozen E1 (UF-11 step 2; AR-SEC-006)
    requires WAITING_FOR_USER/blocker with zero improvised acquisition: the supported client
    class narrows and the tasks that need secrets wait. That is product/platform support-scope
    validation and, at most, a post-selection handback to ADR-E2-001 (client surface) and
    ADR-E2-005 (protected-entry boundary); it cannot prefer or eliminate C01, C02, or C03, so it
    is not candidate-selection evidence and cannot be obtained before a client exists without
    pre-selecting a technology, which E2-004's forbidden_actions prohibit.
  result: S02_STAGE_OWNERSHIP_PASS
