s01_rederivation:
  historical: "SPQ-E2-002-01 (shared; C01/C02/C03 f27; NOT_RUN) -> E2U-S01-DESCENDANT-CONTAINMENT -> E3V-002"
  checks:
    all_candidates_expose_containment_and_fencing_boundary: "YES - C01 f04 execution_owner (bounded process groups, cancels descendants) + f10 process_boundary/cancellation; C02 f04 execution_owner (leased worker plus process-tree supervisor) + TB-07; C03 f04 execution_owner (fenced executor adapter owns one process tree) + f10 process_tree_expectation"
    process_ownership_explicit: "YES - integrated supervisor / worker supervisor / executor adapter"
    process_tree_semantics_explicit: "YES - f10 enforcement_layers.process_termination x3 states the host process-tree primitive must account for descendants; 'logical epoch/lease/workflow fencing alone is not evidence of descendant containment' in all three"
    stale_executor_authority_fenced: "YES - C01 owner epoch; C02 service lease/fence + epoch; C03 stream owner/fence; comparison 4.4 AR-DUR-004/AR-FUT-002"
    lack_of_safe_force_termination_fails_closed: "YES - frozen E1 contract line 371 'force-terminate when safe/available and otherwise fence/revoke'; line 955 NEG-TERM-01; EP-CTL-005; f26 unsupported_environments 'process classes that cannot be bounded or authority-fenced' x3; register S01 failure_implication"
    not_dependent_on_model_cooperation: "YES - f18 structural_fail_closed_rule (C01), fail_closed (C02/C03): 'the architecture does not ask the model to behave safely in lieu of a control'"
    concrete_host_mechanism_unselected: "YES - f27 E4 items 'process API'/'worker supervisor'/'executor/sandbox'; no technology token in any E2 artifact (scan 0 hits)"
    result_cannot_discriminate_c01_c02_c03: "YES - identical TIER_2 assumption, identical 'required host process-tree primitive' clause, identical fail-closed consequence in all three f10 blocks; the candidate-owned layer (epoch/lease/workflow fence) is analysis-confirmed"
    e3v_002_validates_selected_host_platform_configuration: "YES - E2-001 section 9 E3V-002; register E3V-002 required_evidence (exact host/platform/process/configuration support declaration and versions); closure 6.2"
    tested_scope_bounded: "YES - 'Validates only tested host/platform/process/configuration classes; never generalize beyond them'"
    unsupported_scope_remains_unsupported: "YES - PRODUCT_CLASS_UNSUPPORTED narrows and stays blocked/fenced; EVIDENCE_MISSING_FAIL_CLOSED cannot broaden"
    architecture_handback_if_structural_assumption_fails: "YES - E3_HAND_BACK_TO_E2 for ADR-E2-003/004 when no conforming realization can satisfy AR-EXE-003 for a required class"
  aggressive_question: "Could one candidate be fundamentally easier or harder to contain because of topology such that empirical proof should influence selection now?"
  aggressive_answer: >-
    No. Topology changes which process holds the tree handle (integrated core, leased worker,
    executor adapter) and how often that holder can die alone (C01 core exit takes the
    supervisor with it; C02 service may survive a worker crash; C03 coordinator may be absent by
    design). Whether a surviving orphan can then be killed, accounted for, and deprived of
    productive/effect authority is decided by the same host primitive and the same
    restart-reconciliation/fence contract in all three; E1 admits fencing plus explicit
    uncertainty when force termination is unavailable and admits the no-live-owner interval
    symmetrically (EP-CTL-016 is client-only disconnect). The residual difference - blast
    radius and frequency of supervisor loss - is already recorded as qualitative preference
    evidence (comparison 8/17.2 profiles A/F/G; V-E2-003-N8) and no host experiment can turn it
    into a hard pass/fail for one candidate. S01 therefore does not belong in E2.
  result: S01_STAGE_OWNERSHIP_PASS
