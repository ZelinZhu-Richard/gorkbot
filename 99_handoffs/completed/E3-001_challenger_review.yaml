    (cost_is_bounded_and_known const true + reservation refs); credential absence when REQUIRED
    (VALID/NOT_REVOKED/protected-entry consts + security_review_ref); data authorization
    (rights_verified true, clean_room PASSED, RESTRICTED forces DO_NOT_RUN); network (NONE forces
    zero egress/calls; AUTHORIZED requires allowlist/bounds); evidence destination (three
    destination objects + integrity VERIFIED + controls verified consts); isolation (required
    section + supported_class_verified true); handback binding (canonical set consts per E3V +
