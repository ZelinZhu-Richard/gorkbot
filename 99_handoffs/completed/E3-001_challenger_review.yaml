verdict_rationale: >-
  The common qualification and run-admission governance itself survives adversarial review on
  every safety dimension I attacked: fail-closure is structural, not prose (schema outcome enum
  is exactly PASS/DO_NOT_RUN/EXPIRED_REQUIRES_REFREEZE; default outcome DO_NOT_RUN; the master
  PASS conditional structurally forces founder acknowledgement + exact-value approval refs bound
  to 01_governance/DECISION_LOG.md with deciding_actor const Founder and CURRENT_NOT_REVOKED,
  zero-material-finding QPA challenge and separate verification records, protocol
  EXECUTION_READY_VERIFIED, harness VERIFIED, E3-001 governance-verification and E2-gate subject
  refs with recomputed digests, CLAIMED task status, independent checker, all-SATISFIED admission
  checks with evidence, clean stop/handback, zero drift triggers, and a 35-field single-use
  launch binding with atomic CAS, receipt, readback, and crash-reconciliation semantics; the
  PAID_EXTERNAL_VALIDATION lane and RESTRICTED data class force DO_NOT_RUN as consts under this
  schema version; REMOTE_EXTERNAL transport forces the paid lane, so free credits, trials, or
  prepaid subscriptions cannot ride the no-cost lane; the no-cost lane forces LOCAL_OFFLINE,
  zero egress/calls/effects, and credentials NOT_APPLICABLE while still requiring the full gate).
  All three canonical E3-QPA-001 families match the E2-frozen §11 registration byte-for-byte in
  substance, remain explicit null with DO_NOT_RUN consequences, and no default/fallback value
  exists anywhere in policy or schema (zero JSON-Schema "default" keywords; assignment values
  are integer minimum 1 with nulls representable only as whole-field nulls that PASS forbids).
  Frozen E1 verification-rerun/FLAKY/correction semantics are inherited accurately
  (VERIFICATION_ERROR-only same-revision rerun, CHANGES_REQUIRED/BLOCKED/INCONCLUSIVE excluded,
  later-pass-erasure forbidden), and E1/benchmark-plan numerics are explicitly quarantined from
  QPA nulls. Correction accounting binds ceilings to harness-selected membership-independent
  series and per-scope stable-member registries keyed by project/stage/task/scope so
  remove/re-add, rename-adjacent, clone, fresh-ID, and new-series resets fail closed with 95
  unique negative vectors (93 DO_NOT_RUN, 2 EXPIRED). Evidence layers, contamination, hard
  failures, handback (sets equal to the canonical E2 sets in policy overlay and schema consts),
  E3V-002/E3V-006 overlays, model-benchmark exact-configuration identity, EVALUATION_ONLY route
  separation, autonomy invariants, and the byte-level preservation of every frozen E1/E2/ADR/
  checkpoint artifact all re-derive PASS. However, one MEDIUM defect prevents acceptance under
  the no-unresolved-BLOCKER/HIGH/MEDIUM rule: the author's TASK_REGISTRY edit reached outside the
  E3-001 entry and retroactively inserted 05_architecture/ENGINEERING_PREVIEW_ARCHITECTURE_REQUIREMENTS.md
  into the deliverables list of the independently VERIFIED E2-005 task — a factually wrong
  attribution (the file is an E2-001 deliverable created at 349a9f0/0d702b8; E2-005's allowed
  paths exclude it and its handoff/verifier records do not list it as created or modified) that
  silently mutates the recorded history of a verified task and is disclosed nowhere in the E3-001
  handoff. Two LOW findings (a mutable governance-state snapshot embedded in the schema artifact;
