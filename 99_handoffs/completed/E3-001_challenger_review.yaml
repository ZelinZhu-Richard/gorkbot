  qpa_null_state: >-
    The three governed values equal the E2-frozen §11 scope-aware families (verification-rerun
    per case/task; deterministic required-check repetition rule/value per check/class;
    correction-attempt per case/task); no fourth family exists in any source; no unauthorized
