    manifest/attempt identifiers excluded from lineage identity; removed members remain
    authoritative; re-added members resume prior consumption; only never-before-seen members may
    initialize state after a required complete cross-set overlap search; manifests cannot select
    or fork registries; DENY-QPA-010/011/012 and DENY-MFACT-001 close reset paths. A renamed
    case becomes a truly-new member only through a CORRECTION with material diff plus a
    prospectively founder-approved QPA assignment and fresh review cycle, which is a defensible
    governance rule rather than perfect semantic identity.
  flaky_policy: >-
    Mixed ordered outcomes are FLAKY; a later pass erases nothing (consts in schema and policy);
    credit requires the complete prospectively declared repetition rule; deterministic
    repetition is a per-scheduled-attempt requirement (consumed_before 0, reserved equals the
    frozen resolved value, remaining 0), never a decrementing lifetime ceiling (DENY-QPA-009);
    missing/inconclusive/flaky treated as pass is DO_NOT_RUN (DENY-STOP-002); numbers stay
    QPA-owned nulls. Matches frozen E1 EP-FALSE-010 and correctness-contract §745 semantics.
  contamination_policy: >-
    Development/smoke/scored partitions immutable and lane-matched (attempt_class ->
    partition conditionals); held-out bytes/labels/expected results unavailable to tuning with
    digest and access-actor recording; blinding and grader independence for scored PASS;
    tuning-on-held-out, decision-case reuse, favorable seed/order, selective retry/rerun/
    omission, post-result exclusion/denominator/threshold changes, label exposure, dev/smoke
    promotion, and candidate-specific defect exclusion are enumerated forbidden practices with
    DENY-CONTAM-001/002, DENY-GRADE-001, DENY-EVID-002; prompt correction without a new version
    is impossible (configuration/prompt change requires a new configuration version);
    contamination consequence is stop/quarantine/blocked credit/independent review.
  hard_failure_policy: >-
    Fifteen non-compensating classes cover unauthorized effect, secret exposure, fabricated/
    deleted/omitted evidence, false completion, approval/admission bypass or replay, stale
    verification, hidden fallback, scope escape, stop/fence/wait failure, clean-room violation,
    and frozen hard-invariant failure; averages and later passes cannot compensate; immediate
    actions stop dispatch, fence effects, quarantine and preserve evidence, record truthful
    noncomplete status, and escalate for independent classification; schema forces
    lane-stop + non-PASS outcome whenever hard_failure_status is unresolved or any exhaustion/
    stop flag is set; benchmark scores cannot average a hard failure away (INELIGIBLE path
    reserved to the authorized synthesis/verification chain).
  architecture_handback: >-
    IMPLEMENTATION_CONFIGURATION_FAILURE and ARCHITECTURE_HANDBACK are distinct root-cause
    classes; downgrade attacks fail because the root-cause record must be independently
    verified with distinct operator/investigator/verifier, bind the exact fault chain and
    canonical ADR set, and prove all-compliant-route exhaustion and structural impossibility
    (consts in the PENDING conditional; DENY-HANDBACK-001/002); admission can bind but never
    manufacture a handback (this_admission_creates_architecture_handback const false); all eight
    canonical ADR sets re-derive set-equal to the E2-accepted sets in both artifacts; E3V-002
    (ADR-E2-003/004/007), E3V-006 (ADR-E2-001/004/005/007/008/009) and E3V-008 (ADR-E2-006
    structural-gateway-impossibility-only) receive the special treatments the E2 baseline
    requires; e3_may_edit_or_redesign_accepted_adr false and e3_edits_accepted_adr const false.
  e3v_admission_coverage: >-
    ALL_E3V_COMMON_GATES profile is inherited by every E3V (every_e3v_inherits_profile true) and
    carries the ten shared gates; schema conditionals pin per-E3V handback consts, E3-005 ->
    E3V-001..007 + E3-002 protocol, E3-006 -> E3V-008 + E3-003 protocol; specialization objects
    are structurally forced non-null exactly for E3V-002/E3V-006 and null otherwise; no E3V has
    a bypass — E3V-008 adds requirements (exact configuration identity, EVALUATION_ONLY route,
    fallback cross-binding) rather than exemptions.
  e3v_002: >-
    Overlay + specialization require exact host/platform/process/privilege/supervisor/support
    class, safe synthetic task-owned descendant fixtures only (const true), containment/
    termination/survivor/orphan/fence/restart/recovery evidence refs, survivor-loses-authority
    rule, no real-user/destructive workload (const false), stale-authority rejection and
    recovery/readback in the common isolation binding, unsupported classes
    BLOCK_OR_FENCE_AND_MARK_UNSUPPORTED, stop rules, and ADR-E2-003/004/007 handback. No
    mechanism/host is selected (technology_selected_by_e3_001 false) and no validation run
    occurred (counters 0; no harness/fixture files exist).
  e3v_006: >-
    Synthetic marker only (const), exact client/runtime/carrier/recipient ref, complete
    capture-surface inventory ref, exact one-use recipient/use/fence binding, stale/replay/
    wrong-recipient denial, crash/replacement reacquisition, marker outside exact recipient
    forbidden (const false), replay forbidden (const false), missing protected delivery ->
    WAITING_FOR_USER/BLOCKED enum, independent security review as a VERIFIED ref plus
    security_review_required_for E3V-006; credentials structurally NOT_APPLICABLE for E3V-006
    (synthetic markers are not credentials; protected-entry semantics live in the
    specialization). Matches ADR-E2-005 protected-acquisition semantics and the E2U-S02 chain.
    No real secret, no client mechanism selected, no run occurred.
  model_benchmark_admission: >-
    A model name alone cannot run: E3-006 conditional requires nonempty provider/model_id/
    served_model_version, reasoning and tool configuration refs, envelope/eligibility key
    digests, context and prompt versions, logical_role enum, grader/verifier identities and
    independence, registry candidate ref; configuration identity requires system/provider,
    served version, reasoning parameters, tools/gateway, fallback policy and every fallback
    configuration, context/prompt versions, grader/verifier configuration; family aliases are
    explicitly not exact configurations (DENY-ROUTE-001); budget/credential/evidence-destination
    requirements ride the common gates; hard-failure rules bind via stop/handback and
    contamination sections.
  route_eligibility_separation: >-
    Every PASS pins route_purpose E3_EVALUATION and route_eligibility EVALUATION_ONLY (consts);
    PASS creates no credit, qualifies nothing, promotes nothing, authorizes no later run
    (consts/flags); no_global_family_eligibility true; normal_route_promotion_automatic false;
    eligibility remains downstream of E3-007 synthesis (propose-only) + E3-008 independent
    verification + stage gate (AUTONOMY_ELIGIBLE only) + future governance; benchmark PASS ->
    ELIGIBLE transition does not exist anywhere in policy, schema, or registry.
  model_registry: >-
    Recomputed: 13 candidate templates under models:; 13/13 HYPOTHESIS_ONLY role_assignment_
    status; 13/13 NOT_RUN benchmark_status; current_role_assignment_count 0; 0 eligibility
    verdicts; registry untouched by the E3-001 diff; schema-like additions (verdict vocabulary,
    planned protocol pointer) read as plan-only text, not results; no provider/model preselected.
  protocol_activation: >-
    E3-002/E3-003 remain BACKLOG with activation "E3-001 is independently VERIFIED and its
    common admission/QPA/evidence schema is frozen" — not too weak (author completion,
    challenger pass, or author-side helpers cannot activate them; completion_transition assigns
    activation to post-verifier lifecycle) and not needlessly strong (drafting needs no founder
    decision: decision_dependencies.not_required_before covers author drafting; empirical
    execution additionally requires E3-004, QPA approval, and per-block admission). This
    challenger review activates nothing.
  run_task_blocking: >-
    E3-005/E3-006 are BACKLOG with planning_status PLANNED_DO_NOT_RUN_ADMISSION_REQUIRED and
    run_admission_status DO_NOT_RUN; dependencies E3-002+E3-004 / E3-003+E3-004; conditional
    blockers name verified protocol/harness/QPA and per-block admission, plus S0-005/account/
    budget/credential/data/region/network for real-provider work; nothing in E3-001's outputs
    can make either READY (policy task_and_gate_boundaries: any_empirical_task_may_become_ready
    false after E3-001 verification).
  harness_boundary: >-
    e3_004_boundary VALIDATION_HARNESS_CODE_ONLY_NO_SCORED_OR_CANDIDATE_RUN; future harness is
    bounded, protocol-linked, independently reviewed, cannot hide application implementation,
    cannot call a provider without separate admission, and cannot produce accepted empirical
    evidence before the harness itself is VERIFIED; E3-004 registry entry carries the
    application-code/path denylist test; no harness code exists at HEAD.
  autonomy_governance: >-
    Everywhere consistent: gate_effect AUTONOMY_ELIGIBLE_ONLY; does_not_authorize_e4 true;
    AUTONOMY_ELIGIBLE NOT_ELIGIBLE; AUTONOMOUS_BUILD_AUTHORIZED NO/false with separate explicit
    founder decision required (charter §18/19, MASTER_OPERATING_PROMPT D-016, PROJECT_STATE E4
    block, policy non_authorizations, handoff); run admission cannot be confused with build
    authorization (policy: admission PASS authorizes exactly one launch and nothing else).
  e2_baseline_preservation: >-
    git diff fd3a7e7..3766786 over 05_architecture/ (EP-ARCH-C01 candidate, baseline, ADR-E2-001
    ..009, E3 validation obligations), 03_product/, 06_evaluation/ENGINEERING_PREVIEW_EVALUATION_
    SUITE.md, MODEL_ROLE_BENCHMARK_PLAN.md, E3_PLAN.md, 10_checkpoints/, DECISION_LOG.md,
    MODEL_REGISTRY.yaml is empty — zero semantic or byte modifications to EP-ARCH-C01,
    ADR-E2-001..009, canonical E3V definitions, or the E2 gate result. The registry deliverables
    edit in F-E3-001-C01 damages E2-005 bookkeeping provenance but changes no accepted E2
    semantic content; it is dispositioned as its own MEDIUM finding rather than a baseline
    failure.
  no_execution: >-
    Mechanically confirmed: 5-file YAML-only diff; no code files; all execution counters 0 in
    registry, PROJECT_STATE, and handoff; no credential/network/provider/paid action recorded or
    implied; DECISION_LOG unchanged; no eligibility or role assignment created.
  admission_schema: >-
    Root and all 23 sections plus 100 $defs are closed (additionalProperties false everywhere an
    object carries properties — recomputed 0 exceptions); required fields cover every section;
    nullable fields are explicit oneOf null unions whose null branches PASS structurally
    forbids; enums closed; versions/digests/ids typed; state-specific fields constrained
    (DO_NOT_RUN forces launch/plan nulls + blocker reasons; EXPIRED forces prior-pass ref +
    triggers + refreeze + nulled launch; PASS forces the full authority set). "Schema-valid but
    semantically unauthorized" manifests cannot launch: the policy makes semantic verification
    mandatory, explicit, and fail-closed (independent_semantic_fact_verification_required true;
    x-semantic-validation any_failed_or_unknown_check_outcome DO_NOT_RUN; ~100 named semantic
    checks including ref resolution, digest recomputation, founder record currentness, ledger
    projections, and consumption state). Residual hygiene items are LOW/NOTE (F-C02, F-C03,
    stray no-op uniqueItems, x-current-policy-state snapshot).
  manifest_semantic_verification: >-
    The semantic layer independently verifies: referenced IDs/artifacts exist and digests
    recompute under the single global integrity profile; referenced versions and approvals
    current/nonrevoked (CURRENT_NOT_REVOKED consts + currentness checks); budget arithmetic and
    conservative remaining; reservation uniqueness and atomic set membership; credential
    validity/scope/revocation; protocol verified with frozen-field-set digest equality;
    configuration exactness incl. served version; evidence destination separation/integrity;
    handback ID and canonical-set equality; route validity; zero material drift with epoch/
    fence readback; launch not already consumed (UNCONSUMED state + CAS + receipt + readback).
    Failure outcome DO_NOT_RUN. Owner task is E3-004 with harness-selected stores so manifests
    cannot select their own validators, indexes, or ledgers.
