new_findings:
  - finding_id: F-E3-001-C01
    severity: MEDIUM
    title: Undisclosed retroactive edit of the VERIFIED E2-005 task's deliverables in TASK_REGISTRY
    evidence: >-
      git diff fd3a7e7..3766786 hunk at TASK_REGISTRY.yaml line ~2117 adds
      "05_architecture/ENGINEERING_PREVIEW_ARCHITECTURE_REQUIREMENTS.md" to the E2-005 entry's
      deliverables list. That file is an E2-001 deliverable (authored 349a9f0, fixed 0d702b8;
      listed under E2-001 deliverables and allowed_files_to_change). E2-005's
      allowed_files_to_change excludes it, and E2-005's handoff files_created/files_modified and
      verifier record do not list it (it appears there only under files_read). The E3-001
      handoff's decisions_made, notes, and files_modified narrative disclose no edit outside the
      E3-001 entry, and the author-side "64/64 repository reconciliation ... exact five-file
      uncommitted patch ... frozen paths" claim did not surface it.
    affected_artifacts:
      - 01_governance/TASK_REGISTRY.yaml
      - 99_handoffs/completed/E3-001_handoff.yaml
    why_it_matters: >-
      The registry is the authoritative record of what each verified task delivered. Silently
      rewriting a VERIFIED task's recorded scope after verification — with a factually wrong
      attribution — is exactly the class of unreviewed history mutation this governance regime
      treats as a first-class hazard (cf. hard-failure classes for stale/wrong-revision evidence
      and the amendment rules requiring disclosed, attributed changes). It creates no run
      authority and changes no accepted architecture bytes, but it corrupts provenance an
      independent verifier previously certified and undermines confidence in the author's
      self-reported patch accounting.
    required_change: >-
      Fixer reverts the deliverables line in the E2-005 entry (restoring the verified record),
      or — only if the founder explicitly directs a historical correction — records the change
      as a disclosed, attributed amendment with rationale in the appropriate governance note
      rather than a silent list edit; the E3-001 handoff is amended to account accurately for
      every out-of-entry registry change.
    verification_method: >-
      Verifier diffs the fixed TASK_REGISTRY E2-005 entry against the fd3a7e7 (verified-era)
      bytes for the deliverables list, confirms the E3-001 handoff enumerates every registry
      hunk outside the E3-001 entry, and re-runs strict parse.
  - finding_id: F-E3-001-C02
    severity: LOW
    title: Mutable governance-state snapshot embedded in the schema artifact can silently go stale
    evidence: >-
      E3_RUN_ADMISSION_MANIFEST.schema.yaml ends with x-current-policy-state (e3_qpa_values null,
      founder_acknowledgement_recorded false, founder_value_approval_recorded false, paid USD 0,
      run_admission DO_NOT_RUN, counters 0). A future founder acknowledgement/approval changes
      DECISION_LOG/PROJECT_STATE without necessarily revving the schema, leaving this block
      factually wrong inside a frozen governance artifact; nothing in the file labels it
      non-authoritative or freeze-time-only.
    affected_artifacts:
      - 06_evaluation/e3_governance/E3_RUN_ADMISSION_MANIFEST.schema.yaml
    why_it_matters: >-
      Cross-artifact contradictions are the seed of "which record controls?" disputes. The
      snapshot currently points in the fail-safe direction (all null/false/zero), so it cannot
      grant authority, but a stale "founder_acknowledgement_recorded: false" after a real
      decision would put two committed artifacts in conflict.
    required_change: >-
      Label the block as a non-authoritative freeze-time snapshot subordinate to
      PROJECT_STATE/DECISION_LOG (one annotation line), or remove it from the schema artifact.
    verification_method: "Read the amended block; confirm an explicit non-authoritative/as-of marker or its removal; strict parse."
  - finding_id: F-E3-001-C03
    severity: LOW
    title: Nine unreferenced $defs, including three superseded generic QPA resolution-set variants
    evidence: >-
      $defs unreachable from the manifest shape: protected_admission_evaluation_index_record_ref,
      protected_admission_evaluation_slot_record_ref, direct_dispatch_consumption_execution_ref,
      direct_dispatch_consumption_readback_attestation_ref, fallback_route_resolution_execution_ref,
      fallback_route_resolution_readback_attestation_ref (shapes for deliberately external
      protected/runtime records), plus qpa_resolution_set, case_or_task_qpa_resolution_set,
      check_or_class_qpa_resolution_set (generic variants superseded by the three family-specific
      sets that the manifest actually uses).
    affected_artifacts:
      - 06_evaluation/e3_governance/E3_RUN_ADMISSION_MANIFEST.schema.yaml
    why_it_matters: >-
      The six external-record shapes are load-bearing for E3-004's semantic validator, but the
      schema never says they are external-contract-only, so nothing exercises them and they can
      drift from the policy's external-record contracts unnoticed; the three generic QPA set
      variants are dead code in a frozen governance artifact and invite accidental future use
      with weaker constraints (they omit the family/scope pinning of the specific sets).
    required_change: >-
      Annotate the six external-record defs as external-record contracts consumed by the E3-004
      validator (not manifest-reachable), and remove or equivalently annotate the three
      superseded generic QPA resolution-set defs.
    verification_method: "Re-run the def-reference audit; confirm every remaining unreferenced def carries an explicit external-contract annotation."
  - finding_id: F-E3-001-C04
    severity: NOTE
    title: "Uncommitted-patch wording overtaken by the founder's commit"
    evidence: >-
      The handoff's repository_commit_or_patch says "UNCOMMITTED working-tree patch ... leave
      uncommitted for Founder review" and PROJECT_STATE next_recommended_action says the
      challenger "must attack the uncommitted ... policy"; the founder has since committed the
      patch as 3766786 and the tree is clean.
    affected_artifacts:
      - 99_handoffs/completed/E3-001_handoff.yaml
      - 01_governance/PROJECT_STATE.yaml
    why_it_matters: "Statements were true at authoring time; per repo precedent this is a founder-commit-time refresh item, recorded so the verifier does not treat the wording as a live discrepancy."
    required_change: "Optional wording refresh during the fixer/verifier pass; no semantic effect."
    verification_method: "Read the two fields after any refresh."
  - finding_id: F-E3-001-C05
    severity: NOTE
    title: Dual status vocabulary for E3-005/E3-006 across registry and derived records
    evidence: >-
      TASK_REGISTRY records status BACKLOG plus planning_status PLANNED_DO_NOT_RUN_ADMISSION_
      REQUIRED plus run_admission_status DO_NOT_RUN, while PROJECT_STATE/handoff/policy use the
      composite token BACKLOG_DO_NOT_RUN. Substantively identical; the split predates E3-001
      (PLAN_STAGE_E3) and E3-001 merely inherited it.
    affected_artifacts:
      - 01_governance/TASK_REGISTRY.yaml
      - 01_governance/PROJECT_STATE.yaml
    why_it_matters: "A future mechanical reconciler comparing status fields literally will flag a false mismatch; documenting the equivalence avoids a spurious drift alarm."
    required_change: "None required for E3-001; optional future vocabulary alignment."
    verification_method: "N/A (informational)."
  - finding_id: F-E3-001-C06
    severity: NOTE
    title: "README status line still says E3-001: READY"
    evidence: "README.md current-status bullet reads \"E3-001: `READY`\" while the registry records READY_FOR_REVIEW; README is not in E3-001's allowed paths and prior gates treat README refresh as a founder commit-time item."
    affected_artifacts:
      - README.md
    why_it_matters: "Stale top-level status can mislead a casual reader; authoritative state is unaffected."
    required_change: "Founder-side README refresh at a convenient commit."
    verification_method: "Read the README bullet after refresh."
  - finding_id: F-E3-001-C07
    severity: NOTE
    title: Stray no-op uniqueItems keyword on a scalar digest field
    evidence: "architecture_and_e3v_binding.properties.canonical_handback_set_digest carries uniqueItems: true beneath a oneOf digest/null scalar union; uniqueItems constrains only arrays, so the keyword is inert."
    affected_artifacts:
      - 06_evaluation/e3_governance/E3_RUN_ADMISSION_MANIFEST.schema.yaml
    why_it_matters: "Pure hygiene; no validation effect in Draft 2020-12."
    required_change: "Optional removal during any future schema rev."
    verification_method: "Grep the property after any rev."
