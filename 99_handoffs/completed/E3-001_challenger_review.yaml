  admission_state_machine: >-
    Transitions unambiguous under the three-outcome precedence: never admitted / missing
    authority without prior PASS -> DO_NOT_RUN (EXPIRED structurally requires
    prior_pass_manifest_ref non-null + triggers minItems 1, so missing authority cannot
    masquerade as EXPIRED); prior PASS + any of 13 drift triggers or consumption -> EXPIRED (the
    consumed-only case is representable because PRIOR_SINGLE_USE_PASS_CONSUMED is itself an
    enum trigger); PASS cannot survive drift (PASS forces triggers maxItems 0 +
    all_required_facts_current true + epoch/fence currentness + dispatch-time zero-drift
    predicate; fact commits atomically advance epoch and fence prior PASSes). Hard stop during a
    valid launch does not rewrite the historical PASS. Handback is a governed consequence, not
    a fourth outcome. Rerun-after-PASS, retry-after-transient, and correction-after-failure each
    require a fresh single-use manifest and independent PASS.
  atomic_admission: >-
    Two launchers/one admission: single-use launch binding + UNCONSUMED_RESERVED -> CONSUMED CAS
    + one terminal decision per gap-free capture slot + concurrent/replay rejection. Double
    budget spend: one atomic reservation set in canonical member order, no partial commit,
    ledgers append-only and complete from first attempt. Validate-then-policy-change: material
    fact epoch + fence bound into grants/decision/final set/launch and rechecked in one atomic
    dispatch predicate. Credential revocation between validation and launch: dispatch-time grant
    recheck incl. revocation. Version drift: SERVED_VERSION drift trigger fences the PASS.
    Post-handback launch: PASS requires no pending handback and handback advance is a drift
    trigger. Retry reusing consumed admission: every operation kind requires a fresh manifest and
    fresh PASS. Crash after reservation: durable consumption receipt + post-record readback +
    reconciliation before any retry; unknown outcomes block terminal visibility. Ownership:
    one current owner epoch/fence across reservations; authority transfer atomically fences old
    reservations. Semantics are architecture-compatible contracts; no implementation algorithm is
    selected, matching E3-001 scope.
