    conflicting/stale required fact is a DO_NOT_RUN trigger; the master PASS allOf conditional
    pins ~60 facts (founder ACKNOWLEDGED + APPROVED with DECISION_LOG-bound refs, QPA
    challenge/verification refs with unresolved_material_findings_count const 0, protocol
    EXECUTION_READY_VERIFIED, harness VERIFIED, E3-001/E2-gate subject refs, CLAIMED task,
    independent checker const true, self-admission const false, all_pass_checks with SATISFIED +
    evidence minItems 1, freshness prior_pass_consumed false + material_change_triggers maxItems
    0, stop_and_handback all clear, launch binding + reservation intent + atomic set +
    dispatch predicate non-null). Attack paths tried and blocked: missing QPA values (PASS forces
    non-null assignment sets whose items are integers >= 1); expired admission (EXPIRED conditional
    + PRIOR_SINGLE_USE_PASS_CONSUMED trigger enum); missing protocol verification (const
    EXECUTION_READY_VERIFIED + verification_ref non-null); configuration drift (13-trigger
