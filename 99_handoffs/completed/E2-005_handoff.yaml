baseline_coverage:
  requirement_trace: "127 frozen E1 IDs -> 65 AR IDs -> nine proposed ADR primary assignments; every AR assigned exactly once and all hard/preferences retained."
  domains: "All D01-D25 explicitly mapped."
  security: "All TB-01..TB-20 carry trust/assets, authority, allowed flow, forbidden flow, enforcement point, fail-closed behavior, evidence/observability, and recovery/replay implications in the baseline; unsupported compromised-host class remains explicit and no LLM judgment grants authority."
  recovery: "Twenty-five complete scenarios plus seven C01 partial-filesystem subcases cover client/core/host/owner/child failure; model/tool timeout; lost result/acknowledgement; partial authoritative/filesystem mutation; stale workspace/approval/verification; duplicate/reordered input/operation/effect; redirect/resume; stop/shutdown; protected-delivery and provider/request ambiguity. Each records source, readback, action, ambiguity, evidence, owner/escalation, invalidation, dispositions, ADR/AR and E3/E4 linkage while preserving KNOWN_SUCCESS/KNOWN_FAILURE/UNKNOWN_OUTCOME and denying global atomicity."
  approval_effect: "Durable INTENT -> APPROVAL/REFUSAL -> ATTEMPT -> OBSERVED_EFFECT -> CONFIRMED_EFFECT/KNOWN_FAILURE/UNKNOWN_EFFECT with stable identity, exact scope, revocation/staleness, replay protection, target readback, reconciliation, and no global cross-boundary transaction claim."
  evidence_verification: "Exact revision, operation/approval/effect/routing/actor/model/tool provenance, immutable evidence references, predicate adequacy, separate least-privilege verifier context, stale invalidation, integrity/gap state, and limitations."
  testability: "Seams preserved for 170 cases, 18 oracles, 11 fixtures, 23 NEG families, 16 repository conditions, 30 Git/effect classes, nine predicate-adequacy variants, 16 dangerous compositions, eight reliability protocols, and EP-CTL-016; none implemented or run."
  local_first: "One task-bound integrated runtime/package plus owned child/verifier processes; no mandatory daemon or cloud service."
  future_compatibility: "Required-now, reserved-compatibility, and deferred-later classifications preserve versioned remote/concurrency/multi-agent/multi-client/extension/edition/SaaS seams without implementing them."
  clean_room: "All 19 Level-B pattern-family dispositions are justified through frozen E1/E2 constraints; no Level-C source, module, schema, name, layout, constant, asset, or claimed external runtime behavior is imported."
