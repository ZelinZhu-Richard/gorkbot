    AR-PRF-004: "C02 has the clearest direct remote-worker seam and C03 has a serializable dispatch boundary; C01's remote evolution is costlier but remote execution is not required now."
    AR-PRF-005: "C01 has compact current-state access and C03 strongest reconstruction; all evidence/large-output overhead remains unmeasured."
