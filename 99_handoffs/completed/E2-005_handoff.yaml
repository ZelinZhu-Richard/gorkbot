decision_rationale:
  method: QUALITATIVE_CURRENT_SCOPE_PROPORTIONALITY_NO_WEIGHT_NO_SCORE
  hard_gate: "All three candidates retain 57 CONFIRMED_SATISFIED_FOR_COMPARISON plus two ARCHITECTURE_SEAM_CONFIRMED_E3_VALIDATION_OUTSTANDING hard results, with zero architecture-blocking spikes and zero violations. Missing E3 evidence receives no favorable interpretation."
  current_scope_precedence: "D-016 makes local-first, single-user Engineering Preview operation REQUIRED_NOW and leaves remote execution, concurrent tasks, multiple agents/clients, extensions, editions, and SaaS as reserved or deferred."
  decision_rule_source: "After the non-compensating hard tie, use D-016 for present scope; E2 plan section 15 plus verified AR-PRF-002/004 for qualitative present-structure proportionality; comparison sections 5, 13, and 17.2 for contributor trade-offs and sensitivity. Immediate mandatory complexity receives more present scrutiny than reserved compatibility machinery, while future evolution remains a real preference and reopen surface. No numeric or hidden weights exist."
  c01_reason: "C01 provides the shortest mandatory present authority/control path without requiring a persistent local service, service IPC/authentication, worker-lease lifecycle, or journal/reducer/projection authority model before those structures have present scope value. This is best fit for current verified scope under stated qualitative precedence, not an objective or universal winner."
  admitted_costs: "The integrated core has a broader crash/coupling radius, heavier internal-boundary documentation burden, costly later authority extraction, and foundational transactional-state/history/effect semantics."
  contributor_basis: "Contributor accessibility is taken from the verified comparison rather than inferred from process count: C01 has one visible runtime but broad-core coupling, C02 has narrower subsystems but multi-process setup, and C03 has deterministic replay fixtures but event/reducer onboarding."
  sensitivity_basis: "All seven verified profiles were cross-checked: A supports C01's minimal-topology fit; D supports only its setup-topology sub-dimension while preserving distinct C02/C03 contributor advantages; B/C/G preserve C03 replay, C02 remote-worker, and differentiated testability pressure; E/F establish no stable candidate-wide migration or security-boundary winner. No profile is treated as an overall winner."
rejected_alternatives:
  EP-ARCH-C02:
    status: ANALYTICALLY_VIABLE_NOT_PROPOSED_FOR_V0_1
    preserved_strength: "Clearest direct remote-worker seam, replaceable leased/fenced workers, worker fault isolation, and explicit subsystem ownership."
    reason: "A mandatory local service, IPC/authentication, lease/fence, correlation, and lifecycle surface adds present operational/security burden while remote or multi-worker execution is not REQUIRED_NOW."
    reopen: "Reconsider if independently verified requirements make replaceable remote workers, service continuity across client lifetimes, or multiple execution owners present requirements."
  EP-ARCH-C03:
    status: ANALYTICALLY_VIABLE_NOT_PROPOSED_FOR_V0_1
    preserved_strength: "Strongest causal replay/reconstruction, rebuildable projections, deterministic reducer fixtures, and coordinator replaceability."
    reason: "Event identity/order/evolution, immutable payload, reducer, checkpoint, projection, retention, and rebuild semantics create more present conceptual and contributor burden than the single-user local workflow requires."
    reopen: "Reconsider if independently verified requirements make full causal reconstruction, independently replayable projections, or coordinator-free operation decisive."
