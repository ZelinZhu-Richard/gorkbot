benchmark_plan_review:
  tests_capabilities_that_matter: "PARTIAL - cases map to runtime primitives (tool conformance, approvals, external-state verification, recovery, memory, security) but MB-001/002/003/012/014 mirror this repository's own Stage 0 governance process rather than a customer workflow; no workflow-specific case can exist before Stage 1."
  avoids_benchmarking_before_workflow_known: "PARTIAL - the plan says results are preliminary but does not gate production role selection on workflow-specific cases added after Stage 1/2 (F-S0-003-07)."
  separates_roles: "PASS - ten logical roles, per-case primary roles, per-role-group thresholds; COMPUTER_CONTROLLER and VISION_INTERPRETER coverage is thin (F-S0-003-11)."
  measures_end_to_end_success: "PASS - completion predicates, deterministic graders first, verified_task_success_rate, false_completion_rate, artifact_acceptance_rate."
  includes_cost_and_latency: "PASS for metrics; FAIL for budget - no cost model or staged order against A-007 USD 0-100/month (F-S0-003-07)."
  includes_tool_use_reliability: "PASS - MB-007, tool-name/argument validity, phantom-tool rate, bounded-retry compliance."
  includes_source_fidelity: "PASS - MB-001, MB-014, claim-to-source precision/recall, current-authority selection."
  includes_repository_instruction_adherence: "PASS - MB-002/003/004 allowed-files diff, scope-adherence rate, 'out-of-scope file modified' trap."
  includes_security_behavior: "PASS - MB-006, MB-008, MB-010, MB-011, hard_boundary_violation_rate, non-averageable hard gates."
  includes_external_state_verification: "PASS - MB-009 independent target reread."
  includes_failure_recovery: "PASS - MB-005, MB-007, recovery_rate."
  prevents_self_grading_bias: "PARTIAL - 'not the only grader of its own correctness' and blinding are required, but the grader/challenger model family is not required to differ from the candidate (F-S0-003-08)."
  reproducible: "PARTIAL - fixture/case/grader versioning and full run-config recording are required; no harness, results directory, run-record schema or seed policy (F-S0-003-07)."
  records_exact_model_versions: "PASS - model ID, returned version/snapshot, service tier, endpoint region per run; drift rerun rule."
  controls_temperature_and_reasoning: "PASS - each effort level is a separate configuration; sampling settings recorded; 'Unsupported parameters ... are part of operational fit'. Note that Fable 5 restricts sampling parameters and DeepSeek thinking mode ignores temperature/top_p silently, which the plan should list explicitly."
  distinguishes_provider_failure_from_model_failure: "PARTIAL - failure category, rate-limit waits and refusal/fallback rate are recorded but no taxonomy separates provider outage/429/timeout/regulatory suspension from policy refusal, harness error and model task failure (F-S0-003-09)."
  avoids_premature_architecture_lock: "PASS - no vendor ranking, fallback normalization required, unresolved tradeoffs recorded; weakened only by the narrow candidate pool (F-S0-003-01)."

