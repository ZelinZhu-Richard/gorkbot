findings:
  - finding_id: F-S0-003-01
    severity: HIGH
    requirement: "S0-003 objective 'Confirm available model products, API access, costs, limits'; acceptance criterion 3 (no role locked by reputation); MASTER 'Use the least expensive model that has demonstrated sufficient reliability'; MASTER model-routing roles incl. VISION_INTERPRETER, SUMMARIZER, ROUTER, MEMORY_EXTRACTOR; 05_MODEL_ACCESS.md 'specialized coding model' and 'lower-cost candidate' columns."
    file_or_component: "01_governance/MODEL_REGISTRY.yaml models[] (six entries); 06_evaluation/MODEL_ROLE_BENCHMARK_PLAN.md 'Candidate configurations'"
    evidence: "Anthropic overview (SRC-021, live): 'start with Claude Opus 5 for complex agentic coding and enterprise work. For workloads that need the highest available capability, use Claude Fable 5'; Claude Opus 5 claude-opus-5 $5/$25, Claude Sonnet 5 claude-sonnet-5 $2/$10, Claude Haiku 4.5 $1/$5, all GA; Fable 5 comparative latency 'Slower', 30-day retention / no ZDR, classifier refusals, while Opus 4.8 'remains available under ZDR' (migration guide) and Opus 5/Sonnet 5 are Fable's documented fallback targets. OpenAI catalog (SRC-009, live) lists GPT-5.3-Codex ('most capable agentic coding model to date'), codex-mini-latest, computer-use-preview, GPT-5.4 mini ('coding, computer use, and subagents'), gpt-oss-120b/20b open-weight. DeepSeek released deepseek-v4-flash-vision-exp on 2026-08-21 (news260821) at V4-Flash pricing with Responses/Messages support. The registry contains only Sol/Terra/Luna, Fable 5, V4-Pro/Flash - exactly the products the founder subscribes to or named in 00_inbox - and records no exclusion reasons. Consequently the Anthropic provider is represented solely by its most expensive, slowest, retention-constrained model; ROUTER, MEMORY_EXTRACTOR, SUMMARIZER, STRUCTURED_EXECUTOR, VISION_INTERPRETER and low-cost fallback roles have no Anthropic candidate, no vision-capable DeepSeek candidate and no coding- or computer-use-specialised OpenAI candidate."
    why_it_matters: "The benchmark can only select among registered candidates, so a reputation- and subscription-shaped pool pre-decides role outcomes that the plan claims to leave open; it also removes the cheapest way to test same-provider failover for Fable 5 refusals and cross-provider cost/latency frontiers that R-005, R-007 and the Pareto selection rule depend on. Production suitability (ZDR, latency, cost per verified success) differs materially between Fable 5 and Opus 5/Sonnet 5/Haiku 4.5."
    required_fix: "Add registry entries (same schema, public-source fields only, founder_account_api_access NOT_VERIFIED) for at least claude-opus-5, claude-sonnet-5, claude-haiku-4-5-20251001 and deepseek-v4-flash-vision-exp, and either entries or an explicit 'considered_and_excluded' list with reasons for gpt-5.3-codex / codex-mini-latest / computer-use-preview / gpt-5.4-mini / gpt-oss; add the corresponding SOURCE_LEDGER rows; update the plan's 'Candidate configurations' section. Do not assign roles; keep HYPOTHESIS_ONLY."
    verification_method: "ruby -ryaml -e 'puts YAML.load_file(\"01_governance/MODEL_REGISTRY.yaml\")[\"models\"].map{|m| m[\"exact_api_model_id\"]}' lists claude-opus-5, claude-sonnet-5, claude-haiku-4-5-20251001, deepseek-v4-flash-vision-exp; grep -n 'considered_and_excluded\\|exclusion' 01_governance/MODEL_REGISTRY.yaml returns the OpenAI specialised models with reasons; each new entry's source_ids resolve in SOURCE_LEDGER.csv."
  - finding_id: F-S0-003-02
    severity: HIGH
    requirement: "S0-003 acceptance criterion 2 (exact versions and verification dates); MASTER 'Record exact model version, access method, cost'; Stage 0 gate 'consequential product claims are sourced'; R-017 mitigation 'record ... price and run date'; plan 'Standard and premium/fast service tiers are separate configurations'."
    file_or_component: "01_governance/MODEL_REGISTRY.yaml openai_gpt_5_6_sol public_list_pricing_usd_per_1m_tokens; public_source_verified_on; 01_governance/SOURCE_LEDGER.csv SRC-017, SRC-020 accessed_date; 99_handoffs/completed/S0-003_handoff.yaml test_results"
    evidence: "Live SRC-017 (2026-08-21 ~20:57Z): 'Input $4 | Cached input $0.4 | Output $20 ... GPT-5.6 Sol's promotional pricing is available at least through November 21, 2026'; live SRC-020 Standard row gpt-5.6-sol $4.00 / $0.40 / $5.00 / $20.00, long context $8.00 / $0.80 / $10.00 / $30.00; Batch and Flex rows $2.00 / $0.20 / $2.50 / $10.00; Fast row $8.00 / $0.80 / $10.00 / $40.00. Registry: $5.00 / $0.50 / $6.25 / $30.00 and $10.00 / $1.00 / $12.50 / $45.00, no batch/flex/fast prices. Internet Archive: Sol page 2026-08-19T11:13Z '$5.00 ... $0.50 ... $30.00'; pricing page 2026-08-21T10:30:49Z gpt-5.6-sol $5.00 / $0.50 / $6.25 / $30.00. The registry records only a date (public_source_verified_on 2026-08-21), no time, so the record cannot show which price was read on that date. Terra and Luna prices are unchanged and correct."
    why_it_matters: "Cost per verified success for the flagship candidate - the metric the plan optimises - is overstated by 20-33 percent, and the registry lacks the batch/flex/fast prices that the plan itself treats as distinct configurations; more importantly the same-day drift shows that a date-only verification stamp cannot support the Stage 0 gate or R-017 without UTC access times. Not an author error at access time."
    required_fix: "Update gpt-5.6-sol pricing to the live values with a 'promotional through at least 2026-11-21; list price previously $5/$0.50/$6.25/$30 until 2026-08-21' note; add batch, flex and fast service-tier prices for all three GPT-5.6 entries (and Anthropic batch is already present); add an accessed_at UTC timestamp field per model entry and per ledger row (or an accessed_time column) for SRC-009/017/018/019/020 and, ideally, all S0-003 rows; add a known_limitations entry to the S0-003 handoff recording the same-day drift; set public_source_verified_on to the new re-verification timestamp."
    verification_method: "grep -n -E '\\$?4\\.00|input: 4\\.0' 01_governance/MODEL_REGISTRY.yaml hits the Sol block; grep -n 'November 21, 2026\\|2026-11-21' 01_governance/MODEL_REGISTRY.yaml returns the promo note; grep -n 'accessed_at\\|accessed_time' 01_governance/MODEL_REGISTRY.yaml 01_governance/SOURCE_LEDGER.csv returns values with a time component; reopening https://developers.openai.com/api/docs/pricing.md shows the recorded values."
  - finding_id: F-S0-003-03
    severity: MEDIUM
    requirement: "S0-003 objective (capabilities, limits); review brief items structured outputs, computer use, rate limits, data policy, geographic restrictions, fallback implications; MASTER label discipline (documented fact must not be labelled unknown); R-018."
    file_or_component: "01_governance/MODEL_REGISTRY.yaml anthropic_claude_fable_5 public_specs, public_rate_limit_context; 01_governance/RISK_REGISTER.md R-018 (out of S0-003 scope - see F-S0-003-06)"
    evidence: "(a) structured_outputs is 'TO_VERIFY_AND_BENCHMARK' while platform.claude.com/docs/en/build-with-claude/structured-outputs lists 'Supported models: claude-fable-5 ...' with output_config.format type json_schema and strict tool use, no beta header. (b) No computer-use field although computer-use-tool page lists 'Supported models: claude-fable-5, claude-mythos-5, claude-opus-5, claude-sonnet-5, claude-opus-4-8' for computer_toolset_20260801 (no beta header on the Claude API) and the pricing page lists browser_toolset_20260801 overhead for Fable 5. (c) public_rate_limit_context says only 'Account and service-tier dependent' although api/rate-limits publishes Fable 5 Start 1,000 RPM / 500,000 ITPM / 100,000 OTPM, Build 2,000 / 1,500,000 / 300,000, Scale 4,000 / 4,000,000 / 800,000 and monthly spend caps $500 / $1,000 / $200,000 - the OpenAI entries do record public tier limits. (d) Omitted documented behaviours: stop_details.category on refusals; opt-in fallbacks parameter (beta, Claude API only); refused-before-output requests not billed; 400 invalid_request_error 'your organization or workspace must have data retention enabled'; per-workspace retention enablement; prefill returns 400; sampling-parameter restrictions; thinking.display default omitted; ~30% tokenizer overhead versus pre-4.7 models; 512-token cache minimum. (e) SRC-010 (cited) documents a 2026-06-12..30 US export-control suspension of all Fable 5 access and a subsequent classifier tightening that 'comes at the cost of flagging benign requests more often during routine coding and debugging tasks'; neither the registry nor R-018 records regulatory-availability or coding-false-positive risk."
    why_it_matters: "The COMPUTER_CONTROLLER and structured-output roles cannot be planned without (a)-(b); (c)-(d) are exactly the integration, billing and failover facts the brief asks for and the benchmark harness must handle; (e) is a provider-availability and CODER-suitability risk that the registry's sole Anthropic candidate carries."
    required_fix: "Set structured_outputs to SUPPORTED (public doc) with 'benchmark reliability'; add computer_use: SUPPORTED (computer_toolset_20260801; browser use tool) and the toolset overhead note; add public tier limits and spend caps; add refusal/fallback/billing/retention-error/prefill/sampling/tokenizer facts under public_specs or a provider_constraints block; add ledger rows for the structured-outputs, computer-use, rate-limits, api-and-data-retention and refusals-and-fallback pages; record the June 2026 suspension and classifier change in the registry entry (and propose an R-018 amendment or new risk for the founder/governance task, since RISK_REGISTER is outside S0-003 scope)."
    verification_method: "grep -n -E 'computer_toolset_20260801|structured_outputs: SUPPORTED|export control|stop_details' 01_governance/MODEL_REGISTRY.yaml returns hits in the Fable block; grep -c 'platform.claude.com/docs/en/agents-and-tools/tool-use/computer-use-tool' 01_governance/SOURCE_LEDGER.csv >= 1."
  - finding_id: F-S0-003-04
    severity: MEDIUM
    requirement: "S0-003 objective; acceptance criterion 2 (versions and dates); review brief items data-retention/training policy, commercial-use constraints, geographic restrictions, reasoning controls, structured outputs, incompatibilities; MAG-004 / MAG-005; 06_BUILD_CONSTRAINTS.md 'Review provider terms, data use, reselling, rate limits, and commercial deployment rights'."
    file_or_component: "01_governance/MODEL_REGISTRY.yaml deepseek_v4_pro, deepseek_v4_flash, access_gaps MAG-004/MAG-005; 01_governance/SOURCE_LEDGER.csv SRC-011, SRC-024"
    evidence: "(a) Data/jurisdiction: DeepSeek Open Platform Terms of Service (effective 2026-04-29) - operator Hangzhou DeepSeek Artificial Intelligence Co., Ltd.; 'governed by the laws of the People's Republic of China in the mainland'; disputes to the court at the Hangzhou registered office; Privacy Policy (2026-02-10) - 'we directly collect, process and store your Personal Data in People's Republic of China'; data used 'to train and improve our technology, such as our machine learning models' with a stated opt-out right; no API-specific retention period published. None is in the registry; MAG-004 is generic. (b) Version context: SRC-024 is the 2026-04-24 preview post; the served versions come from the 2026-07-31 V4-Flash release and the 2026-08-13 V4-Pro GA release (news260813; change log), which also introduced reasoning effort levels low/high/max (OpenAI-format reasoning_effort, Anthropic-format output_config.effort, Responses reasoning.effort incl. none) and set the current peak/off-peak prices 'effective at 16:00 UTC, Aug 16, 2026'; none of these posts or facts is ledgered or recorded, so the registry's 'thinking_modes' field understates the documented reasoning controls. (c) deepseek-v4-flash-vision-exp (2026-08-21): images tokenised up to 384 tokens at V4-Flash pricing; Chat/Messages/Responses; Files API free - recorded only as a caveat string. (d) Structured output semantics: 'JSON Output' is response_format json_object - valid JSON only, prompt must contain 'json', 'the API may occasionally return empty content'; schema-constrained tool calls require 'strict Mode (Beta)' via base_url https://api.deepseek.com/beta; the registry's 'json_output: SUPPORTED' does not convey this and the plan's first-pass JSON Schema validity metric depends on it. (e) Incompatibilities: Anthropic-format endpoint maps unknown model names to deepseek-v4-flash (claude-opus* -> v4-pro, claude-sonnet*/haiku* -> v4-flash) and ignores cache_control and budget_tokens; thinking mode ignores temperature/top_p without error; with tools, reasoning_content must be echoed back or the API returns 400; server closes requests that have not started inference after 10 minutes; concurrency 429 is account-level. (f) Open weights: Hugging Face DeepSeek-V4-Pro and DeepSeek-V4-Flash model cards state MIT license (preview weights); MAG-005 says licence 'not reviewed'."
    why_it_matters: "For a multi-tenant SaaS backend, PRC-law jurisdiction, PRC data storage and training use are first-order production-suitability facts for the DeepSeek candidates (and for any customer data-residency promise); the silent model-name mapping and ignored parameters are exactly the provider-specific incompatibilities the brief asks the registry to capture so a fallback path does not quietly call the wrong model; the JSON-mode semantics determine how the structured-output metric must be measured."
    required_fix: "Add a public_policy_constraints block to both DeepSeek entries (operator, governing law, storage location, training use and opt-out, retention 'not published', terms effective dates) and an api_compatibility_notes block ((e) above); record reasoning_effort levels and their mapping, json_output semantics and strict-mode beta; add a deepseek_v4_flash_vision_exp entry (or explicit exclusion) per F-S0-003-01; update served-version provenance with the 2026-07-31 and 2026-08-13 dates and the 2026-08-16 price-effective date; revise MAG-005 to record MIT licence and the remaining unknown (whether 0731/0813 weights are published, hosting terms); add ledger rows for news260813, news260821, updates, thinking_mode, json_mode, tool_calls, rate_limit, anthropic_api, the TOS, the Privacy Policy and the two model cards."
    verification_method: "grep -n -E \"People's Republic of China|Hangzhou|reasoning_effort|json_object|strict|claude-opus\" 01_governance/MODEL_REGISTRY.yaml returns hits inside the DeepSeek blocks; grep -c 'api-docs.deepseek.com/news/news260813' 01_governance/SOURCE_LEDGER.csv >= 1; grep -n 'MIT' 01_governance/MODEL_REGISTRY.yaml hits MAG-005 or the DeepSeek entries."
  - finding_id: F-S0-003-05
    severity: MEDIUM
    requirement: "S0-003 objective (access, costs, limits); review brief items batch API, data retention/training, geographic restrictions, rate limits, reasoning controls; plan 'service tiers are separate configurations'."
    file_or_component: "01_governance/MODEL_REGISTRY.yaml openai_gpt_5_6_sol / terra / luna public_specs and public_rate_limit_context"
    evidence: "Live SRC-017/018/019: 'Batch | v1/batch | Supported'; 'Maximum input tokens: 922,000'; 'Reasoning.effort supports: none, low, medium (default), high, xhigh, and max'; Luna rate-limit table 'default' differs from Sol/Terra 'Standard' (Tier 1 batch queue 5,000,000; Tier 5 30,000 RPM / 180,000,000 TPM). Live SRC-020: Batch, Flex and Fast tables for all three models; 'Regional processing (data residency) endpoints are charged a 10% uplift'; tool fees (web search $10.00 / 1k calls; hosted shell / code interpreter containers billed per 20-minute session; file search $2.50 / 1k calls). developers.openai.com/api/docs/guides/your-data: API data 'not used to train or improve OpenAI models (unless you explicitly opt in)'; abuse-monitoring logs 'retained for up to 30 days'; Zero Data Retention and Modified Abuse Monitoring available on approval at organization or project level; ZDR forces store=false on /v1/responses and /v1/chat/completions. rate-limits guide: usage tiers Free ($100/month, allowed geography) through Tier 5 ($1,000 paid, $200,000/month). supported-countries: 188 entries. None of these is in the registry; the entries record only standard/long-context prices, a generic 'Tier 1' sentence and 'free tier not supported'."
    why_it_matters: "Batch (50%) and flex pricing change the cost-per-verified-success frontier for non-interactive roles (VERIFIER, SUMMARIZER, MEMORY_EXTRACTOR); the data-control facts are the OpenAI counterpart of the Fable 5 retention constraint already recorded and are needed for MAG-004; tool fees affect the plan's 'model and tool USD per run'."
    required_fix: "Add batch_api: SUPPORTED plus batch/flex/fast prices; max_input_tokens 922000; default reasoning effort medium; Luna's distinct tier table; data_policy block (no training by default, 30-day abuse-monitoring retention, ZDR/MAM on approval, regional processing uplift); supported-countries reference; tool fee summary; add ledger rows for the rate-limits, your-data and supported-countries pages."
    verification_method: "grep -n -E 'batch|922000|data_policy|Zero Data Retention' 01_governance/MODEL_REGISTRY.yaml returns hits in each GPT-5.6 block; grep -c 'developers.openai.com/api/docs/guides/your-data' 01_governance/SOURCE_LEDGER.csv >= 1."
  - finding_id: F-S0-003-06
    severity: MEDIUM
    requirement: "AGENTS.md 'Do not silently expand scope'; TASK_REGISTRY S0-003 allowed_files_to_change; Stage 0 gate 'governance files agree with one another'; S0-001 challenger notes N-S0-001-04/05 carried forward."
    file_or_component: "01_governance/TASK_REGISTRY.yaml S0-003 allowed_files_to_change; 99_handoffs/completed/S0-003_handoff.yaml files_modified; 01_governance/ASSUMPTION_REGISTER.md (A-009, A-013); 01_governance/RISK_REGISTER.md (R-008, R-017, R-018); 01_governance/SOURCE_LEDGER.csv (SRC-009..011, SRC-017..024)"
    evidence: "git diff 4d99fff f151f28 shows A-009 rewritten and A-013 added, R-008 rewritten and R-017/R-018 added, and 11 model-source ledger rows added; all content is S0-003 subject matter and all three files are listed under files_modified in the S0-003 handoff, but S0-003 allowed_files_to_change lists only MODEL_REGISTRY.yaml, 06_evaluation/, TASK_REGISTRY.yaml, PROJECT_STATE.yaml and 99_handoffs/completed/. The registry requires source_ids that must resolve in SOURCE_LEDGER.csv, so the task could not satisfy its own evidence contract without the ledger; the allowed list was defective and was never amended. S0-005 (the successor task) correctly includes the ledger, assumption and risk registers."
    why_it_matters: "A verifier applying the allowed-files check literally must fail S0-003; concurrent ownership of SOURCE_LEDGER.csv by S0-002 and S0-003 in one batch also removes the single-owner guarantee the governance model relies on. The deviation was visible, not hidden, so severity is limited to governance coherence."
    required_fix: "Founder decision: amend TASK_REGISTRY S0-003 allowed_files_to_change to add 01_governance/SOURCE_LEDGER.csv, 01_governance/ASSUMPTION_REGISTER.md and 01_governance/RISK_REGISTER.md (retroactive, with a one-line note in the task entry or DECISION_LOG), or leave the list and record the deviation in the S0-003 handoff known_limitations with the founder's acceptance. Either way, add a handoff known_limitations entry naming the three files and the reason."
    verification_method: "ruby -ryaml prints S0-003 allowed_files_to_change including the three paths, or grep -n 'allowed_files' 99_handoffs/completed/S0-003_handoff.yaml returns a known_limitations entry describing the deviation and acceptance."
  - finding_id: F-S0-003-07
    severity: MEDIUM
    requirement: "Review brief 'avoids benchmarking models before the product workflow is known', 'can be run reproducibly', cost; A-007 / 06_BUILD_CONSTRAINTS.md 'near USD 0 to 100 per month'; MAG-003; plan preconditions 5 ('Set a per-run and per-suite budget')."
    file_or_component: "06_evaluation/MODEL_ROLE_BENCHMARK_PLAN.md 'Evaluation set', 'Replication', 'Preconditions and access gate', 'Selection rule', 'Current access gaps blocking execution'"
    evidence: "The 14 cases are fixed before Stage 1 (S1-001 BACKLOG); MB-001 (reconcile product pages), MB-002 (inventory fixture repository), MB-003 (governance reconciliation), MB-012 (handoff synthesis) and MB-014 (project-history reconciliation) reproduce this repository's own Stage 0 process; no sentence requires workflow-specific cases from Stage 1/2 before a production role recommendation, and no case weights exist. Replication requires >=5 scored runs for deterministic/extraction cases and >=3 for implementation/browser cases across six candidates, each effort level and service tier a separate configuration; no token estimate or USD estimate per case/block is given. Illustratively, one MB-004/MB-005/MB-013 run on claude-fable-5 at ~200k input / 20k output tokens is ~$3 ($10/$50 per MTok), so the scored pass for the three implementation cases alone on one Fable configuration is ~$27 and the full suite across configurations and effort levels plausibly exceeds the USD 0-100 monthly envelope several-fold. The plan names no harness, results directory (06_evaluation/ contains only the plan), run-record schema or seed policy."
    why_it_matters: "Without a Stage 1 gate the suite will be scored and cited before it tests the workflow that matters, producing exactly the premature role lock the plan says it avoids; without a cost model and staged order the plan cannot be executed inside the founder's stated budget, so 'benchmark_status NOT_RUN' will persist or the budget assumption A-007 will be broken silently; without a results location the plan is not reproducible by another agent."
    required_fix: "Label the current suite 'Stage 0 harness-validation suite (provisional)'; add a rule that production role recommendations require at least one workflow-specific case family added after S1-001 and reviewed; add a per-case token/USD estimate table and a staged execution order (deterministic + low-cost candidates first; flagship candidates only on discriminating cases; explicit USD gates per stage) reconciled with A-007 and MAG-003; specify the results directory (e.g. 06_evaluation/results/<date>_<suite_version>/), a run-record schema matching 'Record for every run', and a fixed seed/sampling policy per provider including the provider restrictions already documented (Fable 5 sampling restrictions; DeepSeek thinking mode ignoring temperature)."
    verification_method: "grep -n -i 'Stage 1\\|S1-001' 06_evaluation/MODEL_ROLE_BENCHMARK_PLAN.md returns the gating rule; grep -n -i 'USD\\|\\$' 06_evaluation/MODEL_ROLE_BENCHMARK_PLAN.md returns a per-case estimate table; grep -n 'results/' 06_evaluation/MODEL_ROLE_BENCHMARK_PLAN.md returns the results path."
  - finding_id: F-S0-003-08
    severity: LOW
    requirement: "Review brief 'prevents the same model from grading itself where that would bias results'; MASTER Stage 7 'verification that merely restates the author'."
    file_or_component: "06_evaluation/MODEL_ROLE_BENCHMARK_PLAN.md 'Author, challenger, verifier separation'"
    evidence: "'A model may grade bounded style dimensions, but it may not be the only grader of its own correctness or external-state completion'; 'A blinded challenger reviews sampled passes ... without provider/model labels'. Nothing requires the grading or challenger model family to differ from the candidate whose output is graded; blinding the label does not remove self-preference when a model scores its own output, and 'not the only grader' still admits it as one of two graders whose scores are averaged."
    why_it_matters: "Rubric dimensions (plan acceptance, summary quality, security severity calibration) are where self-preference bias is largest; a tie-break or average with a self-grade moves the Pareto frontier."
    required_fix: "Require that any non-deterministic grade of a candidate's output be produced by a model from a different provider family (or by a human), record grader model ID per grade, and exclude self-grades from scoring entirely; keep deterministic graders first."
    verification_method: "grep -n -i 'different provider\\|grader model' 06_evaluation/MODEL_ROLE_BENCHMARK_PLAN.md returns the rule."
  - finding_id: F-S0-003-09
    severity: LOW
    requirement: "Review brief 'distinguishes provider failure from model failure'; plan 'Do not normalize away provider-specific limitations'; R-014."
    file_or_component: "06_evaluation/MODEL_ROLE_BENCHMARK_PLAN.md 'Configuration control' (failure category), 'Stability metrics', 'Selection rule'"
    evidence: "Runs record 'failure category, intervention count, and verifier result' and 'refusal/fallback rate' but the categories are undefined; the selection rule eliminates on thresholds without stating whether provider incidents (HTTP 429 at DeepSeek concurrency limits, OpenAI/Anthropic rate-limit waits, 5xx, the DeepSeek 10-minute pre-inference close, regulatory suspensions such as Fable 5's 2026-06-12..30 export-control outage) count against verified success, are excluded, or trigger reruns; policy refusals (Fable 5 stop_reason refusal with stop_details.category; OpenAI/DeepSeek content policy) are likewise unseparated from model task failure and false completion."
    why_it_matters: "A model can be eliminated for an outage or credited for a refusal-then-fallback, and the operational-fit signal the plan wants (fallback identity, refusal rate) is lost if everything is one failure bucket."
    required_fix: "Add an enumerated failure_category (provider_unavailable, rate_limited, provider_timeout, policy_refusal, harness_error, model_task_failure, false_completion, boundary_violation) with scoring/rerun rules per category, and report provider-incident counts separately in the reporting template."
    verification_method: "grep -n 'provider_unavailable\\|policy_refusal' 06_evaluation/MODEL_ROLE_BENCHMARK_PLAN.md returns the taxonomy."
  - finding_id: F-S0-003-10
    severity: LOW
    requirement: "MASTER task execution rule 2 'Confirm dependencies are verified'; AGENTS.md handoff schema (started_at/completed_at); AGENTS.md completion rule 'exact results'; S0-001 challenger note N-S0-001-06 (PROJECT_STATE author claim)."
    file_or_component: "99_handoffs/completed/S0-003_handoff.yaml (started_at, completed_at, test_results, known_limitations); 01_governance/PROJECT_STATE.yaml notes; 01_governance/TASK_REGISTRY.yaml S0-003 dependencies"
    evidence: "S0-003 depends on S0-001, which was READY (not VERIFIED) when S0-003 ran and is CHANGES_REQUESTED now. started_at is null and completed_at is the batch stamp shared by all three Stage 0 handoffs. test_results say the pages 'documented ... public prices' with no access time; the Sol price changed later the same day, so the result cannot be reproduced or dated from the record. PROJECT_STATE note 'Public model catalogs and prices were verified; funded account access and API smoke tests were not' is an author statement recorded in state before independent review and is now partly stale."
    why_it_matters: "Audit value only; the dependency deviation had no substantive effect because S0-001 produced LOW findings only, and the PROJECT_STATE note is corrected by this review."
    required_fix: "In the S0-003 handoff add known_limitations entries recording (a) the dependency deviation, (b) that per-source access times were not captured and that the GPT-5.6 Sol price changed on 2026-08-21 after access; future handoffs record per-task start/end and UTC access times per reopened source. (PROJECT_STATE note updated by this review.)"
    verification_method: "grep -n -E 'access time|2026-11-21|promotional' 99_handoffs/completed/S0-003_handoff.yaml returns the limitation entries."
  - finding_id: F-S0-003-11
    severity: LOW
    requirement: "Review brief 'separates planner, coder, executor, verifier, vision, and low-cost roles'; MASTER roles COMPUTER_CONTROLLER and VISION_INTERPRETER; Stage 4 spikes 'recovery from unexpected UI state'."
    file_or_component: "06_evaluation/MODEL_ROLE_BENCHMARK_PLAN.md MB-008, MB-013; 01_governance/MODEL_REGISTRY.yaml (no vision candidate, no computer-use field)"
    evidence: "VISION_INTERPRETER is exercised only through MB-008 ('Operate or plan against a controlled site') and MB-013's screenshot rubric; there is no case with ground-truth UI/screenshot states (dialog, error banner, login wall, CAPTCHA, layout shift) scored for state recognition; MB-008's 'operate or plan' leaves open whether a harness executes actions or the model only emits a plan, so COMPUTER_CONTROLLER success is not end-to-end. The registry has no vision-capable DeepSeek candidate and no computer-use field for Fable 5 (F-S0-003-01/03)."
    why_it_matters: "Browser/GUI brittleness is R-006 (High/High) and the Stage 4 spike list starts with it; a plan that cannot distinguish 'recognised the state' from 'planned plausibly' will not de-risk it."
    required_fix: "Add MB-015 'UI state recognition' with labelled screenshot fixtures and deterministic scoring; define MB-008 as executed through a controlled harness with action logs (plan-only runs labelled separately); list the documented computer-use interfaces per candidate (OpenAI Responses computer tool / gpt-5.4+ training; Anthropic computer_toolset_20260801 + browser use; DeepSeek none documented for text models) in the candidate section."
    verification_method: "grep -n 'MB-015' 06_evaluation/MODEL_ROLE_BENCHMARK_PLAN.md returns the case; grep -n -i 'harness' 06_evaluation/MODEL_ROLE_BENCHMARK_PLAN.md hits MB-008."

