original_finding_dispositions:
  - finding_id: F-S1-002-01
    severity: HIGH
    disposition: RESOLVED
    evidence: >-
      The H1 guide now presents Contract A (commodity monitoring baseline: scheduled checks of
      named public pages, change detection, source URLs and timestamps, before/after diffs,
      summaries/importance signals, alerts/digests/ordinary reports — explicitly excluding a
      governed canonical record) before Contract B (cross-competitor decision-linked synthesis,
      canonical ledger with checked/unchanged/changed/unavailable/unknown state and provenance,
      approval-gated record proposal, readback), with the same discounting rule as H2 ("Interest,
      novelty, time savings, or willingness to try Contract A is commodity value and does not
      support H1's G8"). The same Contract A is shown to monitor-naive/manual participants so
      ordinary-monitoring novelty is absorbed before B. The plan's H1 row 16, G8-H1, the
      delegation_tier_after_contract_a / contract_b_material_action_lift / contract_b_lift_basis
      CSV fields, and the coding checklist all count only B-over-A action lift. Isolation is now
      structurally symmetric with H2; H1 receives no easier treatment.
  - finding_id: F-S1-002-02
    severity: HIGH
    disposition: RESOLVED
    evidence: >-
      Decision rule 1 assigns one of six explicit terminal states (ADVANCE, KILL_MARKET_EVIDENCE,
      PAUSE_RECRUITING_FAILED, PAUSE_ACCESS_BLOCKED, PAUSE_PROTOCOL_FAILED,
      INCONCLUSIVE_INSUFFICIENT_SAMPLE). Rule 3 splits the branches: only a KILL_MARKET_EVIDENCE
      rival permits a provisional beachhead recommendation; any PAUSE_*/INCONCLUSIVE_* rival
      yields PROMISING_ADVANCE_WITH_UNRESOLVED_RIVAL with D-012 co-equality preserved, no
      comparative winner claimed, and the required next evidence named. A founder abandonment on
      reach grounds must be labeled non-market and cannot be reported as pain/demand
      falsification. Funnel metrics "never enter G1-G11". S1-003's acceptance criteria carry the
      split unchanged.
  - finding_id: F-S1-002-03
    severity: MEDIUM
    disposition: RESOLVED
    evidence: >-
      The common gate-counting freeze is exactly defined: 23:59 America/New_York on the earlier
      of (a) seven calendar days after the later H1/H2 terminal and (b) 42 calendar days after
      first authorized outreach; the formula, first-outreach date, and day-42 cap are recorded
      before contact, the exact timestamp is mechanically logged when the later terminal occurs
      and may not move on observed results, and late written pilot/price acceptances are
      recorded but cannot change this wave's G9/G10 or decision state. Referenced consistently
      by the gate-calculation rules, coding rules, recruiting checklist, and S1-003's
      protocol_change_rule and required tests.
  - finding_id: F-S1-002-04
    severity: MEDIUM
    disposition: RESOLVED
    evidence: >-
      The coding-authority section predeclares: interviewer as primary coder within 24 hours;
      an independent second reviewer recoding every enumerated gate-relevant interpretive field;
      nonempty reviewer_id required for every counted row before freeze; direct observations
      transcribed rather than upgraded; unresolved disagreement coded conservatively
      (contradictions + UNKNOWN/FALSE/lower level/non-qualifying class, favorable intent may
      not resolve ambiguity); an append-only restricted audit log; and AI limited to consented
      transcription/extraction under the founder's recorded policy with no final
      classifications, disagreement resolution, or gate upgrades.
  - finding_id: F-S1-002-05
    severity: MEDIUM
    disposition: RESOLVED
    evidence: >-
      Independently reconciled by script: all 74 public headers occur in exactly one treatment
      class (44 PUBLIC_SAFE, 29 PUBLIC_SANITIZED, 1 OPAQUE_REFERENCE_ONLY); the PRIVATE_ONLY
      class has no public header and enumerates names, emails, handles, employer/domain, exact
      timestamps, payment details, raw notes/transcripts/recordings, verbatim quotations,
      consent records, competitor/watchlist entries, private repository identifiers, source
      code, screenshots, budgets, and credentials. pilot_owner is role-only, pilot_input
      generic, dates month-precision, sizes banded, source_recording_or_notes an opaque random
      ID, and a mandatory field-by-field plus quasi-identifier review precedes any row commit.
  - finding_id: F-S1-002-06
    severity: MEDIUM
    disposition: RESOLVED
    evidence: >-
      The recruiting plan states the six-stage funnel, four labeled DESIGN-ESTIMATE scenarios
      (recomputed exactly: H1 base/downside completions 8.3/1.8 with outside-network 5.4/0.9;
      H2 10.3/2.8 with 6.1/1.1), and a staged maximum of 120 unique prospects per hypothesis in
      three predeclared 40-prospect batches over at most 35 days with one follow-up. The base
      scenarios support the 8-interview and 4-outside targets; the plan explicitly states that
      reaching 120 without filling a quota is PAUSE_RECRUITING_FAILED, not market rejection, and
      extension requires a new founder-authorized task.
  - finding_id: F-S1-002-07
    severity: LOW
    disposition: RESOLVED
    evidence: >-
      The plan table and both v2 guides use identical ten consecutive phases (0-3, 3-7, 7-19,
      19-24, 24-30, 30-35, 35-40, 40-42, 42-44, 44-45); the closing disconfirmation minute is
      mandatory in all three ("Ask both; they are not optional" / "never dropped").
  - finding_id: F-S1-002-08
    severity: LOW
    disposition: RESOLVED
    evidence: >-
      The plan prospectively operationalizes A-018 as the stricter governing conjunction (4/8
      B-over-A action lifts, 4/8 verification-only interest, at least 3 of the same participants
      satisfying both plus the qualifying written pilot), states that this definition governs
      S1-003 and interprets A-018's "verification-only value" as changed behavior, and preserves
      independent-review-before-any-elevation. The H2 guide restates the same conjunction; the
      CSV separates h8_material_trust_lift, h8_verification_only_interest, and
      h8_pilot_commitment. A-018 itself was not edited, consistent with fixer scope.
  - finding_id: F-S1-002-09
    severity: LOW
    disposition: RESOLVED
    evidence: >-
      The plan and both guides state: a plain timely written acceptance of the standardized USD
      500 scope is WRITTEN_500_ACCEPTANCE, satisfies G10, and is Level 4 at most; only
      payment/deposit, a signed paid-pilot order, or an equivalent binding signed commitment
      naming amount, budget owner, and execution date is Level 5 / ECONOMIC_COMMITMENT; verbal
      "USD 500 sounds reasonable" is PRICE_REACTION_ONLY. Decision rule 4's Level-5 tie-breaker
      is therefore unambiguous.
  - finding_id: F-S1-002-10
    severity: LOW
    disposition: RESOLVED
    evidence: >-
      The three presupposing/evaluative wordings grep to zero. Replacements are conditional and
      neutral: H1 frequency Q8 "Was there a failure, stale state, correction, delay, or missed
      response in that case? ... If not, record none"; H2 frequency Q8 "Do you ever accept a
      completion claim without additional checking? What happened the last time? If that does
      not occur, record none"; H2 workaround Q4 "Which checks, if any, are performed by someone
      or something other than the author or authoring tool?". Behavior-first order unchanged.
  - finding_id: F-S1-002-11
    severity: LOW
    disposition: RESOLVED
    evidence: >-
      interview_completion is a required public CSV field with eight mutually exclusive values
      spanning behavior through mandatory disconfirmation; structurally qualified truncated
      interviews remain in the fixed denominator with every unasked gate field a non-success,
      may not be replaced to improve a gate, and both guide checklists restate the rule.
  - finding_id: F-S1-002-12
    severity: LOW
    disposition: RESOLVED
    evidence: >-
      The incentive amount, eligibility, delivery policy, and any staged trigger must be
      identical for H1 and H2 within the wave unless the founder records a concrete operational
      reason before any outreach, and no observed result may trigger an asymmetric change;
      payment compensates time and is paid equally for disconfirming interviews; the private
      incentive/payment ledger lives in the founder-approved restricted recruiting tracker with
      opaque keys, and only aggregate authorized/paid totals may be public. Status remains
      NOT_AUTHORIZED, maximum USD 50/interview and USD 800 total, actual spend USD 0.

section_results:
  h1_residual_isolation: H1_RESIDUAL_ISOLATION_PASS
  h2_residual_isolation: H2_RESIDUAL_ISOLATION_PASS
  comparative_decision_logic: >-
    PASS. Six explicit terminal states; KILL requires legitimate gate evaluation on counted
    customer evidence; a passing candidate with a PAUSE_*/INCONCLUSIVE_* rival is
    PROMISING_ADVANCE_WITH_UNRESOLVED_RIVAL with the missing evidence specified; recruiting/
    channel failure is funnel evidence and never enters G1-G11 or reads as market rejection.
  decision_freeze: >-
    PASS. Pre-outreach protocol freeze pins one independently verified commit SHA plus the
    authorization record; the immutable list covers questions, contracts, gates, thresholds,
    enums, coding/privacy rules, caps, terminal vocabulary, and both freeze dates; safety/
    clerical corrections are logged with comparability rationale; substantive amendments are
    prospective, symmetric for common defects, publicly summarized with old/new/reason/effect,
    and invalidate first-wave comparability for selection; G9/G10 cannot move after any
    response is visible.
  evidence_coding: >-
    PASS. Reproducible and auditable without excess bureaucracy: primary coder, independent
    second recoding of gate-relevant interpretive fields, observation/interpretation split,
    conservative ambiguity and UNKNOWN handling, restricted append-only audit trail, bounded
    AI assistance with a named accountable human coder and reviewer making final entries.
  privacy_boundary: >-
    PASS. 74/74 public headers carry exactly one of PUBLIC_SAFE/PUBLIC_SANITIZED/
    OPAQUE_REFERENCE_ONLY; identity-prone fields have concrete transformations; raw names,
    emails, identifying employers, recordings, transcripts, screenshots, proprietary documents,
    source code, confidential workflows, budgets, and payment records are PRIVATE_ONLY and
    never enter the public repository; the CSV uses opaque random interview/organization keys
    and an opaque restricted-record reference; quasi-identifier review is mandatory. Safe for a
    public repository and a material S1-003 release condition satisfied at the design level.
  recruiting_funnel: >-
    PASS. 8 qualified organizations per hypothesis, at least 4/8 outside-network, staged
    120-prospect/35-day cap per hypothesis with predeclared batch triggers; explicit
    contacted→responded→screened→qualified→scheduled→completed states tracked separately for
    H1/H2 and network tiers; scenarios labeled DESIGN PROPOSAL/ESTIMATES and independently
    recomputed; duplicates handled by restricted-tracker identity/domain dedupe and the
    one-organization rule; channel failure is PAUSE, never market evidence.
  interview_wording: >-
    PASS. Both guides collect last real occurrence, actual behavior, tools/workarounds
    (unaided before recognition), consequences, spend/time, and artifacts before any concept;
    presupposing wordings removed; concept questions are hypothetical and their evidence codes
    at Level 0 unless anchored to a changed action; pilot/commitment/price follow the concept
    test and use written instruments.
  evidence_hierarchy: >-
    PASS. Levels 0-6 are strictly monotonic (opinion, specific behavior, repeated measured
    behavior, artifact/workflow observation, operational commitment, economic commitment,
    repeated economic behavior); the Level 4/5 boundary prevents hypothetical or merely written
    WTP from masquerading as economic commitment.
  h8_consistency: >-
    PASS. H8 exists only inside H2's Contract B with no separate quota, ICP, buyer, score,
    price, or allocation; the scorecard hypothesis enum is "H1 or H2; never H8" and H1 records
    the H8 fields NOT_ASKED; reopening a distinct allocation requires the stricter prospective
    A-018 conjunction plus independent review, with no automatic elevation; no conflicting H8
    definition exists across the plan, guides, CSV, registry, or A-018.
  incentive_policy: >-
    PASS. Status remains UNAUTHORIZED DESIGN PROPOSAL (max USD 50/interview, USD 800 total;
    actual spend USD 0); founder authorization of cap, delivery, geography, and issuer is
    required before any spend; H1/H2 policy is symmetric; payment is for time, identical for
    disconfirming interviews; identifying payment records stay in the restricted ledger. No
    spending is authorized by this review.
  s1_003_blockers: >-
    PASS. S1-003 remains BLOCKED and requires: independent S1-002 verification (satisfied by
    this review once committed), founder outreach authorization, founder-approved
    channels/accounts, the founder incentive decision including an explicit USD 0 option,
    approved restricted evidence storage and consent practice, an assigned interviewer, and an
    explicit AI-role policy. These are the minimum necessary controls; none is satisfied by
    this review and S1-003 was not started.
  scorecard_schema: >-
    PASS. Exactly one header row and zero customer rows; interview_completion present; direct
    observations separable from interpretive fields; evidence_level, disconfirming_evidence,
    and contradictions present; privacy classes operational; Contract A/B and delegation-tier
    fields distinguish commodity from residual lift for both hypotheses; TRUE/FALSE/NOT_ASKED
    and UNKNOWN/REDACTED_UNKNOWN represent missing data honestly. No row was populated.

