decisions_made:
  - "REQUIRED product semantics only: v0.1 is a local-first, single-user preview with one persistent named engineering agent and bounded authority over one user-admitted repository task. This is a product target, not validated customer evidence."
  - "Correctness uses separate work-phase, wait/control/blocker, attempt-disposition, verification-status/verdict, operation/effect-outcome, and agent-availability axes; no one status label may erase another."
  - "COMPLETED is a derived conjunction requiring all applicable predicates, terminal and accounted material operations/effects, fresh readback where required, a valid evidence bundle, and independent PASSED verification on the exact revision; false terminal completion is a zero-tolerance failure."
  - "A minimal durable preflight grant and candidate task identity exist before repository/issue-content access; expanded task authority is required before material execution."
  - "Bounded autonomy cannot self-create/select work, delegate to visible peer agents, expand authority, weaken predicates, or exceed finite limits; task amendment and separate consequential-action approval remain distinct."
  - "The v0.1 core ends in a local review package/report. Optional consequential external capabilities are not required; if later supported, they require admitted authority, exact approval, receipt, and fresh readback."
  - "E1-001 defines only nonwaivable contribution/evaluation/release constraints. E1-002 exclusively owns the contributor procedure, evaluation cases/fixtures/harness/oracles, aggregate thresholds, release checklist, and checkpoint and remains BACKLOG."
