    result: PASS
    basis: "195/195 cells carry all seven elements (plus correlation group, E3 obligation and preference characterization); 0 blank cells; evidence strings reconcile 195/195 to f23."
  - criterion: "Hard constraints are evaluated before weighted preferences; every hard failure eliminates the candidate without averaging."
    result: PASS
    basis: "§4 precedes §5; no hard failure exists; no preference compensates a hard result; UNKNOWN cells receive no credit; the two blocking ARs block every candidate."
  - criterion: "Criteria cover correctness, false completion, durability/recovery, security/isolation, approvals/effects, evidence, complexity, local experience, observability, E1-suite testability, provider neutrality, performance/resources, portability, maintainability, contributor accessibility, remote/SaaS/Finance compatibility, and migration/reversibility."
    result: PASS
    basis: "The 65 verified ARs plus §6-§14 cover every listed subject; portability and Finance compatibility appear via AR-PKG-001/AR-FUT-003, §6 D21-D24 and §13."
  - criterion: "Every unknown is exactly one of PAPER_RESOLVABLE, E2_PRESELECTION_SPIKE_REQUIRED, E3_POSTSELECTION_TECHNICAL_VALIDATION, E3_MODEL_OR_CONFIGURATION_BENCHMARK, or DEFERRED_OUT_OF_SCOPE, with owner, rationale, decision linkage, and blocking consequence."
