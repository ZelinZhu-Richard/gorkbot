  - "N-E2-003-02: README.md still reports E2-001 READY / E2-002..006 BACKLOG and next command EXECUTE_TASK_E2-003 with E2-001 instructions; README is outside the E2-003 allowed paths, so this is a founder commit-time refresh item (precedent V-E2-002-N2)."
