new_findings:
  - finding_id: F-E2-003-01
    severity: HIGH
    candidate_or_component: >-
      E2U-S01-DESCENDANT-CONTAINMENT (uncertainty register classification, state, spike_contract);
      matrix AR-EXE-003 cells x3; comparison §4.3, §11, §15, §16.3, §17; handoff e2_spikes_retained /
      blockers; TASK_REGISTRY author_uncertainty_summary and author_readiness; PROJECT_STATE
      comparison_preselection_spike_count / notes; RISK_REGISTER R-030 mitigation text
    requirement_or_uncertainty: >-
      AR-EXE-003 (hard); PRD FR-033/FR-040; NEG-TERM-01 / EP-NEG-TERM-01; EP-CTL-005; AQ-004; E3V-002;
      plan §13 definition of E2_PRESELECTION_SPIKE_REQUIRED ("mechanism feasibility could change the
      architecture choice"); E2-001 §9 handback rule 1; E2-003 acceptance criterion 4; E2-004
      gate_invariant and disposition vocabulary
    evidence: >-
      (1) Frozen E1 admits fencing when termination is unavailable: PRD FR-033 "safe/available force
      termination or authority fencing"; correctness contract line 955 "safe force termination or
      authority fencing occurs when available; descendants/effects are terminal or explicitly
      uncertain"; EP-CTL-005 "Resistant descendants require bounded force-stop or authority fence";
      EP-NEG-TERM-01 "force/fence when available"; AR-EXE-003 required property "any unkillable work is
      fenced/accounted". (2) The verified E2-001 register already places host process-tree support in
      E3: AR-EXE-003 Uncertainty "Host-specific process-tree and fencing support requires E3
      validation"; E3V-002 owns "descendant accounting" with handback "A structural inability to
      control/fence an advertised class returns to E2"; AQ-004 "possible E2-004 feasibility question;
      validate under E3V-002". Comparison §4.3 gives no reason why that placement is wrong; its
      justification ("prose cannot prove supported-host descendant termination, post-fence effect
      deprivation, or whole-tree accounting") is the definition of E3 postselection validation, not
      of a feasibility that could change the architecture choice. (3) The question is
      candidate-invariant by the author's own contract: "one technology-neutral process-tree adapter"
      with "three thin topology wrappers"; reusable_result_scope "Host primitive and process-tree
      behavior reusable across all candidates"; all three f10 isolation_classification blocks declare
      the identical TIER_2 assumption, the identical "required host process-tree primitive must
      account for descendants", and the identical fail-closed consequence "otherwise untrusted
      execution is unsupported". The only candidate-owned layer (C01 owner epoch, C02 service
      lease/fence, C03 workflow owner/fence) is analysis-confirmed in §4.3/§4.4. In every topology the
      owner-death case (C01 core, C02 worker, C03 executor adapter) reduces to the same host-primitive
      question. (4) Failure cannot invalidate a candidate shape or the frozen requirement: the
      no_go_result narrows "the current Tier 2 support declaration", which is shared, and AR-PKG-001
      requires explicit supported/unsupported host declarations. (5) E2-003 applies E3 treatment to
      the same class of host-primitive dependency without a distinguishing principle: f10 path_scope
      ("required host object-identity/path primitives; unsupported if access-time identity cannot be
      held") -> AR-WSP-003 CONFIRMED with E3V-003; f10 descendant_filesystem_and_network ("required
      host execution primitives must make the boundary apply to arbitrary descendants, otherwise
      untrusted execution is unsupported") -> AR-SEC-004 CONFIRMED with E3V-006; f10
      process_termination (same structure) -> ARCHITECTURE_BLOCKING_SPIKE. (6) MASTER_OPERATING_PROMPT
      Stage 4 lists sandbox lifecycle and pause/resume/worker-restart as technical-spike subjects,
      i.e. E3 under the D-016 mapping. (7) A "technology-neutral adapter" must still bind to some host
      primitive to observe anything, so any result is valid only for that unselected mechanism/host;
      E3V-002 is defined to test the selected mechanism. (8) The contract's three topology wrappers
      would re-implement each candidate's control-plane fencing, which is closer to application code
      than a minimal spike.
