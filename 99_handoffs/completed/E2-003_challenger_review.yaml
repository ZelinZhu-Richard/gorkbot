  - "N-E2-003-04: Two small asymmetries in prose: C02's service/worker protocol version skew across separately updated processes is not named in the complexity discussion, and C03's TB-05 'strongest raw-event exclusion rule' is a mild superlative — the three raw-exclusion rules are design-equivalent (each excludes raw bytes from its ordinary/authoritative paths)."
