section_evidence:
  comparison_matrix: >-
    196 lines = 18-column header + 195 data rows; 65 unique criterion_id x 3 candidate_id = 195
    unique pairs, 0 duplicates, 0 blank cells; criterion_class/title identical across candidates
    for every AR; 177 HARD_CONSTRAINT rows + 18 WEIGHTED_PREFERENCE rows; every row carries
    claim_type, source_evidence (requirement anchor + candidate f23 anchor + candidate evidence),
    comparison_rationale, comparison_result, uncertainty_id, uncertainty_classification,
    related_e3_uncertainty_id, blocking_consequence, correlation_group, e3_obligation and
    preference_characterization. The "candidate evidence:" substring equals the frozen f23 evidence
    string in 195/195 cells; input_generation_status equals f23 generation_status in 177/177 hard
    cells. Evidence volume is comparable per candidate (11,009 / 10,138 / 10,324 source chars;
    15,283 / 14,441 / 14,694 rationale chars); no candidate receives materially less evidence.
    Hard and preference rows remain distinct (different result vocabulary, uncertainty linkage and
    preference_characterization NOT_APPLICABLE for hard rows).
  hard_constraint_discipline: >-
    Every hard cell moved from the verified E2-002 status under one written rule: 52 SATISFIED_BY_DESIGN
    -> CONFIRMED_SATISFIED_FOR_COMPARISON (PROPOSAL; "design confirmation only"); 5 PLAUSIBLE ->
    CONFIRMED_SATISFIED_FOR_COMPARISON (INFERENCE) via E2U-PAPER-C01-U03 / C02-U02 / C02-U03 /
    C03-U03 / C03-U04 with §4.2 per-candidate analysis; 2 UNKNOWN_REQUIRING_SPIKE ->
    ARCHITECTURE_BLOCKING_SPIKE (UNKNOWN; "no favorable score or assumed pass"). No VIOLATED result;
    no preference row carries a hard result; no hard cell cites a preference as justification; both
    UNKNOWNs block E2-005 for every candidate. Re-derived rechecks: AR-EXE-003 kept blocking (staging
    disputed in F-E2-003-01, credit not disputed); AR-DUR-003 confirmed in all three from f08/f12
    intent/attempt/readback/unknown-effect bridges with no atomicity claim; AR-DUR-004 confirmed from
    f03/f04/f07/f09 durable ordered control with no-live-owner semantics recorded truthfully
    (V-E2-002-N6); AR-DUR-005 confirmed from f08/f09 (C01 transactional old/new + quarantine; C02
    corruption_partial_write + retention_migration + restore; C03 versioning + partial_write_corruption
    + evolution + payload-before-event ordering + orphan reconciliation); AR-SEC-003 confirmed from f04
    protected_delivery_path (C01 co-resident one-use scope; C02 service-issued non-secret authorization
    with raw bypass; C03 out-of-event broker); AR-SEC-006 kept blocking (staging disputed in
    F-E2-003-02); AR-TST-002 confirmed from f25 family_level_matrix + EP_CTL_016 + 16 compositions;
    AR-FUT-001/002 confirmed at the seam/ownership floor with extraction cost in AR-PRF-003/004;
    AR-PKG-001 confirmed at the explicit no-hidden-service floor with burden in AR-PRF-006. No hard
    failure was compensated; no unresolved hard question received optimistic credit.
  symmetric_hard_status: >-
    The two retained blocking ARs are AR-EXE-003 and AR-SEC-006 for all three candidates (identical
    uncertainty_id E2U-S01 / E2U-S02). Candidate-specific hard-relevant risks are visible rather than
    hidden: C01 broad trusted core and headless task-bound continuation (§6 D02/D20, §7, §13, f02
    lifetime_model); C02 service as sole live authority/availability and security boundary plus
    lease/fence and IPC authentication (§6 D02/D20, §8 SPOF row, §9 TB-05/TB-15); C03 reducer/schema/
    append-validation correctness inside the trusted design and no-live-coordinator interval (§6 D20,
    §8, §9 closing paragraph). Equal hard counts are not presented as equal quality: §16.1 and §16.2
    record distinct costs per candidate.
  analytic_resolutions: >-
    All ten PAPER_RESOLVABLE records are genuinely analysis-owned: six are preference/proportionality
    characterizations (C01-U01, C01-U02, C02-U01, C03-U01, C03-U02 in part, and the burden halves of
    the packaging questions) and four/five are structural-floor confirmations of PLAUSIBLE hard ARs
    (C01-U03, C02-U02, C02-U03, C03-U03, C03-U04). Each cites committed candidate structure
    (f02/f04/f06/f08/f09/f10/f15/f16/f18/f19/f20/f22/f23/f25/f26/f28); none invents an empirical
    observation; none resolves an E3 question or elevates an implementation detail. Weaknesses: the
    valence labels are asymmetric (F-E2-003-03) and the three host-class questions are labelled
    RESOLVED_FAVORABLE although their host-class half is deferred to E3V-003/006 (F-E2-003-05).
  v_e2_002_01: >-
    AR-DUR-005 semantics (versioned, complete-or-detectably-interrupted records; incompatible/corrupt
    data fails or migrates visibly with original evidence preserved) are addressed for C02 by f08
    corruption_partial_write, retention_migration and restore plus f09 partial_write /
    workspace_partial_write_recovery, and for C03 by f08 versioning, partial_write_corruption,
    evolution, protected_and_external_payload_ordering (payload-before-event) plus f09 partial_write
    and orphan reconciliation — the same f08/f09 content the E2-002 verifier cited and that
    F-E2-002-08/09 added. Comparison §4.2 supplies the per-candidate analysis; the register links
    AR-DUR-005 to E2U-PAPER-C02-U03 / C03-U04 with V-E2-002-01 as a source_ref; frozen candidate f27
    pointers are unchanged. The missing pointer was bookkeeping; no spike is needed; C01 received the
    same treatment (E2U-PAPER-C01-U03), so no candidate was favoured.
  v_e2_002_02: >-
    Frozen semantics: AR-SEC-003 is the exact-recipient/least-scope delivery boundary; AR-SEC-006 is
    the acquisition/takeover boundary; E1 (correctness contract §9.6) makes the recipient boundary "an
    E2-selected protected recipient boundary", i.e. an interface decision, and E3V-006 owns "recipient
    isolation". Every candidate specifies a sufficient protected-delivery seam (C01 f04
    protected_delivery_path one-use recipient/use/fence scope; C02 f04 protected_delivery_path with
    scope_validator, opaque authorization, forbidden_raw_observers, worker_replacement and
    crash_semantics; C03 out-of-event broker with non-secret receipt event). Candidate-specific
    delivery failure would revise the selected candidate's ADR, not change which shape is coherent, so
    E3V-006 is the correct owner and the handback rule is explicit in each E3U-*-PROTECTED-DELIVERY
    record ("structural impossibility or a hard failure in E3 triggers ADR handback/revision"). The
    split is recorded uniformly for all three; AR-SEC-003 is not overstated (design-level vocabulary
    with E3 obligation). The disposition is accepted; its reasoning is exactly what F-E2-003-02 asks
    the author to apply to acquisition.
  retained_spikes: >-
    SPQ-E2-002-01 -> author KEEP_E2_004 (E2U-S01); challenger MOVE_TO_E3 (E3V-002) with
    architecture-level PAPER closure — see F-E2-003-01. SPQ-E2-002-02 -> author KEEP_E2_004 (E2U-S02);
    challenger MOVE_TO_E3 (E3V-006) with architecture-level PAPER closure — see F-E2-003-02.
    SPQ-E2-002-03/04/05 -> author and challenger MOVE_TO_E3 (E3V-006) as E3U-C01/C02/C03-PROTECTED-
    DELIVERY. No question is NOT_REQUIRED (each remains a real E3 obligation with handback). No item
    should MOVE_TO_E4. Re-derived retained E2-004 set: empty.
  s01_descendant_containment: >-
    Blocks AR-EXE-003 only. The uncertainty is implementation/host technology (does the supported host
    primitive terminate or durably deprive descendants), not semantic architecture feasibility: frozen
    E1 admits fencing when termination is unavailable (PRD FR-033 "safe/available force termination or
    authority fencing"; correctness contract l.955 "safe force termination or authority fencing occurs
    when available"; EP-CTL-005; EP-NEG-TERM-01 "force/fence when available"; AR-EXE-003 "any
    unkillable work is fenced/accounted"). The requirement can be satisfied at architecture level by
    the containment interface every candidate already declares (supervisor-owned process tree,
    required host primitive, cancel/force-or-fence/settle bounds, stale-result rejection by
    epoch/lease/fence, fail-closed unsupported class) with mechanism validation under E3V-002, which
    the verified E2-001 register already assigns ("Host-specific process-tree and fencing support
    requires E3 validation"; E3V-002 handback "A structural inability to control/fence an advertised
    class returns to E2"). Candidate choice does not change feasibility: the author's contract uses
    one technology-neutral adapter with thin wrappers and declares the host primitive result reusable
    across all candidates; in every topology the owner-death case reduces to the same primitive.
    Tier 2 semantic isolation is the shared floor and is enough at architecture level. This is a
    shared platform mechanism, not a candidate discriminator; failure narrows the supported host
    class (already an explicit AR-PKG-001 declaration) rather than invalidating any shape or the
    frozen requirement.
  s02_protected_acquisition: >-
    Hard ARs: AR-SEC-006 (and AR-SEC-003 via delivery). Shared across all candidates by the author's
    own record; no candidate changes acquisition feasibility, which depends on the client surface
    (ADR-E2-001, unselected under D-016) and host observation surfaces. The architecture can and does
    require a protected-entry interface contract (distinct path, capture suspension/exclusion,
    exact-recipient handoff, non-secret receipt, fail-closed WAITING_FOR_USER/blocker, no raw replay)
    in C01/C02/C03 f04/f18, leaving the concrete secure-input mechanism to E3V-006, which E2-001
    explicitly assigns ("E3V-006 owns the focused capture-suspension/acquisition-boundary
    validation"; AQ-010 "E2-004 only if feasibility remains selection-blocking"). The product
    requirement does not depend on proving OS/client capture exclusion before selection: UF-11 step 2
    and AR-SEC-006 define the fail-closed branch. If all candidates fail, the consequence is a
    product/client-support limitation shared equally, not one architecture being inferior. As
    contracted the spike cannot produce architecture evidence (no client/host class; self-defined
    observers; zero dependencies) — see F-E2-003-02.
  removed_reclassified_spikes: >-
    SPQ-03/04/05 no longer block E2 because the exact-recipient protocol is a structurally explicit
    interface in each candidate (seams above) whose concrete IPC/memory/crash-point correctness is
    selected-mechanism validation; E3V-006 is the E2-001-declared owner of recipient isolation; E3
    must validate one-use consumption, forbidden-surface cleanliness, replacement/revocation and
    crash ambiguity without raw persistence; a structural inability to keep raw bytes out of the
    candidate's ordinary paths forces ADR handback (recorded in each E3U record), while a miswired
    adapter is implementation correction (E2-001 §9 rule 3). None still blocks candidate viability.
  minimal_e2_004_set: >-
    Minimum empirical evidence genuinely required before E2-005 may propose ADRs: none. Both
    remaining hard unknowns are candidate-invariant, have fail-closed E1 semantics, are owned by
    E3V-002/E3V-006 with handback in the verified E2-001 register, and cannot change the selection
    among C01/C02/C03 (plan §13 definition). E2-004 should therefore produce the registry-anticipated
    NO_PRESELECTION_SPIKE_REQUIRED closure, carrying for each removed item: the non-selection-blocking
    demonstration, the E3 obligation and handback rule, the ADR (plan §9 ID) missing-evidence entry,
    and the explicit product consequence of a later negative result (unsupported host/workload class;
    protected entry unsupported on a client class => WAITING_FOR_USER). One shared experiment would be
    preferred over duplicated candidate experiments if any spike were retained; none is required.
  hard_fairness: >-
    Same evidentiary bar: identical rationale template and vocabulary for every hard cell; §4.2 gives
    each candidate a mechanism-specific paragraph per PLAUSIBLE AR. Unknowns symmetric (same two ARs,
    same blocking consequence). Complexity is charged to every candidate (C01 broad-core coupling,
    C02 lifecycle/IPC/lease, C03 event/reducer/projection) and never as a hard status. Integration,
    service/worker and event-model risks each appear in the preference rows, §13 and §16.2 as
    descriptions, not counts; no future-compatibility benefit offsets a hard uncertainty (hard map is
    equal and §5 AR-PRF-004 states "not a hard-status difference").
  preference_comparison: >-
    Six rows (AR-PRF-001..006) x three candidates; every cell QUALITATIVE_TRADEOFF_NO_SCORE with
    preference_characterization; no weights, numeric values, hidden totals or ranks anywhere
    (E2U-PREFERENCE-WEIGHTS NOT_ASSIGNED_BY_POLICY). Hard compliance is separate (§4 before §5). The
    matrix pairs the preferences into three groups {001,005} {002,006} {003,004}; the comparison §3
    discloses five groups with E2-001 §8 semantics; the two vocabularies do not map to each other and
    PRF-003's dual membership is not stated (F-E2-003-06, LOW; no arithmetic double counting exists
    because nothing is summed).
  decision_domains: >-
    D01-D25 each have a C01, C02 and C03 shape cell, a comparative strengths/weaknesses cell and a
    U/H-P/M cell; sampled against f24 (D08, D16, D21) the claims trace to candidate structure; every
    unresolved question is mapped to E2-004 (D08/D09/D20 blockers), E3 (mechanism/fault/instrumentation
    evidence) or deferred future product (D22-D24).
  correctness: >-
    §7 compares truthful completion, revision binding/stale invalidation, independent verification,
    predicate adequacy, partial outcomes, evidence integrity and executor/verifier separation. C01's
    broad trusted core is stated as a burden ("broad core remains trusted authority") while the
    independence floor (separate verifier process/context reading core authority) holds; C02's
    authority races are bounded by service epoch/lease binding (f06) with stale-writer rejection;
    C03's derived projections are explicitly non-authoritative with projection lag/staleness burden
    (f22, §6 D01/D15). No hard violation is fabricated; no burden is hidden.
  durability_recovery: >-
    §8 compares source of truth, complexity, single point of failure, ambiguous effect strategy,
    reconciliation cost, partial writes/corruption, client exit and pause/stop/force, and closes with
    "tradeoffs, not a recovery winner"; "transactional"/"replaceable"/"journal" framing is offset by
    each candidate's stated limit (C01 centralized recovery/blast radius; C02 lease/fence and service
    availability; C03 journal/payload/reducer/checkpoint/retention surface). Stale workspace,
    duplicate delivery, stale approval and stale verification are confirmed per candidate in matrix
    cells and f09 keys but are not compared as rows (F-E2-003-09, LOW).
  security: >-
    All 20 boundaries compared on enforcement locality, trusted boundary, blast radius, protected
    entry, process containment, effect authority, provider/tool boundary and evidence integrity;
    §9 explicitly refuses process-count inference and declares no candidate more secure overall.
    One mild unearned superlative (C03 TB-05 "strongest raw-event exclusion rule" — the three
    exclusion rules are design-equivalent) is recorded as note N4.
  isolation: >-
    Truly common: TIER_2 semantic floor, dependent hard ARs, enforcement layers, fail-closed
    unsupported classes, AQ-003 disposition (identical f10 blocks). Differs by topology: locality of
    brokers/supervisors and enforcement burden only. The retained S01 question is a platform
    mechanism question by the author's own contract and §11 ("the shared hard floor is unchanged");
    isolation differences therefore cannot influence candidate selection, which is the basis of
    F-E2-003-01.
  testability: >-
    §12 compares seams for the 170 cases, 18 oracles, 11 fixtures, 23 negative families, 16
    repository conditions, 30 Git/effect rows, 9 adequacy variants, 16 compositions, 8 protocols and
    EP-CTL-016; fault injection, state observation, substitution, process kill, stale state,
    approval/effect simulation and independent verification are covered; C03 is not rewarded for
    inspectable events ("more substitution points are not automatically better"; "no score") and
    C01 is not rewarded for one process ("extra injection points are not automatically better").
  contributor_burden: >-
    §13 descriptions are supported by f22 (C01 "core failures can span several colocated
    responsibilities"; C02 "Correlation spans IPC and worker leases"; C03 "understanding
    reducer/event evolution, projection lag and payload retention is required"). The same facts
    appear in AR-PRF-002 and AR-PRF-006 rows and in §16.2 without a cross-reference; no counting
    occurs, so this is a presentation issue folded into F-E2-003-07.
  implementation_complexity: >-
    Qualitative only; not a hard constraint. C01 coupling/recovery concentration/migration coupling,
    C02 lifecycle/IPC/protocol contract-version burden, C03 schema evolution/reducer correctness/
    replay tools/projection debugging are named. C02 service-worker version skew across separately
    updated processes is not named explicitly (note N4).
  local_first: >-
    §13 covers setup/process count, startup/idle, offline, shutdown/update/migration; C03's task-bound
    coordinator during active work is stated ("task-bound/absent"; f19/f22) so the no-daemon claim
    does not hide a live coordinator; C01's shutdown/checkpoint/migration coupling is stated
    ("integrated store/core migrations are coupled"); during active work C01 and C03 both run one
    task-bound owner process while C02 runs a persistent service — correctly reflected.
  future_evolution: >-
    §6 D22-D24 and §13 compare remote, cloud workers, concurrency, agents, clients, skills,
    connectors, editions and SaaS as reserved seams only (f20 RESERVED_COMPATIBILITY,
    not_implemented true in all three); C02/C03 seams are credited as lower adaptation cost, not as
    hard advantage; C01's extraction cost is stated (arguably over- rather than under-stated, see
    F-E2-003-03).
  migration_reversibility: >-
    §13 distinguishes foundational lock-in (C01 integrated single-writer core and store/history/
    effect semantics; C02 service/store authority and lease/effect protocol; C03 canonical event
    identity/order/meaning and journal/payload boundary) from reversible decisions, and §5
    AR-PRF-003 names the material data/state migration each faces; "adapter" language is not used
    to understate state migration.
  level_b: >-
    f29 statuses recomputed and matching §14: LB-02 NOT_USED in all three; C03 LB-05 and LB-09
    SUBSUMED; LB-12 SUBSUMED for C01/C03 and USED for C02; every other family USED. §14 explicitly
    treats counts as non-scores, credits C03 with "stronger structural alignment and higher burden,
    not a count advantage" and gives C01 no bonus for LB-02/LB-14 non-use.
  dominance: >-
    Strict pairwise re-test. C01 vs C02: C01 worse on worker replaceability/remote seam. C01 vs C03:
    C01 worse on causal reconstruction/replay. C02 vs C01: C02 worse on local topology/latency/
    setup. C02 vs C03: C02 worse on deterministic replay/reconstruction. C03 vs C01: C03 worse on
    conceptual burden/current-state simplicity/storage overhead. C03 vs C02: C03 worse on direct
    worker replaceability and contributor concepts. Every pair has a strictly-worse dimension and
    the same unresolved hard unknowns; no candidate dominates.
  sensitivity: >-
    A minimal local complexity: C01 gains, C02 loses, C03 mixed — supported. B recovery rigor: C03
    gains — supported. C future remote: C02 most directly, C03 via serializable events, C01 pays
    extraction — supported. D contributor accessibility: mixed, E3V-003 observation — supported.
    E migration reversibility: no stable order — supported. F security boundary clarity: no stable
    gainer (one high-authority locus vs narrower worker authority with more authenticated crossings
    and a service boundary vs explicit admission with schema/reducer correctness in the trusted
    design) — consistent with §9 but absent from §16.2. G testability/debuggability: C03 replay,
    C02 substitution, C01 low topology, no score — consistent with §12 but absent from §16.2
    (F-E2-003-07). No overall ranking results from any profile.
  decision_readiness: >-
    All three candidates survive the analytic hard gate with equal maps and no candidate-specific
    unresolved hard risk. NEEDS_E2_004 follows only from the author's two-spike set; both spikes are
    shared, cannot distinguish candidates, and block implementation-class evidence rather than
    candidate comparison or ADR proposal (which may carry missing evidence per plan §9). If
    F-E2-003-01/02 are accepted, readiness for each candidate is
    READY_FOR_E2_005_AFTER_INDEPENDENTLY_VERIFIED_E2_004_NO_SPIKE_CLOSURE; no candidate is
    ANALYTICALLY_NONVIABLE or NEEDS_ARCHITECTURE_REVISION; no candidate is preferred.
  e2_004_input: >-
    Both contracts carry ID, question, candidate applicability, ARs, blocking reason, minimal
    prototype, success, failure, no-go, evidence/artifact, stop condition, budget and decision
    linkage (13/13 fields). They fail as E2-004 input because (a) they are staged at the wrong gate
    (F-E2-003-01/02); (b) S02 cannot instantiate its mandatory OS-surface observers without a declared
    client/host class and zero dependencies, so a PASS would be prototype theater and the realistic
    disposition is INCONCLUSIVE_BLOCKING (F-E2-003-02); (c) S01's "technology-neutral adapter" must
    bind to an unselected host primitive, so its result is valid only for that mechanism, which is
    E3V-002's object; (d) consequence rules conflict across matrix/register/§16.3 and do not map the
    E2-004 disposition vocabulary (F-E2-003-04); (e) adr_linkage does not use the plan §9 ADR IDs
    (F-E2-003-08). If the fixer converts E2-004 to a no-spike closure, the register already holds
    most of the required content and needs relabelling plus the demonstrations above.
  e2_005_input: >-
    §17 enumerates comparison baseline, surviving candidates, hard map plus E2-004 outcomes,
    unweighted preferences/sensitivity, the ten resolutions and both verifier dispositions,
    recovery/security/testability/contributor/local-first/future/migration evidence, E3 obligations
    with handback, and "explicit decisions for proposed ADRs" without naming ADR-E2-001..009 or
    mapping missing evidence to them (F-E2-003-08, LOW). No ADR is written.
  premature_selection: >-
    Word scan over the four artifacts: preferred 4, recommended/recommend 3, winner 23, rank/ranked/
    ranking 27, score/scored/scoring 26, selected 8, dominant 1, default 5, best 0, leading 0,
    favorite 0 — every context is a negation or policy statement ("no winner", "not ranked",
    "unranked", "NOT_SELECTED", "preferred candidate NONE/null", "deny-by-default", "hands the
    selected ADR back"). Preferred candidate null/NONE in register, handoff, registry and
    PROJECT_STATE; architecture_selected false. No candidate consistently receives more generous
    evidentiary treatment (equal templates, comparable evidence volume, equal hard maps). The C01-only
    UNFAVORABLE valence label is a latent asymmetry (F-E2-003-03), not a selection.
  frozen_artifacts: >-
    git diff c2f7093..HEAD -- 03_product 06_evaluation 10_checkpoints: empty (E1 byte-preserved
    since the E1 gate commit); git diff 0d702b8..HEAD on the three E2-001 artifacts: empty; git diff
    1a1c542..HEAD on 05_architecture/candidates and the alternatives overview: empty; candidate
    SHA-256 equal to the author's recorded values (ea9ff609…, 899f7fa0…, 72cacf1c…); no
    05_architecture/spikes, 05_architecture/adrs or 04_decisions directory; no application source
    files; no model/provider comparison; no Level C path tokens in the E2-003 artifacts.
  governance: >-
    PROJECT_STATE and TASK_REGISTRY reconcile: E2-001 VERIFIED, E2-002 VERIFIED (1a1c542), E2-003
    READY_FOR_REVIEW / READY_FOR_REVIEW_NOT_VERIFIED_AUTHOR_PASS, E2-004..006 BACKLOG (E2-004
    blocked_by E2_003_NOT_INDEPENDENTLY_VERIFIED), gate NOT_EVALUATED, architecture_selected false,
    preferred_candidate null, accepted_architecture_adrs 0, architecture_spikes_run /
    technical_spikes_run 0, evaluation_cases_run 0, model_benchmarks_run 0, paid_api_calls 0,
    autonomy_eligibility NOT_ELIGIBLE, autonomous_build_authorized false, S1-003 BLOCKED /
    DEFERRED. The author's seven changed paths are all within E2-003 allowed_files_to_change;
    README (not an allowed path) remains stale from the E2-002 cycle (note N2).
