  - finding_id: F-E2-003-02
    severity: HIGH
    candidate_or_component: >-
      E2U-S02-PROTECTED-ACQUISITION (register classification, state, spike_contract); matrix
      AR-SEC-006 cells x3; comparison §4.3, §10, §11, §15, §16.3; RISK_REGISTER R-009 mitigation text;
      handoff/registry/PROJECT_STATE spike counts and readiness
    requirement_or_uncertainty: >-
      AR-SEC-006 (hard) and AR-SEC-003; UF-11 steps 2-3; correctness contract §9.6; AQ-010; E3V-006;
      plan §9 ADR-E2-001 (client surface) and ADR-E2-005 (secret/protected-entry boundary); plan
      §13; E2-004 forbidden_actions ("select a technology") and challenger_requirements ("prototype
      theater or hidden implementation")
    evidence: >-
      (1) Frozen E1 defines the consequence of an unavailable acquisition boundary: UF-11 step 2 "If
      a supported secret-safe or human-takeover boundary does not exist, add
      task.wait_reasons=WAITING_FOR_USER or a task.blocker_refs record; do not improvise"; AR-SEC-006
      "If that acquisition boundary cannot be guaranteed, the task fails closed to WAITING_FOR_USER
      or a blocker with zero improvised acquisition". A negative result narrows the supported
      client/host class; it invalidates neither the requirement nor any candidate shape, and all
      three candidates already specify the fail-closed branch (C01 f18 protected_human_entry; C02
      f18 protected_entry; C03 f18 protected_entry). (2) The verified E2-001 register assigns the
      validation to E3: AR-SEC-006 Evaluation linkage "E3V-006 owns the focused
      capture-suspension/acquisition-boundary validation without altering the frozen suite"; E3V-006
      subset "protected-entry capture suspension/exclusion, recipient isolation" with
      ARCHITECTURE_HANDBACK; AQ-010 "E2-004 only if feasibility remains selection-blocking". (3) The
      question is candidate-invariant: register rationale "The question is shared before
      candidate-specific delivery"; reusable_result_scope "Acquisition/capture exclusion result is
      shared"; the contract has no candidate wrappers. Its answer depends on the client surface
      (terminal, local web, desktop) that D-016 leaves unselected and plan §9 assigns to ADR-E2-001;
      a client-neutral spike cannot inform that ADR without pre-selecting a client class, which
      E2-004 forbids. (4) The author's reasoning for reclassifying delivery (§10 "A candidate's E3
      delivery failure hands the selected ADR back for revision; it never becomes a favorable E2
      assumption"; E3U-*-PROTECTED-DELIVERY) applies verbatim to acquisition; §4.3's only reason for
      keeping acquisition in E2 ("cannot prove ... from prose") applies equally to AR-SEC-003, which
      the author paper-resolved. (5) As contracted the spike cannot yield architecture evidence: it
      requires "complete observers" for keystroke, clipboard, screen_and_screenshot,
      accessibility_state and terminal surfaces with dependencies_or_installations 0, no declared
      client/host class, a harness-defined protected-acquisition adapter, and the rule "missing
      capture is not a clean result". Either the harness observes only surfaces it defines itself
      (a PASS would be prototype theater clearing a hard blocker for all candidates) or the mandatory
      OS-level observers are missing and the disposition is INCONCLUSIVE_BLOCKING, which the contract
      makes block E2-005 for all three candidates on a non-discriminating question. The
      required_content "Exact local environment/support declaration" would be whatever machine the
      E2-004 author uses, not a declared product support class.
    why_it_matters: >-
      A hollow PASS would convert a hard property into cleared evidence with no observed client
      surface (R-030 "treats an unknown as favorable"); a predictable INCONCLUSIVE_BLOCKING would
      deadlock E2 on a platform/client question that cannot distinguish candidates and that E1
      resolves by fail-closed WAITING_FOR_USER. Either outcome is an unnecessary or insufficient
      E2-004 spike and false decision readiness, and the classification contradicts the verified
      E2-001 E3V-006/AQ-010 placement and the author's own delivery reclassification.
    required_fix: >-
      Either (a) reclassify E2U-S02 to E3_POSTSELECTION_TECHNICAL_VALIDATION under E3V-006 (state
      RECLASSIFIED_TO_E3); record the architecture-level PAPER closure for AR-SEC-006 in all three
      candidates (protected path distinct from ordinary pipelines, capture suspension/exclusion
      interface, exact-recipient handoff per AR-SEC-003, non-secret durable receipt, fail-closed
      WAITING_FOR_USER/blocker, no raw replay on recovery — present in f04/f18 of each candidate);
      set the three matrix AR-SEC-006 cells to CONFIRMED_SATISFIED_FOR_COMPARISON with E3V-006 linkage
      and blocking_consequence "E3V-006 ARCHITECTURE_HANDBACK narrows the supported client/host
      class; protected entry unsupported on a class means WAITING_FOR_USER, never improvised
      acquisition"; link the missing evidence to ADR-E2-001 and ADR-E2-005; merge or align with
      E3U-C0x-PROTECTED-DELIVERY so acquisition and delivery are validated under one E3V-006 protocol
      after the client-surface ADR; recompute partition, readiness, §15/§16.3/§17, handoff,
      registry, PROJECT_STATE and the R-009 text; or (b) retain E2U-S02 only with an explicit
      demonstration of how its result changes an E2 decision without pre-selecting a client class, a
      concrete statement of how each mandatory observer will be realized with zero dependencies on an
      undeclared host, and a prototype-theater control (observers independent of the acquisition
      adapter under test). In either route do not credit AR-SEC-006 as validated, select no client
      technology, mechanism or product, and do not modify the frozen candidate records.
    verification_method: >-
      Parse the register for E2U-S02 classification/state and E3V-006 linkage; confirm the three
      matrix AR-SEC-006 cells and partition totals; confirm UF-11 step 2 is quoted in the closure;
      confirm ADR-E2-001/ADR-E2-005 missing-evidence linkage exists; grep governance for spike counts,
      R-009 wording and NEEDS_E2_004; confirm no client technology, mechanism or host product was
      selected.
