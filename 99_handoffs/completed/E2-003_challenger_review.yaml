  - "N-E2-003-06: The handoff's repository_commit_or_patch says the patch is uncommitted at founder request; the founder committed it as c870c83 (2026-08-29T10:11:53-04:00). Reviewed against committed bytes; the committed path set equals the seven paths the handoff lists."
  - "N-E2-003-07: The E2-004 registry's disposition vocabulary includes DEFERRED_TO_E3_NON_SELECTION_BLOCKING, so an E2-004 author could still defer S01/S02 with evidence if the fixer disputes F-E2-003-01/02; the taxonomy nevertheless makes E2-003 the classification owner, and E2-004 may execute only prospectively classified items."
  - "N-E2-003-08: AR-COR-002 e3_obligation NONE matches E2-001 (NONE). AR-TST-002 cells list E3V-001 only although E2-001 declares E3V-001..007; cosmetic."
  - "N-E2-003-09: Author started_at is UNKNOWN_NOT_CAPTURED (precedent); the technology scan's single 'Codex' token is the author-model attribution, not a technology selection."
