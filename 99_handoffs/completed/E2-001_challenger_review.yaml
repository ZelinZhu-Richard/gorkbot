section_evidence:
  e1_trace_source: >-
    Independent extraction of backticked definition rows/headings yields exactly the 127 IDs
    listed in the CSV (set difference empty both ways); each appears exactly once with one
    primary disposition; the checkpoint requirement_dispositions carry the same 127 keys. The
    source documents are correct on every row; the section numbers cited for FR (PRD §7) and
    the RR mirror (PRD §10) are wrong (actual §6 and §7) — recorded as F-E2-001-04.
  traceability_quality: >-
    Per-ID comparison of E1 text against the primary AR: 124 of 127 primaries are the
    semantically governing requirement (e.g. FR-065/066/RR-008 -> AR-COR-004 reproduces the
    §11.1 conjunction; FR-044/NEG-APR-01 -> AR-APR-001 reproduces §9.4 binding, one-shot,
    successor revalidation; FR-032/RR-003/NEG-EXT-01 -> AR-DUR-003/APR-002 reproduce §6.1/§9.5
    OUTCOME_UNCERTAIN and no-blind-replay; FR-023/024 -> AR-GIT-001 preserves the 30-row
    matrix with approval unable to enable PROHIBITED_V0_1; FR-053 -> AR-MOD-002 preserves all
    four eligibility classes and zero dispatch). No architecture-relevant ID is treated as
    non-architecture-driving; the eight SLO/MET IDs are correctly empirical with AR-TST-003/
    AR-PERF-002 seams hard. No empirical question became an architecture decision. Defects:
    UF-11 (reference-only, F-01); FR-025/FR-026 primary AR-TST-001 with TESTABILITY taxonomy
    although their semantics are product check-set integrity and check-result evidence
    (F-03); 30 edges disagree between the AR register and the CSV (F-02). The CSV columns
    implied_architecture_property (51 distinct values) and justification_or_uncertainty
    (3 distinct values) are AR-level boilerplate, so per-ID semantics live in the AR
    grouping rather than the row (NOTE).
  hard_constraint_model: >-
    For every one of the 58 hard ARs, violating the description would violate a cited frozen
    E1 MUST/zero-tolerance clause (checked against PRD §6/§8/§12, contract §§3-15, UF
    invariants); none is a preference dressed as a constraint. The six preferences
    (latency, complexity, migration/reversibility, remote/concurrency adaptation, evidence
    overhead, contributor burden) can each be violated by an E1-compliant design and are
    correctly secondary with unassigned weights. No security/correctness property is
    downgraded: every PRF source ID also has a hard primary elsewhere. No performance
    preference masquerades as correctness: AR-PERF-001/002 and AR-TST-003 require bounds and
    instrumentation only, not values. The 119 primary hard dispositions are justified because
    FC-001..009 and UF-16 are compatibility/ownership floors whose violation contradicts PRD
    §12 evidence requirements (criterion_role makes this explicit). The hard set is
    property-level and does not predetermine a shape: single-process-with-detached-owner,
    local-service-plus-thin-client, and desktop-embedded runtimes can each satisfy it.
  architecture_neutrality: >-
    Zero matches for client, runtime, language, database, event store, workflow engine,
    queue, sandbox, container, VM, cloud, Git library, model SDK, agent framework, MCP-as-
    mandatory, vector/embedding/RAG, observability stack, or packaging system in either
    deliverable or the handoff. Mechanism-leak check: AR-DUR-005 states content addressing is
    not required; AR-DAT-002/COR-007/DUR-003 keep append structure, hashing, CAS, and
    journals Level B; AR-WSP-002 mirrors FR-012 "or another E2-selected mechanism";
    AR-EXE-003 mirrors RR-006 "force termination or authority fencing"; AR-VER-001 "separate
    accountable execution context with no shared mutable author state" is verbatim contract
    §11.3, not an added process requirement; AR-PKG-001 "remote services cannot be required
    for local truth" is the D-016/charter local-first constraint with declared-unsupported
    escape. §16 nonselection statement is consistent with the bodies.
  correctness_architecture: >-
    AR-COR-001..007, AR-VER-001..003, AR-EVD-001 preserve truthful completion (COR-004 =
    §11.1 conjunction incl. redirect-on-current-revision, pause released, stop->CANCELLED,
    no OUTCOME_UNCERTAIN, eligible independent PASSED), task/operation/verification/effect/
    artifact identity (COR-001), exact revision binding and stale invalidation (COR-006,
    VER-003), partial completion and UNVERIFIED distinctness (COR-005, VER-003), predicate
    adequacy before credit (COR-005, VER-002), independence floor and least privilege
    (VER-001), post-verification mutation (COR-006), evidence validity (EVD-001). Stress
    scenarios (killed process, executor prose, flaky pass, verifier crash, stale approval,
    unknown effect, draft package as PR, same-session verification, transcript-only
    verification, weighted completion) are each rejected by a prohibited outcome.
  durability_recovery: >-
    Process/orchestrator/worker/executor/verifier/machine interruption (DUR-002), model/tool
    timeout and lost response (EXE-002, DUR-003, FAIL-001), partial write and corruption
    (DUR-005), duplicate/stale writer (COR-007), duplicate external effect (DUR-003,
    APR-002), stale workspace (WSP-005), approval recovery (APR-001), acknowledgement loss
    (DUR-001, DUR-003), pause/resume/redirect/cooperative stop/force termination (DUR-004,
    EXE-003), reconciliation (DUR-002/003/004), verification invalidation (COR-006, VER-003)
    are all present; known success / known failure / unknown are distinguished (DUR-003,
    APR-002, EXE-002) and a crash after dispatch cannot infer success or failure
    (DUR-003 prohibited outcome). Residual under-specification of duplicate-delivery
    idempotent acknowledgement, UF-07 resume revalidation, external-event correlation, and
    agent-level pause/retire is LOW (F-E2-001-08).
  state_data_model: >-
    §3 and AR-DAT-001 separate authoritative state, derived projection, ephemeral working
    context, and lossy summary; only authoritative state grants authority or completion;
    rendered transcript is a projection while conversation/message authority is
    authoritative (charter §6 item 2 preserved); evidence is distinct from telemetry
    (EVD-003); summaries are provenanced/invalidatable and never authority (CTX-002); task
    state persists outside model context (CTX-001). Content addressing, journals, hash chains,
    projection codecs, and summary blocks are explicitly Level B; no Level B pattern is made
    mandatory anywhere in the bodies (checked every Provenance/Uncertainty line).
  workspace_execution: >-
    Admission and 16-condition disposition (WSP-001), base identity (WSP-001, GIT-002),
    bind-before-mutating-reproduction (WSP-002 = FR-012/EP-WF-019), original user state and
    dirty material (WSP-004), path/alias/symlink/special/archive/topology (WSP-003),
    protected secret locations overriding roots (SEC-003), stale workspace (WSP-005),
    cleanup/holds/deletion readback (DUR-006), process tree/bounds/force/fence (EXE-003),
    timeout/cancellation class (EXE-002), package scripts/hooks/helpers/network-sensitive
    commands (EXE-004), 30-row Git classification (GIT-001). No worktree, container, VM,
    copy, or supervisor technology is required (WSP-002, PKG-001 uncertainties).
  security_architecture: >-
    Structurally forced: user/founder authority and precedence (SEC-001), untrusted
    repository/tool/model content and closed instruction influence (SEC-001), capability
    contracts and boundary validation (EXE-001), deny-by-default scopes (SEC-002),
    filesystem/path/symlink (WSP-003), secret use/recipient boundary (SEC-003), process
    descendants (EXE-003), network/destination/credential (SEC-004), package scripts and Git
    hooks/helpers (EXE-004), external effects (APR-002), approvals (APR-001), destructive/
    prohibited actions (APR-003), provider boundary (SEC-004, MOD-002), evidence integrity
    (EVD-003, DAT-002). SEC-001 explicitly prohibits LLM judgment as the sole authority
    boundary. Not forced: the human secret-acquisition / interactive-authentication takeover
    boundary with observation-capture suspension and fail-to-wait (contract §9.6, UF-11,
    charter §5.4 "acquisition") — F-E2-001-01.
  approval_effect: >-
    AR-APR-001 binds requester/approver/principal/task/attempt/operation/action/capability/
    schema/target/base/policy/time/use with denial, expiry, revocation, replay, mutation,
    display, ownership-transfer and recovery semantics and prohibits Boolean/conversational
    approval; AR-APR-002 separates intent, authorization, attempt, observed response,
    authoritative readback, confirmed effect, known non-success, cancellation, unknown
    effect with stable request and execution identities; approval durability (APR-001) and
    effect durability (APR-002/DUR-003) are separate requirements. A transient UI
    confirmation fails APR-001's "authenticated durable record distinct from authorization
    and conversation".
  model_provider: >-
    Provider/role neutrality (MOD-001), route purpose and all four eligibility classes with
    zero dispatch for DISALLOWED and no self-promotion for EVALUATION_ONLY /
    USER_CONFIGURED_UNVERIFIED (MOD-002), explicit fallback as a new attributed route and
    typed provider-specific semantics (MOD-003), provider-versus-transport/policy failure
    distinction (MOD-003, FAIL-001), cost/latency accounting and pre-dispatch ceilings
    (PERF-001/002, SEC-004), E3-only eligibility (E3V-008, AQ-009). No provider, model, SDK,
    or permanent role assignment appears; no dependence on a current provider API shape.
  context_memory: >-
    Bounded context manifest and resumability (CTX-001), authoritative state and evidence
    outside model context (CTX-001, DAT-001), lossy summaries with source/version/trust
    provenance and invalidation (CTX-002), compaction never dropping approval/revocation/
    policy/security/evidence/completion facts (CTX-002 = contract §13.4). No vector store,
    embedding, RAG, long-context-only, or transcript-as-state selection.
  evidence_verification: >-
    Exact revision binding (COR-006, EVD-001), command/tool/check/approval/effect/route/
    actor/verifier provenance (EVD-001/002, EXE-002, VER-001), predicate adequacy (COR-005,
    VER-002), integrity/gap/tamper (EVD-002/003, DAT-002), limitations and final disposition
    (EVD-001), verifier access to the exact produced state and deterministic replay
    (VER-001/002), stale invalidation (COR-006, VER-003). An executor-summary-only verifier
    fails VER-001 ("transcript-only verification" prohibited; "obtain durable evidence
    independently of executor claims" required).
  observability_failure: >-
    OBS-001 structured inspectable answers by axis; OBS-002 evidence-linked explanations
    without chain-of-thought; EVD-003/DAT-001 keep telemetry non-authoritative; FAIL-001
    enumerates all fourteen failure layers requested by the review brief with source layer,
    retryability, consequence, and resolution path; FAIL-002 ceiling exhaustion and bounded
    safety reserve. No logging or error framework is named; a typed registry is Level B.
  testability: >-
    AR-TST-001 seams cover authoritative state, time/order, process interruption,
    filesystem/Git state, capability policy, provider routes, approvals, effects/readbacks,
    evidence, verification, resource ceilings — sufficient for fault injection, crash and
    lost-acknowledgement recovery, approval simulation, effect reconciliation, verifier
    independence, revision mutation, fake provider failure, timeout, and process termination;
    secret-boundary observation is forced through AR-SEC-003's twelve marker surfaces and
    AR-TST-002's 23-family materialization. The asset counts in AR-TST-002/§10 (170/18/11/
    23/16/30/9/16/8) reproduce from the suite and the verified E1 gate record. Hidden
    production-only state and model-claim-dependent tests are prohibited outcomes.
  performance_cost: >-
    No numeric threshold anywhere in the deliverables (regex scan for ms/seconds/%/USD/p50/
    p95 finds none); SLO/MET values and reference environment remain UNKNOWN (AR-TST-003,
    §11); measurement seams are hard where E1 requires them (PERF-002, TST-003, OBS-001);
    §11 assigns empirical items to E3_EMPIRICAL_VALIDATION, defaults/adapter limits to
    E4_IMPLEMENTATION_CONFIGURATION, and cloud/tenant thresholds to FUTURE_PRODUCT.
  future_compatibility: >-
    AR-FUT-001..003 and §12 operationalize compatibility as explicit identity/ownership
    fields, versioned serializable contracts, replaceable boundaries, visible migration/
    unsupported assumptions, and no global mutable authority, while §12 and every FUT
    uncertainty line state that remote execution, consensus, multiple agents/users,
    tenancy, connector loaders, schedules, finance schemas, and SaaS operations are NOT
    required in v0.1. AR-PRF-004 is the comparative criterion beyond the floor and names
    concrete observables (boundaries that would change, bounded migration profile), so the
    preference can distinguish candidates.
  level_abc: >-
    All 64 ARs carry Level A provenance re-derived from E1 (checked source IDs); §13 lists
    ten Level B families (content addressing, derived transcript projection, typed error
    registry, operation journal, provider router, explicit task/execution state, structured
    approvals, local/remote abstraction, context summary blocks, cloud-agent lifecycle) and
    excludes Level C per row; the audit is declared non-authoritative; no reconstruction
    identifier, module name, schema, or path appears (scan of 20 matrix pattern names and
    charter §16.2 Level C terms: zero hits). No Level B pattern has become hard through
    wording elsewhere (every Uncertainty/Provenance line checked). The table is
    under-inclusive relative to charter §16.2/§19 (F-E2-001-06, LOW).
  e3_obligations: >-
    E3V-001..008 are each empirical/technical or model validation of a selected mechanism,
    depend on a selected architecture, carry evidence and failure/reversal conditions, and
    do not conceal an E2 blocker: AQ-003/AQ-004 (isolation feasibility, force termination/
    fencing) are explicitly flagged as possible E2-004 questions rather than deferred; the
    ceiling-value owner (G-E1-N3) is routed to AQ-008/E2-005 per plan §14; E3V-008 keeps
    model eligibility in E3. Scope wording ("Run all twenty-three families", "execute the
    eight protocols") and the absent per-obligation handback path are LOW (F-E2-001-07).
  unresolved_questions: >-
    AQ-001 E2-002 candidate / E2-003 comparison; AQ-002 candidate declaration + E3V-001;
    AQ-003 candidate + E2-003 (possible E2-004) + E3V-003/006; AQ-004 candidate + possible
    E2-004 + E3V-002; AQ-005 E2-002 capability/effect contract + E3V-001; AQ-006 E2-002 +
    E3V-005; AQ-007 E2-002 + weighted preference + E3V-003; AQ-008 ownership interface in E2,
    values registered by E2-005/E3 freeze; AQ-009 E3 only. No frozen product semantic is
    presented as an unknown (AQ-005 asks only which capabilities remain unsupported, which
    FR-068 already permits).
  decision_domains: >-
    All 25 plan domains receive at least three ARs (D15 and D22/D23 have 3-4 each, all
    material: CTX-001/002/DAT-001; FUT-001/PKG-001/PRF-003/004; COR-007/FUT-002/PRF-004/
    WSP-005); every domain has an ownership/authority question; no domain is covered only by
    a catch-all; the §7 table equals the inverse of the AR bodies; cross-cutting ARs appear
    in several domains by design. No significant E1 domain is missing from the plan's 25.
  e2_002_input_contract: >-
    28 fields recomputed; they cover every item in the review brief (system shape 2,
    process 4, trust 5, authority/state 6, operation 7, persistence 8, recovery 9, workspace/
    execution/isolation 10 and D09 answer via 22, Git 11, approvals/effects 12, provider 13,
    context 14, evidence 15, verification 16, observability/failures 17, security ownership
    18, packaging/local-first 19, future 20, E1 mapping 21, domains 22, testability 23,
    weaknesses 24, unknowns/spikes 25, migration/reversibility 26, Level A/B/C 27, E3 28).
    The contract does not force one shape (field 4 asks for owners of logical boundaries; §7
    permits colocation) and forbids hand-waving through fields 21-23 and the structural-
    invalidity clause. Gaps: the plan §7 / E2-002 AC-3 three-way split (required now /
    interface reserved now / deferred later) and an explicit contributor-burden field are
    absent (F-E2-001-05, LOW).
  decision_criteria: >-
    §2 defines HARD_CONSTRAINT, WEIGHTED_PREFERENCE, UNKNOWN_REQUIRING_SPIKE,
    E3_VALIDATION_OBLIGATION, and JUSTIFIED_NON_ARCHITECTURE_DRIVING with selection
    consequence and evidence rule; hard failures are disqualifying and non-compensable by
    score or approval; unknowns receive no favorable/zero/midpoint surrogate; preferences
    apply only after hard pass; E3 obligations cannot defer an architecture blocker (§2, §5,
    §8, §9). No AR sits ambiguously between classes: hard instrumentation (PERF-002/TST-003)
    versus preference on measured values (PRF-001/005) and hard compatibility floor
    (FUT-001/002, §12) versus PRF-004 are explicitly delimited.
  clean_room: >-
    No reconstructed code, module name, schema, path, or Level C identifier imported (zero
    hits); external audit and adoption matrix treated as non-authoritative questions/pattern
    hypotheses (§13); Level C excluded per row; frozen E1 artifacts byte-identical (blob IDs);
    no private customer data or proprietary material; AR-SEC-005 keeps provenance a hard
    constraint; R-029 licensing remains a separate release blocker.
  governance_boundary: >-
    TASK_REGISTRY E2-001 status READY_FOR_REVIEW / verification_status
    NOT_VERIFIED_AUTHOR_PASS; E2-002..E2-006 BACKLOG with dependencies unchanged;
    PROJECT_STATE current_stage_status E2_ACTIVE_E2_001_READY_FOR_REVIEW_NOT_VERIFIED,
    active_task_ids [E2-001], ready_task_ids [], E2 gate NOT_EVALUATED, architecture_selected
    false, current_architecture_version null, model_roles_locked false,
    application_code_created false, evaluation/spike/benchmark/paid/external counters 0,
    E3-E5 NOT_STARTED, autonomy NOT_ELIGIBLE / NOT_AUTHORIZED, S1-003 BLOCKED / DEFERRED
    with zero execution; MODEL_REGISTRY 13 candidates HYPOTHESIS_ONLY / NOT_RUN and
    no_paid_calls_run true; no ADR directory or accepted ADR exists; no candidate directory
    exists. PROJECT_STATE and TASK_REGISTRY reconcile. README.md still shows E2-001 READY and
    next command EXECUTE_TASK_E2-001 (stale; README is outside E2-001 allowed paths — NOTE).

new_findings:
  - finding_id: F-E2-001-01
    severity: MEDIUM
    requirement_or_mapping: "UF-11; correctness contract §9.6 (human secret acquisition and protected entry); charter §5.4 ('Explicit secret boundaries for acquisition, injection, use ...'); CSV row UF-11 -> AR-SEC-003"
    file_or_component: "05_architecture/ENGINEERING_PREVIEW_ARCHITECTURE_REQUIREMENTS.md AR-SEC-003 (lines 545-559) and §14 fields 5/12/18; 05_architecture/ENGINEERING_PREVIEW_E1_ARCHITECTURE_TRACEABILITY.csv row UF-11"
    evidence: >-
      CSV row UF-11: primary AR-SEC-003, empty supporting/secondary, cases EP-CONTRIB-007
      only. AR-SEC-003's source list is FR-046, FR-047, RR-015, NEG-SECRET-01, NEG-CRED-01;
      recomputation shows UF-11 is the single canonical ID that appears in no AR source list
      (126/127 referenced). AR-SEC-003 describes a protected recipient boundary for secret
      use. The strings takeover, protected entry, interactive auth, keystroke, clipboard,
      screen, and terminal stream occur nowhere in the requirements document, the CSV, or
      the E2 plan. Frozen E1 requires: "Human secret acquisition MUST use a protected path
      distinct from conversation and repository files. During protected entry, agent/model/
      tool observation and capture of keystrokes, clipboard, screen/screenshot,
      accessibility state, terminal stream, and the secret value stop; only a non-secret
      outcome/receipt returns, followed by full resume revalidation. Unavoidable absence of
      such a protected boundary adds WAITING_FOR_USER ... or creates a task blocker"
      (contract §9.6; UF-11 steps 2, 3, 6).
    why_it_matters: >-
      E2-002 candidates are not forced to describe a human-takeover / protected-entry
      boundary, the structural suspension of agent observation channels during that entry,
      the receipt-only return with resume revalidation, or the fail-to-wait path when no
      boundary exists; the 28-field contract asks for a secret boundary only in its
      use/recipient sense. A candidate can satisfy all 64 ARs with the acquisition path
      undesigned, and E2-003 has no criterion to reject it. The master prompt lists
      "secure authentication takeover" (Stage 4) and "human login takeover" (Stage 5) as
      core capabilities. MEDIUM rather than HIGH because AR-SEC-003 already rejects the leak
      outcome (raw value in model context/chat/commands/logs/tool output) and E1 permits
      absence of the boundary when the product waits or blocks.
    required_fix: >-
      Add the acquisition/takeover semantics as a hard property — either extend AR-SEC-003
      (description, required observable property, prohibited outcome) or add
      AR-SEC-006 "Protected human secret-entry and takeover boundary" sourced from UF-11,
      FR-046, FR-047, NEG-SECRET-01, NEG-CRED-01 with domains D01/D08/D09/D11/D20 and
      E3V-006; list UF-11 as a source of that AR; update the CSV UF-11 row (supporting ARs,
      domains, justification) to match; and add "protected human secret entry / takeover
      boundary, observation-capture suspension, fail-to-wait when absent" to §14 field 5 or
      18 so every candidate must answer it. Do not change frozen E1.
    verification_method: "grep the requirements document for 'takeover' and 'protected entry'; confirm UF-11 appears in at least one AR source list and that the CSV row's AR set equals the inverse of the AR source lists; confirm §14 contains the explicit field; re-run the 127/64 set and no-orphan checks."
