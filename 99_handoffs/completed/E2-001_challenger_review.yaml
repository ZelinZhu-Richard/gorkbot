acceptance_criteria_evaluation:
  - criterion: "Every one of the 127 canonical E1 requirement IDs has exactly one primary architecture disposition of HARD_CONSTRAINT, WEIGHTED_PREFERENCE, or JUSTIFIED_NON_ARCHITECTURE_DRIVING, with source anchors and no waiver semantics."
    result: PARTIAL
    basis: "127/127 exactly one primary disposition, no waiver; source anchors present on every row but 71 (56 FR + 15 RR) cite the wrong PRD section (F-E2-001-04)."
  - criterion: "All 25 required architecture decision domains are present with required evidence and explicit ownership/authority questions."
    result: PASS
    basis: "25/25 domains in §7 with ARs and ownership questions; §7 equals the AR bodies; per-row CSV domains equal AR unions."
  - criterion: "Correctness, durability, security, execution, model abstraction, observability, extensibility, performance/cost, operability, and E1-suite testability are derived without invented quantitative requirements."
    result: PASS
    basis: "All ten categories map to ARs in §6; zero numeric thresholds in the deliverables."
  - criterion: "Hard constraints, weighted preferences, UNKNOWN_REQUIRING_SPIKE, and E3_VALIDATION_OBLIGATION are defined so hard failures cannot be averaged away and unknowns cannot be scored favorably."
    result: PASS
    basis: "§2, §5, §8, §9 semantics; no ambiguous class boundary found."
  - criterion: "Cross-cutting threat-boundary, recovery, evidence-integrity, independent-verification, provider-neutrality, clean-room Level A/B/C, local-first, and future-compatibility criteria are complete."
    result: PARTIAL
    basis: "All families present and structurally forced except the human secret-acquisition / takeover boundary (F-E2-001-01); consolidated threat-boundary checklist absent (F-E2-001-09)."
  - criterion: "Weighting governance, if proposed, is prospective, discloses correlated criteria and sensitivity requirements, and assigns no candidate-specific score or winner."
    result: PASS
    basis: "§8: weights UNASSIGNED, five correlated groups disclosed, sensitivity required, no candidate, score, or winner."

