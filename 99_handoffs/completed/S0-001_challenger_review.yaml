    requirement: "TASK_REGISTRY S0-001 acceptance criterion 1 'Every repository file is listed'; objective 'Confirm every current file, its role, authority, freshness'; why_it_matters 'Prevent planning models from treating prepared drafts as verified observations'."
    file_or_component: "99_handoffs/completed/S0-001_handoff.yaml (inventory_scope, repository_inventory)"
    evidence: "Inventory = 34 paths = git ls-tree 4d99fff. git ls-files at f151f28 = 39. Unlisted: 02_research/GROK_BOT_BASELINE_2026-08-21.md, 06_evaluation/MODEL_ROLE_BENCHMARK_PLAN.md, 99_handoffs/completed/S0-001_handoff.yaml, S0-002_handoff.yaml, S0-003_handoff.yaml. grep shows no authority/freshness/evidence classification for these five anywhere in 01_governance or 99_handoffs. Handoff decisions_made discloses: 'scoped to the 34 tracked input files at base commit ... author-created Stage 0 outputs are recorded by handoffs and the final diff'."
    why_it_matters: "The two research outputs are the files Stage 1 planners will read next; the inventory is the one place that tells agents which files are unreviewed author drafts versus authoritative state. The self-labels inside those files ('Author status: READY_FOR_REVIEW') mitigate but do not replace the inventory entry. Criterion 1 is therefore PARTIAL at the reviewed commit."
    required_fix: "Add an addendum to S0-001_handoff.yaml (allowed path) — e.g. repository_inventory_addendum_at_f151f28 — listing the five files with role, authority (e.g. AUTHOR_OUTPUT_PENDING_INDEPENDENT_REVIEW), freshness, and evidence_or_assumption (e.g. DOCUMENTATION_DERIVED_BASELINE_NOT_OBSERVATION / PLAN_ONLY_NO_RESULTS / FACTUAL_HANDOFF_NOT_PROOF_OF_REVIEW), and record reviewed_commit f151f28 in inventory_scope. Alternatively the verifier may explicitly accept base-commit scoping for criterion 1 and record that acceptance."
    verification_method: "git ls-files | sort > a; grep -E '^  - path: ' S0-001_handoff.yaml (both inventory and addendum) | sed 's/.*path: //' | sort > b; comm -23 a b is empty."
