    required_fix: "In S0-001_handoff.yaml, describe the DECISION_LOG change (name the note, state that it is a stage-level author note written under S0-001's DECISION_LOG allowance on behalf of the S0-002/S0-003 research outcomes, and that it changes no decision status). Optionally add a one-line 'Recorded by: S0-001 handoff on behalf of S0-002/S0-003' under the note header (DECISION_LOG.md is in S0-001's allowed files)."
