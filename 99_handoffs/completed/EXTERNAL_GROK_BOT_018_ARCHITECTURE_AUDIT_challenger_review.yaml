# ────────────────────────────────────────────────────────────────────
# 5. Findings
# ────────────────────────────────────────────────────────────────────
findings:
  - finding_id: F-EXT-018-C-01
    severity: HIGH
    author_claim: >-
      Executive verdict item 1 and A02/PAT-02: "ADOPT the invariants behind its durable
      transcript journal" presented as the reconstruction's primary durability/
      persistence pattern, with §12 translating "Transcript WAL, checkpoint, route
      pinning" to a "provider-neutral durable event journal and projection checkpoint";
      the conversation blob store appears only under A04 recovery and a §7.2 GC remark.
    external_evidence: >-
      At a9f633e0 the transcript journal protects a DERIVED projection, not canonical
      state: TranscriptMirrorJob{conversationId, stateBlobId, blobDbPaths}
      (source/host/agent-isolation/transcript-mirror-offload.ts) has the mirror worker
      read the canonical protobuf ConversationStateStructure from SQLite blob DBs
      (transcript-mirror-worker.ts) and derive transcript JSONL; conversation-state-
      binary.ts says the mirror consumes only the fields "transcript JSONL production"
      reads; the canonical store is the content-addressed conversation blob DAG with a
      root pointer, reachability GC, and adoption/retirement migration
      (conversation-blob-store.ts, conversation-blob-db.ts, conversation-blob-gc.ts).
      The journal's prepare/commit/abort/recover mechanics (verified real) keep the
      derived file consistent with a checkpoint of that canonical state.
    primary_project_constraint: >-
      MASTER_OPERATING_PROMPT requires a durable task/agent state machine and evidence-
      before-architecture; ADR-C01 (canonical turn/event truth) is the central Stage 3
      persistence decision; the challenger instruction independently requires testing
      transcript-as-state against event-log + projection + task-state-machine.
    why_it_matters: >-
      The audit's number-one ADOPT, read at headline level, invites Stage 3 to treat a
      durable transcript journal as the persistence centerpiece. The external tree's own
      architecture is the opposite and stronger lesson: canonical content-addressed
      state/event storage with WAL-consistent materialized projections. Omitting the
      derivation relationship and leaving the canonical-state pattern unclassified could
      materially distort ADR-C01 by presenting the projection mechanism as the
      system-of-record pattern.
    required_fix: >-
      Re-describe A02/PAT-02 to state the journal is a projection-consistency WAL over a
      canonical content-addressed conversation-state store; add the conversation-state
      DAG (root pointer, GC, migration/retirement) as its own classified pattern
      (ADOPT-the-invariants is defensible); update executive item 1 and the §12 row so
      ADR-C01's evidence mapping shows the external reference itself separates canonical
      state from transcript projection.
    verification_method: >-
      Re-read the corrected sections; confirm cloud citations of transcript-mirror-
      offload.ts/transcript-mirror-worker.ts/conversation-state-binary.ts are present;
      confirm ADR-C01's alternatives reference the corrected evidence; grep the audit for
      an explicit statement that the JSONL transcript is derived, not canonical.

  - finding_id: F-EXT-018-C-02
    severity: MEDIUM
    author_claim: >-
      The audit's coverage (§4 architecture map, 25-topic coverage table, 33-pattern
      matrix) is presented as spanning the tree's substantial patterns; the handoff lists
      "cloud agents" among inspected host scopes; R05/§5.2 state side-effect
      classification in the tree is a name/description regex heuristic.
    external_evidence: >-
      source/host/cloud-agents/cloud-agent-tool.ts (19KB) defines a complete remote
      cloud-agent lifecycle tool: actions launch/list/models/get/dump/watch/reply/rename/
      cancel/archive/unarchive/delete/list_artifacts; environment targeting
      {cloud|pool|machine|environment}; a cloud model catalog with per-model params and
      incompatibleWith matrices; a confirm flag; and — decisively — declared sets
      DESTRUCTIVE_ACTIONS = {cancel, archive, unarchive, delete} and REVIEW_GATED_ACTIONS
      = {launch, reply, rename, cancel, archive, unarchive, delete};
      cloud-agent-transcript-dump.ts dumps the remote transcript JSONL to a durable box
      file with byte/line accounting. None of this is analyzed, mapped, scored, or
      classified anywhere in the audit or CSV (grep: zero analytic mentions).
    primary_project_constraint: >-
      Product objective 4 (continue work in the cloud after client disconnect), Stage 5
      background continuation, Stage 8 delegation primitives, and the challenger
      instruction's explicit "cloud agents" attention item.
    why_it_matters: >-
      This is the tree's only direct evidence of a remote-agent delegation/lifecycle
      contract — a core product concern — and its declared action-classification sets are
      the in-tree counter-example that strengthens R05's rejection of heuristics and
      D05/D06's declared-capability requirement. Its omission leaves a decision-relevant
      evidence hole and an incomplete R05 narrative.
    required_fix: >-
      Add a classified pattern row (likely ADAPT: lifecycle/action contract shape,
      environment targeting, model-catalog constraints, durable transcript export;
      tenant/authorization/durability still absent), cite the declared action sets as
      supporting evidence in D05/D06 and in R05's rationale, and cover cloud agents in
      the §4 architecture map.
    verification_method: >-
      Confirm the new row's paths/symbols exist at a9f633e0 (DESTRUCTIVE_ACTIONS,
      REVIEW_GATED_ACTIONS, CloudAgentApi); confirm R05/D05/D06 cross-references; confirm
      the coverage map includes the cloud-agent boundary.

  - finding_id: F-EXT-018-C-03
    severity: MEDIUM
    author_claim: >-
      The audit repeatedly criticizes the external error handling (failures flattened to
      assistant text, R03/D04) and recommends building typed failure events and a
      failure taxonomy aligned with the primary benchmark plan (§6.2, ADR-C11), without
      identifying any in-tree error-taxonomy asset.
    external_evidence: >-
      source/shared/errors/registry.ts (841 lines) defines SAND_ERROR_DEFINITIONS: stable
      codes (SAND-E####), name, domain (registry/transport/...), retryable flag,
      bounded declared payload fields, and seededFrom provenance, with an emit-boundary
      rule that unregistered errors are reclassified so "the original code and payload
      never ship"; bounded.ts provides branded bounded payloads (e.g. brandedErrno).
      The journal and other modules mint typed errors through this registry
      (SandError.journalReplayFailed etc., seen in transcript-mirror.ts).
    primary_project_constraint: >-
      MODEL_ROLE_BENCHMARK_PLAN's nine-category failure taxonomy with accountable layers
      and UNKNOWN_LAYER; MOP requirements for typed turn failure states and observability.
    why_it_matters: >-
      The audit recommends inventing exactly the artifact the tree already demonstrates —
      a machine-readable, retryability-classified, leakage-bounded error registry. Missing
      it weakens D04/R03/ADR-C03/ADR-C11 evidence and loses a concrete design input for
      the provider failure envelope and telemetry-boundary payload bounding.
    required_fix: >-
      Add the error registry as a classified pattern (ADOPT-the-principle or ADAPT) and
      cite it from D04, R03, D12, ADR-C03 and ADR-C11; note the registry/benchmark
      taxonomy alignment opportunity (stable codes + accountable domain + retryability).
    verification_method: >-
      Confirm registry.ts/bounded.ts citations resolve at a9f633e0; confirm the new
      cross-references; confirm no code import occurred (pattern description only).

  - finding_id: F-EXT-018-C-04
    severity: MEDIUM
    author_claim: >-
      The audit's transcript/durability/memory analysis (§5, §6.1 transcript row, A02,
      D04, ADR-C01) covers durable conversation history, truncation, retention and
      replay; compaction/summarization is never mentioned anywhere in the report or CSV.
    external_evidence: >-
      source/packages/agent-summarization/ implements a full context-compaction pipeline:
      summarization-handler.ts, pipeline.ts, deterministic-summary-builder.ts,
      durable-blocks.ts, prompt-truncation.ts, background-summarization.ts,
      skill-persistence.ts, error-handling.ts (~120KB); the canonical conversation state
      itself carries summaryArchives (conversation-state-binary.ts), i.e. compaction
      artifacts are first-class persisted state in the external design.
    primary_project_constraint: >-
      MOP memory requirements (durable roles/memory, memory extractor role, R-015 stale/
      poisoned memory), Stage 3 memory architecture comparison, and the challenger
      instruction's explicit compaction item.
    why_it_matters: >-
      Unbounded event/transcript growth versus context limits is one of the forcing
      functions on ADR-C01/C06 (what is durable, what is derived, what is summarized, and
      how summaries are audited); an audit that maps the persistence architecture but
      omits the tree's compaction layer leaves Stage 3 without the evidence that
      summaries were designed as durable, deterministic, first-class artifacts.
    required_fix: >-
      Add a classified pattern for the summarization/compaction pipeline (deterministic
      builders, durable summary blocks, background execution, summaryArchives in
      canonical state) and reference it in ADR-C01's alternatives (compaction/retention
      semantics) and the memory-related translation rows.
    verification_method: >-
      Confirm the agent-summarization paths and the summaryArchives field resolve at
      a9f633e0; confirm ADR-C01 mentions compaction; confirm classification present in
      the matrix totals.

  - finding_id: F-EXT-018-C-05
    severity: MEDIUM
    author_claim: >-
      §15 presents ADOPT/ADAPT/EXPERIMENT/REJECT/DEFER as "the canonical classification"
      with exactly one class per pattern (totals 6/14/3/8/2), and classifies A01 typed
      ports as ADOPT while D01 connector seam and D05 MCP bridge are ADAPT.
    external_evidence: >-
      No class definitions exist anywhere in the report or CSV. By the audit's own
      evidence and scores the boundary is not reproducible: A01 (ADOPT) is a seam whose
      implementation lacks tenant identity, authorization, versioning and exact runtime
      validation (MT2/SEC3; "most method payloads remain coarse objects"), while D01
      (ADAPT, MT1/SEC2) and D05 (ADAPT) are seams with the same class of deficiency and
      the same required redesign; the recommended "independent versions" of A01 and D01
      are comparable full contract redesigns.
    primary_project_constraint: >-
      MOP review rules require reproducible criteria for consequential classifications;
      the matrix is intended as a Stage 3 decision aid, so its classes will be read as
      relative maturity/confidence.
    why_it_matters: >-
      Without a stated rubric, later stages may treat ADOPT rows as more settled than
      ADAPT rows on labeling alone; the A01-versus-D01/D05 inconsistency shows the labels
      partly encode the author's enthusiasm rather than a reproducible rule.
    required_fix: >-
      Add explicit one-line definitions (for example: ADOPT = the invariant/property can
      be carried into requirements as-is; ADAPT = the principle survives but the contract
      must be redesigned; EXPERIMENT = value contingent on a spike; REJECT = neither
      implementation nor blueprint should carry; DEFER = decision premature) and either
      re-justify A01 under the rubric or reclassify it ADAPT. Verify every row against
      the rubric once stated.
    verification_method: >-
      Confirm definitions present; confirm A01/D01/D05 dispositions are consistent under
      them; re-run the totals check (each pattern exactly one class).

  - finding_id: F-EXT-018-C-06
    severity: MEDIUM
    author_claim: >-
      §18 proposes ten Stage 4 spikes (SP-C01..SP-C10) with hypothesis, bounded
      implementation, and pass/fail evidence, presented as the spike candidates for the
      three EXPERIMENT patterns and the ADOPT/ADAPT proof obligations.
    external_evidence: >-
      The spike table itself: no per-spike alternatives (which competing architecture is
      being compared), no distinct failure metrics beyond inverted pass criteria, security
      checks present in only some rows, and no cost caps or decision rules in any row.
    primary_project_constraint: >-
      MASTER_OPERATING_PROMPT Stage 4 requires every spike to record hypothesis,
      environment, model, implementation, test cases, result, failures, cost, latency,
      security impact, and architecture consequence; the challenger instruction requires
      hypothesis/alternatives/minimum prototype/workload/success/failure/security/cost
      cap/decision rule per spike.
    why_it_matters: >-
      Stage 4 planning is likely to inherit these specifications wholesale; without
      alternatives and decision rules a spike can only confirm the proposed design
      (anchor bias), and without cost caps the spike program has no budget boundary in a
      project whose benchmark budget is currently USD 0.
    required_fix: >-
      Augment each retained spike (at minimum those backing E01-E03: SP-C05, SP-C06,
      SP-C07, plus SP-C01/SP-C02 which gate A02/D03) with alternatives under test,
      explicit failure metrics, a security check, a cost cap, and a decision rule; or
      state that these fields are deferred to the Stage 4 authorization template and mark
      the table as incomplete input.
    verification_method: >-
      Field-presence check per spike row against the nine-field template; confirm cost
      caps are consistent with the recorded USD 0 unauthorized-budget state.

  - finding_id: F-EXT-018-C-07
    severity: LOW
    author_claim: >-
      D13 classifies "channel transport abstraction" as ADAPT with external strengths
      "small transport-neutral address concept and separated message surface".
    external_evidence: >-
      source/shared/channels.ts and channel-messaging.ts are thin address/envelope type
      declarations; the frontend conversation-evidence manifest marks Slack/Discord
      surfaces coming-soon; the audit's own §8.3 marks every production-relevant channel
      property UNKNOWN.
    primary_project_constraint: >-
      The matrix is an evidence-weighted decision aid; an ADAPT implies the external
      design contributes reusable substance.
    why_it_matters: >-
      Classifying a near-empty surface ADAPT overstates external contribution; the
      channel contract will be designed from the audit's own §8.3 requirements list, not
      from the external types.
    required_fix: >-
      Reclassify D13 to DEFER (design from requirements at Stage 3) or annotate that the
      external contribution is naming only and the §8.3 field list is requirements-derived.
    verification_method: "Read the revised D13 row; confirm consistency with §8.3's UNKNOWN marking."

  - finding_id: F-EXT-018-C-08
    severity: LOW
    author_claim: >-
      A03/PAT-03 recommend tenant-scoped encrypted content-addressed workspaces with
      per-tenant authorization/keying, retention, and erasure; acceptance includes
      cross-tenant read failure.
    external_evidence: >-
      Box-store objects are addressed by sha+size in a store namespace
      (box-store-manifest-format.ts identity; box-object-store contentAddressed put);
      nothing in the external design or the audit discusses deduplication scope or hash
      disclosure.
    primary_project_constraint: >-
      Security requirements (tenant leakage, provenance) and Finance Edition
      confidential datasets; the challenger instruction: "A content hash must not
      accidentally become a cross-tenant information oracle."
    why_it_matters: >-
      Cross-tenant deduplication over bare content hashes lets a tenant probe for the
      existence of known content, and content hashes embedded in shared evidence bundles
      can leak the same way; per-tenant keying implies the safe answer but the audit
      never states the dedup boundary, the salted/keyed-addressing tradeoff, or GC
      ownership across snapshot lineages.
    required_fix: >-
      Add explicit constraints to A03/ADR-C06: deduplication boundary is at most
      per-tenant (or per-key-domain), content hashes in cross-tenant or exported evidence
      must be salted/HMAC'd or disclosed by policy, and GC/retention ownership across
      snapshot lineage must be part of the contract.
    verification_method: "Confirm the constraints appear in A03's independent version and ADR-C06's criteria."

  - finding_id: F-EXT-018-C-09
    severity: LOW
    author_claim: >-
      §11.1: "Scores evaluate the external pattern as implemented, not the independently
      recommended translation"; PAT-11 multi_tenancy=3; PAT-09 security=4 with rationale
      "MT1 ... DUR2 ... approval files exist, but core controller maps are memory-only"
      and weakness note listing expiry among incomplete properties.
    external_evidence: >-
      PAT-11's manifests as implemented have no tenancy at all (reconstruction
      artifacts); the 3 is justified in the rationale by what manifests "can carry" —
      translated potential. PAT-09 as implemented is a process-local, single-user
      controller (durability 2 by the same row); its 4 reflects principle strength. The
      controller does implement an ask-expiry TTL (askTtlMs / SAND_LOCAL_TOOL_ASK_TTL_MS,
      local-tool-permission-controller.ts:30,42), so "expiry" is only missing at the
      approval-lifetime level.
    primary_project_constraint: >-
      R-023 (false numerical precision) and the matrix's own stated scoring rule.
    why_it_matters: >-
      Bounded: no aggregation exists, so no ranking is distorted; but rule-inconsistent
      cells weaken the matrix as a reproducible decision aid and the expiry misstatement
      slightly undersells the external controller.
    required_fix: >-
      Rescore PAT-11 MT and PAT-09 Sec under the as-implemented rule (or annotate those
      cells as translated-potential exceptions), and correct D06/PAT-09 wording to
      distinguish present ask-TTL expiry from absent approval-lifetime expiry.
    verification_method: "Re-read the two rationale cells and the D06 weakness text against the cited code."

  - finding_id: F-EXT-018-C-10
    severity: LOW
    author_claim: >-
      (a) §4.3 row 22: "Two-to-six member cap" evidenced at group-chat.ts:1-17;
      (b) §16.1: Stage 3 "requires alternatives, threat modeling, cost analysis, ADRs"
      cited to MASTER_OPERATING_PROMPT.md:267-304; (c) §15 presents "33 patterns" with
      D14 as a distinct pattern and R01/E01/D01 as distinct rows.
    external_evidence: >-
      (a) group-chat.ts:1-17 contains turn/round/history/message bounds and nesting
      rejection but no member cap; GROUP_MAX_MEMBERS = 6 is in group-store.ts:1, and the
      minimum of two is documented product behavior (baseline GBF-016), not code
      evidence. (b) MOP:267-304 spans orchestration options, the ADR requirement, the
      Stage 3 gate and Stage 4 intro; the threat-model requirement lives in the security
      requirements section. (c) D14 cites the same evidence paths as D09
      (workflows store/library/shared), and R01/E01/D01 are three classifications of the
      same connector code region.
    primary_project_constraint: >-
      Evidence-anchor discipline the audit itself adopts (A05): claims bind to exact
      artifacts.
    why_it_matters: >-
      Bounded inaccuracies: none changes a conclusion, but (a)/(b) are citation
      imprecision in an artifact whose value is citation precision, and (c) means the
      "33 patterns" total counts one code region under multiple classes without saying
      so, mildly inflating apparent external contribution.
    required_fix: >-
      Correct the two citations (add group-store.ts:1 and the baseline source for the
      lower bound; point the threat-model clause at the security-requirements lines) and
      add a one-line note that matrix rows classify pattern-aspects, so several rows can
      reference one code region (D14/D09, R01/E01/D01).
    verification_method: "Re-resolve the corrected citations at the pinned commits; recount the matrix totals."

