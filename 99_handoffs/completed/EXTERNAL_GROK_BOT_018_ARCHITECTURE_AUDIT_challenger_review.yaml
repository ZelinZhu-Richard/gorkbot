# 3. Thematic challenge results
# ────────────────────────────────────────────────────────────────────
transcript_durability_challenge:
  question: "Should conversation transcripts be authoritative task state?"
  external_fact_established_by_challenger: >-
    In the external tree the transcript is NOT authoritative. Canonical conversation
    state is a protobuf ConversationStateStructure stored as content-addressed blobs in
    SQLite (source/host/agent-isolation/conversation-blob-store.ts, root blob pointer,
    reachability GC, adoption/retirement migration). The transcript mirror derives JSONL
    from a state blob: TranscriptMirrorJob carries conversationId + stateBlobId +
    blobDbPaths (transcript-mirror-offload.ts), the worker decodes the blob
    (transcript-mirror-worker.ts), and conversation-state-binary.ts states the mirror
    consumes only the fields "transcript JSONL production" reads. The A02 journal's
    prepare/commit/abort/recover machinery protects that derived projection's consistency
    with canonical state — it is a projection WAL, not the system of record.
  challenger_position: >-
    The external evidence therefore supports the architecture the challenger instruction
    hypothesizes — durable canonical event/state store + materialized conversation
    projection + explicit task-state machine — rather than transcript-as-state. The
    audit's D04/ADR-C01 leave the decision correctly open, but its headline A02 framing
    obscures the strongest external datapoint for that decision (F-EXT-018-C-01). The
    remaining §10 sub-questions are adequately handled by the audit (ordering/idempotency
    via A02+SP-C01, replay via D04, retention/privacy via D12, cross-agent messages via
    D08) with two gaps: compaction (never addressed despite in-tree evidence,
    F-EXT-018-C-04) and multi-device/multi-writer conversation synchronization (NOTE-1).
    No forced answer is recorded: ADR-C01 remains the deciding artifact.

content_addressed_state_challenge: >-
  The external tree content-addresses four distinct things: box-store file blobs
  (sha+size with a contentAddressed put option), conversation-state blobs (hash-ID DAG
  under a root pointer), the staged host bundle (sha256 Docker labels), and
  reconstruction fingerprints. The audit fully covers the first and last, covers the
  host-bundle hash inside the Docker analysis, and mis-files the conversation-state DAG
  under recovery only (folded into F-EXT-018-C-01). The A03 translation properly demands
  per-tenant keying/authorization/retention, which implicitly forecloses cross-tenant
  deduplication, but the audit never states the dedup boundary or the
  content-hash-as-oracle risk explicitly — for confidential finance datasets and evidence
  bundles a bare content hash in a shared namespace can leak existence of known content
  across tenants, and salted/per-tenant-keyed addressing versus dedup efficiency is a
  real tradeoff Stage 3 must decide (F-EXT-018-C-08). Storage cost and GC are covered
  (MIG5 in PAT-03, GC in A04/conversation-blob-gc); encryption is named; malware/DLP
  hooks are named.

typed_boundaries_challenge: >-
  The audit's typed-boundary positions survive challenge: it consistently requires
  runtime schema validation rather than TypeScript types alone (the external evidence
  itself demonstrates why — coarse args:'object' method tables and req() coercion at
  trust boundaries), requires schema versioning and producer/consumer compatibility
  fixtures, and correctly refuses to select a serialization technology. The boundary
  list where validation materially matters (client/API, orchestration, provider, tools,
  execution provider, A2A, approvals, events, artifacts, vertical packs) is covered by
  A01 + §16.3. No finding.

scoped_approvals_challenge: >-
  The audit distinguishes tool permission, capability grant, action approval, credential
  lease, data-scope entitlement, network/egress permission, spending/budget limits, and
  irreversible-action gating across D05/D06/§7.3/§9.3/§14.1, and its position that the
  approval engine must operate on normalized structured capabilities with durable
  receipts — never tool names or natural-language metadata (R05) — is correct and
  well-evidenced. Finance approval classes (data write, order simulation, paper
  portfolio changes, strategy activation, model changes, risk-limit changes) are all
  present in §14.1, with live-money execution correctly excluded per D-014. The one
  correction is evidentiary, not conceptual: declared action-classification exists in the
  external tree itself (cloud-agent DESTRUCTIVE_ACTIONS/REVIEW_GATED_ACTIONS) and should
  be cited as supporting evidence (F-EXT-018-C-02).

operation_recovery_challenge: >-
  The recovery principles the challenger instruction lists — resumable execution,
  operation leases, task checkpoints, idempotency keys, resource generation IDs,
  connection recovery, execution reconciliation — are each explicitly present in the
  audit's D03/D10/§7.2/§7.3/SP-C01/SP-C02 with verified external evidence (operation IDs,
  migration phases, resume offsets, watchdogs, stream-attempt checkpoint/retry state).
  The audit correctly requires Stage 3 to make leases/fencing/idempotency contract
  fields rather than implementation notes. No finding beyond the spike-specification
  augmentation (F-EXT-018-C-06).

saas_translation_review: >-
  The §12 translation table was audited row by row against the challenger criteria
  (property preservation, new failure modes, coordination primitive, consistency model,
  tenant boundary, authorization boundary, observability, recovery). No simplistic
  one-line translation was found: every consequential row names the required change, and
  §15.2 acceptance tests add crash/replay/stale-lease/cross-tenant negatives. The
  translations correctly refuse to pick consistency models or technologies (Stage 3
  scope). Residual gaps: multi-device/multi-writer conversation submission is not
  addressed anywhere (the external writerWindowId canonical-write conflict evidence is a
  useful input; NOTE-1), and the local-JSON→event-store row inherits the A02 referent
  problem (F-EXT-018-C-01).

harness_review: >-
  The harness recommendations pass the should-it-exist / which-stage / what-does-it-
  validate / staleness / regeneration / theater tests with two qualifications. The
  twelve-outcome table and §19.1 priority sequence are appropriately minimal (evidence
  schema and ledger hashes first; contract manifests only after ADRs; release
  certification last), so the maintenance-cost-exceeds-value risk is low. Anti-theater
  guards exist (mutation/missing-anchor invalidation; blocked closure cannot pass;
  "a hash does not make a stale claim current"). Qualifications: regeneration ownership
  and automation are unassigned for every manifest class (NOTE-3), and the smallest
  high-leverage set should be stated explicitly — the challenger assesses it as §19.1
  items 1-2 (evidence packet schema + source-ledger content hashes) now, item 5
  (security negatives) at first code, everything else post-ADR. The eight-file/576-line
  external test count and CI gaps the author reports were independently reproduced.

general_edition_review: >-
  The audit's General Edition guidance is consistent with D-014 and the MOP: shared-core
  contracts for agents/turns/tools/execution/workspaces/approvals/audit, vertical packs
  above them, no fixed-renderer or local-session inheritance, and no finance semantics in
  core. Overfitting was checked per the challenger instruction: the recommendations
  systematically strip Electron/macOS/Node/single-user/fixed-renderer assumptions
  (§20 list, R06), and the ADR-C01..C13 decomposition, while shaped by the external
  module map, maps onto the MOP Stage 3 comparison list rather than importing
  reconstruction boundaries (NOTE-6 records the residual anchoring risk). The missed
  cloud-agent lifecycle evidence (F-EXT-018-C-02) is the one General Edition gap:
  product objective 4 and Stage 5 background continuation make remote-agent lifecycle a
  core concern, and the tree's only direct evidence of it went unanalyzed.

finance_edition_review: >-
  The §14 finance treatment survives the stress test: point-in-time datasets,
  survivorship/universe rules, lookahead-leakage tests, corporate actions, data lineage,
  versioned datasets, reproducible feature computation, deterministic calculations,
  backtest configuration identity (code/image/data/model/policy digests + seed),
  transaction-cost assumptions, paper-trade order state with simulated-broker receipts,
  double-entry portfolio ledger with reconciliation, and risk-limit provenance with
  immutable decision receipts are all explicitly present and correctly split between
  shared-core interfaces and finance-owned extensions; the audit honestly records that
  the external tree evidences none of the finance-grade semantics; no-live-trading
  matches D-014. Two minor gaps: research-thesis history/versioning is not named as an
  artifact class (NOTE-5), and the content-hash oracle risk matters most for
  confidential finance datasets (F-EXT-018-C-08). Nothing in the audit designs the
  Finance Edition prematurely.

score_review: >-
  The adoption-matrix scoring was independently reviewed. Structure verified: 16
  patterns x 17 integer dimensions, every value 1-5, every row's rationale explains all
  17 codes. No aggregate score is computed anywhere, which structurally prevents the
  correlated-dimension double-counting failure (R-023) from driving a ranking; scores
  and classifications move together (SaaS1/SEC1 rows are the REJECT/DEFER rows), so SaaS
  suitability and security are not underweighted; reconstruction fidelity is repeatedly
  separated from architecture quality (§10.2, §21.7). Two bounded deviations from the
  matrix's own "as implemented" rule were found — PAT-11 multi_tenancy 3 and PAT-09
  security 4 score the translated potential of patterns whose implementations have no
  tenancy and are process-local — and PAT-09's rationale understates the present ask-TTL
  (F-EXT-018-C-09). Scores were not rewritten by the challenger; corrections flow
  through findings per the review instruction.

