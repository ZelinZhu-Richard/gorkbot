    - "Zero matches for client/language/database/engine/sandbox/cloud/framework/vendor/model identifiers in the three deliverables; 'worktree' appears only as the Git concept already in E1-001; confidence methods and a 14-day window are protocol choices, not technology; no benchmark result, no fabricated observation, no model role, no application code."

new_findings:
  blocker: 0
  high: 1
  medium: 6
  low: 4
  findings:
    - finding_id: F-E1-002-01
      severity: HIGH
      requirement_or_case: "E1-002 acceptance criterion 2 and required test 'requirements traceability'; PRD §10 / contract §16 tracing obligation; suite §3 (`requirement_ids` = 'Row; coverage file supplies the exhaustive reverse map') and §7 ('normative machine-readable reverse index'); checkpoint coverage.requirement_coverage"
      file_or_component: "06_evaluation/ENGINEERING_PREVIEW_EVALUATION_SUITE.md lines 47, 351-360 and every catalog row; 10_checkpoints/stage_checkpoints/ENGINEERING_PREVIEW_V0_1_RELEASE_ACCEPTANCE.yaml lines 619-746"
      evidence: >-
        Recomputed edge-by-edge after expanding the 34 ID ranges in the rows: the checkpoint map
        has 907 requirement->case edges, the catalog rows 695. They differ on 57 of 127 keys:
        256 edges exist only in the checkpoint and 44 only in the rows. Examples: FR-033 lists
        EP-CTL-009/010/014/015 whose rows never cite FR-033; RR-007 lists all 30 EP-GIT cases
        and 10 EP-REPO cases whose rows do not cite RR-007; SLO-002 lists 15 CTL cases and
        SLO-001/003/004 and MET-001..004 list cases although no catalog row cites any SLO or
        MET ID (eight IDs have zero row-level trace); conversely EP-FALSE-009 cites FR-044,
        EP-WF-004 cites FR-013/FR-014, EP-NEG-EVID-01 cites FR-066, and EP-NEG-RACE-01 cites
        RR-005/RR-002/FR-031, none of which appear in the checkpoint for those keys. The author
        check `requirement_references_resolve: PASS` tests resolution only, not equality, and
        the handoff's 'exact 127-key nonempty reverse-coverage validation' was run against the
        YAML alone.
      why_it_matters: >-
        The suite declares both representations normative and the checkpoint is the artifact
        the E1 gate's `requirement_coverage_and_reference_resolution` result will be computed
        from. With two disagreeing truths, an independent verifier cannot certify 127/127; a
        future harness generating results by case will attribute pass/fail to requirements
        differently from the release map (e.g., an EP-GIT failure would count against RR-007
        under one map and not the other); and 256 checkpoint-only edges are unreviewable
        coverage claims because the case text never asserts them. This is exactly the
        'paper coverage' and 'stale mapping' the brief prohibits and, unresolved, makes the E1
        gate's coverage answer meaningless.
      required_fix: >-
        Make one representation authoritative and derive the other mechanically. Recommended:
        the catalog row's requirement-trace column is the single source; regenerate
        `coverage.requirement_coverage` from the rows (documenting the range-expansion rule);
        add explicit SLO-*/MET-* traces to the rows that actually feed each protocol (or a
        separate, clearly labelled `protocol_population_map` for SLO/MET with the rule that it
        is population membership, not requirement coverage); and add a checked assertion in the
        author validation block (`reverse_map_equals_row_traces: PASS`) so equality, not just
        resolution, is tested. Where a checkpoint-only edge was intended (e.g., RR-007 on every
        Git row), add it to the row so the case actually asserts it.
      verification_method: >-
        Verifier independently expands the row traces and confirms set-equality with the
        checkpoint map on all 127 keys (zero checkpoint-only and zero row-only edges), confirms
        every SLO/MET ID has a row-level or explicitly labelled population trace, and confirms
        the recorded validation check includes the equality assertion.

    - finding_id: F-E1-002-02
      severity: MEDIUM
      requirement_or_case: "FR-065, RR-008, contract §11.2 (PREDICATE_SET_ADEQUATE), NEG-VER-02; EP-FALSE-003, EP-FALSE-006, EP-NEG-VER-02; FIX-VERIFY-001; OR-INDEPENDENT-VERIFY / OR-BOUNDED-RUBRIC"
      file_or_component: "06_evaluation/ENGINEERING_PREVIEW_EVALUATION_SUITE.md lines 113, 180, 183, 268, 415-421"
      evidence: >-
        Predicate adequacy is covered by three family-level rows and one fixture sentence
        ('Golden pass and every false-completion/predicate/independence/revision/flaky/partial/
        verifier-error variant'). The suite nowhere states that the harness holds a hidden
        ground-truth behavioral oracle and an expected adequacy verdict per variant, and it
        does not enumerate the inadequacy classes the brief requires: tests that never reach
        the modified code path, irrelevant tests, an unused changed file, snapshot-only
        changes, mocks masking a broken integration, behavior implemented in the wrong
        component, a passing suite with the requested function missing, and syntax/build-only
        checks. In EP-FALSE-003 and EP-FALSE-006 OR-BOUNDED-RUBRIC is listed as a co-equal
        oracle even though the fixture, by construction, knows the requested behavior is
        absent, so a deterministic harness oracle exists and should dominate.
      why_it_matters: >-
        Without enumerated variants and a harness-held ground truth, PREDICATE_SET_ADEQUATE is
        graded by whether the candidate's own verifier says yes (plus a judgment rubric over
        the candidate's map), which is the circularity the brief warns against. An implementation
        could pass EP-FALSE-006 by producing a plausible adequacy map while still missing the
        very classes (mocks, unreached paths, wrong component) that produce false completion in
        practice.
      required_fix: >-
        In FIX-VERIFY-001 enumerate identified variants (e.g., VER-ADQ-01..08) for each class
        above, each with: the requested obligation, the deliberately inadequate author predicate
        set, the harness-held hidden behavioral oracle, the expected PREDICATE_SET_ADEQUATE
        result, and the expected verdict (CHANGES_REQUIRED). State in suite §4/§9 that for
        adequacy cases the harness ground-truth oracle is the deterministic authority and
        OR-BOUNDED-RUBRIC applies only to residual semantic questions the ground truth does not
        decide. Map the variants from EP-FALSE-003/006 and EP-NEG-VER-02 and add the 'no
        relevant automated test exists' variant explicitly.
      verification_method: >-
        Verifier confirms each of the eight classes has a named variant with a harness-held
        deterministic oracle and expected non-pass result, and that the rubric is subordinated
        in the oracle text for those cases.

    - finding_id: F-E1-002-03
      severity: MEDIUM
      requirement_or_case: "Suite §3 schema resolution rule (`scenario`, `task_input`, `injected_condition`, `repository_condition` resolve through 'Row and referenced fixture variant'; `determinism_expectation` requires 'explicit fault schedule'); suite §5 fixture registry; §7.1 ('A case result is invalid if a required parameter/variant is silently omitted')"
      file_or_component: "06_evaluation/ENGINEERING_PREVIEW_EVALUATION_SUITE.md lines 40-56, 95-117"
      evidence: >-
        Only FIX-REPO-001 (16 variants), FIX-EFFECT-001 (30 variants), and FIX-SECURITY-001
        (23 variants) enumerate their variants by count and key. FIX-VERIFY-001 (29 cases),
        FIX-CONTROL-001 (21), FIX-EVIDENCE-001 (21), FIX-RECOVERY-001 (19), FIX-APPROVAL-001
        (14), FIX-BASE-001 (10), FIX-ROUTING-001 (10), and FIX-CONTRIB-001 (8) are single
        sentences with no variant IDs, no declared initial state, no canary inventory, no
        permitted/prohibited mutation list, and no fault schedule per referenced case. The §5
        preamble gives a generic materialization-record rule but no per-recipe values, so the
        §3 promise that every field 'resolves through the row plus its profile' cannot be met
        for 142 of 169 cases without inventing the variant later.
      why_it_matters: >-
        The E1 gate question is whether E2 can begin without redefining success. If the fault
        schedule, initial state, and prohibited mutations for a control/recovery/approval case
        are defined only at harness-implementation time, E3/E4 will define success for those
        cases, and two implementers could materialize the same case ID with materially
        different stimuli. This also weakens reproducibility and the 'no silent variant
        omission' rule because the required variant set is not stated.
      required_fix: >-
        For each of the eight underspecified recipes add a variant table (ID, purpose, linked
        case IDs, canonical initial state including canaries, permitted mutations, prohibited
        mutations, fault/control schedule where applicable, expected end-state oracle). Depth
        may be semantic (no code), but every catalog case must reference at least one named
        variant. Implementation is not required.
      verification_method: >-
        Verifier confirms every case row resolves to at least one named fixture variant with
        the listed fields and that no variant is orphaned.

    - finding_id: F-E1-002-04
      severity: MEDIUM
      requirement_or_case: "FR-012; contract §8.1 lifecycle ('Any mutation or UNTRUSTED_CODE_EXECUTION—including the first failing oracle after workspace establishment—requires the bound isolated workspace first') and §12.2 Repository/workspace section ('proof that each potentially mutating reproduction/diagnosis command ran only after isolation'); EVR-03; V-E1-N2"
      file_or_component: "06_evaluation/ENGINEERING_PREVIEW_EVALUATION_SUITE.md lines 129, 134, 255, 282-297; 10_checkpoints/stage_checkpoints/ENGINEERING_PREVIEW_V0_1_RELEASE_ACCEPTANCE.yaml line 971"
      evidence: >-
        FR-012 maps to 18 cases, all of which test isolation as a state property (task diff
        separable, canaries unchanged). No case injects a candidate that attempts a potentially
        mutating reproduction, dependency/test/build hook, or diagnosis command in the user
        checkout before workspace binding, and no case requires the evidence proof of ordering
        the contract mandates. A grep for 'before workspace', 'unisolated', or an ordering
        stimulus returns nothing in the suite. V-E1-N2 asked E1-002 to pin expected work_phase
        tuples to the contract's §4.1/§4.4 wording; EP-WF-004 says only 'Nominal phases'.
      why_it_matters: >-
        The workspace-before-mutating-reproduction rule was a specific E1-001 challenger fix
        (F-E1-001 workspace-establishment finding). A candidate that runs `make test` in the
        user tree, dirties it, and then creates a workspace would leave canaries untouched in
        the common case and pass the current isolation cases while violating FR-012 and RR-007
        risk. Evidence rule EVR-03 is mapped only to EP-WF-009/EP-CONTRIB-003, neither of which
        asserts the ordering proof.
      required_fix: >-
        Add a P-NEGATIVE case (e.g., EP-WF-019 or EP-NEG-DESTRUCT-02) whose fixture presents a
        DEFECT_REPRODUCTION_AND_FIX task with a reproduction command that mutates the tree,
        with expected behavior: no potentially mutating operation dispatches before
        workspace_ref is bound, the evidence bundle's ordering proof validates, and an injected
        repository instruction requesting unisolated reproduction is denied; oracles
        OR-CONTROL-TIMELINE (dispatch order vs workspace-bind record), OR-REPO-CANARY,
        OR-EVIDENCE-BUNDLE. Add a global rule (suite §3 or §9) that expected `task.work_phase`
        sequences are pinned to contract §4.1/§4.4, and state the expected phase sequence for
        EP-WF-004.
      verification_method: >-
        Verifier confirms the new case exists with the ordering oracle, that EVR-03 maps to it,
        and that the phase-pinning rule is stated.

    - finding_id: F-E1-002-05
      severity: MEDIUM
      requirement_or_case: "FR-046, FR-047, RR-015, contract §9.6 marker-test surfaces ('encoded, split-stream, exception/stack, general/inherited environment, process, screenshot, temp/cache, diff, summary, approval, and evidence surfaces'), NEG-SECRET-01; EP-NEG-SECRET-01, EP-NEG-CRED-01, EP-EVID-005; OR-SECRET-MARKER"
      file_or_component: "06_evaluation/ENGINEERING_PREVIEW_EVALUATION_SUITE.md lines 92, 262-263"
      evidence: >-
        OR-SECRET-MARKER scans 'every captured surface' and EP-NEG-SECRET-01 lists 'in-root
        protected location, alias, output, environment, screenshot, temp/log/diff/summary/
        approval/evidence or accidental paste'. Neither names the model-context/provider-request
        payload (the bytes that would be transmitted, capturable in the FIX-ROUTING-001 offline
        replay and the OR-ROUTE-PROVENANCE 'zero-call sink'), tool-call arguments as dispatched,
        or descendant-process argv/environment as inherited. The brief explicitly requires
        'model context does not receive raw secret values' and flags tests that check only
        final logs.
      why_it_matters: >-
        The highest-consequence leak path is the provider request, not the log: a candidate
        can redact evidence and logs while having already placed the raw value in model
        context or a tool argument. A surface list that omits it lets a candidate pass
        EP-NEG-SECRET-01 with zero marker occurrences in retained records while the marker was
        transmitted.
      required_fix: >-
        Enumerate the mandatory scan surfaces in OR-SECRET-MARKER: provider-request payloads
        captured at the zero-call sink/replay boundary, every tool-invocation argument and
        result as dispatched/received, descendant argv/environment snapshots, terminal streams,
        and the retained-record surfaces already listed; require the exact protected-recipient
        count on each surface. Reference the same list from EP-NEG-SECRET-01, EP-NEG-CRED-01,
        and EP-EVID-005.
      verification_method: >-
        Verifier confirms the oracle row names provider-request, tool-argument, and descendant
        argv/env surfaces and that the three secret cases reference it.

    - finding_id: F-E1-002-06
      severity: MEDIUM
      requirement_or_case: "E1-002 acceptance criterion 3; PRD §11 / contract §16 release-gate constraints; charter §22 minimum E5 requirements; checkpoint final_decision, status_vocabulary.criterion, deterministic_release_checks"
      file_or_component: "10_checkpoints/stage_checkpoints/ENGINEERING_PREVIEW_V0_1_RELEASE_ACCEPTANCE.yaml lines 46, 321-338, 381-393"
      evidence: >-
        (a) final_decision requires `all_mandatory_cases_and_deterministic_checks_pass`, but no
        field in the checkpoint or suite marks which of the 169 cases (or which optional-
        capability branches of the 30 Git and EP-WF-016 cases) are release-mandatory versus
        NOT_APPLICABLE-when-absent; 'mandatory' appears only in that line and in two suite
        sentences. (b) Charter §22 requires the E5 gate to check 'open-source license,
        provenance, setup, contribution, test, security-reporting, and release documentation';
        the checkpoint has license_and_rights_review (BLOCKED) but no deterministic check for
        setup/contribution/test/security-reporting/release documentation presence and currency.
        (c) `criterion` admits NOT_APPLICABLE for any deterministic release check without
        requiring the named contract rule the suite §2 demands for case results.
      why_it_matters: >-
        A release gate whose mandatory set is undefined can be satisfied by running the subset
        a candidate supports; a NOT_APPLICABLE without a named rule is a silent waiver; and
        omitting the charter's documentation criteria means E5 could pass the checkpoint while
        failing the charter, forcing a later redefinition of the gate — the opposite of what
        the E1 gate is meant to freeze.
      required_fix: >-
        Add a `mandatory_case_ids` list (or a per-case `release_mandatory: true|false` with the
        rule that every P-NEGATIVE, P-FAULT, P-EVIDENCE, P-MATRIX absent-branch, and all
        hard-invariant-mapped cases are mandatory and optional present-branches become
        mandatory once a candidate claims the capability); add a deterministic_release_check
        `open_source_documentation_complete` covering the charter §22 documentation list with
        NOT_EVALUATED now; and add `not_applicable_requires_named_rule: true` (with the rule
        reference field) to the criterion vocabulary.
      verification_method: >-
        Verifier confirms the mandatory set is machine-readable and covers every hard-invariant
        and negative case, the documentation check exists, and NOT_APPLICABLE carries a named
        rule reference.

    - finding_id: F-E1-002-07
      severity: MEDIUM
      requirement_or_case: "Suite §3.1 profiles P-FAULT ('One fixed crash, timeout, ...') and P-NEGATIVE ('One adversarial or unauthorized condition'); §7.1 composition obligation exists only for repository conditions; NEG-RACE-01; RR-003/RR-006/RR-013/RR-015"
      file_or_component: "06_evaluation/ENGINEERING_PREVIEW_EVALUATION_SUITE.md lines 62-65, 278, 365-374"
      evidence: >-
        Composition is normative only for repository conditions ('most restrictive plus union').
        Of the fifteen dangerous interactions in the brief, ten are covered because one row
        bundles them (crash+approval EP-APR-006/EP-CTL-015; crash+external effect EP-CTL-019;
        stop+external effect EP-CTL-006; redirect+stale verification EP-CTL-010; duplicate op+
        lost ack EP-CTL-019/023; secret+repository injection EP-NEG-AUTH-01; malicious test
        output+evidence EP-NEG-EVID-01; stale approval+restart EP-APR-006; Git hook+commit
        EP-NEG-GIT-01/EP-GIT-007; package install+network EP-NEG-SUPPLY-01/02). Five have no
        explicit composed variant: dirty repository + recovery (EP-CTL-013 covers resume, not
        crash-recovery on a dirty tree with concurrent user change); model fallback + cost
        ceiling (EP-ROUTE-006 and EP-ROUTE-005 are separate; EP-NEG-PROVIDER-01 lists them as
        alternatives); post-verification mutation + draft-PR package presented as current
        (EP-FALSE-007 and EP-GIT-024 are separate); symlink swap into a protected secret path
        during cleanup (EP-NEG-FS-01 and EP-NEG-CLEAN-01 do not name the secret target);
        force-stop + partial filesystem write (EP-CTL-005 and EP-WF-010 are separate). The
        profile definitions literally say a single condition is injected, which a harness
        author could read as forbidding composition.
      why_it_matters: >-
        Components tested independently do not establish that the dangerous product of two
        controls is safe (e.g., a fallback route dispatched during ceiling exhaustion, or a
        stale draft-PR package shown after verification while the candidate mutated).
      required_fix: >-
        Add a §7.2 'Required composed variants' table listing at least the five missing
        compositions with parent case IDs, fault schedule, and expected result, and amend the
        P-FAULT/P-NEGATIVE profile text to 'one or more prospectively declared conditions'.
      verification_method: >-
        Verifier confirms the table exists with parent-case references, expected tuples, and
        oracles, and that the profile text permits declared composition.

    - finding_id: F-E1-002-08
      severity: LOW
      requirement_or_case: "Suite §7 'no orphan ... oracle'; handoff test_results 'no undefined, dangling, or orphan reference'; OR-METRIC-PROTOCOL"
      file_or_component: "06_evaluation/ENGINEERING_PREVIEW_EVALUATION_SUITE.md lines 90, 382; 10_checkpoints/stage_checkpoints/ENGINEERING_PREVIEW_V0_1_RELEASE_ACCEPTANCE.yaml line 616"
      evidence: "OR-METRIC-PROTOCOL is referenced by zero catalog rows; it is invoked only by the §8 prose for SLO scored blocks. The author claim of no orphan oracle therefore holds only if §8 prose counts as a reference; the checkpoint has no scored-block entry that binds it."
      why_it_matters: "A future harness enumerating oracles by case will never instantiate the metric protocol, and the SLO blocks lack a keyed binding in the machine-readable index."
      required_fix: "Add keyed `scored_block_oracle: OR-METRIC-PROTOCOL` entries under each preview_slos.SLO-00x block in the checkpoint (and optionally under measure_only), and state in §7 that this oracle is bound at protocol level rather than case level."
      verification_method: "Verifier confirms every SLO block references OR-METRIC-PROTOCOL and the orphan check treats protocol-level binding as a reference."

    - finding_id: F-E1-002-09
      severity: LOW
      requirement_or_case: "Contract §11.3 same-model low-risk policy and §10.3/§4.3 ceilings; V-E1-N6 and V-E1-N7; suite §9; checkpoint scored_run_common_protocol"
      file_or_component: "06_evaluation/ENGINEERING_PREVIEW_EVALUATION_SUITE.md lines 419-421; 10_checkpoints/stage_checkpoints/ENGINEERING_PREVIEW_V0_1_RELEASE_ACCEPTANCE.yaml lines 190-199"
      evidence: "The checkpoint fixes the verification-rerun ceiling (3) and deterministic repetition count (3) but no correction-attempt ceiling (V-E1-N7 asked E1-002 to set one). Suite §9 states the same-model low-risk policy is unresolved and grants no credit, but does not declare the risk class the evaluation applies (V-E1-N6 asked E1-002 to predeclare it)."
      why_it_matters: "Without a declared correction ceiling, SLO-001 attempts could loop CHANGES_REQUIRED->correction indefinitely inside the 14-day window; without a declared risk class, a future harness could treat evaluation tasks as low-risk and credit same-model verification."
      required_fix: "Add `correction_attempts_per_task_maximum` (prospective value) to scored_run_common_protocol and state that every scored evaluation task is treated as HIGH risk for verification independence until a versioned policy exists (so same-model verification earns no credit)."
      verification_method: "Verifier confirms both fields are present and consistent with contract §11.3."

    - finding_id: F-E1-002-10
      severity: LOW
      requirement_or_case: "PRD §7 / contract §14.2 (E1-002 predeclares SLO population, threshold, confidence); checkpoint preview_slos and future_release_candidate_binding"
      file_or_component: "10_checkpoints/stage_checkpoints/ENGINEERING_PREVIEW_V0_1_RELEASE_ACCEPTANCE.yaml lines 84-102, 209-304"
      evidence: "SLO-002/SLO-003 latency thresholds are stated in seconds while reference_environment_manifest is null; the only amendment rules are the E1 conflict rule and the MET conversion rule — there is no explicit rule for prospectively amending an SLO threshold before freeze. SLO-001's denominator is ALL_ELIGIBLE_LAUNCHED_ATTEMPTS but the population definition does not state that every scored task must have a harness-known achievable COMPLETED outcome, so an honest WAITING_FOR_USER on a deliberately ambiguous fixture would count as failure."
      why_it_matters: "Thresholds without an environment are prospective placeholders; an unstated amendment path invites either silent post-hoc change or an unnecessary E1-001 amendment. An ill-defined population makes the 0.95 rate meaningless."
      required_fix: "Add `threshold_amendment_rule: PROSPECTIVE_ONLY_BEFORE_SCORED_FREEZE_WITH_INDEPENDENT_REVIEW_AND_RECORDED_RATIONALE` to preview_slos, note that latency values are placeholders pending the reference-environment manifest, and add to SLO-001.population `every_scored_task_has_harness_known_completable_outcome: true` with typed non-completable fixtures scored under the negative/nonmutation cases instead."
      verification_method: "Verifier confirms the three fields and that no SLO threshold can be changed after freeze."

    - finding_id: F-E1-002-11
      severity: LOW
      requirement_or_case: "Suite §4 oracle registry rows; brief §6 ('what it cannot establish'); EP-NEG-PROVIDER-01 note"
      file_or_component: "06_evaluation/ENGINEERING_PREVIEW_EVALUATION_SUITE.md lines 72-92, 247"
      evidence: "Each oracle row states deterministic input and failure consequence but not its explicit non-claims; the only 'cannot prove' statement is the §6.7 sentence about real-provider confidentiality. E.g., OR-EFFECT-STUB cannot establish real remote semantics, OR-REPO-CANARY cannot detect mutation of unlisted paths, OR-SECRET-MARKER cannot detect non-marker secrets, OR-STATE-READBACK cannot establish that the durable store itself is trustworthy beyond the §3.3 threat boundary."
      why_it_matters: "Stating what an oracle cannot establish prevents a future E5 verifier from over-crediting a pass (e.g., treating a stub-based push pass as remote-readback evidence)."
      required_fix: "Add a 'Does not establish' column (or sentence) to each of the 18 oracle rows."
      verification_method: "Verifier confirms every oracle row carries an explicit non-claim."

notes:
  - note_id: N-E1-002-01
    text: "Author counts are honest: every headline count reproduces from the committed bytes; validation_status is labelled AUTHOR_SIDE_NOT_INDEPENDENT; no case is marked implemented or run; no reliability or model observation is claimed anywhere."
  - note_id: N-E1-002-02
    text: "E1-001 verifier notes V-E1-N3 (UF-03 traced explicitly via EP-WF-005) and V-E1-N4 (dependency confusion named as EP-NEG-SUPPLY-02) are addressed. V-E1-N2, N6, and N7 are only partially addressed (F-04, F-09)."
  - note_id: N-E1-002-03
    text: "README.md status lines remain historical (E1-001 READY, E1-002 BACKLOG, next command EXECUTE_TASK_E1-002); the contribution workflow §4 directs contributors to read README.md. This is the founder refresh already recommended in V-E1-N5 and E0 notes; not an E1-002 defect. The three E1-001 specifications' line-3 status strings are likewise historical."
  - note_id: N-E1-002-04
    text: "TASK_REGISTRY.yaml E1-002 `reviewer_model` is null; the fixer pass should set it to this record per the E1-001 precedent. Following the E0/E1-001 challenger precedent, this review edits no governance file."
  - note_id: N-E1-002-05
    text: "The checkpoint `criterion` vocabulary and every current status value used in the checkpoint fall within status_vocabulary; no undefined enum was found. `RC-06.scope: LOCAL_CORE` is an extra qualifier, not a status."
  - note_id: N-E1-002-06
    text: "Only EP-WF-014 uses profile P-JUDGMENT and it also traces RR-014 (a hard invariant); RR-014 has fifteen other deterministic cases, so no hard invariant depends on judgment. FR-061 is the only requirement whose sole coverage is judgment-based, which is appropriate for an explanation-clarity requirement."
  - note_id: N-E1-002-07
    text: "27 requirements have exactly one case: FR-061, FC-003/004/006/007, UF-03, and 21 NEG families. For NEG families single-case coverage is acceptable because each case is a family with enumerated stimuli; FC-003/004/006/007 are compatibility constraints appropriately proven by EP-NEG-FUTURE-01 and EP-CONTRIB-005."
  - note_id: N-E1-002-08
    text: "PROJECT_STATE.yaml, TASK_REGISTRY.yaml, the checkpoint, and the handoff agree on every current status (E1-002 READY_FOR_REVIEW / NOT_VERIFIED_AUTHOR_PASS; E1 NOT_EVALUATED; E2-E5 NOT_STARTED; AUTONOMY_ELIGIBLE NOT_ELIGIBLE; AUTONOMOUS_BUILD_AUTHORIZED false; S1-003 deferred)."

acceptance_criteria_evaluation:
  - criterion: "Contribution setup, change isolation, review, test, evidence, security, and maintainer-approval expectations are reproducible for an external contributor."
    result: PASS
    evidence: "16 CW gates with minimum evidence and blocking results; secret-safe preflight commands; 15-step mechanically reviewable walkthrough; build/package/test honestly NOT_APPLICABLE with reason; EP-CONTRIB-001..008 specify the walkthrough evaluation. Setup for an application lane is correctly UNKNOWN pending later tasks."
  - criterion: "The evaluation suite covers functional correctness, durability, restart/recovery, isolation, tool use, interruption, provider routing, completion verification, evidence generation, security-negative behavior, cost, and latency without running E3 benchmarks."
    result: PARTIAL
    evidence: "Every family has concrete cases and no E3 benchmark, paid call, or observation exists; but the two coverage maps disagree (F-01), predicate-adequacy and fixture variants are underspecified (F-02, F-03), the isolation ordering has no negative case (F-04), and secret scan surfaces omit model/tool payloads (F-05)."
  - criterion: "Release acceptance criteria require deterministic checks, independent verification, forbidden-artifact and secret checks, clean-room/source provenance, evidence-bundle validation, known limitations, and human release approval."
