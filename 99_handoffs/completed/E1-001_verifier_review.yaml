original_finding_dispositions:
  - finding_id: F-E1-001-01
    severity: HIGH
    disposition: RESOLVED
    evidence: >-
      Contract §2 (lines 48-64) enumerates exactly nine semantic responsibilities and types
      task.control (NONE/PAUSING/PAUSED/STOPPING) and task.reconciliation
      (NONE/RETRYING/RECOVERING) as separate mutually exclusive scalars, task.wait_reasons and
      task.blocker_refs as independent sets, attempt.disposition as the only terminal scalar,
      verification as aggregate status + 0..n immutable runs + verdict, per-operation
      status/outcome, and separately referenced agent identity/availability. §12.1 gives
      task_control "exactly 1" (line 796), task_reconciliation "exactly 1" (797),
      task_wait_reason_refs 0..many (795), task_blocker_refs 0..many (798) — the cardinality now
      admits every coexistence the prose requires; the old single-valued control_condition
      field is gone (grep returns zero matches). §4.2 (lines 176-191) is an explicit
      legal/invalid combination table: PAUSING+RECOVERING VALID, STOPPING+RECOVERING VALID,
      PAUSED+RECOVERING VALID, WAITING_FOR_APPROVAL+RECOVERING VALID, blockers+PAUSED VALID,
      CANCELLED+verification VALID with rules, COMPLETED+nonterminal/uncertain operation
      INVALID, PAUSED+STOPPING STRUCTURALLY IMPOSSIBLE, control+RETRYING INVALID,
      RETRYING+RECOVERING IMPOSSIBLE, terminal+active axis INVALID, PAUSED+productive RUNNING
      INVALID; "bundle validation MUST reject every invalid combination". PRD §2.3 (line 44),
      FR-007 (157), and user-flow invariant 9 (line 35) list the same nine responsibilities;
      no "six"/"seven axes" wording remains; the primary display label is a derived projection
      only (§2 line 62). R-028 restated accordingly.
  - finding_id: F-E1-001-02
    severity: HIGH
    disposition: RESOLVED
    evidence: >-
      Contract §9.3 (lines 578-593) defines independent route_eligibility
      (PRODUCTION_OR_NORMAL_ELIGIBLE / EVALUATION_ONLY / USER_CONFIGURED_UNVERIFIED /
      DISALLOWED) and route_purpose (NORMAL_PRODUCT_TASK -> normal-eligible only;
      E3_EVALUATION -> EVALUATION_ONLY plus eligible controls under a separately
      registered/authorized E3 task; USER_EXPERIMENTAL -> USER_CONFIGURED_UNVERIFIED only with
      explicit authenticated selection and visible warning), states "Merely unbenchmarked is
      not synonymous with DISALLOWED", that E1 assigns no PRODUCTION_OR_NORMAL_ELIGIBLE
      configuration and "only a later gate may establish it", that results "remain evaluation
      evidence until an independent governance decision changes class", and that the model
      "authorizes no E3 run, paid call, model role, or qualification decision". PRD FR-051
      (217), FR-053 (219), FR-054 (220), FR-055 (221), RR-011; UF-12 steps 1/5; §12.1
      route_provenance_refs (812), §12.2 Provider/model section (835), §12.3 rule 7 (854);
      NEG-PROVIDER-01 (959) now targets policy-disallowed routing, evaluation-only on a normal
      route, unverified without explicit experimental routing, and evaluation results presented
      as eligibility, with zero bytes/cost. A-004, A-009, R-025 reconciled. No vendor or model
      named anywhere in the three specifications (word-bounded scan).
  - finding_id: F-E1-001-03
    severity: MEDIUM
