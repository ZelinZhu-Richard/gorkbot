section_results:
  state_model: STATE_MODEL_PASS
  state_model_evidence: >-
    Nine independent responsibilities with identical enumeration in PRD §2.3, UF invariant 9,
    and contract §2; scalar exclusivity only within task.work_phase, task.control,
    task.reconciliation, attempt.disposition; independent wait/blocker sets; §12.1
    cardinalities match; explicit legal/invalid table with rejection duty; derived-projection
    rule; terminal disposition immutable and incompatible with any active axis. Stress cases:
    PAUSING+RECOVERING VALID (§4.2; UF-04 acceptance line 139); STOPPING+RECOVERING VALID
    (§4.2; §6.3; §7 continues stop reconciliation first); WAITING_FOR_APPROVAL+RECOVERING VALID
    with no consumption until revalidation (§4.2, §6.5, §9.4); BLOCKED+PAUSED VALID (§4.2;
    UF-15); CANCELLED+verification state VALID with zero credit, IN_PROGRESS invalid at close,
    CHANGES_REQUIRED forces SUPERSEDED (§4.2, UF-05 step 9); COMPLETED+outstanding external
    effect INVALID (§4.2; §11.1 requires every success-required effect KNOWN_SUCCEEDED with
    readback and zero OUTCOME_UNCERTAIN); verification failure after implementation success ->
    CHANGES_REQUIRED -> old attempt SUPERSEDED + linked unverified correction attempt (§4.3,
    §4.4 line 256); crash during approval wait -> RECOVERING preserves the wait, approval
    survives only after successor revalidation (§7, §6.5, §9.4, NEG-APR-01); redirect while
    execution active -> ordered by acceptance sequence, in-flight work reconciled, bound
    approvals/checks/verification invalidated, material change -> SUPERSEDED link (§6.4, UF-06).
    No prose/schema contradiction found.
  model_eligibility: MODEL_ELIGIBILITY_PASS
  model_eligibility_evidence: >-
    Route purpose and eligibility are separate required fields on every model operation and
    evidence record (§9.3, §12.1 route_provenance_refs, §12.2, §13.2, RR-011); normal tasks
    admit only PRODUCTION_OR_NORMAL_ELIGIBLE; E3 candidates run only as EVALUATION_ONLY under a
    separately registered/authorized E3 task and "never promote" themselves; class change is
    an independent governance decision; user-experimental routes are visibly unverified,
    never default/fallback/release evidence; DISALLOWED never dispatches; fallback cannot cross
    classes (FR-054, UF-12 step 5); E1 assigns no eligible configuration and no role (FR-055);
    no paid call or E3 run is authorized (§9.3 last sentence, FR-053, A-009
    NO_PAID_CALL_AUTHORIZED). No circularity: eligibility evidence is produced under
    EVALUATION_ONLY provenance and conferred only by later verified governance.
  repository_conditions: REPOSITORY_CONDITIONS_PASS
  repository_conditions_evidence: >-
    16 rows independently recounted; every founder-listed condition (clean, dirty tracked,
    untracked, ignored, detached HEAD, no remote, shallow, submodules, LFS, linked worktree,
    nested, monorepo, in-progress merge/rebase/cherry-pick) plus bare, generated output, and
    an explicit UNKNOWN_E2_E3 catch-all has exactly one disposition from the closed
    vocabulary; unknown identity fails closed; E2 cannot silently promote UNKNOWN_E2_E3;
    dispositions are carried in the preflight record, task contract, and evidence bundle.
  git_effect_policy: GIT_EFFECT_POLICY_PASS
  git_effect_policy_evidence: >-
    30 rows with independent effect class (READ_ONLY / LOCAL_REVERSIBLE / LOCAL_DESTRUCTIVE /
    EXTERNAL_READ_EFFECT / REMOTE_EFFECT), v0.1 disposition, and approval rule; external reads
    (fetch/clone/ls-remote/submodule/LFS) are distinct from local actions and from remote
    mutations; destructive local actions are prohibited even inside the allowed root except
    proven task-owned worktree cleanup; every REMOTE_EFFECT row is APPROVAL_REQUIRED or
    prohibited; PROHIBITED_V0_1 rows uniformly carry NOT_APPLICABLE_PROHIBITED and "approval
    cannot enable" wording; post-restart reconciliation is defined for every operation (§6.1,
    §7, §9.5); no Git library/CLI or process technology is selected.
  instruction_precedence: INSTRUCTION_PRECEDENCE_PASS
  instruction_precedence_evidence: >-
    Closed five-layer precedence; AGENTS.md/CLAUDE.md/path-local admitted only with
    identity/version/path/role/precedence as UNTRUSTED_GOVERNING_INPUT; README*/CONTRIBUTING*
    contextual by default; issue/PR text, comments, source code, test/build output, generated
    code, tool descriptions/results, and model output are untrusted content that "cannot grant
    capability, satisfy approval, change policy, widen scope, or prove completion"; explicit MAY
    (narrow only) and MUST NOT (no authority, security, secret, network, approval, destructive,
    routing, evidence, or predicate broadening) lists; conflicts -> WAITING_FOR_USER/blocker,
    never model preference; NEG-AUTH-01 fixtures the boundary.
  secret_policy: SECRET_POLICY_PASS
  secret_policy_evidence: >-
    Nine protected families incl. .env*, SSH/signing, Git credentials, package-registry, cloud/
    provider, OS stores, browser/session, shell/process, diagnostic remnants; precedence over
    allowed-root/path/task/Git/terminal/tool/instruction allowance; ambiguous -> deny without
    content-sniffing; non-exhaustive detection stated; false negative = hard boundary failure;
    raw values only through an E2-selected protected recipient boundary, never to
    model/UI/general output or descendants; evidence/log redaction, exposure records without
    echo/digest; marker-test surfaces enumerated; mechanism left to E2.
  workspace_lifecycle: WORKSPACE_LIFECYCLE_PASS
  workspace_lifecycle_evidence: >-
    PRD §2.4, UF-02, and contract §§4.1/4.4/8.1 agree: read-only admission and base capture ->
    isolated workspace established/bound -> reproduction/diagnosis in the workspace ->
    implementation -> checks -> verification; ANALYZING runs no potentially mutating command;
    unisolated mutating reproduction requires an explicit product rule plus authenticated task
    authorization that repository text cannot supply; evidence must prove no potentially
    mutating oracle ran in the unisolated user checkout (§8.1, §12.2). See V-E1-N2 for a
    non-blocking phase-label nuance.
  verification_rerun: VERIFICATION_RERUN_PASS
  verification_rerun_evidence: >-
    Verifier crash/timeout/tool failure/check-infrastructure failure/collection failure ->
    verification.run_status=VERIFICATION_ERROR, aggregate UNVERIFIED, "neither FAILED nor a
    pass" (§4.3, §10.3, UF-14 7D, FR-031, FR-067, RR-009); retry failure keeps every run and
    UNVERIFIED after ceiling exhaustion with a named wait/blocker or honest noncomplete close;
    incomplete candidate evidence receives a substantive verdict and cannot be disguised as
    infrastructure error; verification reruns are separate from execution retries and from
    correction attempts (CHANGES_REQUIRED -> SUPERSEDED + new attempt); implementation-correct-
    but-unverifiable remains UNVERIFIED and never COMPLETED (§11.1 line 718).
  independence_floor: INDEPENDENCE_FLOOR_PASS
  independence_floor_evidence: >-
    §11.3 floor: exact revision binding; not solely executor self-report; deterministic
    oracles outrank LLM judgment; separate execution context with no shared mutable author
    state; bounded context manifest; transcript excluded or UNTRUSTED; durable verifier
    identity/configuration/route/independence provenance per run; same-model only with full
    separation, never the same session; stronger strategies are E3 variables; provider
    diversity not required. NEG-VER-01 fixtures each floor element. No role selected.
  predicate_adequacy: PREDICATE_ADEQUACY_PASS
  predicate_adequacy_evidence: >-
    Both A (declared predicates pass) and B (PREDICATE_SET_ADEQUATE with evidence-backed
    request/class/instruction/scope coverage) are required (§11.1 lines 704-705). Stress:
    lint passes but feature absent -> uncovered requested behavior fails adequacy and
    BOUNDED_CODE_CHANGE requires "Requested observable behavior exists"; unit tests not
    exercising changed behavior -> "irrelevant or weak oracle" fails adequacy (NEG-VER-02);
    wrong execution path -> objective predicate for the requested behavior still required;
    snapshot without semantic validation -> weak oracle; reproduction passes but unrelated
    regression -> DEFECT class requires specified negative/affected checks and no unrelated
    diff; no relevant test -> NOT_APPLICABLE only with an objective reason and an alternative
    objective predicate, with deterministic coverage evidence preferred over unsupported model
    judgment. Adequacy is evidence-bound (source clause, oracle, coverage evidence, gap).
  stop_semantics: STOP_SEMANTICS_PASS
  stop_semantics_evidence: >-
    Cooperative stop -> cancellation/descendant termination -> finite reconciliation window ->
    user or automatic FORCE_STOP with safe termination or authority fencing -> workspace/effect
    reconciliation -> truthful CANCELLED with OUTCOME_UNCERTAIN carried as successor blocker
    (§6.3, UF-05, FR-033, RR-006, SLO-002). Killed process != completed; untrusted code cannot
    be non-interruptible; known effects reconciled by receipt/readback; unknown effects cannot
    be completed; no OS/process architecture selected.
  completion_semantics: COMPLETION_SEMANTICS_PASS
  completion_semantics_evidence: >-
    §11.1 conjunction plus §4.2/§4.4/§12.3 enforcement. Cases: (1) patch + failing tests ->
    RR-009 noncomplete; (2) tests never ran -> skipped check noncomplete; (3) tests pass +
    verifier crash -> VERIFICATION_ERROR/UNVERIFIED; (4) inadequate predicates ->
    CHANGES_REQUIRED; (5) post-verification change -> new revision UNVERIFIED (§11.3, §12.3
    rule 11, NEG-VER-02); (6) push fails -> KNOWN_FAILED/OUTCOME_UNCERTAIN blocks the
    external predicate (UF-10 step 7, §9.5); (7) remote effect pending approval -> gate
    forbids pending approval; (8) redirect after verification -> bound verification
    invalidated, must verify current revision (§6.4, §11.1); (9) flaky single pass -> FLAKY;
    (10) no test -> objective alternative or justified NOT_APPLICABLE under adequacy; (11)
    reproduction impossible -> UF-03/§11.2 cannot complete as a verified fix; (12) partial
    success -> PARTIALLY_COMPLETED, zero credit; (13) force-killed -> CANCELLED/RECOVERING,
    never COMPLETED (§6.3); (14) incomplete bundle -> EVIDENCE_FAILURE prevents COMPLETED
    (§12.3); (15) effect succeeded but acknowledgement lost -> OUTCOME_UNCERTAIN, readback
    before retry or completion (§9.5, NEG-EXT-01). FALSE_TERMINAL_COMPLETION is a zero-
    tolerance hard invariant (FR-066, RR-008); UNSUPPORTED_COMPLETION_ASSERTION records
    correctly rejected claims separately.
  evidence_bundle: EVIDENCE_BUNDLE_PASS
  evidence_bundle_evidence: >-
    §12.1 versioned envelope (schema_version, bundle_id, bundle_revision, prior revision ref,
    profile, privacy_class, redaction_scan, persistence_boundary, final_validation_ref) and
    §12.2 sections reconstruct task ID, original request, input provenance, repository base
    and conditions, plan/version, workspace, changed files, diff/revision reference,
    operations/commands/tools, checks with ordered repeats, bounded outputs/artifact refs,
    failures/retries/recovery, approvals/effects/readbacks, routing provenance, author/
    executor/challenger/verifier provenance, provider/model/tool/environment identities,
    per-run verifier identity/configuration, predicate adequacy/coverage map, artifacts with
    integrity/staleness, integrity/tamper status, limitations, and final disposition. Six
    profiles cover rejected, active, waiting/blocked, terminal noncomplete, candidate, and
    completed attempts; stale-evidence invalidation and revision binding are rules 11 and 16;
    silent omission is invalid; "Storage and serialization technology are deliberately
    unselected."
  security_negatives: SECURITY_NEGATIVES_PASS
  security_negatives_evidence: >-
    23 families recounted: AUTH, SCHEMA, FS, GIT, DESTRUCT, TERM, CMD, SUPPLY, NET, PROVIDER,
    SECRET, CRED, APR, RACE, EXT, VER-01, VER-02, CTX, EVID, AUDIT, CLEAN, DOS, FUTURE.
    Coverage traced for prompt injection, path escape, symlink abuse, secret exfiltration,
    destructive shell, in-root destructive action, network exfiltration, malicious Git hooks,
    package-install scripts, remote Git effects, stale approval, approval replay, duplicate
    side effects, evidence tampering, post-verification mutation, malicious test output,
    oversized output/resource exhaustion, sandbox-escape assumptions (§8.1 last bullet, PRD §8
    items 9-10), and model/provider compromise assumptions (§3.2 untrusted model output, hard
    controls outside model judgment, NEG-PROVIDER-01/CTX/EVID). Dependency confusion is
    covered at requirement level by §8.5 declared provenance/version/source and §9.3
    destination binding under NEG-SUPPLY-01/NEG-NET-01 (see V-E1-N4). Concrete cases remain
    E1-002's.
  architecture_neutrality: ARCHITECTURE_NEUTRALITY_PASS
  architecture_neutrality_evidence: >-
    Word-bounded scans of the three specifications for Electron, Tauri, Temporal, Redis,
    Postgres, SQLite, Docker, Kubernetes, Firecracker, gVisor, E2B, LangChain, LangGraph,
    CrewAI, AutoGen, AWS, Azure, GCP, GitHub, GitLab, Python, TypeScript, JavaScript, Rust, Go,
    Node.js, React, Vue, Svelte, protobuf, gRPC, JSONL, Kafka, RabbitMQ, NATS, Playwright,
    Puppeteer, Selenium return zero matches except one "MCP metadata/results" untrusted-input
    example (PRD §8 item 1, consistent with the E0-verified charter); vendor/model scan returns
    only "Grok Bot" in the non-goal and baseline-limit sentences; "worktree" appears only as a
    Git feature/condition with "an E2-selected equivalent" permitted (FR-012, §8.1); PRD §14
    and contract §20 keep client, storage/event, isolation, host matrix, providers, roles,
    budgets, thresholds, packaging, and concurrency mechanism UNKNOWN; 26 explicit "E2"
    deferrals in the contract.
  e1_002_boundary: E1_002_BOUNDARY_PASS
  e1_002_boundary_evidence: >-
    PRD §§9-11 and contract §16 define handoff constraints only; no evaluation case, fixture,
    seed, harness, grader, benchmark result, aggregate threshold, repetition count, isolation
    experiment, or architecture spike exists; the only percentages are per-occurrence
    zero-tolerance invariants (100%/zero); no ES-* case IDs; the three E1-002 artifact paths
    and 06_evaluation/model_role_benchmark do not exist; MODEL_ROLE_BENCHMARK_PLAN.md and
    MODEL_REGISTRY.yaml are byte-identical to the E0-verified state and E1-001 expressly does
    not import their design-proposal thresholds; E3 remains owner of technical/model benchmarks.
  traceability: TRACEABILITY_PASS
  traceability_evidence: >-
    Counts recomputed: 56 FR (001-009, 010-015, 020-027, 030-037, 040-048, 050-055, 060-069),
    15 RR identical in PRD and contract, 9 FC, 4 SLO, 4 MET, 23 NEG, 16 UF, 16 repository-
    condition rows, 30 Git/action rows; all IDs unique; 127 distinct referenced IDs / 265
    references all resolve; every FR/FC/SLO/MET/NEG/UF family is covered by PRD §13/§13.1 and
    contract §19 traceability rows (range references such as FR-001-FR-009 cover each member);
    no undefined state token (UF/PRD tokens all defined in the contract); no contradictory
    definition found across PRD/UF/contract on lifecycle, authority, approval, completion, or
    evidence; A-004/A-009/A-020 and R-002/R-003/R-009/R-025/R-028 reconcile with the
    corrected requirements; 20 unique A-IDs and 28 unique R-IDs with uniform table widths.

