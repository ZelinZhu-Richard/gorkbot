    - note_id: V-E1-N1
      text: >-
        The token COMPLETED appears bare in 13 prose sentences (e.g., PRD line 47, UF line 230,
        contract line 20) where it unambiguously means attempt completion; it is also the name
        of the completed evidence profile (contract line 771). Every cross-axis token that
        F-E1-001-20 targeted is qualified. Non-blocking; a future editorial pass may write
        attempt.disposition=COMPLETED in prose for uniformity.
    - note_id: V-E1-N2
      text: >-
        UF-02 labels workspace establishment as the READY_TO_EXECUTE row (line 83), while
        contract §4.4 performs it as the PLANNING -> READY_TO_EXECUTE transition action (line
        248) and §4.1 describes READY_TO_EXECUTE as the state in which the workspace "has been
        established/bound" (line 145). The ordering invariant (no potentially mutating
        reproduction or implementation before a bound workspace) is identical in all three
        documents; only the work_phase value displayed during workspace creation is a
        phase-boundary nuance. E1-002 should pin expected tuples to the contract's §4.1/§4.4
        wording (the contract governs lifecycle). Non-blocking.
    - note_id: V-E1-N3
      text: >-
        UF-03 (reproduction unavailable or contradictory) is normative and referenced by the
        DEFECT_REPRODUCTION_AND_FIX rules, but it is not named individually in the UF §19 flow
        coverage matrix or the PRD §13.1 crosswalk rows (it is covered by the UF-01-UF-15
        range in the NEG row). Non-blocking navigational gap; E1-002 should include UF-03 in
        its coverage trace explicitly.
    - note_id: V-E1-N4
      text: >-
        Dependency confusion (a private package name resolving to a public registry) is
        covered at requirement level by §8.5 (declared provenance, version/source, separate
        network/execution grants) and §9.3 (grant binds normalized destination) under
        NEG-SUPPLY-01/NEG-NET-01 but is not named as a stimulus. E1-002 should instantiate a
        named dependency-confusion case without needing an E1-001 amendment (consistent with
        challenger note N-E1-001-06).
    - note_id: V-E1-N5
      text: >-
        Artifact self-status lines describe pre-verification state and become historical once
        this verification is committed: README.md "Current phase ... E1-001 is ready and not
        started", its task-status bullet, and its next command "MODE: EXECUTE_TASK_E1-001";
        the three specifications' line-3 status "E1-001 FIXER PASS — READY_FOR_REVIEW; NOT
        VERIFIED"; charter §17/§18/§24 E0-era wording; the A-020 status tag
        POST_FIX_VERIFICATION_REQUIRED (its remaining evidence is the E1-002 walkthrough and
        later E2/E3/E5 observations, so the assumption stays OPEN_NOT_TESTED). None is in this
        verifier's authorized edit list; TASK_REGISTRY.yaml and PROJECT_STATE.yaml are
        authoritative. Recommended founder action at commit time: refresh README's status
        bullets (E1-001 VERIFIED; E1-002 READY, not started) and set its next command to
        MODE: EXECUTE_TASK_E1-002.
    - note_id: V-E1-N6
      text: >-
        Contract §11.3 permits same-model/configuration verification only for
        "policy-defined low-risk tasks" with the full separation floor; the risk classification
        policy and its owner are not defined in E1-001. Because the separation floor (separate
        session/context/manifest, deterministic-oracle priority, provenance) applies regardless
        of class, this does not weaken correctness; E1-002 should predeclare the task-class
        risk policy used by the evaluation and E2 should record the policy owner. Non-blocking.
    - note_id: V-E1-N7
      text: >-
        A CHANGES_REQUIRED verdict creates a linked correction attempt (§4.3/§4.4). Repeated
        correction attempts are bounded by the task-level time/cost/tool-call ceilings (RR-005,
        FR-037) and by the failure-class retry ceiling (FR-034, §10.2 Verification/evidence
        family) rather than by a named maximum-correction-attempt ceiling. E1-002 may set an
        explicit correction-attempt ceiling for the evaluation without an E1-001 amendment.
        Non-blocking.
    - note_id: V-E1-N8
      text: >-
        PROJECT_STATE unresolved_p0_questions still lists
