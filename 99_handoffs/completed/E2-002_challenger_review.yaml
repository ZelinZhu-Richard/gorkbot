    restart reconciliation, effect intent/attempt/observation/readback/unknown chain,
    unknown acknowledgement, durable one-shot approval, secret recipient boundary, protected
    entry, path/symlink brokering, process fencing, provider neutrality/zero dispatch,
    context/evidence separation, stale verification invalidation, first-outcome duplicate
    delivery, resume revalidation, evidence integrity, test seams). The failure is
    consistency, not intent-crediting: the same mechanism receives three different statuses
    across candidates for AR-EXE-003 and AR-DUR-003, and C01's AR-FUT-001/002 are held down on
    preference reasoning (F-E2-002-01). One SATISFIED_BY_DESIGN (AR-TST-002 in all three)
    is credited against evidence "f25 all frozen asset families" that does not map the
    families (F-E2-002-04), and AR-DUR-002 SATISFIED_BY_DESIGN in C01 and C03 does not address
    the client-only interruption class (F-E2-002-02).
  known_hard_violations: >-
    Searched each candidate for the listed contradictions: C01 verifier dependence on
    executor state (no: verifier reads the store through the core port and reruns checks in
    its own workspace; the executor child has no store write); C01 restart separation (no:
    durable truth is on the persistent volume; the availability blast radius is disclosed);
    C02 ambiguous operation ownership after worker replacement (no: lease/fence tokens,
    first-outcome inbox, readback before retry); C02 stale client authority (no: expected
    task version on every command; stale views disclosed in f26); C03 dangerous stale
    projections (no: projections never authorize; commands carry expected stream/version and
    the reducer validates against the journal); C03 impractical protected entry/local-first
    (unknown, correctly labeled, not violated); eventual consistency as current truth (no:
    C03 decisions are made by the single-writer append gate/reducer, projections are
    read-only); protected input bypass (all describe a dedicated path outside the ordinary
    pipeline); original-user-state protection (all bind isolation before mutation with
    canaries/inventories); effect ambiguity after crash (all persist intent/dispatch before
    the effect and require readback). No known hard violation is hidden. One possible
    FR-031 failure in C01 depends on an unstated lifetime decision and is recorded as
    F-E2-002-02 rather than as a known violation.
  preference_treatment: >-
    AR-PRF-001..006 are PREFERENCE_CHARACTERIZED_UNSCORED with candidate-specific evidence
    strings in all three records (e.g. C01 "Colocated interactive/control path", C02 "Local
    IPC/control path", C03 "Local append/reducer/projection path"; migration evidence names
    each candidate's own costly boundary); weights_assigned 0; no total, rank, or
    conversion to hard; no hard failure is described as a tradeoff. The overview §5 table
    names evidence classes E2-003 may examine and leaves weights UNASSIGNED.
  decision_domains: >-
    25/25 domains answered per candidate with a named owner and a topology-specific answer
    (e.g. D02 "Local core" / "CONTROL_SERVICE" / "WORKFLOW_CORE: replaceable coordinator;
    journal/append gate/reducer are authority"; D08 supervisor / worker-plus-service-fence /
    executor-adapter-plus-workflow-fence; D22 executor port / worker interface / dispatch
    event contract). The answers are indexes into substantive fields rather than bare
    "supported" labels. D09 answers list controls and the unsupported host class but no
    candidate declares the isolation tier it claims (F-E2-002-05).
  recovery_model: >-
    All three candidates enumerate a startup sequence and the same 17 scenario classes
    (application crash, host restart, worker failure, model timeout, tool timeout, lost
    tool result, partial write, stale workspace, duplicate operation, duplicate effect,
    external acknowledgement loss, stop/force, stale approval, stale verification, waited
    event, protected entry, retirement) with candidate-specific mechanisms, and each can
    represent KNOWN_SUCCESS, KNOWN_FAILURE, and UNKNOWN_OUTCOME without guessing (lost
    acknowledgement -> OUTCOME_UNCERTAIN/UNKNOWN_EFFECT until readback; provider timeout after
    receipt -> typed transport/model/provider timeout with usage uncertainty; approval stale
    after restart -> full tuple revalidation; verification stale after mutation -> old run
    retained, aggregate UNVERIFIED; duplicate event after recovery -> first outcome). The
    FAIL is bounded: the client-only interruption class that E1 requires to be distinct
    (FR-031, RR-002, UF-08 step 1, EP-CTL-016) is absent from the C01 and C03 scenario lists
    and from their process-lifetime declarations (F-E2-002-02), and interrupted task-workspace
    file writes (FR-014, COMP-14) are not represented in any candidate's recovery model
    (F-E2-002-09).
  protected_entry: >-
    Each candidate's f18, TB-05/TB-08/TB-20, f03, and f09 protected_entry describe a
    dedicated path outside ordinary chat/model/telemetry/event capture; authenticated
    takeover; suspension or exclusion of ordinary observation; raw value delivered only to
    the exact recipient/use; no raw value in transcript, model context, state, journal,
    logs, screenshots, summaries, evidence, or artifacts; fail to WAITING_FOR_USER or a hard
    blocker when exclusion is unavailable; a non-secret durable receipt; and restart
    reacquisition with no replay. The seam is credible in all three, and all three truthfully
    mark AR-SEC-006 UNKNOWN_REQUIRING_SPIKE. Classification: the capture-suspension core
    (keystroke/clipboard/screen/accessibility/terminal exclusion on a supported host) is
    shared implementation uncertainty independent of candidate architecture (class A); the
    delivery path is candidate-dependent (class B): in-process controller inside the
    integrated interface (C01), a client->worker recipient channel that must bypass the
    service (C02), and a broker that must bypass the command/event/payload pipeline (C03).
    E2-003/E2-004 need this decomposition stated so one shared spike with three delivery
    variants can close it (F-E2-002-03).
  threat_boundaries: >-
    20 rows per candidate, each with trust/assets, authority source, allowed flows,
    forbidden flows, enforcement point, failure behavior, evidence, and recovery; zero row
    strings identical across candidates; enforcement points follow the topology (TB-07 core
    supervisor / worker supervisor plus service fence / executor supervisor plus workflow
    fence; TB-18 evidence builder-validator-verifier / service validator plus verifier worker
    / evidence reducer-validator-verifier; TB-19 core startup coordinator / service recovery
    coordinator / recovery reducer and append gate; TB-20 in-process controller / client
    broker plus worker gate / broker outside the command-event path). Each candidate states
    the unsupported host-compromise assumption. No row is answered by model self-restraint.
  security_enforcement: >-
    Structural owners named per candidate for untrusted repository instructions (policy
    kernel / instruction-policy evaluator / instruction-policy command validator), filesystem
    and path scope (workspace broker/adapter), protected secrets (protected-entry controller
    / client protected broker plus worker recipient gate / protected broker), process
    execution (supervisor with fence), network (network policy boundary / service network
    gate plus worker policy / network capability adapter), package scripts (TB-09 capability
    gate), Git hooks/helpers (Git adapter), approvals (ledger / service ledger / approval
    reducer serialized before dispatch), external effects (effect ledger / service effect
    ledger / effect workflow), tool capabilities (capability gateway and result validators),
    model/provider dispatch (provider gateway plus result validator), and evidence integrity
    (validator plus verifier). Each f18 carries an explicit fail-closed rule that model
    intent cannot substitute for a control.
  approval_effects: >-
    INTENT/APPROVAL/ATTEMPT/OBSERVED_EFFECT/CONFIRMED_EFFECT/UNKNOWN_EFFECT are listed and
    defined in f12 of all three; approval is a durable authenticated one-shot object with
    issuer, exact normalized scope, versions, expiry, revocation, and consumption serialized
    with dispatch (core ledger / service ledger / immutable approval events); lost
    acknowledgement remains UNKNOWN_EFFECT and blocks completion and blind retry; duplicates
    return the first outcome; stale approvals are revalidated on the full tuple; replay is
    denied before dispatch; recovery after a dispatched effect goes through readback; effect
    identity is stable and distinct from operation/attempt identity. Durable effect owner
    exists in each. The remaining question is only the crash-window classification
    consistency (F-E2-002-01).
  evidence_verification: >-
    Evidence has an authoritative owner (evidence builder/validator over the core store;
    evidence service; evidence projector over journal/payloads); executor output is an
    observation validated against operation/lease/schema; the verifier reads underlying
    authoritative state and target readbacks, binds the exact candidate revision, reruns
    deterministic checks, evaluates predicate adequacy, and records its identity/
    configuration/provenance; crash or timeout yields VERIFICATION_ERROR and UNVERIFIED;
    material mutation preserves the old run and invalidates the current aggregate; evidence
    integrity covers gaps, tamper, substitution, reordering, and staleness with digest alone
    not counting as correctness. C01's integration does not reduce independence: the
    verifier is a separately launched process/context with its own review workspace and no
    author write authority, and the executor child cannot write the store.
  context_memory: >-
    All three keep original messages, task/plan/predicate/policy, operations/effects,
    approvals, failures, artifacts, evidence, and verification outside model context; build
    a bounded versioned manifest; label summaries LOSSY with source IDs/versions/trust/
    omissions and invalidate stale or poisoned blocks; reconstruct resume from authoritative
    facts before any summary; forbid compaction of security/approval/effect/evidence/
    predicate/verification/disposition facts; and require no vector/RAG mechanism.
  testability: >-
    Every candidate lists subsystem-keyed seams covering crash/commit fault points, restart
    reconciliation, process kill/fence/descendant survival, provider/model/transport timeout
    and cancellation, lost acknowledgement and duplicate delivery, stale approval/revocation
    races, synthetic secret markers and capture-state observers, repository condition/GE
    rows and path attacks, evidence gap/tamper/staleness and candidate mutation, verifier
    crash/adequacy/check replay, and raw metric inputs, and each states a decisive-oracle
    rule and an unsupported-case rule. The FAIL is bounded to the missing per-asset-family
    mapping required by AR-TST-002's observable property and the absence of any named seam
    for cross-boundary ordering/fault scheduling (the sixteen dangerous compositions) or for
    EP-CTL-016 client-only disconnect (F-E2-002-04).
  level_b: >-
    19 rows per candidate with disposition, why, independent E1 reason, and excluded Level C
    detail. No pattern is used merely because the reconstruction used it (each row cites
    ARs); no NOT_USED pattern is required by the candidate's own design (content addressing
    is replaced by stable IDs plus integrity metadata in all three); SUBSUMED rows (C01
    LB-12; C03 LB-05/09/12) state where the property lives; no DEFERRED row hides an
    architecture decision (cloud lifecycle is deferred inside USED/SUBSUMED text with the
    local semantics retained); the overview states this is an inventory, not a merit count.
    Two charter §19 comparison subjects are dispositioned identically across all three
    (LB-02 NOT_USED, LB-14 gateway) and are therefore not comparable from the set
    (F-E2-002-06).
  spike_classification: >-
    Six items, each with a falsifiable question, affected hard ARs/AQs, and NOT_RUN. The
    six decompose into three underlying questions applied unevenly: protected-entry
    capture exclusion (AQ-010) is listed for all three; descendant termination/fencing
    (AQ-004) is a spike for C01 only although C02 and C03 fence over an owned process tree
    the same way; the record-to-external-effect crash window (AQ-005/SP-C01 pattern) is a
    spike for C02 and C03 but SATISFIED for C01 although no candidate can make an external
    effect atomic with its local record. The overview §10 presents all six as
    "candidate-specific". Nothing labeled E3 actually blocks selection; the reverse risk is
    present: the crash-window question may be analysis-resolvable plus E3V-001 rather than
    an E2-004 blocker, and the current framing pre-shapes E2-003 unevenly (F-E2-002-01,
    F-E2-002-03).
  uncertainties: >-
    Each candidate uses all five classes with counts 3/2/1/1/1, 3/2/1/1/1, 4/2/1/1/1. No
    unknown is treated as favorable; no product semantic is mislabeled as an architecture
    unknown; E4 items are implementation choices; FUTURE_PRODUCT items are deferred scope.
    The FAIL is bounded to consistency: the same underlying questions are classified as
    ANALYSIS_RESOLVABLE_E2_003 in one candidate (C03-U04 includes AR-EXE-003 host
    enforcement; C02-U03 excludes it) and as ARCHITECTURE_BLOCKING_SPIKE_E2_004 in another
    (C01-S01), and the isolation/host-class question has no C01 entry at all (F-E2-002-01,
    F-E2-002-05).
  e3_mapping: >-
    E3V-001..008 mapped per candidate with candidate-specific focus (e.g. E3V-001
    transactional acknowledgement/owner epoch versus service inbox/outbox/lease transfer
    versus append acknowledgement/replay/partial event-payload), focused evidence, owner
    class, E4/E5 remainder, architecture handback versus implementation adjustment, and an
    unpopulated proposed-ADR link. Each handback condition is structural (loss, stale
    acceptance, duplicate effect, unfencable class, structural escape, interface unable to
    preserve semantics, self-report-only proof, unrepresentable inputs) and each adjustment
    condition is repairable; E3V-008 leaves model eligibility unassigned and pre-decides no
    occupant. E3 scope remains the focused subset; full-suite work stays E4/E5.
  future_compatibility: >-
    Each candidate classifies remote execution, cloud workers, concurrent tasks, multiple
    agents, multiple clients, skills/routines, and connectors as RESERVED_COMPATIBILITY with
    a named seam and not_implemented true, and General Edition, Finance Edition, and SaaS as
    DEFERRED_TO_LATER_STAGE; capability inventories place actual remote/cloud/concurrent/
    multi-agent/extension/vertical/SaaS features in DEFERRED_TO_LATER_STAGE. No distributed
    consensus, transport, fleet, loader, tenancy, or vertical schema is specified now. Lock-in
    is named per candidate (integrated core plus record semantics; service lifecycle plus
    lease/effect protocol; canonical event identity/order/evolution) with the local-to-remote
    work honestly described as future design in all three.
  contributor_burden: >-
    f22 is candidate-specific: C01 discloses broad core authority/recovery documentation and
    blast-radius debugging; C02 discloses service lifecycle, IPC/auth versioning, and
    cross-process correlation; C03 discloses event schema/reducer/projection/replay/retention
    concepts and precision documentation. C03 does not claim parity with C01; its "no
    mandatory daemon" claim is truthful only once the coordinator lifetime is defined
    (F-E2-002-02). No ranking or "simplest wins" rule is applied.
  migration_reversibility: >-
    f28 in each candidate lists easy reversals (adapters, projections, client, verifier),
    costly reversals (splitting the integrated core / merging or splitting the service and
    its lease-effect protocol / rewriting canonical event identity or journal-payload
    authority), state export/import with epoch/lease/verification invalidation, provider
    migration with retained nonportable evidence, executor-boundary and local-to-remote
    migration needing future transport/identity/failure design, client replacement
    preconditions (authentication, durable control/approval, protected entry, evidence),
    and reversal triggers that return the candidate to E2. No "adapter" language hides a
    lock-in; each names its principal commitment.
  premature_ranking: >-
    The only hits for preferred/recommended/winner/best/leading/default/favored/score/rank
    are negations; candidate ordering is by ID; evaluation detail is reasonably symmetric
    (C01 546 lines, C02 484, C03 491; the difference is longer TB-row and recovery prose in
    C01, not additional criticism or praise); each candidate carries two spike-class
    unknowns and 4-5 weaknesses. The overview §3 "Required long-running topology" row reads
    lightest for C03, which is acceptable only once F-E2-002-02 defines the coordinator
    lifetime.
  clean_room: >-
    Zero reconstruction-specific identifiers from the audit module map or the adoption-matrix
    external paths; no reconstructed source, schema, layout, module name, asset, copy, or
    score; external audit cited only as Level B pattern inventory; no candidate is "rebuild
    the reconstruction" (none adopts its Electron/coordinator/local-store/MCP-bridge
    topology; C03's "coordinator" is a generic role name); frozen E1 blob-identical; verified
    E2-001 artifacts unchanged.
  governance: >-
    TASK_REGISTRY E2-002 status READY_FOR_REVIEW / planning_status
    READY_FOR_REVIEW_NOT_VERIFIED_AUTHOR_PASS with assigned_model recorded and reviewer/
    verifier null; E2-001 VERIFIED; E2-003 BACKLOG blocked_by E2_002_NOT_INDEPENDENTLY_VERIFIED;
    E2-004..006 BACKLOG on serial dependencies; PROJECT_STATE current_stage_status
    E2_ACTIVE_E2_001_VERIFIED_E2_002_READY_FOR_REVIEW, active_task_ids [E2-002],
    ready_task_ids [], backlog E2-003..006, E2 gate NOT_EVALUATED, architecture_selected false,
    architecture_candidate_count 3 with IDs, preferred_candidate null,
    accepted_architecture_adrs 0, architecture_spikes_run 0, model_roles_locked false,
    application_code_created false, evaluation/benchmark/spike/paid/external counters 0,
    E3-E5 NOT_STARTED, autonomy NOT_ELIGIBLE / NOT_AUTHORIZED, S1-003 BLOCKED/DEFERRED with
    zero execution; MODEL_REGISTRY benchmark_status NOT_RUN and role assignments
    HYPOTHESIS_ONLY; handoff governance_state block agrees. README.md is stale (outside the
    allowed paths; NOTE).

state_ownership_assessment:
  EP-ARCH-C01:
    task_operation_approval_effect_verification_evidence_workspace_routing_conversation: "All authoritative records are owned by the single-writer core persistence port under one ownership epoch with compare-version preconditions (f06); the execution supervisor owns process trees only; the verifier owns immutable run records but writes them through the core port; the client view, models, executors, and verifier cannot write the store (f02)."
    split_brain: "None. Two components cannot believe they are authoritative; the client cannot overwrite authority (in-process controller submits versioned commands); the executor cannot determine completion (core derives the conjunction); projections are derived; model output is an observation validated by the policy kernel."
    residual: "The interaction controller shares the authority process, so the client/owner lifetime relationship is the open question (F-E2-002-02)."
  EP-ARCH-C02:
    task_operation_approval_effect_verification_evidence_workspace_routing_conversation: "Control service is the sole canonical writer under one store epoch; clients submit versioned idempotent commands; workers hold lease/fence tokens and return observations; verifier worker runs are recorded by the service; routing provenance and conversation are service-owned (f04/f06)."
    split_brain: "None. Stale client commands are rejected by expected version; late worker results are stale observations after fence advance; no worker or client can set completion; approvals are consumed by the service serialized with dispatch."
    residual: "The protected client->worker recipient channel is a write-free but trust-relevant edge missing from the f04 topology (F-E2-002-07)."
  EP-ARCH-C03:
    task_operation_approval_effect_verification_evidence_workspace_routing_conversation: "Journal append gate under the current stream-owner epoch and expected sequence is the only writer; payload store writes are referenced by accepted events; reducers derive task/operation/approval/effect/verification state deterministically; projections, snapshots, and summaries are derived; adapters (executor, provider, verifier, protected) append only through policy-checked commands (f04/f06)."
    split_brain: "None by shape: a stale coordinator's append is rejected by expected sequence/owner epoch; a projection cannot become authoritative because commands carry expected versions validated by the reducer; the verifier's restricted command path cannot rewrite history. Enforcement of the single append gate across two coordinator processes is a mechanism (durable epoch/lock at the journal tail) that the candidate leaves unselected; the shape is coherent."
    residual: "Coordinator lifetime versus client presence is undefined (F-E2-002-02); payload-before-event ordering is unstated (F-E2-002-08)."

candidate_challenges:
  EP-ARCH-C01:
    transactional_boundary: "Inside the boundary: task/plan/predicate/policy/authority records, operation/control/approval/attempt/effect/verification records, history, and outbox/evidence references (f08 acknowledgement_boundary). Filesystem changes, Git operations, process execution, and remote effects are outside it and are reconciled through the durable operation/effect ledger, idempotency keys, and target-specific readback (f07/f12). The record does not claim atomicity for external reality, so 'transactional' does not create a false atomicity sense; the effect chain keeps ATTEMPT distinct from CONFIRMED_EFFECT and keeps acknowledgement loss as UNKNOWN_EFFECT."
    partial_filesystem_writes: "Store records: atomic old/new or quarantine with original bytes (f08/f09). Task-workspace files: only canary/inventory reconciliation is described; interrupted file replacement (FR-014, COMP-14) is not represented (F-E2-002-09; shared by all candidates)."
    effect_acknowledgement_loss: "OUTCOME_UNCERTAIN persisted until authoritative readback (f09 external_ack_loss); coherent, but its SATISFIED_BY_DESIGN for AR-DUR-003 is inconsistent with the peers' spike classification of the same window (F-E2-002-01)."
    verifier_isolation: "Separately launched process/context, own review workspace, least privilege, read-only access to authoritative evidence, no author approval reuse, immutable sequential runs, VERIFICATION_ERROR on crash (f16). Adequate: integration does not reduce independence from the executor/model session."
    core_corruption_or_crash: "Durable truth survives on the persistent volume; startup validates and quarantines; the core is the single availability and recovery coordinator, disclosed in f26 as a blast-radius weakness. Not a hard violation."
    simplicity_claim: "Coherent as an integrated design; its claimed operational simplicity is partly offset by the undisclosed consequence that every client exit is an orchestrator interruption unless the core continues detached from the interface (F-E2-002-02)."
    result: "Internally coherent; two findings to resolve (F-E2-002-01 status consistency; F-E2-002-02 client/owner lifetime)."
  EP-ARCH-C02:
    operation_truth_owner: "Control service; worker output is an observation validated against operation/lease/schema (f07 result_rule)."
    worker_loss_reconciliation: "Lease expires or is revoked; process outcome and possible effect are read back before bounded retry; dispatch outbox and result inbox retain the first outcome (f09)."
    duplicate_effect_avoidance: "Stable effect identity, target idempotency where available, first-outcome inbox, and readback; a replacement worker is granted only after fence advance (f07/f12)."
    workspace_authority_transfer: "Lease binds exact workspace/base/path scope; stale lease invalidates workspace and verification; recreation only under current authority (f10/f09)."
    worker_identity_to_evidence: "f15 provenance records client/worker/lease identities per action."
    force_termination_and_stale_workers: "Service orders cancel/force/fence of the worker tree; late results are rejected by fence epoch. A fenced-but-alive descendant can still mutate the workspace filesystem or consume resources, which is exactly the NEG-TERM-01 'zero outside effect/orphan' host question the candidate marks SATISFIED_BY_DESIGN for AR-EXE-003 while C01 marks it a spike (F-E2-002-01)."
    fencing_required: "Yes and present (lease/fence tokens on every envelope)."
    compromised_worker_escape: "Worker has no canonical write and least authority; its host-level reach is the shared isolation-tier question (F-E2-002-05)."
    always_on_burden_and_version_skew: "Disclosed in f26 (installation/lifecycle, IPC versioning, stale client views, correlation across processes); versioned IPC envelopes in f04."
    value_of_separation: "Genuine: client-only disconnect is a presentation event by construction (EP-CTL-016 satisfied by shape), workers are disposable, and the worker lease interface is the reserved remote seam. Not complexity for its own sake."
    result: "Coherent; findings F-E2-002-01 and F-E2-002-07."
  EP-ARCH-C03:
    authoritative_element: "Journal events plus referenced payloads under the append gate; workflow state is a deterministic reduction; projections and snapshots are derived (f06)."
    contradictory_events: "Expected stream/entity sequence plus owner/fence at the append gate; rejected stale commands are retained in a denial stream."
    external_reality: "Adapter responses are observation events; target-specific readback events establish known success or non-success; UNKNOWN_EFFECT event otherwise (f12)."
    ordering_after_crash_retry: "Sequence numbers, causal parents, and first-result indexing by command ID; duplicate append/dispatch/effect rejected (f07/f09)."
    duplicate_events: "Command result event indexed by stable ID returns the first result."
    protected_data_out_of_history: "Protected broker outside the command/event/payload/model pipeline; only a non-secret receipt event is appended (f18/TB-20)."
    redaction_without_corrupting_history: "Holds/deletion/redaction are linked events; payload physical deletion is distinct; C03-U02 correctly flags retention/redaction coherence for E2-003."
    stale_projection_risk: "Projections never authorize; commands carry expected versions validated by the reducer; lag/gap are visible in the client (f03)."
    local_first_justification: "C03-U01 honestly asks whether immutable event authority is proportionate for v0.1; not pre-answered."
    schema_evolution_and_contributor_burden: "Named as durable commitments and learning burden in f26/f22/f28."
    rebuildable_projection_motivation: "Rebuildable derived views are an E1 requirement in every candidate (AR-DAT-001); C03's distinctive choice is journal authority, which charter §19 lists as a mandatory comparison subject (event-history/workflow-history), so it is a legitimate alternative rather than an imported elegance."
    open_points: "Coordinator lifetime versus client presence and who enforces deadlines with no live process (F-E2-002-02); payload-before-event durability ordering and orphan handling (F-E2-002-08); AR-DUR-003 spike classification versus C01 (F-E2-002-01)."
    result: "Complexity is bounded and truthfully disclosed; findings F-E2-002-01, F-E2-002-02, F-E2-002-08."

new_findings:
  - finding_id: F-E2-002-01
    severity: HIGH
    candidate_or_component: "EP-ARCH-C01, EP-ARCH-C02, EP-ARCH-C03 f23 architecture_requirements; f27 ARCHITECTURE_BLOCKING_SPIKE_E2_004 and ANALYSIS_RESOLVABLE_E2_003; overview §4 and §10; handoff hard_constraint_status_summary and e2_004_spike_candidates; registry author_hard_constraint_status"
    requirement_or_domain: "AR-EXE-003, AR-DUR-003, AR-FUT-001, AR-FUT-002; E2-001 §2 status semantics (UNKNOWN_REQUIRING_SPIKE blocks selection; PLAUSIBLE requires E2-003 analysis); AQ-004, AQ-005; RR-003, RR-006, NEG-TERM-01, NEG-EXT-01; E2-003 acceptance criterion 'hard constraints evaluated before preferences' and 'UNKNOWN never favorable'"
    evidence: >-
      AR-EXE-003: C01 line 318 UNKNOWN_REQUIRING_SPIKE ("proposed process-tree force/fence;
      supported-host feasibility unproven"), C02 line 278 SATISFIED_BY_DESIGN ("worker process
      tree plus service fence"), C03 line 284 PLAUSIBLY_SATISFIABLE ("process supervisor plus
      workflow fence; host support unselected"). All three describe the same structure: an
      in-band supervisor over an owned process tree plus an authority epoch/fence (C01 f04
      lines 48-51 and f07 cancellation_fence; C02 f04 execution_owner/control_and_fencing_owner;
      C03 f04 execution_owner/control_and_fencing_owner). Authority fencing alone does not
      satisfy NEG-TERM-01 ("zero outside effect/orphan"); descendant termination/containment
      is a host-class capability that AQ-004 names as a possible E2-004 feasibility question
      for every candidate. AR-DUR-003: C01 line 303 SATISFIED_BY_DESIGN ("stable operations
      and effect readback") while C02 line 263 and C03 line 269 are UNKNOWN_REQUIRING_SPIKE
      ("crash-boundary feasibility unproven"; "atomicity impossible and protocol unproven").
      No candidate can make an external effect atomic with its local record; all three
      persist intent/dispatch before the effect and reconcile by readback (C01 f12 attempt/
      unknown_effect; C02 f12; C03 f12), so the crash window is the same class of question
      (SP-C01 matrix; AQ-005) in all three, with C02 adding one IPC hop. AR-FUT-001/002: C01
      lines 350-351 PLAUSIBLE on "core extraction cost needs analysis" and "single-process
      assumptions need analysis" while C01 f04 communication_rule, f06, and f20 claim
      versioned serializable envelopes and explicit ownership scopes; extraction cost is the
      AR-PRF-003/AR-PRF-004 comparison, not the AR-FUT hard floor, which C02 (lines 310-311)
      and C03 (lines 316-317) are credited for on the same evidence type. The handoff and
      overview present the resulting 50/52/51 counts and six "candidate-specific" spikes as
      comparable.
    why_it_matters: >-
      E2-003 must eliminate hard failures before preferences, may not score an UNKNOWN
