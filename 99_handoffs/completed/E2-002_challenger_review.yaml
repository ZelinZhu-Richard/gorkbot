  - finding_id: F-E2-002-02
    severity: HIGH
    candidate_or_component: "EP-ARCH-C01 f02 colocated (line 24), f03 conceptual_client/reconnect (lines 37, 40), f09 scenarios, f19 long_running_components (line 228), f22 processes_services (line 272), f23 AR-DUR-002; EP-ARCH-C03 f02 summary (lines 20-22), f19 candidate_assumption/long_running_components (lines 195-196), f22 processes_services (line 239), f23 AR-DUR-002/AR-DUR-004; overview §3 'Required long-running topology' row (line 93)"
    requirement_or_domain: "FR-031, RR-002, UF-08 trigger and step 1 (client-only disconnect/reload is a presentation event unless it also caused runtime-owner loss), EP-CTL-016 (execution continues; no client-presence coupling), AR-DUR-002 (distinct client/orchestrator/worker interruption semantics), AR-DUR-004 and contract §6.3 step 5 (automatic escalation no later than the stop deadline), plan domains D01/D02 (local lifecycle and crash boundary), E2-002 acceptance criterion 1 (client/runtime boundary as a structural axis)"
    evidence: >-
      C01 places the authenticated interaction controller in the core process and runs "one
      local core process while the application is active"; f03 nevertheless describes an
      interface that "reconstructs" a projection on reconnect and f20 reserves "reconnect
      projections". The record never states whether the interaction surface can be closed
      or detached while the core continues, or whether closing the application interrupts
      executor children. Its 17 recovery scenarios contain application_crash and
      host_restart but no client-only interruption class. C03 states "no mandatory separate
      daemon", a coordinator "launchable by a local client" that "may remain active for
      current work", and that the "durable logical agent/task survives process exit"; it
      never states whether the coordinator survives client exit, who keeps it alive, or who
      enforces stop-reconciliation deadlines and approval expiry when no process is alive.
      C02 states the relationship explicitly (persistent service; "disconnect never changes
      task truth"). EP-CTL-016 requires that, when the execution owner is healthy, a client
      disconnect leaves execution running with "no client-presence coupling"; FR-031 and
      RR-002 make this a hard invariant; AR-DUR-002 requires the client interruption class
      to be distinct. Both C01 and C03 mark AR-DUR-002 SATISFIED_BY_DESIGN.
    why_it_matters: >-
      If closing the integrated C01 application or the C03 launching client terminates the
      execution owner, every client exit is an orchestrator interruption and FR-031's
      client-only clause can be satisfied only vacuously or not at all — a possible hidden
      hard failure that E2-003 could admit as SATISFIED. If instead the owner continues
      detached, that is a material topology fact (a background process of the application;
      a detached coordinator) that changes packaging (f19), contributor burden (f22), the
      D02 crash boundary, SLO-002 control-effectiveness comparability, and the C01-versus-C02
      client-boundary distinction on which acceptance criterion 1 partly rests. The
      overview's topology row currently reads lightest for C03 precisely because this is
      undefined.
    required_fix: >-
      For C01 and C03, state explicitly in f02/f04/f19: (a) whether a client-only disconnect
      exists in the shape and how EP-CTL-016/FR-031 is materialized (e.g. the interaction
      surface can close while the core/coordinator continues as a detached process of the
      same application; or, if not, that client exit is always an orchestrator interruption —
      in which case AR-DUR-002 cannot remain SATISFIED_BY_DESIGN and the FR-031 consequence
      must be recorded as a candidate-specific status with its E2-003 consequence);
      (b) which process enforces control/stop/approval deadlines and waited-event timeouts
      when no owner process is alive, and how the finite-bound requirement is met on next
      start; (c) add the client-only interruption class to f09 and the consequence to f26;
      (d) map EP-CTL-016 in f25; (e) adjust overview §3's topology row so C01/C02/C03 are
      compared on the same lifetime facts. The fix must preserve the C01-versus-C02
      distinction (if C01's interface becomes a separate process, C01 must re-state its
      distinguishing axes or be replaced with a materially different shape). Do not change
      frozen E1.
    verification_method: "Read C01 and C03 f02/f03/f04/f09/f19/f22/f25; confirm an explicit client-versus-owner lifetime statement, an explicit deadline-enforcement statement for the no-live-process case, a client-only interruption scenario, and an EP-CTL-016 mapping; confirm AR-DUR-002/AR-DUR-004 statuses are consistent with those statements; confirm the pairwise C01/C02 distinction still holds on at least two structural axes."
