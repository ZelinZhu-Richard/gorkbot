acceptance_criteria_evaluation:
  - criterion: "At least three credible end-to-end candidates differ materially across multiple structural axes, including authority/persistence, orchestration, execution/isolation, and client/runtime or control-plane boundaries."
    result: PARTIAL
    basis: "Three credible shapes differ materially in authority/persistence, orchestration ownership, verifier path, process topology, and migration commitment; the execution/isolation axis differs less than advertised (all three: owned process tree plus authority fence) and the C01/C02 client-boundary distinction depends on C01's unstated integrated-interface/app-lifetime decision (F-E2-002-02)."
  - criterion: "Every candidate covers all 25 domains and every E2-001 hard constraint with process, trust, data, control, effect, recovery, and verification boundaries."
    result: PASS
    basis: "25/25 domains and 59/59 hard constraints present per candidate with candidate-specific process (f04), trust (f05), data (f06/f08), control (f07), effect (f12), recovery (f09), and verification (f16) boundaries; status truthfulness issues are recorded under F-E2-002-01/02/04, not as coverage gaps."
  - criterion: "Every candidate separates v0.1 required behavior, interfaces reserved for compatibility, and deferred future features without speculative SaaS or multi-agent implementation."
    result: PASS
    basis: "f20 and f21 three-way classifications present and consistent; no distributed, tenancy, fleet, loader, or vertical machinery specified now."
  - criterion: "Assumptions, unknowns, reversibility/migration boundaries, contributor burden, E3 obligations, Level B inputs, and rejected Level C details are explicit for each candidate."
    result: PARTIAL
    basis: "All are explicit per candidate (f26/f27/f28/f22/f30/f29); the unknown classifications are explicit but not consistent across candidates for the same underlying questions (F-E2-002-01, F-E2-002-03, F-E2-002-05)."
  - criterion: "No candidate is recommended, ranked, or described as selected."
    result: PASS
    basis: "Zero positive ranking/selection language; preferred candidate NONE; accepted ADRs 0; architecture NOT_SELECTED in all artifacts and governance."

