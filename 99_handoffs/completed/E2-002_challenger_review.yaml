verdict_rationale: >-
  No BLOCKER. The candidate set is real: three end-to-end shapes that differ in authority
  owner (single-writer integrated core / persistent control service / journal append gate
  plus reducer), persistence and recovery model (transactional current state plus history
  ledgers validated on restart / service-owned transactional state plus command, dispatch,
  result and effect ledgers with lease invalidation / append-only journal replayed through
  deterministic reducers with rebuildable projections), process topology, client boundary,
  and principal migration commitment; none is a library, framework, or vendor permutation of
  another and none is a straw alternative. Every mechanical claim in the handoff reproduces
  from the committed bytes: 3 unique IDs; 30 fields numbered f01..f30 in each record; 65 ARs
  per candidate set-equal to the verified register with matching classes (59 hard / 6
  weighted); hard generation statuses C01 50/7/2/0, C02 52/5/2/0, C03 51/6/2/0 with the
  summary blocks and the contract-status equivalence rule consistent; 127 unique canonical E1
  IDs per candidate set-equal to the traceability CSV with every group's primary AR equal to
  the CSV primary column (0 mismatches); 25/25 domains; TB-01..20 with all nine semantics and
  zero identical row strings across candidates; LB-01..19 with valid dispositions; E3V-001..008
  with seven fields; three-way capability inventories with no duplicate; 56/56 repository
  YAML files strict-parse with zero duplicate keys; zero technology/vendor, Level C
  identifier, secret-pattern, or ranking hits; frozen E1 and verified E2-001 artifacts
  preserved; seven allowed paths; git diff --check clean. Two HIGH findings nevertheless
  require a bounded fixer pass before independent verification: (1) the same underlying
  unknowns receive different hard-constraint statuses across candidates — descendant force
  termination/authority fencing (AQ-004) is UNKNOWN_REQUIRING_SPIKE for C01, SATISFIED_BY_DESIGN
  for C02, and PLAUSIBLE for C03 although all three fence by authority epoch over a process
  tree; the record-to-external-effect crash window (AQ-005) is SATISFIED_BY_DESIGN for C01 but
  UNKNOWN_REQUIRING_SPIKE for C02 and C03 although atomicity with an external target is
  impossible for all three; and C01's AR-FUT-001/002 are held at PLAUSIBLE on extraction-cost
  reasoning that belongs to AR-PRF-003/004 — so the headline counts and the six-item E2-004
  spike list are not comparable inputs for E2-003; (2) C01 and C03 do not define the
  execution owner's process lifetime relative to client presence, which frozen E1 makes a
  hard, distinct interruption class (FR-031, RR-002, UF-08 step 1, EP-CTL-016 "no
  client-presence coupling"), so C01's AR-DUR-002 SATISFIED_BY_DESIGN is unsupported, C01 may
  carry a hidden FR-031 failure depending on an unstated decision, C03's "no mandatory
  daemon" advantage is undefined, and the C01-versus-C02 client-boundary distinction rests on
  the same unstated decision. Three MEDIUM findings cover the shared-versus-candidate-specific
  decomposition of the six spike candidates, the missing per-asset-family testability mapping
  required by AR-TST-002 (including no seam for the sixteen dangerous compositions), and the
  absent v0.1 isolation-tier declaration required by plan domain D09/AQ-003. Four LOW findings
  are bounded corrections. Nothing found changes E1 semantics, imports Level C material,
  selects a technology, or ranks a candidate.

