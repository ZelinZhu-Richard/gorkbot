structural_distinctness:
  result: STRUCTURAL_DISTINCTNESS_PASS
  basis: >-
    The three shapes differ in authoritative state owner, persistence/recovery model, process
    topology, scheduling ownership, verifier path, and principal migration commitment, and
    none can be transformed into another by swapping a library or moving one module. The
    execution/isolation axis differs less than the overview advertises (all three run an
    owned process tree under an in-band supervisor with an authority epoch/fence; the
    differences are the lease/fence token protocol in C02 and the durable dispatch event in
    C03), and the client-boundary distinction between C01 and C02 rests on C01's unstated
    integrated-interface/app-lifetime decision (F-E2-002-02); the pass is therefore conditional
    on the fixer preserving distinctness when resolving that finding.
  pairwise:
    C01_vs_C02:
      minimum_non_equivalence: >-
        (a) Authority process lifetime: C01's single-writer core exists only while the
        application is active (f19/f22) whereas C02's control service is persistent and
        independent of any client; (b) client boundary: C01 colocates the authenticated
        interaction controller with the authority in one process (f02) whereas C02 places
        thin clients behind an authenticated versioned local IPC boundary with stale-client
        version rejection (f03/f04); (c) execution ownership transfer: C02 issues explicit
        worker lease/fence tokens and reconciles worker loss through command inbox, dispatch
        outbox, result inbox and effect ledgers (f07/f08), whereas C01 supervises owned
        child process groups in-core with a fence epoch and no lease protocol (f04/f07);
        (d) remote-evolution boundary: C02's worker interface already crosses a process
        boundary, C01 must extract it (f20/f28). Swapping stores, UI frameworks, or IPC
        libraries does not remove these differences; removing C01's integrated interface
        would collapse C01 toward C02, which is why F-E2-002-02 must be resolved without
        that collapse.
    C01_vs_C03:
      minimum_non_equivalence: >-
        (a) What is authoritative on conflict: C01's transactional current-state record
        (history is an audit ledger) versus C03's ordered journal (current state is a
        deterministic reduction; snapshots are discardable); (b) recovery reconstruction:
        C01 validates the store and reconciles nonterminal ledgers, C03 replays reducers
        from a trusted checkpoint and rebuilds every projection; (c) evolution commitment:
        C01 can migrate mutable records forward, C03 must version immutable events and
        readers and can only add corrective events; (d) verifier path: C01's verifier is a
        fresh process reading the store, C03's verifier is an adapter that replays the
        journal and appends immutable verification events through a restricted command path;
        (e) coordinator replaceability: C03's coordinator process is not the authority
        (append gate plus reducer are), C01's core is. These are semantic differences in
        recovery truth and evolution cost, not representation choices.
    C02_vs_C03:
      minimum_non_equivalence: >-
        (a) Mandatory daemon versus none: C02 requires a persistent service; C03's authority
        survives with no live process and any coordinator with the current owner epoch may
        continue; (b) scheduling source: C02's service scheduler grants leases from
        transactional state, C03's reducer derives eligible work from durable events and a
        replaceable coordinator grants leases; (c) authority record model: service-owned
        mutable state plus inbox/outbox ledgers versus append-only journal plus payload
        store; (d) client boundary: authenticated IPC command/read API versus projection
        subscription at an event position with visible lag/gap semantics (C03 f03);
        (e) migration commitment: service lifecycle/lease protocol versus canonical event
        identity/order/evolution. Distinct.
  cosmetic_technology_permutations: 0

