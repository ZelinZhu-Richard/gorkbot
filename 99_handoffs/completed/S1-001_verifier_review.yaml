independent_checks:
  scoring_model: >-
    CORRECT. Formula, weights, direction, normalization (/5 onto 0–100), arithmetic, ranking,
    failure_safety direction, E/J/U provenance and all five sensitivity orderings reproduce
    exactly. Weighting robustness: corrected feasibility/safety cluster 22 vs core demand 31 vs
    competition/WTP 23 vs distribution 12 vs delegation 6; platform fit is unscored. Because all
    demand cells of H1/H2/H8 are identical neutral values, H1 leads under the corrected, original,
    demand-heavy and feasibility-heavy schemes solely through judgment cells on failure safety
    (+1), integration (+1), security (+2) and prototype feasibility (+1), net of H2's expansion
    (+2) and investor (+2); a demand-only weighting ties H1/H2/H8 exactly; H8 leads under
    competition/WTP-heavy. No ranking is robust enough to justify a winner; the artifact says so.
  d012_co_equal_justified: true
  h1: >-
    H1_VALID_FOR_DISCOVERY. Competitive gap and differentiation are not overstated (2/2; the
    matrix shows diffs, source URL/time, importance scoring, digests, multi-competitor views and
    Slack/Sheets delivery at USD 12–99/month and in enterprise suites); much of H1 is explicitly
    satisfiable by scheduled monitoring (platform class scheduled_automation; 'A simpler scheduled
    assistant can solve much of H1 without a bespoke persistent platform'); trigger/frequency
    internally consistent across A-014, the gate and the brief; customer frequency UNKNOWN; no
    customer demand claimed. Not selected as beachhead.
  h2: >-
    H2_VALID_FOR_DISCOVERY. Issue-to-PR treated as commoditized/competitive with six first-party
    systems; approval-before-merge represented as existing (GitHub human-only merge, Cursor draft
    PR, Devin Review approve/request changes, Jules plan approval); independent review represented
    as existing (Copilot second opinion, Codex review pass, Claude Code Review multi-agent +
    verification step, Devin Review); the remaining gap is stated narrowly (separately provisioned
    reproducer, declared acceptance predicate, current remote PR/CI state after the author run
    stops, contradiction-preserving bundle) and labelled UNTESTED. Not selected as beachhead.
  h8_classification: >-
    H8_FOLD_INTO_H2. A CUSTOMER: NO — identical buyer (technical founder/eng lead at a 2–20 dev
    team). B TRIGGER: PARTIAL — an incoming human- or agent-authored PR rather than a bounded issue,
    but H2's residual step is triggered by the same PR arrival. C JOB: NO — H2's residual job after
    commoditized generation is exactly H8's job (independently verified completion evidence).
    D WORKFLOW: PARTIAL — H8 omits the commodity generation step; the verifier component is the
    same. E VALUE PROPOSITION: MIXED — a customer could name 'PR verifier' as a product, but the
    scorecard already pitches H2 on the verification evidence, not on generation. F DISCOVERY: NO —
    same interview population; A-018 probes already run inside the H2 interviews. Four of six NO/
    PARTIAL → fold. Recommended representation: keep H8's scored row for transparency, label it
    'H2 verification mechanism / sharper H2 workflow (folded)', keep A-018 and the four in-interview
    probes as the only H8 test, and reopen a distinct allocation only if A-018's 4/8 + 3/8
    thresholds are met and independently reviewed. The current artifact already does this in
    substance ('retain as H2 refinement', no quota, probes inside H2); the remaining delta is the
    'pending review' wording, which this review satisfies. Not elevated to co-equal.
  platform_necessity: >-
    Every hypothesis carries a minimum-sufficient-runtime class from the five-class scale and a
    stated basis; the class is a qualitative constraint, not a score bonus (R-024). H1 is
    classified scheduled_automation and its investor_relevance/expansion bases cite the
    substitution; H2/H8 carry multi-tool persistent-agent reasons (repository environment, CI, PR
    and review state, clean reproduction, remote-state readback) while noting incumbents already
    provide that runtime. No explicit platform-necessity kill rule exists; the H1 competitive-
    differentiation gate (residual contract must change a real decision) is the operative proxy
    (NOTE).
  discovery_gates: >-
    EXECUTABLE AND SYMMETRIC. Ten parallel dimensions (pain, frequency, workaround
    dissatisfaction, delegation, measurable value, pilot, WTP, integrations, failure tolerance,
    competitive differentiation) with observable X/8 thresholds, same 8/8 sample, same USD 500 /
    four-week written price test, same two-cycle written pilot ask, same ≥4/8 outside-network
    control, every threshold labelled DESIGN PROPOSAL and NOT_TESTED. H1 receives no extra
    opportunity or easier threshold; the frequency thresholds differ in absolute terms (H1 2 in 60
    days vs H2 4 in 30 days) but are matched to each job's natural cadence.
  customer_evidence: "ZERO confirmed — no interviews, pilots, WTP, payments, observed frequency or validation; 10_CUSTOMER_NOTES unchanged; all eight rows LOW / 0_NONE."
  source_integrity: "SRC-064/065/066/072 repaired as recorded; SRC-075..SRC-105 current canonical URLs, publisher, primary classification, claims_supported, access window and 403 limitations verified; publication dates 'not_displayed' where the page shows none."
  governance: "D-011 PROVISIONAL with historical note; D-012 CONFIRMED authoritative for allocation; H1/H2 co-equal, neither selected; D-006/D-007 PROVISIONAL; no architecture, application code, benchmark, provider call, outreach or spend; S0-004/S0-005 byte-identical to the Stage 0 verified commit; no S1-002; fixer changes inside allowed_files_to_change; repository state matched READY_FOR_REVIEW at review start."

