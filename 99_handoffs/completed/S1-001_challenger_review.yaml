      for approval, re-read it. Of the nine MVP-must-demonstrate items (persistent task state,
      background execution after disconnect, two tool classes, progress, interruption/
      redirection, approval boundary, artifact/external state, independent verification,
      provider abstraction), the job structurally needs only two tool classes (web fetch,
      files), an artifact and a diff check; background continuation and interruption are not
      required by a job that a cron-triggered monitor completes in minutes, and the approval
      boundary exists because the contract adds a master-record write, not because the customer
      job has one. The scorecard does not evaluate whether a persistent agent materially
      improves the job over "SMB change monitor + LLM summary" (F-S1-001-01 shows the
      incumbents already bundle the summary), and no criterion captures platform necessity or
      vendor-feature exposure. The reviewer's classification: FOUNDER/ANALYST JUDGMENT, not
      evidence.
    why_it_matters: >-
      A wedge that does not need the platform does not de-risk the platform or the company
      thesis (verified completion of delegated work), and is the most exposed of the seven to
      incumbents and general assistants adding a scheduled-research feature. The MASTER prompt
      forbids letting a future platform rescue a weak wedge; the converse also holds — the
      first workflow must at least exercise the capability the company claims as its
      differentiator, or the investor demo and the customer value diverge. H1's expansion_
      potential=4 and investor_relevance=3 look generous on this basis; H2 and H7 exercise far
      more of the runtime (terminal, tests, long-running execution, browser state, approval
      interception).
    required_fix: >-
      Add a qualitative "platform necessity / vendor-feature exposure" assessment to every
      hypothesis brief (which MVP-must-demonstrate items the customer job itself requires; which
      incumbent or general-assistant feature would absorb it), and either add it as a scored
      criterion with a stated weight or state why it is deliberately unscored. Re-examine H1
      expansion_potential with that lens. No re-ranking is mandated by this finding; the point
      is that the dimension is currently invisible.
    verification_method: "Verifier confirms each brief carries the assessment and the scoring-method section states how it is treated."

  - finding_id: F-S1-001-05
    severity: MEDIUM
    requirement: "Scoring transparency — 'Scores and weights are author judgments subject to challenger review'; MASTER label discipline (VERIFIED FACT / STRONG INFERENCE / DESIGN PROPOSAL / OPEN QUESTION); acceptance criterion 2"
    file_or_component: "03_product/S1-001_SCORED_HYPOTHESES.csv (no per-cell basis); scorecard Scoring method; CSV ease_of_reaching_users H1=5, H2=5"
    evidence: >-
      The CSV carries 105 criterion scores and one row-level evidence_confidence=LOW; no cell
      states whether it rests on a source, an author judgment, or nothing. ease_of_reaching_
      users is 5 ("unusually favorable as a hypothesis") for H1 and H2 with zero recruiting
      attempts, channel counts or network inventory in the repository; the only basis is the
      founder brief's "founder-led outreach and design partnerships" preference and D-006.
      bootstrap_revenue_potential is 4 for H1 with no price or buyer evidence. The scorecard's
      "Required independent challenge" item 2 asks for perturbations but the artifact itself
      publishes none.
    why_it_matters: >-
      A precise total over mostly-judgment cells reads as measurement; a reader (including the
      verifier and later the investor-facing stage) cannot tell which 1.2 points are evidence
      and which are preference. Reach=5 is the clearest place where founder preference enters
      the number rather than the narrative, and it inflates H1 and H2 equally by 1.6–4.8 points
      against H3–H7 (reach 2–4), which partly manufactures the top-two gap over the rest.
    required_fix: >-
      Add a basis column per criterion (or a companion table) with values EVIDENCE / JUDGMENT /
      UNKNOWN and a one-line rationale for every cell scored 5 or 1; cap UNKNOWN cells at 3 or
      justify the exception in writing; publish at least the equal-weight, demand-only and
      feasibility-zeroed orderings computed above in the scorecard's sensitivity section.
    verification_method: "Verifier checks that every 1 and 5 has a written basis, that reach cells are labelled JUDGMENT/UNKNOWN, and re-runs the three alternative orderings."

  - finding_id: F-S1-001-06
    severity: MEDIUM
    requirement: "Scoring method must be reproducible and unambiguous (scorecard Scoring method section names which criteria are reverse-scored)"
    file_or_component: "Scorecard Scoring method and criteria table row 'Cost of failure'; CSV cost_of_failure column"
    evidence: >-
      The scoring method declares that integration tractability, security manageability and
      sales-cycle speed are scored so that higher is more favourable, and says nothing about
      cost_of_failure, whose rationale ("Failure cost shapes trust, verification, and buyer
      urgency") can be read either way. Cells: H2 4, H3 4, H5 4, H7 4; H1 3, H4 3, H6 3. If
      higher means "more severe failure cost", a 4 is a burden for an early agent product
      (R-002 false completion); if it means "favourable buyer urgency", it is a benefit. Under
      reversal (6-x) the totals become H1 75.6, H2 74.8, H3 66.8, H7 64.2 — the top-two order
      flips.
    why_it_matters: "One undeclared sign convention on a weight-5 criterion is sufficient to reverse the headline ranking; the verifier cannot reproduce the intent from the artifact."
    required_fix: "Declare the direction of cost_of_failure (and confirm every other criterion's direction) in the Scoring method section; if the intended reading is 'severity', explain why severity is scored as favourable for a first wedge or re-score."
    verification_method: "Verifier reads the declared direction and confirms the cells are consistent with it."

  - finding_id: F-S1-001-07
    severity: MEDIUM
    requirement: "MASTER Stage 1 evaluation dimensions (current workaround, willingness to pay, ease of reaching users, differentiation); review brief: does the model underweight distribution, willingness to pay, switching costs or competitive intensity and overvalue feasibility"
    file_or_component: "Scorecard criteria and weights table"
    evidence: >-
      Feasibility cluster (integration 7 + security 6 + prototype 10) = 23; competitive
      intensity (current_workaround_gap) = 5; the only willingness-to-pay proxy
      (bootstrap_revenue_potential) = 5; there is no switching-cost or current-spend criterion;
      pain_urgency (11) is defined as the existence of a painful job, not unsolved pain, so a
      crowded-but-painful job (H2: pain 4, gap 2) and a less-painful-but-open job are scored
      on different axes that the weights then net out. Differentiation (8) and current_
      workaround_gap (5) overlap (both reward the absence of a satisfactory alternative).
    why_it_matters: "The model structurally favours workflows a solo founder can prototype safely over workflows customers already pay to solve; H1 benefits most from that shape (feasibility-only: H1 88.7, first by 5.2). This is a design choice the author may defend, but it must be visible, and the published ranking should be shown under at least one commercially weighted alternative."
    required_fix: "Either re-weight (the reviewer suggests pain/unsolved-gap ≥ 25 combined, a willingness-to-pay/switching criterion ≥ 8, feasibility cluster ≤ 18) with rationale, or keep the weights and publish the commercial-first and demand-only orderings beside the headline with a sentence on why the author's weights are preferred at Stage 1. Define pain_urgency as unsolved pain or merge it with current_workaround_gap to avoid netting."
    verification_method: "Verifier checks the weights table rationale and that at least one commercially weighted ordering is published."

  - finding_id: F-S1-001-08
    severity: MEDIUM
    requirement: "Acceptance criterion 4 — disconfirming evidence plan; scorecard Counter-hypothesis rule ('H1 receives no incumbent advantage'); D-011 reversal rule"
    file_or_component: "Scorecard Falsification plan (H1 gates only) and Counter-hypothesis rule; Interview recruiting plan quotas"
    evidence: >-
      H1 has four predeclared gates with numeric thresholds over 8 interviews. H2 has "at least
      four artifact-led H2 interviews" and a comparative rule ("more qualified artifacts,
      stronger pilot commitments, or stronger payment evidence than H1") with no thresholds,
      no problem gate, no delegation gate, and no price test. With 8 vs 4 sample sizes, any
      count-based comparison ("more qualified artifacts") is biased toward H1 by construction;
      no proportion-based or per-interview comparison is specified. H3–H7 have no gates at all.
    why_it_matters: "The reversal rule in D-011 cannot fire fairly as written, so the counter-hypothesis is decorative; the plan satisfies the letter of acceptance criterion 4 for H1 only."
    required_fix: "Predeclare H2 gates symmetric to H1 (problem, delegation/differentiation, commitment/payment, feasibility) with thresholds stated as proportions, and state the comparison rule in proportions; give H3 and H7 at least a problem-gate threshold since they are sampled. If the first-wave allocation stays 8/4, say why and how proportions will be compared."
    verification_method: "Verifier confirms H2 gates exist with thresholds and that the comparison rule is proportion-based."

  - finding_id: F-S1-001-09
    severity: MEDIUM
    requirement: "Acceptance criterion 3 — selected hypothesis is narrow and testable (trigger, frequency and owner must be identifiable); A-014"
    file_or_component: "Scorecard H1 brief and Provisional beachhead contract (Trigger and job); A-014; H1 problem gate item 1"
    evidence: >-
      A-014 hypothesizes the job is performed "at least monthly"; the product contract is a
      "weekly ledger"; the problem gate requires the job "at least twice in the preceding 60
      days" (monthly); the trigger is stated as "At a weekly review or before a positioning/
      release decision". The customer is "founder, head of product, or product-marketing lead"
      — three roles with different triggers (lost deal, launch, pricing review, battlecard
      refresh) and no stated owner. The scorecard's own H1 brief says frequency is an OPEN
