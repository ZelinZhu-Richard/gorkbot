# 5. Challenger-added hypothesis (candidate, not validated)
# ---------------------------------------------------------------------------
challenger_added_hypotheses:
  - id: H8
    classification: CHALLENGER_ADDED_HYPOTHESIS
    status: NOT_VALIDATED_NOT_SCORED
    customer_segment: "Technical founder or engineering lead at a 2–20 developer team that already receives agent- or human-authored pull requests faster than it can review them"
    workflow: "Independent reproduce-and-verify of an incoming PR in an isolated sandbox: reproduce the linked issue on the base branch, run the change, execute and extend tests, exercise the preview or CLI, and attach a machine-checkable evidence bundle (reproduction result, test/CI logs, external-state readback, unresolved uncertainty) as a check run — with no merge or approval authority"
    why_it_deserves_stage_1_consideration: >-
      (1) The author's own evidence plus this review shows the issue→PR layer is commoditized
      while no official page shows a first-class, independently verified completion-evidence
      bundle — verification is the open gap. (2) Verification IS the company's stated
      differentiator (A-005, D-007), so this is the one workflow where the differentiator is
      the job rather than a garnish. (3) It exercises the runtime the MVP must demonstrate
      (sandbox, terminal, tests, browser, long-running execution, evidence artifacts) without
      write authority, so failure cost is bounded. (4) Frequency is per PR; success is
      objective; the buyer matches D-006 and the founder's stated reach. (5) Willingness to pay
      in the adjacent AI-review category is observable (Claude Code code review "$15-25" per
      review; Copilot code review on paid plans) — category WTP, not demand for this product.
    known_risks: "Crowded by comment-level AI reviewers (Copilot code review, Claude Code code review with its own 'verification step', Cursor Bugbot, Codex review, Devin Review, CodeRabbit and peers); reproduction on arbitrary stacks is hard (same R-006 family as H2); close to the founder's technical interests, so founder-preference bias must be controlled; it may be H2's differentiator restated rather than a separate wedge."
    requested_handling: "Fixer scores H8 with the same rubric and basis labels, adds it to the scorecard as a scored candidate (not a selection), and adds two probes to the H2 interview quota (do you review agent PRs; what evidence would let you merge faster) rather than a new quota. Do not declare it validated."

