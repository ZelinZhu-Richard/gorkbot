findings:
  - finding_id: F-S1-001-01
    severity: HIGH
    requirement: "Stage 1 — current workaround and differentiation must be evaluated against the customer's actual alternatives; R-022; acceptance criterion 2 (evidence vs preference); S1-001 deliverable customer_workflow_scorecard"
    file_or_component: "02_research/S1-001_CURRENT_WORKAROUND_EVIDENCE_2026-08-23.md (claim matrix, screening implication 2 and 6); 03_product/S1-001_SCORED_HYPOTHESES.csv H1 current_workaround_gap=3, differentiation=3; scorecard H1 brief and Provisional beachhead contract; A-015"
    evidence: >-
      The author screened H1 only against ChatGPT deep research (SRC-066), Klue (SRC-067) and
      Crayon (SRC-068) and concluded the edge is "verified delta state and approval-gated record
      updates — not generic citations". Live official pages on 2026-08-23 (06:09Z..06:17Z):
      Visualping competitive-monitoring page — monitors "pricing pages", "changelog or product
      page"; each change is "a side-by-side diff with the old and new price, a screenshot, and an
      AI summary"; alerts include "a timestamp, the source URL, a screenshot and an AI summary";
      custom importance prompt "Alert me when the price changes or a new plan appears"; "Reports
      roll every change across your competitive set into one scheduled email"; Slack/Teams/
      Google Sheets/API & MCP; pricing page Free $0, Personal $14/mo, Business $140–350/mo.
      PageCrawl.io — "AI scores every change from 0-100 by importance. Set your threshold";
      "Daily, weekly, or monthly cadence"; "Auto-sync tracked data to Google Sheets"; Standard
      $13.33/mo. Competiflow.com — watches "pricing, blog, docs, and changelog"; every alert
      includes "the exact text before and after, plus the source URL and the time we read it";
      "a summary, why it matters, and a severity score"; "Email, Slack, or a signed webhook";
      audiences "Product marketing Founders Product & strategy"; Starter $19/mo, Growth $49/mo,
      Pro $99/mo. ChangeTower ($12–78/mo, "time-stamped web page snapshots"), Distill.io
      ($15–80/mo, "Version History of all changes"), Competitors.app ($14.95–19.95 per
      competitor/mo, "Weekly email overview", "AI Summaries"), Kompyte/Semrush ("AI Daily
      Summaries", tiers by companies tracked, quote-only) were also live. Crayon's own aggregate
      page states "surfacing meaningful 'before and after' changes to web pages in real-time".
      Scheduled general-assistant routines exist: Gemini Scheduled Actions ("daily, weekly, and
      monthly routines", up to 10 active); Claude Code routines ("run on a recurring cadence like
      hourly, nightly, or weekly", Pro/Max/Team/Enterprise); ChatGPT scheduled tasks (search
      snippet only, page 403: "ask ChatGPT to check for changes and notify them when there's a
      meaningful update"); the reference product's own routines ("A routine tells one Bot when to
      run a workflow—on a schedule", docs.x.ai/grok-bot/skills-routines-and-automations, and
      GBF-020/021 in the verified Stage 0 baseline). None of these appears in the evidence file,
      ledger, scorecard, or D-011.
    why_it_matters: >-
      Every pillar of the H1 "verification-first" contract — official-source allowlist, prior
      snapshot, before/after evidence, retrieved-at time, materiality classification, weekly
      digest, Slack/Sheets delivery — is already sold to founders and product marketers at SMB
      prices. The residual gap is narrow: a cross-competitor cited delta memo and an
      approval-gated update to the customer's master record, and neither has been shown to be
      something a buyer pays for. A-015 ("more value than a generic cited report or current CI
      alternative") is partly falsified by public evidence before any interview; the delegation/
      differentiation gate item 4 ("fewer than 5/8 describe their current alternative as
      satisfactory") is likely to be tested against tools the interviewer does not know exist.
      H1 current_workaround_gap=3 ("mixed/unknown") and differentiation=3 are not supportable
      against this field; 2/2 is the defensible ceiling, which moves H1 to 73.0 and widens the
      gap to H2 to 3.8 under the author's own weights. This also strengthens R-022 and the
      "product whose main advantage disappears when model vendors add a feature" exclusion in
      the founder brief.
    required_fix: >-
      (a) Add the change-monitoring category (at minimum Visualping, PageCrawl, Competiflow,
      ChangeTower, Competitors.app, Kompyte) and the scheduled-assistant/routine category
      (Gemini Scheduled Actions, Claude Code routines, ChatGPT scheduled tasks as PARTIAL, Grok
      Bot routines via the existing Stage 0 SRC-004) to SOURCE_LEDGER.csv and the evidence
      file's claim matrix with quoted capability statements and UTC access times. (b) Re-score
      H1 current_workaround_gap and differentiation with a written basis, and recompute totals
      and ranks. (c) Rewrite the H1 differentiator statement to name only what is not already
      shipped (cross-competitor cited delta memo; approval-gated master-record update with
      readback; explicit unknown/unavailable states) and state plainly that diffs, timestamps,
      importance scoring and digests are table stakes. (d) Update A-015's wording and evidence
      needed to reflect that the comparison baseline is an SMB change monitor plus an LLM
      summary, not only Klue/Crayon/deep research. (e) Add the named tools to the H1 interview
      "what have you tried" probe so the satisfaction test is run against the real alternative.
    verification_method: "Verifier re-opens the added sources, confirms quoted phrases, re-runs the Ruby recomputation, and checks that the H1 differentiator text and A-015 no longer claim before/after delta evidence or timestamps as differentiation."

  - finding_id: F-S1-001-02
    severity: HIGH
    requirement: "Acceptance criterion 2 — recommendation distinguishes evidence from founder preference; R-001; R-021; MASTER Stage 1 gate (one provisional beachhead selected using customer pain, willingness to pay, feasibility, defensibility)"
    file_or_component: "01_governance/DECISION_LOG.md D-011 (Scoring context); scorecard Outcome first and Sensitivity and selection rule; scorecard Provisional beachhead contract (H1 only); Interview recruiting plan quotas 8/4"
    evidence: >-
      D-011: "H1 receives the first discovery slot based on lower-sensitivity initial inputs and
      founder-stated reach, neither of which is customer evidence." Scorecard: "H1 is selected
      for discovery because it offers a read-only, lower-sensitivity first test, a simpler
      external completion predicate, and alignment with the founder's stated reach hypothesis."
      CSV: H1 already receives security_manageability 4 vs H2 3 (+1.2) and prototype_feasibility
      5 vs H2 4 (+2.0) for exactly those properties; ease_of_reaching_users is 5 for both H1 and
      H2, so reach does not separate them and is the maximum score on a criterion with zero
      recruiting evidence. The alternative weightings above show H1's second place depends on
      the feasibility cluster (demand-only: H1 4th; feasibility-only: H1 1st by 5.2). The
      founder brief's stated beachhead is "technical founders and small startup teams"; a
      product-marketing lead or head of product at a B2B SaaS company is a different buyer from
      the one D-006 names, so founder reach to the H1 buyer is itself an inference. The scorecard
      gives a full beachhead contract (customer, trigger, output, completion predicate,
      differentiator, demo, expansion path) only for H1, and the first-wave quota is 8 H1 vs 4
      H2, while also stating "H1 receives no incumbent advantage".
    why_it_matters: >-
      The tie was broken toward the option that is easier to prototype and matches the founder's
      stated preference, and the reasons offered are either already inside the score or not
      evidence. That is precisely the pattern R-001 ("building a platform before validating a
      workflow") and R-021 ("founder preference mistaken for validated demand") exist to catch,
      and it is the substance of acceptance criterion 2. With F-S1-001-01 applied, the tie
      disappears in H2's favour under the author's own weights. The decision itself (which to
      discover first) is low-stakes and the founder's to make; the problem is that D-011 is
      framed and documented as a scored-and-reasoned beachhead selection when it is a
      preference-driven sequencing choice, and the asymmetric contract/quotas give H1 the
      incumbent advantage the text disclaims.
    required_fix: >-
      Fixer (not challenger) to present, for founder decision, a restated D-011 that (a) removes
      "lower-sensitivity inputs" and "simpler completion predicate" as tie-break reasons because
      they are already scored, or explicitly says they are being double-weighted and why; (b)
      labels the remaining reason as FOUNDER PREFERENCE / sequencing convenience, not analysis;
      (c) either records equal first-wave discovery allocation for H1 and H2 (e.g. 6/6 within
      the 20) with a symmetric H2 beachhead contract and gates (see F-S1-001-08), or records the
      founder's explicit choice to favour H1 with the reason and the reversal rule. D-011 status
      stays PROVISIONAL. The challenger did not edit D-011.
    verification_method: "Verifier reads the revised D-011 and scorecard selection rule and confirms no tie-break reason duplicates a scored criterion, the preference is labelled, and the allocation/contract asymmetry is either removed or explicitly founder-decided."

  - finding_id: F-S1-001-03
    severity: HIGH
    requirement: "Current-workaround accuracy and differentiation for the top-ranked hypothesis; R-022; acceptance criterion 3 (selected hypothesis narrow and testable — applies to the counter-hypothesis the plan relies on)"
    file_or_component: "02_research/S1-001_CURRENT_WORKAROUND_EVIDENCE_2026-08-23.md rows SRC-064/SRC-065 and screening implication 1; scorecard H2 brief (Differentiation: 'weak unless independent verification materially outperforms current coding agents'); CSV H2 current_workaround_gap=2, differentiation=2"
    evidence: >-
      The author cites two products. Live official pages on 2026-08-23 (06:08Z..06:14Z) show at
      least nine current first-party issue/ticket-to-PR agents: GitHub Copilot cloud agent
      ("available for all paid Copilot plans"; "Draft pull requests created by Copilot cloud
      agent must be reviewed and merged by a human"; "cannot approve or merge a pull request";
      "gets a second opinion on its code with Copilot code review"; "You can set up automations
      to run Copilot cloud agent automatically, on a schedule or in response to events"), OpenAI
      Codex cloud (learn.chatgpt.com/docs/cloud: "Run tasks in isolated cloud environments ...
      start work from the web, GitHub, GitLab, Linear, or Slack"; "open a pull request when the
      result is ready"; Business "$20/ user / month" annual; "@codex review" on every PR), Claude
      Code on the web / @claude GitHub Action ("turn issues into pull requests"; "Claude
      analyzes code, makes changes, runs tests, and checks its work"; "Create PR"; auto-fix of CI
      failures and review comments; Pro/Max/Team), Cursor Cloud Agents ("Comment @cursor on a
      GitHub PR or issue ... to kick off an agent"; "build, test, and interact with the changed
      software"; Bugbot reviews), Cognition Devin (docs: "write, run and test code"; "repro and
      fix bugs"; CI check reporting; Devin Review; self-serve Free/Pro/Max/Teams; prices 429),
      Google Jules ("start a task from a GitHub issue by applying the label 'jules'"; plan
      approval before code), GitLab Duo Developer flow ("Create a draft merge request from an
      issue"; "run tests and verify its own changes"; Free/Premium/Ultimate), AWS Kiro
      autonomous agent ("Add the kiro label"; opens PRs), OpenHands Cloud ("Label an issue with
      openhands"). Separate AI review products: Copilot code review, Claude Code code review
      ("a verification step checks candidates against actual code behavior"; "$15-25" per
      review; never blocks merging), Cursor Bugbot, Codex review, Devin Review. Not found on any
      official page: a reproduce-first guarantee or a first-class, independently verified
      completion-evidence bundle (reproduction confirmation + test logs + review findings)
      attached to the PR; Claude Code routines explicitly warn "A green status in the run list
      ... does not mean the task in your prompt succeeded."
    why_it_matters: >-
      The top-ranked hypothesis was screened against two of nine-plus substitutes, and the
      scorecard's H2 differentiation statement ("independent verification materially
      outperforms current coding agents") is too vague given that approval-before-merge and a
      bundled second-opinion review are already advertised by the incumbent. The issue-to-PR
      layer is commoditized at USD 20 per user per month; H2's only defensible wedge is the
      verification/evidence layer, which is exactly A-005/D-007 and is untested. That must be
      written into the H2 hypothesis and falsifier or the H2 interviews will test the wrong
      thing. H2 current_workaround_gap could legitimately be 1 (H2 75.8), which is another
      reason the top-two order is not robust. This finding cuts both ways: it does not rescue
      H1, it sharpens what an H2 test must show.
    required_fix: >-
      (a) Add the omitted first-party issue-to-PR and AI-review sources to SOURCE_LEDGER.csv and
      the evidence file, with quoted capability statements, plan/pricing statements where
      displayed, and UTC access times; mark SRC-065 as migrated (see F-S1-001-10). (b) Rewrite
      the H2 hypothesis, differentiator and falsifier so the test is: does an independently
      verified completion-evidence bundle (reproduction, tests, review findings, external-state
      readback) change a real merge or delegation decision versus the incumbent's session log
      and second-opinion review; (c) re-score H2 current_workaround_gap with a written basis.
    verification_method: "Verifier re-opens the added sources, confirms quotes, and checks that the H2 brief and counter-hypothesis rule name the verification layer as the only tested differentiator."

