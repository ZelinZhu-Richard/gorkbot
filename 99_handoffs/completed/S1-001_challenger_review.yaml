    why_it_matters: "A weekly scheduled cadence is a product design, not an observed trigger; if the real trigger is event-driven (a lost deal, a customer mentioning a competitor's price), the scheduled ledger is the wrong shape and the frequency score and gate threshold are testing different things. The owner ambiguity also weakens the recruiting screen."
    required_fix: "State the hypothesized trigger type (scheduled vs event-driven) and the single owner role per interview, align the A-014 frequency, the product cadence and the gate threshold, and add an interview probe that distinguishes scheduled review from event-triggered lookup. Lower workflow_frequency to 3 or justify 4 in the basis column."
    verification_method: "Verifier checks A-014, the contract trigger and gate item 1 use one consistent frequency and that the interview procedure probes trigger type."

