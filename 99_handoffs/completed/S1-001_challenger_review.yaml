  criterion_level_h2_minus_h1:
    pain_urgency: "+2.2 (H2 4 vs H1 3, w11)"
    current_workaround_gap: "-1.0 (2 vs 3, w5)"
    workflow_frequency: "+1.4 (5 vs 4, w7)"
    economic_value: "+3.2 (5 vs 3, w8)"
    cost_of_failure: "+1.0 (4 vs 3, w5)"
