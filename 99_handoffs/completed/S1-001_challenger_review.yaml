# ---------------------------------------------------------------------------
# 3. Hypothesis-set check (every hypothesis)
# ---------------------------------------------------------------------------
hypothesis_set_review:
  legend: "Cells: OK / WEAK / UNKNOWN; flags per review brief; all demand-side cells are author judgment with zero customer evidence"
  H1:
    segment_specific: "OK (3–30 B2B SaaS, 5–15 competitors, no CI analyst) but the buyer spans three roles (F-S1-001-09)"
    workflow_specific: "OK (weekly official-source change ledger + memo + approval-gated master-record update)"
    trigger_identifiable: "WEAK — scheduled cadence assumed; real trigger likely event-driven (F-S1-001-09)"
    workaround_accurate: "WEAK — misses SMB change monitors and scheduled-assistant routines (F-S1-001-01)"
    frequency_plausible: "UNKNOWN — monthly hypothesized, weekly designed"
    pain_plausible: "WEAK-TO-UNKNOWN — consequence of doing nothing is diffuse; no revenue link stated"
    completion_verifiable: "OK — diff vs snapshot, schema checks, readback"
    delegable: "OK — read-only public research"
    failure_cost: "LOW for read-only output; the only consequential step is the added master-record write"
    permissions_integrations: "EASY — public fetch, files, spreadsheet"
    acquisition: "UNKNOWN — PMM/head-of-product buyer is not the D-006 founder network"
    prototype_speed: "FAST"
    expansion_credible: "WEAK — research-product expansion; does not exercise the persistent-agent runtime (F-S1-001-04)"
    already_well_served: "YES at the diff/alert/importance/digest layer (Visualping, PageCrawl, Competiflow, Crayon); residual = cited cross-competitor memo + approval-gated record update"
    more_than_llm_interface: "MARGINAL — incumbents already bundle AI summaries; the residual is a workflow wrapper"
    flags: [weakly_differentiated, unlikely_willingness_to_pay_unverified, vendor_feature_exposed, solution_first_partial]
  H2:
    segment_specific: "OK (technical founder / eng lead, 2–20 developers, GitHub)"
    workflow_specific: "OK (bounded issue → reproduced → tested → reviewed → PR held for approval)"
    trigger_identifiable: "OK — issue triage"
    workaround_accurate: "WEAK — two of ≥9 first-party agents cited (F-S1-001-03)"
    frequency_plausible: "OK — per-issue"
    pain_plausible: "OK as a job; residual unsolved pain is the verification burden, not the coding"
    completion_verifiable: "OK — tests, reproduction, CI"
    delegable: "OK — market already delegates (Copilot cloud agent, Codex, Claude Code, Cursor, Devin, Jules)"
    failure_cost: "MEDIUM — bad PR caught at review; write access is the sensitivity"
    permissions_integrations: "MEDIUM — repo, sandbox, CI, secrets"
    acquisition: "PLAUSIBLE via D-006 network; unverified"
    prototype_speed: "MEDIUM — environment reproduction"
    expansion_credible: "STRONG — exercises terminal, tests, long-running execution, approval interception"
    already_well_served: "YES at the issue→PR layer, with approval-before-merge and bundled review already advertised by GitHub; NO shipped independently verified evidence bundle found"
    more_than_llm_interface: "ONLY IF the verification layer is the product"
    flags: [weakly_differentiated_unless_verification_layer, heavy_competitive_pressure, dependent_on_unverified_capability_reproduce_first]
  H3:
    summary: "Segment and job OK; Hex + notebooks are strong substitutes; data sensitivity (security 2) is the gating risk; reach 3 unverified. Scores appear internally consistent; demand-only ranking 3rd. Flags: dependent on safe fixture access; differentiation weak."
  H4:
    summary: "Dovetail covers evidence-linked synthesis and PII controls; sensitivity high; differentiation 2 justified. Flags: weakly differentiated; poor early-stage match because of PII/consent."
  H5:
    summary: "Elicit covers reports, screening, alerts, sentence-level citations and (live page) a new 'Elicit Research Agent'; budgets and procurement unknown; differentiation 2 justified. Flags: weakly differentiated; slow sales cycle."
  H6:
    summary: "Coding agents + Vercel previews (live page adds fork-PR deployment authorization) cover the job; differentiation 2 justified; reach 4 unverified. Flags: weakly differentiated; solution-first."
  H7:
    summary: "Strongest demand-side profile (pain 4, frequency 5, value 4, failure 4) and most runtime-exercising; held down by feasibility 2/2 per R-006 and Power Automate's documented failure modes; buyer and vertical undefined. Flags: too broad (no vertical), dependent on unverified browser reliability, services-heavy setup risk. Should not lose its first-wave quota."

# ---------------------------------------------------------------------------
# 4. H1 / H2 assessments and strategic stress test
# ---------------------------------------------------------------------------
h1_assessment: >-
  NOT JUSTIFIED AS SOLE PROVISIONAL BEACHHEAD; ACCEPTABLE AS ONE OF TWO CO-EQUAL DISCOVERY
  CANDIDATES. Exact job delegated: weekly diff of allowlisted competitor pages into a ledger,
  memo and held spreadsheet update. Owner: nobody in particular at 3–30 people (founder, head
  of product or PMM, ad hoc). Frequency: hypothesized monthly, designed weekly, unobserved.
  Do nothing: usually nothing happens until a deal or launch surfaces the gap; consequence is
  diffuse and the author scores it 3. Current tools: manual checks, Google Alerts, ChatGPT/
  Perplexity ad hoc, and — omitted by the author — USD 13–99/month change monitors that already
  deliver diffs, timestamps, source URLs, AI importance scores, weekly digests and Slack/Sheets
  (Visualping, PageCrawl, Competiflow, ChangeTower, Competitors.app), plus Crayon's "before and
  after" page changes and scheduled-assistant routines. Verification-first: low stakes for a
  read-only research output (the cost of an unverified claim is a click to the page); it
  matters when actions are taken, which this job barely has. Revenue tie: indirect (positioning,
  pricing). Must-have vs interesting: interesting information product unless interviews show a
  recurring decision that depends on it. Persistent agent improvement: marginal over monitor +
  LLM summary; background continuation and interruption are not needed. Expansion: toward an
  operating-intelligence research teammate, not toward the verified-action platform.
  Incumbent reproduction: trivial (Visualping already exposes custom importance prompts and an
  MCP/API; Crayon has importance scoring and digests). Disconfirming evidence found: the
  substitute field above; A-015 partly pre-falsified. What would rescue H1: interviews showing
  a recurring decision (pricing/positioning/sales battlecard) that is actually blocked on a
  trustworthy cross-competitor delta, dissatisfaction with the named monitors for a stated
  reason, and written willingness to pay above their price points.
h2_assessment: >-
  SCORE NOT MATERIALLY INFLATED ON THE DEMAND SIDE, BUT BUILT ON A THIN SUBSTITUTE SCREEN.
  H2's lead comes from pain/frequency/value/failure-cost judgments that are plausible for the
  job; its gap=2/differentiation=2 are directionally honest and, with the fuller field, could
  be 1/2. The issue→PR layer is commoditized at USD 20 per user per month and GitHub already
  advertises human-only merge, no self-approval, an Actions approval gate, scheduled runs and a
  bundled second-opinion review; Claude Code, Cursor, Devin, Jules, GitLab, Kiro and OpenHands
  add more. What no official page shows: a reproduce-first guarantee or an independently
  verified completion-evidence bundle attached to the PR, and Claude Code's own routines docs
  warn green status is not task success — so the verification layer is genuinely open and is
  the only thing H2 can test. D-011's departure from the score is documented but its stated
  reasons are double-counted or preference (F-S1-001-02); the legitimate version of the
  argument is "H1 is cheaper to concierge first", which is a sequencing convenience, not a
  beachhead selection. Evidence that would distinguish H1 from H2: per-interview proportions
  of (a) recent repeated job with artifact, (b) stated dissatisfaction with the named
  incumbent, (c) written pilot commitment with repo/watchlist access, (d) written price
  acceptance — under symmetric gates.
strategic_stress_test:
  H1: {urgency: "LOW-UNKNOWN", frequency: "monthly-weekly UNKNOWN", value: "indirect", delegability: "HIGH", verification: "HIGH but low-stakes", distribution: "UNKNOWN (PMM buyer ≠ founder network)", prototypeability: "HIGH", competitive_pressure: "HIGH (SMB monitors + CI suites + assistant routines)", expansion: "WEAK toward platform", defensibility: "LOW (custom-prompt importance filters and MCP already exposed by incumbents)"}
  H2: {urgency: "MEDIUM-HIGH for the job, residual = verification burden", frequency: "per issue", value: "developer time", delegability: "HIGH (observed in market)", verification: "HIGH and high-stakes", distribution: "PLAUSIBLE via D-006 network, unverified", prototypeability: "MEDIUM", competitive_pressure: "VERY HIGH at the coding layer; OPEN at the evidence-bundle layer", expansion: "STRONG", defensibility: "POSSIBLE via reproduction/evaluation data and workflow integration; unproven"}
  H7: {urgency: "potentially HIGH", frequency: "HIGH", value: "HIGH", delegability: "MEDIUM (credentials)", verification: "HIGH (readback)", distribution: "UNKNOWN — no vertical", prototypeability: "LOW (R-006)", competitive_pressure: "MEDIUM (RPA)", expansion: "STRONG", defensibility: "POSSIBLE per vertical"}
  H3: {urgency: "MEDIUM", frequency: "recurring", value: "MEDIUM-HIGH", delegability: "MEDIUM (data sensitivity)", verification: "HIGH (re-run)", distribution: "UNKNOWN", prototypeability: "MEDIUM-HIGH on fixtures", competitive_pressure: "HIGH (Hex, notebooks)", expansion: "MEDIUM", defensibility: "LOW"}

