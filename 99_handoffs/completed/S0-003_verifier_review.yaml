new_findings:
  - finding_id: V-S0-003-01
    severity: MEDIUM
    status: OPEN
    requirement: "Registry claim_status contract ('VERIFIED_PUBLIC: Current first-party public source directly supports the claim'); AGENTS.md 'Use current primary sources'; Stage 0 gate 'consequential product claims are sourced or labeled'; review brief 'no unsupported claims introduced'; MASTER 'Record exact model version'."
    file_or_component: "01_governance/MODEL_REGISTRY.yaml models[anthropic_claude_opus_5] release_context (line 455) and public_specs.reliable_knowledge_cutoff (line 460)"
    evidence: "(a) release_context: {claim_status: VERIFIED_PUBLIC, public_api_availability: \"2026-05-21\"} — the entry's source_ids (SRC-021, 022, 046, 047, 048, 049) and all 39 fetched S0-003 pages contain no 'May 21' / '2026-05-21' statement; a repository-wide grep finds the date only on this registry line; the challenger review does not mention it. (b) reliable_knowledge_cutoff: \"2026-01-31\" — live SRC-021 (2026-08-22T11:54:00Z) model table row 'Reliable knowledge cutoff' reads Jan 2026 (Fable 5) | May 2026 (Opus 5) | Jan 2026 (Sonnet 5) | Feb 2025 (Haiku 4.5), and 'Training data cutoff' May 2026 for Opus 5. Whether (b) is a transcription slip from the adjacent Fable column or post-access drift could not be established (the 2026-08-22T01:25Z archive capture is a client-rendered shell); either way the VERIFIED_PUBLIC value does not match the current primary page."
    consequence: "Two VERIFIED_PUBLIC values in a newly added candidate are not supported by the cited sources; the registry's label discipline, which is the task's core purpose, is breached for that entry and the required primary-source verification test is PARTIAL. No price, access, role, risk or plan consequence."
    correction: "Set claude-opus-5 reliable_knowledge_cutoff to the source value at month precision (\"2026-05\") or, if the page has changed again, to the value read on the fix date; for public_api_availability either add a ledgered current first-party page that states the Opus 5 availability date and cite it, or remove the field / set it to UNKNOWN. Re-stamp source_accessed_at_utc for the entry."
    verification_method: "grep -n 'public_api_availability\\|reliable_knowledge_cutoff' 01_governance/MODEL_REGISTRY.yaml; reopen https://platform.claude.com/docs/en/about-claude/models/overview.md and compare the Opus 5 column; if a date is kept, ruby -rcsv confirms the new source row and grep finds the date on the fetched page."
  - finding_id: V-S0-003-02
    severity: LOW
    status: OPEN
    requirement: "Same label contract as V-S0-003-01; MASTER 'Do not invent ... model capabilities'."
    file_or_component: "01_governance/MODEL_REGISTRY.yaml models[anthropic_claude_fable_5] public_specs.thinking (line 414)"
    evidence: "The value states that 'Manual effort budget, disabling thinking, non-default temperature/top_p/top_k, assistant-prefill, and an insufficient prompt-cache minimum can produce documented HTTP 400 errors.' SRC-023 documents 400 for budget_tokens, thinking disabled, prefill and non-default sampling parameters, but documents the 512-token minimum only as 'The minimum cacheable prompt length ... is 512 tokens' (prompts below it are not cached); no cited page documents a 400 for it."
    consequence: "One unsupported clause inside an otherwise source-backed field; would mislead a harness author into expecting an error that is not documented."
    correction: "Delete 'and an insufficient prompt-cache minimum' from the 400-error list (the 512-token minimum is already recorded separately as prompt_cache_minimum_tokens), or cite a current primary page that documents the error."
    verification_method: "grep -n 'insufficient prompt-cache' 01_governance/MODEL_REGISTRY.yaml returns nothing, or the cited page text contains the 400 statement."
  - finding_id: V-S0-003-03
    severity: LOW
    status: OPEN
    requirement: "Label discipline: recorded precision must not exceed the source."
    file_or_component: "01_governance/MODEL_REGISTRY.yaml reliable_knowledge_cutoff for claude-fable-5 (\"2026-01-31\", line 412), claude-sonnet-5 (\"2026-01-31\", line 493), claude-haiku-4-5 (\"2025-02-28\", line 527)"
    evidence: "SRC-021 states month-level values ('Jan 2026', 'Feb 2025'); the pre-fix registry recorded Fable 5 as \"2026-01\"; the fixer rendered these as end-of-month dates, asserting a day the source does not give."
    consequence: "Cosmetic over-precision; could be read as a documented day."
    correction: "Record month precision (\"2026-01\", \"2025-02\") or add an explicit note that the day is a rendering convention."
    verification_method: "grep -n 'reliable_knowledge_cutoff' 01_governance/MODEL_REGISTRY.yaml shows month-precision values or a stated convention."
