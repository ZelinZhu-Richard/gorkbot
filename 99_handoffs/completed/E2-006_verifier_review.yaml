no_hidden_hybrid:
  comparison_basis: "Baseline section 2 shape and sections 3-11 compared property-by-property with verified C01 f02 (lifetimes), f03 (client), f04 (process boundaries incl. protected_delivery_path and no_live_owner_semantics), f05 (TB-01..20), f06 (state ownership), f07 (operation model), f08 (persistence incl. transactional_authority_scope), f09 (recovery), f10 (workspace/isolation Tier 2), f12 (approval/effect), f13 (provider), f14 (context), f15/f16 (evidence/verifier), f18 (security control ownership), f19 (packaging), f20 (future compatibility), f28 (migration), f29 (Level B); and against C02 f02/f04/f06/f08 (persistent control service, leased/fenced replaceable workers, service store) and C03 f02/f04/f06/f08 (journal append gate, deterministic normative reducer, replaceable coordinator)."
