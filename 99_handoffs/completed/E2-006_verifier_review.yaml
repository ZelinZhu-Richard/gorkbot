  E3V-005 +003/005; E3V-006 +001/008; E3V-007 +002/009), 0 linked ARs lack an owner, and the
  sets are equal across 75 representations in the baseline, E3 register, nine ADRs, both
  handoffs, PROJECT_STATE and TASK_REGISTRY. (7) Recovery (25 REC rows x 12 non-empty cells with
  authoritative source, readback, action, ambiguity class, evidence, owner/escalation,
  invalidation, dispositions, ADR, AR and E3/E4 links, plus the 7 C01 f09 partial-filesystem
  subcases with no global-transaction claim), security (20 TB rows cell-equal to verified C01 f05
