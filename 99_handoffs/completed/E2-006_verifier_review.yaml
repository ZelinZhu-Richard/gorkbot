  hard_gate: "Recomputed from the verified matrix: C01, C02, C03 each 59 hard = 57 CONFIRMED_SATISFIED_FOR_COMPARISON + 2 ARCHITECTURE_SEAM_CONFIRMED_E3_VALIDATION_OUTSTANDING (AR-EXE-003 -> E3V-002; AR-SEC-006 -> E3V-006) + 0 blocking + 0 violated; result vocabulary contains no blocking/violated value; the seams are identical across candidates (same host process primitive and unselected client surface), so no candidate carries a hidden hard violation and no comparison evidence changed (candidate/matrix/closure SHA-256 pins reproduce; E2-003/E2-004 artifacts byte-identical)."
  weights_and_scores: "Zero numeric weights, scores, ranks or additive counts in the baseline, ADRs, E3 register, handoffs or governance; every weight/score/rank token is a negation or disclaimer; six preferences appear once each with C01/C02/C03 columns and the verified comparison section 3 no-double-count rule; E2U-PREFERENCE-WEIGHTS remains DEFERRED_BY_POLICY with no value."
  decision_rule: "Ordered, transparent, applied once: (1) non-compensating hard tie (requirements section 5; comparison sections 3-4); (2) D-016 REQUIRED_NOW local-first single-user scope with the explicit statement that D-016 alone does not distinguish three local-first candidates (charter section 19; DECISION_LOG D-016); (3) present-structure proportionality sourced to E2 plan section 15 second bullet ('speculative ... machinery that increases v0.1 complexity without satisfying a current E1 requirement'), AR-PRF-002 ('fewer independent failure/upgrade/operational surfaces and clearer component ownership') and AR-PRF-004 rationale ('v0.1 must not absorb unnecessary distributed-system complexity'); (4) applied to mandatory present structure (C02 persistent service/IPC/auth/lease-fence lifecycle; C03 event identity/order/evolution/reducer/checkpoint/projection model) rather than to process count, with contributor accessibility taken from comparison sections 5 ('not inferred from component count'), 13 and 17.2; (5) future evolution retained as a real preference and reopen surface; (6) missing E3 evidence given no favorable reading. Independently re-applying the rule to C02 and C03 reproduces their recorded 'analytically viable, not proposed' dispositions; another reasonable unweighted precedence (privileging profiles B, C or G) could propose C03 or C02, which the baseline states and preserves as reopen triggers, so the proposal is defensible as best fit for current verified scope without claiming uniqueness or universal superiority."
  process_count_not_the_reason: "Baseline section 17 disclaims 'fewer components' as justification; section 1 item 4 assesses contributor burden from the verified comparison rather than process count; C01 broad-core coupling, largest failure blast radius (comparison section 8 core-loss row), costlier extraction (D22, section 13, profile C) and foundational transactional state/history/effect semantics are stated in baseline sections 1.1/1.2/1.6/17 and the ADR-001/002/003/005/009 negative consequences."
  c02_c03_fairness: "C02 strengths (clearest direct remote-worker seam; replaceable leased/fenced workers; worker fault isolation; explicit subsystem boundaries) and C03 strengths (strongest causal replay/reconstruction; deterministic reducer fixtures; coordinator may be absent) are quoted from comparison sections 5/13/17.1/17.2 without strawman language; reasons for not proposing trace to comparison sections 5, 9, 13 and profiles B/C; reopen conditions and migration statements are explicit in baseline section 1.1 and every ADR."
  sensitivity_profiles: "All seven verified profiles A-G re-read against comparison section 17.2 row text: A supports C01 minimal topology (C03 also avoids a service); B favors C03 replay and is preserved as a reopen trigger; C favors C02/C03 and counts against C01; D limited to C01's setup-topology sub-dimension with no candidate-wide contributor winner (matches row D 'no single advantage spans all dimensions'); E and F no stable candidate-wide winner; G no overall winner. No profile is treated as an overall winner or hidden weight."
