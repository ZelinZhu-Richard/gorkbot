verdict_rationale: >-
  Re-derived from the frozen E1 baseline and the verified E2-001..E2-004 artifacts rather than
  from the E2-005 author, challenger, fixer, or task-verifier summaries: (1) the C01 proposal is
  independently defensible - all three candidates recompute from the verified 195-cell matrix as
  59 hard = 57 CONFIRMED_SATISFIED_FOR_COMPARISON + 2 ARCHITECTURE_SEAM_CONFIRMED_E3_VALIDATION_
  OUTSTANDING (AR-EXE-003 -> E3V-002, AR-SEC-006 -> E3V-006) + 0 blocking + 0 violated, so the hard
  gate is a genuine non-compensating tie; the tie-break is an explicit, ordered, non-numeric rule
  (D-016 REQUIRED_NOW scope; E2 plan section 15 plus verified AR-PRF-002/AR-PRF-004 rationale;
  comparison sections 5/13/17.2 for contributor and sensitivity evidence) applied once, with C02's
  direct remote-worker seam and C03's causal replay preserved as explicit reopen triggers, all
  seven sensitivity profiles acknowledged without an overall winner, and C01's broad-core
  coupling, crash radius, foundational state/history/effect semantics and later extraction cost
  stated rather than understated. (2) The baseline is verified EP-ARCH-C01 unchanged, property by
  property against C01 f02-f30 and against the C02/C03 shapes: task-bound integrated authoritative
  core, detachable non-authoritative client, owned child-process supervisor, embedded transactional
  current state plus append-only material history and outbox/effect ledgers, capability/approval/
  effect gateway, co-resident protected-entry controller, embedded provider-neutral gateway,
  separate least-privilege verifier path; no mandatory permanent daemon, no replaceable
  leased/fenced worker plane, no journal/reducer authority, no hidden C04. (3) Coverage
  recomputes exactly: 127 frozen E1 IDs (56/15/9/4/4/16/23) -> 65 ARs (59 hard / 6 preferences)
  -> nine ADRs with every AR assigned exactly once in baseline section 13 and every ADR primary
  line set-equal to it; every hard AR resolves to ARCHITECTURE_CONFIRMED (57) or
  E3_VALIDATION_OUTSTANDING (2) with 0 VIOLATED and 0 UNMAPPED; the eight SLO/MET rows are
  JUSTIFIED_NON_ARCHITECTURE_DRIVING with their measurement seams owned by ADR-E2-008 under
  E3V-007 and no waiver; all 25 domains resolve to ADR owners through primary or cross-cutting
  lists. (4) The two E3-outstanding hard requirements are nowhere claimed proven: the baseline,
  ADR-E2-004/005, and the E3 register keep host descendant containment/force feasibility and
  protected acquisition/delivery unselected, unvalidated, fail-closed (blocked/fenced;
  WAITING_FOR_USER), and handback-linked. (5) Exactly nine ADRs exist with uniform 17-section
