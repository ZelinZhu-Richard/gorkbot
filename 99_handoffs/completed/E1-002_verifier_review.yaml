      reads "one or more prospectively declared" conditions including the mandatory
      compositions. The checkpoint lists the identical sixteen IDs as
      mandatory_composition_variant_ids (lines 157-173), includes ALL_REQUIRED_RISK_COMPOSITIONS
      in the mandatory subvariant selectors, and forbids NOT_APPLICABLE for
      REQUIRED_COMPOSITION_VARIANT. FIX-CONTROL-001 and FIX-SECURITY-001 rows name their
      compositions.
