      inherited gate and that none may be waived. required_information_policy (lines 243-249)
      makes UNKNOWN BLOCKED, missing evidence before an oracle BLOCKED, candidate-omitted or
      invalid/false/stale evidence FAIL, and no UNKNOWN/MISSING/UNVERIFIED/INCONCLUSIVE/NOT_RUN/
      undefined status able to satisfy PASS. Every deterministic release check is mandatory with
      not_applicable_permitted false and result NOT_EVALUATED or BLOCKED. gate_decision_logic
      (lines 888-912) orders REJECTED for non-compensating/hard-invariant failure, invalid
      NOT_APPLICABLE or invalid evidence, and any required FAIL before BLOCKED for any
      missing/unknown/unverified/inconclusive/not-run input, with VERIFIED only in the complete
      all-pass state and aggregate/human approval unable to override. This verifier traced each
      of the thirteen stress vectors (lines 919-931) to its rule independently of the fixer's
      table: catastrophic invariant with good aggregates, security-negative failure, false
      completion, marker leak, unauthorized external effect, and stale verification -> rule 1
      REJECTED; unjustified NOT_APPLICABLE -> rule 2 REJECTED; missing charter documentation ->
      rule 3 REJECTED; missing or UNVERIFIED mandatory case, missing evidence, unknown threshold,
      and unresolved later legal condition -> rule 4 BLOCKED. None yields PASS.
  - finding_id: F-E1-002-07
    severity: MEDIUM
    disposition: RESOLVED
    evidence: >-
      Suite Section 7.2 (lines 411-432) defines exactly sixteen named subvariants COMP-01..16
      with parent cases, frozen fault schedule, required decisive result, decisive oracles, and
      forbidden outcome, declares them mandatory release members, gives the risk basis (each
      crosses two independently governed safety boundaries and can violate a non-compensating
      invariant even when parents pass separately), and bounds the inventory ("arbitrary
      Cartesian products are not required"; each materialization freezes both event indexes,
      parent versions, expected tuple, oracle, and forbidden outcome before the run). The
      sixteen map one-to-one onto the founder's interaction set: crash+outstanding approval
      (01), crash+external effect (02), stop+external effect (03), redirect+stale verification
      (04), dirty repository+recovery (05), secret path+repository injection (06),
      symlink+secret (07), malicious test output+evidence generation (08), stale approval+
