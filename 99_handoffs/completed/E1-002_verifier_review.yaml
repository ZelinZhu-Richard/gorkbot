original_finding_dispositions:
  - finding_id: F-E1-002-01
    severity: HIGH
    disposition: RESOLVED
    evidence: >-
      Suite Section 3 (line 44) makes the explicit case-row requirement tokens after range
      expansion "the sole canonical case-coverage edges"; Section 7 (lines 381-392) defines the
      disjoint C(r) domain for the 119 FR/RR/FC/UF/NEG IDs and P(r) for the 8 SLO/MET IDs,
      states that the checkpoint coverage.requirement_dispositions "is a stored mechanically
      checked projection, not a second authority", and requires set equality with symmetric
      differences, unresolved references, empty targets, ungoverned dispositions, or
      secondary-map-only edges failing validation. Checkpoint coverage.traceability_model
      (lines 1168-1191) records secondary_map_normative false, projection_set_equality_required
      true, population_case_ids_are_feeder_membership_not_trace_edges true, and the range
      expansion rule. This verifier recomputed C(r) from the 170 rows (34 ranges expanded,
      risk tokens excluded): 701 distinct requirement->case edges over exactly the 119
      case-backed IDs, zero SLO/MET row edges, every token resolving to a canonical ID; the
      checkpoint projection (lines 1192-2081) has 127 keys set-equal to the canonical IDs, 701
      case edges and 8 protocol edges, zero checkpoint-only edges, zero catalog-only edges,
      protocol_ids exactly [PROT-<id>] for each SLO/MET and empty for every case-backed ID,
      and every disposition one of the four typed values with implementation_status
      SPECIFIED_NOT_IMPLEMENTED and run_status NOT_RUN. The stored counts block equals the
      recomputation. The 57-key disagreement, 256 checkpoint-only edges, and 44 row-only edges
      the challenger measured no longer exist. Coverage is never claimed from checkpoint
      membership alone, and each SLO/MET ID binds to one keyed protocol with OR-METRIC-PROTOCOL.
      The fixer resolved the disagreement by making rows canonical and dropping unasserted
      checkpoint-only edges rather than adding them to rows (e.g., RR-007 now has 13 asserting
      cases instead of 43 projected ones); that is the truthful choice and every affected
      requirement retains adequate case coverage.
  - finding_id: F-E1-002-02
    severity: MEDIUM
    disposition: RESOLVED
    evidence: >-
      Suite Section 5.1 (lines 129-143) freezes a hidden harness obligation graph (requested
      behavior, entrypoint, expected transition, changed-path reachability probe, integration
      boundary, mutation-sensitivity probe, expected adequacy verdict) before candidate
      execution for EP-FALSE-003, EP-FALSE-006, and EP-NEG-VER-02, declares harness ground
      truth the deterministic authority, confines OR-BOUNDED-RUBRIC to residual semantic
      mapping the manifest cannot decide, and states that "the model says adequate" has no
      evidentiary weight. Nine variants VER-ADQ-01..09 each carry fixture state, requested
      behavior, intentionally insufficient predicate, expected adequacy outcome, required
      evidence/oracle, and forbidden false pass: relevant path with reachability/mutation
      witness (01), passing test that never reaches the modified path (02), irrelevant suite
      (03), lint/build only (04), dead/unused file (05), snapshot only (06), mock hiding a
      broken integration (07), wrong component (08), and no deterministic test with
      INADEQUATE/INCONCLUSIVE and never completion (09). The checkpoint lists the same nine IDs
      as mandatory_predicate_adequacy_variant_ids (lines 147-156) and forbids NOT_APPLICABLE
      for FALSE_COMPLETION_VARIANT. The FIX-VERIFY-001 row (line 122) names the variants and
      the hidden obligation graph; the OR-BOUNDED-RUBRIC row (line 94) now states it cannot
      establish "predicate adequacy where harness-held ground truth decides the question";
      Section 9 (line 485) says deterministic ground truth and failures always dominate
      judgment; R-002 mitigation names the fixture-authored ground-truth classes. Judgment is
      used only where deterministic ground truth is genuinely insufficient (VER-ADQ-09 and
      FR-061 clarity).
