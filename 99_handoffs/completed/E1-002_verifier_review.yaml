      scored_block_oracle: OR-METRIC-PROTOCOL, and each evidence_source list ends with
      OR-METRIC-PROTOCOL. Suite Section 7 (line 390) states oracle usage is the union of catalog
      and protocol references and that OR-METRIC-PROTOCOL is intentionally bound to all eight
