      list is set-equal to the 18 suite definitions.
  - finding_id: F-E1-002-09
    severity: LOW
    disposition: RESOLVED
    evidence: >-
      Suite Section 7.3 (lines 434-438) classifies every scored evaluation task HIGH risk for
      verification independence until a versioned, independently verified policy establishes
      otherwise, grants no same-model/configuration credit under the unresolved low-risk
      exception, requires risk_class, versioned correction_ceiling_ref, correction_ceiling_owner,
