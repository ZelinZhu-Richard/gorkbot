  admission_expiry: "No invented calendar TTL. Any material change to the policy/schema, verified task/protocol/harness, exact configuration/scope/route, QPA, budget/account/credential, data/region/network/effect, isolation/security, architecture/ADR, evidence/contamination, provider version, support scope, or consumed single-use PASS requires a new freeze and manifest; prior PASS plus drift is EXPIRED_REQUIRES_REFREEZE, while missing authority without a prior PASS is DO_NOT_RUN."
  budget_policy: "NO_COST_LOCAL_VALIDATION and PAID_EXTERNAL_VALIDATION are distinct, but both require the full gate. Local admission binds prospectively approved finite time/output/process/disk/network/cost limits. Paid validation remains NOT_AUTHORIZED with USD 0; any future paid block requires an exact current Founder authorization for provider/account, purpose, configurations, per-run/protocol/stage caps, repetitions and corrections, data/credential/network scope, stop threshold, actor, and provenance."
  credential_policy: "Governance and ordinary evidence may contain only opaque nonsecret references and redacted metadata, never raw credentials. Any future use requires an exact provider/account scope, least privilege, protected entry where applicable, current validity/revocation and recipient checks, disabled ambient inheritance, capture-surface exclusion, no model-context or fixture copying, and fail-closed admission. Current dependency is UNKNOWN_OR_NOT_AUTHORIZED and no credential was accessed."
  s0_005_reconciliation: "Historical provider account, entitlement, billing/quota, token/credential availability, and external-service accessibility remain UNKNOWN_OR_NOT_AUTHORIZED. Protocol drafting may proceed without resolving them, but every dependent real-provider or paid run remains DO_NOT_RUN until exact current evidence and authorization exist; no Stage 0 work is reopened by E3-001."
  data_fixture_policy: "Default admissible classes are SYNTHETIC, REPOSITORY_OWNED, PUBLIC_OPEN_WITH_RIGHTS, and CLEAN_ROOM_DERIVED with exact provenance, rights, region, retention, privacy, and training-use facts. Private customer discovery/interviews, proprietary or reconstructed Grok Bot source, real secrets/credentials, and unauthorized personal/private data are prohibited; RESTRICTED is currently DO_NOT_RUN. E3V-002 uses safe synthetic process fixtures and E3V-006 uses synthetic protected markers only."
  network_and_external_effect_policy: "NETWORK_READ and REMOTE_SIDE_EFFECT are separate dimensions. The local lane is offline with zero consequential external effect. Any future egress needs an exact allowlist, bounds, redirects, destinations, data classes, account/credential and authority; any remote mutation additionally needs an indispensable frozen-question basis, exact target/action/idempotency/reconciliation/rollback contract, and specific authorization. Git push, PR/branch mutation, arbitrary upload, webhook, account change, or other unapproved effect remains forbidden."
  raw_evidence_policy: "RAW_RUN_EVIDENCE is append-only, immutable, integrity-checked, and separately addressed from analysis and decisions. It retains every failed, inconclusive, retried, rerun, corrected, excluded, stopped, and hard-failure attempt with stable IDs, exact protocol/configuration/environment/input/tool/provider provenance, outputs or protected references, timing, usage/cost, stop reason, and integrity state. Amendments preserve the original and record reason, actor, time, impact, and recomputation scope."
  derived_analysis_policy: "DERIVED_ANALYSIS references immutable raw evidence and a prospectively frozen analysis/exclusion/denominator rule. It may compute scoped correctness, reliability, cost/latency, role outcomes, and failure classes, but may not overwrite raw evidence, omit unfavorable attempts, invent missing facts, move criteria after results, or generalize beyond tested scope."
  eligibility_decision_policy: "ELIGIBILITY_DECISION is a distinct versioned layer keyed by exact configuration, logical role, task class/scope, and protocol version. Admission PASS and raw or derived results create no eligibility credit or route promotion. E3-007 may only synthesize; E3-008 must independently rederive; VERIFY_STAGE_E3 may establish AUTONOMY_ELIGIBLE only, and separate Founder authorization is still required for AUTONOMOUS_BUILD_AUTHORIZED."
  model_eligibility_vocabulary:
    ELIGIBLE: SATISFIES_ALL_REQUIRED_EVIDENCE_FOR_THE_EXACT_ROLE_CONFIGURATION_TASK_AND_PROTOCOL_SCOPE
    ELIGIBLE_WITH_CONSTRAINTS: ELIGIBLE_ONLY_UNDER_EXPLICIT_RECORDED_BOUNDS
    INELIGIBLE: FAILS_A_REQUIRED_CONDITION_OR_HARD_INVARIANT_FOR_THE_SCOPE
    INCONCLUSIVE: EVIDENCE_IS_INSUFFICIENT_CONFLICTING_OR_INVALID_FOR_A_VERDICT
    NOT_TESTED: NO_QUALIFYING_EVIDENCE_EXISTS
    current_candidate_assignments: NONE
  benchmark_contamination_policy: "Development/smoke and held-out decision partitions remain separate. Held-out bytes, labels, and expected results are unavailable to candidate tuning; grading is blinded and independent where judgment is used. Favorable seed/order selection, selective retry/rerun or omission, post-result exclusion/denominator/threshold changes, and promotion of development or smoke evidence are forbidden and trigger stop, quarantine, and blocked credit."
  retry_semantics: "RETRY is a new attempt ID under the same frozen block/run semantics after an eligible transient operational failure; it preserves the original and consumes the frozen execution-retry and budget reservations. Denials, stale authority, uncertain non-idempotent effects, exhausted limits, and hard failures are not automatically retryable."
  rerun_semantics: "RERUN is a new run ID and new evidence-producing execution under the same frozen protocol/configuration. A scheduled protocol repetition consumes its protocol repetition slot; a same-revision verification-error rerun consumes the affected QPA rerun scope and no protocol repetition slot. The prior run remains evidence and selective failure-only reruns are forbidden."
  correction_semantics: "CORRECTION is a material change before a new execution, requiring exact diff, new affected configuration/protocol/policy version where applicable, a new whole affected block and manifest, and preserved prior evidence. A membership-independent series plus versioned membership snapshot and global stable member registry preserve every overlapping, removed, or re-added case/task ledger; only never-before-seen members initialize state, and each added member needs a prospectively Founder-approved QPA assignment."
  flaky_check_policy: "Mixed ordered outcomes for the same revision/configuration/environment/check are FLAKY. A later pass erases neither the flake nor failure; credit requires the complete prospectively declared deterministic repetition rule, and unresolved mixed or insufficient evidence blocks eligibility."
  hard_failure_policy: "Non-compensating failures include false completion, unauthorized effect, duplicate/unresolved consequential effect, secret/private exposure, scope escape or data loss, approval/admission bypass, stale evidence, hidden fallback, fabricated/deleted/omitted evidence, invalid independence, failure to stop/fence/wait, clean-room violation, and any frozen hard-invariant failure. They immediately stop productive dispatch, quarantine evidence, preserve the record, block the affected tuple, and require independent classification; averages or later passes cannot compensate."
  e3v_admission:
    common: "Every E3V-001..008 block needs exact independently verified task/protocol/harness bindings, current Founder-approved QPA values, exact configuration/tested and unsupported scope, route, budget, credentials, data/region/retention, network/effects, isolation/security, evidence/contamination, stop/currentness, and its exact canonical ADR handback set. E3-001 authoring alone makes none executable."
    E3V-002: "Additionally binds tested host/platform/support scope, safe synthetic process tree, bounded privilege, containment/force/fence/descendant and recovery observations, no destructive real-user workload, stop rules, and ADR-E2-003/004/007 handback; no mechanism is selected or run."
    E3V-006: "Additionally binds exact selected client/configuration and recipient, protected entry, synthetic marker only, unauthorized-surface observations, capture exclusion, exact-recipient/no-replay/fail-to-WAITING_FOR_USER evidence, and ADR-E2-001/004/005/007/008/009 handback; no client implementation is selected or run."
    model_benchmark: "Additionally binds exact configuration/version, logical role, task class, EVALUATION_ONLY route, provider/model/served version, reasoning/tool/context/prompt/fallback policy, verifier separation, budget/credential, benchmark case/oracle set, and hard-failure rules. A family name is insufficient and no candidate is currently assigned or qualified."
  downstream_activation:
    E3-002: BACKLOG_UNTIL_FRESH_INDEPENDENT_E3_001_VERIFICATION
    E3-003: BACKLOG_UNTIL_FRESH_INDEPENDENT_E3_001_VERIFICATION
    E3-004: BACKLOG_UNTIL_BOTH_E3_002_AND_E3_003_ARE_INDEPENDENTLY_VERIFIED
    E3-005: BACKLOG_DO_NOT_RUN
    E3-006: BACKLOG_DO_NOT_RUN
  future_harness_boundary: "Any later E3-004 code is bounded VALIDATION_HARNESS_CODE linked to verified protocols, uses synthetic/open fixtures, receives independent review and deterministic replay where applicable, may not hide application implementation or call a provider without separate admission, and cannot generate accepted empirical evidence before the harness itself is independently VERIFIED. No harness code was written or run in E3-001."
  integrity_model: "One manifest-global, separately versioned integrity profile governs every digest. The pre-decision admission payload excludes both digest fields and the admission decision; the external decision and single-use binding records bind that payload; the final envelope then excludes only its own digest. E3-001 selects no hash, storage, locator, or sealing implementation."
  admission_capture_model: "Every submission is captured once inside the protected boundary before parsing or secret classification under one authenticated trusted preparse context. Ordinary records receive only capability-free, non-dereferenceable, history-independent attestations for the current index entry, slot, preparse context, and universal protected-history screen; protected locators, counters, versions, content-derived tokens, and access handles never cross that boundary. A prior protected match remains secret-boundary rejected under later checker/classifier versions. Capture terminal classes remain separate from the exact three run-admission dispositions."
  attempt_model: "Every INITIAL, RETRY, RERUN, and CORRECTION requires a fresh single-use manifest and independent PASS. Verification reruns project over the current block; deterministic repetition reserves its exact scheduled attempt; a membership-independent correction-series subject binds a versioned per-block membership snapshot; and each global stable scope-member ledger survives removal, readdition, series, group-set, block, manifest, and version changes. Only a never-before-seen member may initialize state. Protocol per-attempt resources bind the exact operation-schedule entry. Typed authoritative attempt-index history, fixed project/stage/task material-fact epochs, and atomic reservations prevent reset or stale-fact launch."
  direct_dispatch_model: "Every DIRECT PASS seals one prospective consumption plan binding the exact launch/final set, attempt-index member, all applicable scopes of the three QPA families, all eight protocol-limit members, budget member, and fallback selector/claim disposition. One external authoritative execution record atomically consumes the launch and every required direct member before process start; a post-record readback rederives the terminal tuple, and partial, mismatched, separate, unknown, or unreceipted transition blocks execution pending reconciliation."
  fallback_model: "Fallback depth is one. Every child is a separately admitted FALLBACK_ONLY manifest with direct dispatch structurally forbidden. Before the parent launch, the system seals only prospective selector, selected-child, parent-transition, child-release, and exact four-branch no-selection plans plus an identifier-only runtime-resolution locator. After actual trigger observations, one authoritative route-resolution execution deterministically applies FIRST_MATCH_IN_FROZEN_ORDER, atomically transitions the parent and selector, consumes at most one selected child, releases every unused child or all children on no-selection, records one receipt, and completes post-record readback before any child process starts. No realized selection, terminal class, receipt, transition, or runtime digest is embedded in a prelaunch plan."
  handback_model: "Admission cannot manufacture an architecture handback. It can truthfully bind a pre-existing independently verified handback, exact canonical ADR set, and stopped lane; ordinary configuration failure remains non-architectural."
