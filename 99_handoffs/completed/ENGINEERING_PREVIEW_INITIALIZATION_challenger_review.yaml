finding_counts: "BLOCKER 0, HIGH 2, MEDIUM 3, LOW 2, NOTE 5"

findings:
  - finding_id: F-E0-01
    severity: HIGH
    requirement: "D-016 fidelity; autonomous build explicitly not yet authorized; E0-001 acceptance criterion 3 (provisional inactive E4 contract explicit and faithful)"
    file_or_component: "03_product/ENGINEERING_PREVIEW_CHARTER.md Section 20 (line 449) and Section 21; 01_governance/PROJECT_STATE.yaml engineering_preview_track.phases.E4.activation_condition (line 133)"
    evidence: >-
      Charter line 449: "D-016 conditionally authorizes the provisional E4 loop after that gate".
      PROJECT_STATE line 133: "D-016 conditionally authorizes the provisional E4 contract at that
      gate". The D-016 text (DECISION_LOG.md, introduced at 334f919, unchanged) contains no
      authorization, conditional or otherwise, of an autonomous build loop, an E4 phase, or a
      Codex-operated implementation queue; grep for autonom/loop/E4/Codex/conditionally returns
      only "bounded autonomous task queues" in the list of capabilities the product "should
      eventually support", and its Consequence section says to "avoid application implementation
      until the Engineering Preview requirements and architecture gates are verified".
    why_it_matters: >-
      This is the only place E0 deviates from D-016, and it deviates on the most consequential
      control in the track. As written, the repository tells a future agent that once E3 is
      independently VERIFIED the founder has already consented to autonomous implementation; no
      further founder decision would be sought. The founder made no such decision. Attributing
      an authorization to a CONFIRMED decision that does not contain it is the same class of
      defect as relabeling deferred customer work as validated.
    required_fix: >-
      Remove the D-016 attribution from charter Section 20 and PROJECT_STATE E4
      activation_condition. State instead that the Section 21 contract is a DESIGN PROPOSAL
      (or PROVISIONAL CONTRACT) drafted by the E0 author, that D-016 lists bounded autonomous
      task queues only as an eventual product capability, and that E4 activation requires (a)
      E3 independently VERIFIED and (b) a separate explicit founder decision recorded in
      DECISION_LOG.md. Mirror the same wording in the handoff decisions_made if the fixer
      updates it.
    verification_method: >-
      grep -n "D-016 conditionally" across the repository returns nothing; charter Section 20/21
      and PROJECT_STATE E4 name a separate founder decision as an activation precondition; D-016
      remains byte-identical.

  - finding_id: F-E0-02
    severity: HIGH
    requirement: "Expected lifecycle E0 AUTHOR → CHALLENGER → FIXER → VERIFIER → E1-001; AGENTS.md 'execute only a task marked READY'; MASTER_OPERATING_PROMPT EXECUTE_TASK rule 2 'confirm dependencies are verified'; internal consistency with E1-002's activation condition"
    file_or_component: "01_governance/TASK_REGISTRY.yaml E1-001 (status READY, dependencies S0-002/S0-003 only, gate_invariant line 965); 01_governance/PROJECT_STATE.yaml current_stage E1 / current_stage_status ACTIVE / ready_task_ids / next_recommended_action; README.md 'next command' block; charter Section 17 last paragraph"
    evidence: >-
      E1-001 is READY with dependencies [S0-002, S0-003] and governance_prerequisites
      [D-016_CONFIRMED, ENGINEERING_PREVIEW_CHARTER_PRESENT]; its files_to_read includes the
      charter, and its deliverables are the charter's items 1–12. E0-001 is READY_FOR_REVIEW and
      unreviewed. E1-002 by contrast is gated on "E1-001 is independently VERIFIED and E0-001 is
      independently VERIFIED". README instructs the next model to run EXECUTE_TASK_E1-001 now.
      Charter Section 17 argues E1-001 may proceed because "E1-001 depends only on verified
      research tasks", which is true only because E0-001 was omitted from its dependency list.
    why_it_matters: >-
      The charter is the governing specification input for E1-001. Releasing E1-001 before the
      charter is challenged and verified means charter defects (F-E0-01, F-E0-03, F-E0-04)
      propagate into the PRD, user flows, and correctness contract, and the fixer/verifier for
      E0 would then be reviewing a document that E1 has already built on. The inconsistency with
      E1-002's gate shows the author recognized the dependency for one task and not the other.
      Allowing parallel authoring may be a legitimate founder choice, but it is a choice the
      founder must record, not one the author may make by omitting a dependency.
    required_fix: >-
      Either (preferred) add E0-001 to E1-001.dependencies, set E1-001 to BACKLOG with
      blocked_by E0_001_NOT_INDEPENDENTLY_VERIFIED, set PROJECT_STATE current_stage to E0 with
      ready_task_ids empty until E0 verifies, and change README's next command to the E0
      review/fix/verify sequence; or, if the founder wants E1-001 authored in parallel, record
      that as an explicit founder decision or scope note in DECISION_LOG.md/PROJECT_STATE and
      add to E1-001 an acceptance criterion that the PRD must be reconciled against the verified
      charter before E1-001 can be verified. In either case make E1-001's gate consistent with
      E1-002's.
    verification_method: >-
      Registry assertion: E1-001 is READY only if every dependency including E0-001 is VERIFIED,
      or a founder decision authorizing parallel authoring is cited in E1-001.readiness_basis;
      README next command matches PROJECT_STATE.next_recommended_action and the sole READY task.

  - finding_id: F-E0-03
    severity: MEDIUM
    requirement: "External audit preserved as INPUT to E1/E2/E3, not architecture mandate; charter must be unambiguous about what E1 may still decide"
    file_or_component: "03_product/ENGINEERING_PREVIEW_CHARTER.md Section 16.2 (lines 338–352) versus Sections 4.4 (line 77), 5.1 (lines 97–100), 5.5 (line 135), 6 (lines 141–150), 6.1 (line 154)"
    evidence: >-
      Section 16.2 says E1/E2 "must evaluate, without automatically adopting" canonical
      conversation state distinct from transcript projection, typed errors, compaction with
      evidence preservation, structured approvals bound to effects, and typed/runtime-validated
      boundaries. Sections 4.4/5.1/5.5/6/6.1 already declare each of these a PRODUCT REQUIREMENT
      or invariant that "may not be collapsed". The same principle is therefore simultaneously
      "open for evaluation" and "required".
    why_it_matters: >-
      An E1 author cannot tell whether canonical-state/projection separation, typed error
      taxonomy, and compaction invariants are settled charter requirements to specify or open
      questions to evaluate and possibly reject. If they are settled, the charter should own
      them as requirements derived from D-016 and MASTER_OPERATING_PROMPT (durable state
      machine, completion standard, security principles) so that the external audit is
      corroboration rather than the source of authority; if they are open, Sections 4.4/6 must
      soften. The current wording lets the audit become de facto architecture authority while
      claiming it is not.
    required_fix: >-
      Add one sentence to Section 16.2 (or Section 6) stating which listed principles are
      charter-level logical requirements independent of the audit (state/projection
      separation, typed errors, compaction invariant, structured approvals, validated
      boundaries, evidence lineage, security-negative testing) and which remain genuinely open
      E2 alternatives (content-addressing, cloud-agent lifecycle mechanics, MCP gateway
      topology, multi-writer mechanics). Keep every requirement at the logical level with no
      technology named.
    verification_method: "Read Sections 4.4, 6, and 16.2 together; no principle should be both 'must evaluate without adopting' and 'PRODUCT REQUIREMENT' without an explicit reconciling statement."

  - finding_id: F-E0-04
    severity: MEDIUM
    requirement: "No permanent Terra/Luna/Sol/Fable/Codex role selected in E0; MASTER_OPERATING_PROMPT 'Do not use model reputation as proof'; E3 must determine which task classes can use which candidates"
    file_or_component: "03_product/ENGINEERING_PREVIEW_CHARTER.md Section 21 line 453"
    evidence: "\"After E3 is independently verified, Codex may repeat the following…\" — the provisional E4 contract names Codex as the autonomous build operator before any E3 benchmark exists, while Section 20 says \"No permanent role is assigned now.\""
    why_it_matters: "Pre-naming the build operator is a role selection in the one place it matters most and contradicts Section 20 and the model registry's 13/13 HYPOTHESIS_ONLY state; it also conflates the human-run authoring surface used so far with the product's future execution model."
    required_fix: "Replace 'Codex' with 'a benchmark-approved execution agent/model selected under verified E3 evidence' and, if useful, note that the current authoring surface (Codex) is not thereby selected."
    verification_method: "grep -n Codex 03_product/ENGINEERING_PREVIEW_CHARTER.md returns no role assignment in Section 21."

  - finding_id: F-E0-05
    severity: MEDIUM
    requirement: "Governance files agree with one another (MASTER_OPERATING_PROMPT Stage 0 gate principle); E3 model-role benchmark must be reachable under the E-track"
    file_or_component: "MASTER_OPERATING_PROMPT.md (mission, stage sequence, Stage 1–12 gates — untouched by E0 and outside its allowed paths); AGENTS.md; 06_evaluation/MODEL_ROLE_BENCHMARK_PLAN.md 'Stage 1 workflow gate' (lines 34–46, verified S0-003 artifact); charter Sections 17/20; PROJECT_STATE current_stage E1"
    evidence: >-
      MASTER_OPERATING_PROMPT still states the mission as a SaaS platform progressing
      verified research → customer/wedge selection → product requirements → …, with modes
      keyed to numeric stages, and contains no reference to D-016 or E-phases (grep returns
      nothing). The independently verified benchmark plan says the benchmark "remains
      BLOCKED_WORKFLOW_NOT_SELECTED until Stage 1 has recorded … one selected customer segment
      and one selected workflow, with founder approval" and a workflow-specific fixture pack.
      D-016 defers exactly that Stage 1 selection. Charter Section 20 assigns model-role
      benchmarks to E3 and gates them only on S0-005, budget, credentials, and approval; it
      does not mention the plan's Stage 1 gate. E0 records no mapping between E-phases and MOP
      stages and no assumption/risk about the conflict.
    why_it_matters: >-
      Two authoritative documents now disagree about what gates the model-role benchmark and
      what the project's stage sequence is. A future E3 author either silently bypasses a
      verified artifact's gate or is blocked by a customer-selection requirement the founder
      deferred. AGENTS.md makes MASTER_OPERATING_PROMPT mandatory reading, so the stale stage
      model will be read as authoritative by every new session.
    required_fix: >-
      Within E0's scope: add to the charter (Section 17 or 23) and PROJECT_STATE an explicit
      E-phase ↔ MASTER_OPERATING_PROMPT stage mapping (E1≈Stage 2 product definition,
      E2≈Stage 3, E3≈Stage 4 plus the model benchmark, E4≈Stage 5, E5≈Stage 6 subset) and a
      statement that the benchmark plan's Stage 1 workflow gate must be re-gated on the
      verified E1 specification's task classes by a bounded, founder-authorized amendment to
      06_evaluation/MODEL_ROLE_BENCHMARK_PLAN.md before E3 (assign this to E1-002's evaluation
      suite or a new bounded task), not bypassed. Recommend a founder scope amendment or a
      short D-017 note authorizing a minimal MASTER_OPERATING_PROMPT/AGENTS.md reconciliation
      pointer to D-016; E0 itself must not edit those files without that amendment.
    verification_method: "Charter and PROJECT_STATE contain the mapping and the benchmark re-gating statement; a founder-authorized path to reconcile MASTER_OPERATING_PROMPT is recorded; the benchmark plan is unchanged until that amendment."

  - finding_id: F-E0-06
    severity: LOW
    requirement: "Governance records (assumption, risk) reflect the confirmed decision; MASTER_OPERATING_PROMPT Stage 0 gate 'unresolved high-impact questions are visible'"
    file_or_component: "01_governance/RISK_REGISTER.md (R-001 mitigation 'Stage 1 gate'); 01_governance/ASSUMPTION_REGISTER.md (no Engineering Preview assumption); both outside E0-001 allowed paths"
    evidence: "Neither register mentions D-016 or the Engineering Preview. R-001 ('Building a broad platform before validating a workflow', mitigation 'Stage 1 gate and strict MVP non-goals') is the exact risk D-016 knowingly accepts, yet its mitigation now points at a deferred gate. No assumption records that a local single-user software-engineering agent is the right open-source first product, and no risk covers open-source license/provenance exposure or autonomous-build failure modes."
    why_it_matters: "Bounded: the registers are inputs to E1-001, which has both files in its allowed paths, so the gap can be closed there; but E0 should have flagged it rather than leaving R-001's mitigation silently stale."
    required_fix: "Either amend E0-001 scope (D-009 process) to add one assumption (engineering-first product hypothesis, OPEN_NOT_TESTED) and update R-001's mitigation to cite D-016 and the E1/E5 gates, or add an explicit handoff/known_limitations note assigning this reconciliation to E1-001."
    verification_method: "grep D-016 in both registers after the fixer or E1-001 pass, or a known_limitations entry naming the deferral."

  - finding_id: F-E0-07
    severity: LOW
    requirement: "AGENTS.md: CHALLENGER and VERIFIER are independent roles; 'the sole author may not mark high-risk work verified'"
    file_or_component: "99_handoffs/completed/ENGINEERING_PREVIEW_INITIALIZATION_handoff.yaml independent_review block (lines 77–98)"
    evidence: "The author's own read-only subagents are recorded with role: CHALLENGER and role: VERIFIER and results such as 'PASS on every requested current-state invariant', although formal_task_verification_status is correctly NOT_VERIFIED."
    why_it_matters: "Later audits searching for challenger/verifier records could mistake author-internal drafting checks for the repository's independent roles. The Stage 0 precedent (S1-003 reconciliation handoff) used the same labeling, so this is a bounded terminology correction, not a protocol violation."
    required_fix: "Relabel these entries (e.g., role: AUTHOR_INTERNAL_SUBAGENT_REVIEW) and state that they do not satisfy the independent challenger/verifier requirement; keep formal_task_verification_status NOT_VERIFIED."
    verification_method: "Handoff independent_review roles no longer use the bare CHALLENGER/VERIFIER labels."

