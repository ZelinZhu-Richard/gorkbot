section_evidence:
  candidate_set: "3 records under 05_architecture/candidates/; IDs EP-ARCH-C01/C02/C03 unique; names unique; each record complete (30 fields); no other candidate file or referenced candidate; overview §14 preferred NONE, selected NO, ADRs 0; governance preferred_candidate null, architecture_selected false, accepted_architecture_adrs 0."
  structural_distinctness: "Pairwise on twelve dimensions from f02/f04/f06/f07/f08/f09/f19/f20/f22/f28: authoritative owner (integrated single-writer core / persistent service / journal head plus reducer), process topology (task-bound integrated runtime that may run headless / persistent service plus optional clients plus leased workers / no mandatory daemon, replay-replaceable coordinator), execution ownership (co-resident supervisor under integrated epoch / lease-fenced disposable worker / coordinator-granted fenced adapter lease), persistence (transactional current state plus history/ledgers / service transactional state plus inbox-outbox / append-only journal plus immutable payloads), operation accounting (core outbox-inbox / service command-dispatch-result-effect ledgers / intent-dispatch-observation-readback events), recovery (validate store, rebuild projections, reconcile ledgers / new service epoch, invalidate leases, reconcile inbox-outbox / replay journal through reducers, rebuild projections), worker replaceability (children not independent authorities / defining property / replaceable by replay and new fence events), external-effect authority (core ledger / service bridge / ordered workflow events), client lifetime (presentation detaches from task-bound runtime / thin client over service / projection subscriber), projection-event model (transactional authority, events do not define all authority / service state authoritative / journal and reducer define authority), local-to-remote seam (in-core executor port needing extraction / worker lease contract already across a boundary / serializable dispatch events), contributor burden (broad core / service-IPC-lease lifecycle / event schema-reducer-replay). C01's headless task-bound core is not a permanent installed service, has no replaceable execution authority, and loses the live owner on full core exit (f02 relationships, f04 execution_owner, f19); C03's coordinator is a replaceable interpreter and journal/reducer authority survives its absence (f04 orchestration_owner, f02 CONTROL_AUTHORITY_LIFETIME), so C03 is not C02 with an event log."
  hard_status_rule: "Rule text in overview §1 and each f23 status_assignment_rule; SATISFIED requires a specified structural mechanism/seam; PLAUSIBLE requires only paper analysis; SPIKE requires empirical architecture-blocking feasibility; VIOLATED is contradiction; preference/cost/burden explicitly excluded. Applied consistently: the seven non-SATISFIED ARs all concern host-mechanism or support-declaration feasibility (path defense, network enforcement, secret recipient boundary, corruption/partial-write mechanism, packaging support, descendant containment, capture exclusion); no SATISFIED status rests on preference language; no status depends on candidate identity."
  cross_candidate_status: "Zero ARs with differing status. Semantic challenge of equalities: AR-EXE-003 all SPIKE (same supervisor-plus-fence structure in all three; host descendant containment is the shared unknown); AR-DUR-003 all SATISFIED (same intent/attempt/readback bridge class; C02's extra IPC hop and C03's event ordering are covered by f08 bridges and E3V-001, not a structural absence); AR-DUR-004 all SATISFIED (every candidate durably orders controls, fences on full shutdown, and truthfully classifies overdue work on restart; the no-live-owner interval after crash exists in all three including C02 service loss, and no candidate claims real-time enforcement without a live owner); AR-FUT-001/002 all SATISFIED at the seam floor; AR-SEC-003 all PLAUSIBLE and AR-SEC-006 all SPIKE (shared acquisition unknown, candidate delivery variants); AR-PKG-001 all PLAUSIBLE (conservative, uniform). No candidate receives SATISFIED where another receives SPIKE. Making the counts identical did not hide a legitimate difference: the real differences (persistent-service availability, coordinator absence by design, integrated blast radius) are correctly located in f22/f26/f28 and the AR-PRF characterizations rather than in hard status."
  execution_owner_lifetimes: "Per candidate: CLIENT_LIFETIME, CONTROL_AUTHORITY_LIFETIME, EXECUTION_OWNER_LIFETIME, TASK_LIFETIME, WORKSPACE_LIFETIME with relationships (f02). Scenario walk: client close while idle or while a command runs -> presentation detach only, work continues or reaches policy-bounded wait (f03 disconnect_and_exit, f09 client_only_interruption); disconnect while approval pending -> durable WAITING state unaffected (controls/approvals are durable commands, never UI state); client absent during recovery -> startup sequence is owner-driven and client-independent (f09 startup); reconnect -> fresh axis-qualified projection (f03 reconnect); stale reconnect -> never regains old lease/approval/control authority (f03 stale_client_rule, overview §7); deliberate full-system shutdown -> distinct authenticated path with quiesce/cancel/fence/persist (f04 full_system_shutdown); control authority crash -> C01 core crash fences children and restart reconciles; C02 service crash invalidates leases and new epoch reconciles; C03 coordinator loss fences lease and replay reconciles (f04 no_live_* semantics, f09 application_crash); execution-owner crash -> worker_failure scenarios with readback before retry. Task/evidence state survives, completion never depends on a UI process, in-flight operations reconcile via known/failed/unknown."
  ep_ctl_016: "Each f25 named_case_mappings.EP_CTL_016 gives an injectable client-only disconnect (close/drop client without full shutdown or cancel), observable durable state/lease/epoch continuity, oracle path OR-STATE-READBACK/OR-RECOVERY-REPLAY with projection rebuild, the limitation that full owner loss is a different case, an unsupported condition (platform unable to distinguish window close from shutdown / client technology owning the only authority), and instrumentation stage; stale-client authority is covered by f03 stale_client_rule."
  spike_model: "5 unique IDs SPQ-E2-002-01..05; SPQ-01/02 SHARED (3 candidates each); SPQ-03/04/05 CANDIDATE_SPECIFIC (1 each); 9 references (3 per candidate); all 14 fields present in every reference; run_status NOT_RUN everywhere; no duplicate shared question disguised as candidate-specific; no analysis-resolvable item labelled spike (the five plausible ARs are in ANALYSIS_RESOLVABLE entries); no E3 model question in E2-004 items; E4_IMPLEMENTATION_DETAIL items are mechanism choices, not feasibility questions."
  protected_entry_spikes: "Shared acquisition/capture exclusion appears once as SPQ-02 (not triplicated); candidate-specific delivery retained only where topology changes the mechanism: C01 co-resident in-boundary handoff, C02 cross-process client-to-leased-worker handoff bypassing the service, C03 out-of-event broker with payload/event ordering and append/delivery crash points."
  testability_matrix: "9 family rows x 7 fields per candidate with candidate-specific seams (C01 integrated ports; C02 service/IPC/lease/worker; C03 command/event admission, reducer, adapters); each row states oracle access via authoritative state or independent target readback, a limitation, an unsupported condition that cannot count as pass, and E2/E3/E4/E5 stage; decisive_oracle_rule/unsupported_case_rule forbid executor/client/projection/model summary as sole oracle."
  composition_testability: "COMP-01..16 present in all three with seam, injection point, observable evidence, oracle path, limitation, unsupported condition and stage; cross-checked against the frozen suite COMP rows (crash+approval, crash+external effect, stop+external effect, redirect+stale verification, dirty repo+recovery, secret path+injection, symlink+secret, malicious output+evidence, stale approval+restart, duplicate effect+lost ack, post-verify mutation+draft package, Git hook+commit, package script+network, force-stop+partial filesystem, fallback+cost ceiling, injection+capability escalation); no composition is marked supported without an injection/observation seam; non-atomic filesystem/external reality truthfully ends PARTIAL/UNKNOWN."
  isolation_tiers: "Taxonomy is semantic (process-tree, filesystem, network/resource, credential boundaries for a declared workload class including descendants and owner loss) and names no container/VM/sandbox/worktree/product; Tier 2 assumption is justified by AR-EXE-003 descendant authority, NEG-TERM-01, AR-WSP-003, AR-SEC-002/003/004 (E1 requires descendant-level enforcement), not an over-strengthening; the assumption's feasibility is truthfully the SPQ-01 unknown; non-guarantees (compromised host, cross-tenant, side-channel, Tier 3) stated; AQ-003 consistent in all three f10 and f27."
