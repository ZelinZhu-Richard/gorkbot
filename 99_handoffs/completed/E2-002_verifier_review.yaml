original_finding_dispositions:
  - finding_id: F-E2-002-01
    severity: HIGH
    disposition: RESOLVED
    evidence: >-
      Overview §1 records one status-assignment rule (SATISFIED_BY_DESIGN = sufficiently
      specified structural authority/mechanism/seam; PLAUSIBLE = credible design path with
      unresolved paper analysis; UNKNOWN_REQUIRING_SPIKE = empirical feasibility that is
      architecture-blocking and not decidable by analysis; VIOLATED = contradiction) and states
      that preference elegance, cost, extraction burden, or contributor burden never sets a hard
      status. Each f23 carries the same status_assignment_rule with cross_candidate_application
      and specifically_rechecked [AR-EXE-003, AR-DUR-003, AR-FUT-001, AR-FUT-002, AR-TST-002].
      Recomputed: all three 59-entry generation-status maps are identical; AR-EXE-003 is
      UNKNOWN_REQUIRING_SPIKE in all (C01 l.374, C02 l.347, C03 l.352) with evidence that
      separates logical fencing from descendant containment under shared SPQ-E2-002-01;
      AR-DUR-003 is SATISFIED_BY_DESIGN in all with an explicit intent/attempt/correlation/
      readback/known-failed-unknown bridge and no atomicity claim (C01 f08
      external_effect_recovery_bridge, C02 f08, C03 f08); AR-FUT-001/002 SATISFIED_BY_DESIGN in
      all at the hard seam floor with extraction cost moved to AR-PRF-003/004 (C01 l.406-407);
      AR-TST-002 SATISFIED_BY_DESIGN in all pointing to the nine-row matrix, EP_CTL_016 and 16
      compositions. Tallies 52/5/2/0 match each f23 summary, overview §4, handoff
      hard_constraint_status_summary, registry current_hard_constraint_status, and PROJECT_STATE.
      f27 spike entries (SPQ-01 for AR-EXE-003; SPQ-02..05 for AR-SEC-006/003) match the
      statuses; no analysis entry contradicts a spike status.
  - finding_id: F-E2-002-02
    severity: HIGH
    disposition: RESOLVED
    evidence: >-
      C01 f02 lifetime_model defines CLIENT/CONTROL_AUTHORITY/EXECUTION_OWNER/TASK/WORKSPACE
      lifetimes and relationships; f03 disconnect_and_exit separates client-only close from
      explicit full-system shutdown; f04 no_live_owner_semantics states that persisted deadlines
      are not claimed to receive real-time enforcement while every owner is absent and that the
      next startup immediately classifies overdue work; f04 full_system_shutdown; f09
      client_only_interruption names EP-CTL-016; f19 long_running_components; f22
      processes_services; f25 EP_CTL_016; f26 known_weaknesses discloses the deadline
      consequence. C03 f02 lifetime_model, f03 disconnect_and_exit, f04
      no_live_coordinator_semantics and full_system_shutdown, f07 coordinator_loss_and_deadlines
      ("elapsed time is not itself evidence that cancellation/termination occurred"), f09
      client_only_interruption, f19, f22, f25 EP_CTL_016 and f26 all present. C02 retains the
      explicit service semantics and adds f04 no_live_service_semantics, full_system_shutdown,
      f09 client_only_interruption and f25 EP_CTL_016. Overview §3 topology row and §7 lifetime
      table compare all three on the same lifetime facts. AR-DUR-002/AR-DUR-004 statuses now
      cite the lifetime model and no-live-owner classification. C01-versus-C02 distinction holds
      on authority ownership (task-bound integrated core vs persistent service), worker
      replaceability (children not independent authorities vs disposable leased workers), and
      client boundary (presentation attached to the integrated runtime vs thin client over a
      service boundary): C01 did not acquire C02's daemon/worker topology.
  - finding_id: F-E2-002-03
    severity: MEDIUM
    disposition: RESOLVED
    evidence: >-
      Overview §10 and each f27 ARCHITECTURE_BLOCKING_SPIKE_E2_004 list use five normalized IDs
      SPQ-E2-002-01..05. SPQ-01 (descendant containment, AR-EXE-003) and SPQ-02 (protected
      acquisition/capture exclusion, AR-SEC-006) are SHARED_ARCHITECTURE_SPIKE referenced by all
      three candidates with identical core text; SPQ-03/04/05 are CANDIDATE_SPECIFIC delivery
      questions for C01/C02/C03 respectively. Every reference carries spike_question_id,
      property_being_tested, affected_ARs, affected_candidates, shared_or_candidate_specific,
      why_analysis_is_insufficient, minimal_mechanism_under_test, success_criterion,
      failure_criterion, architecture_blocking_reason, reusable_result_scope, decision_linkage,
      sp_c_reuse (SP-C01/C04/C05 named with distinguishing note) and run_status NOT_RUN. Nine
      references, five unique questions, zero run. Classification authority is explicitly left
      to E2-003.
  - finding_id: F-E2-002-04
    severity: MEDIUM
    disposition: RESOLVED
    evidence: >-
      Each f25 contains family_level_matrix with exactly nine rows (170 cases, 18 oracles, 11
