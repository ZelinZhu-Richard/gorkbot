  c03_payload_event_ordering: "f06 canonical_writer, f08 acknowledgement_boundary, f08 protected_and_external_payload_ordering (ten sub-fields), f09 partial_write orphan handling, f06 reducer_rule, f04 reducer_and_projection_authority."
