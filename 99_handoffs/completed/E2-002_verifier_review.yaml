  - finding_id: F-E2-002-07
    severity: LOW
    disposition: RESOLVED
    evidence: >-
      C02 f04 protected_delivery_path defines protected_entry_begins, ordinary_capture_stops,
      scope_validator (service validates recipient/use/operation/lease/fence/expiry/one-use
      without receiving the raw value), delivery (service-issued opaque one-use authorization;
