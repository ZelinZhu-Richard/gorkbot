new_findings:
  - id: F-E3-002-C01
    severity: MEDIUM
    classification: ARCHITECTURE_FAILURE_UNREACHABLE_BURDEN_OF_PROOF_DRIFT
    artifacts:
      - 06_evaluation/technical_validation/E3_TECHNICAL_VALIDATION_PROTOCOLS.yaml (architecture_failure_classification; every per-protocol implementation_configuration_failure_rule and architecture_failure_rule)
      - 06_evaluation/technical_validation/E3_TECHNICAL_HARNESS_CONTRACT.md (§13)
      - 99_handoffs/completed/E3-002_handoff.yaml (architecture_failure_and_handback)
    finding: >-
      The architecture-failure boundary is materially stronger than the accepted E2 semantics and
      is not falsifiable in practice as written. (a) Every per-protocol
      implementation_configuration_failure_rule avoids handback whenever a conforming EP-ARCH-C01
      realization "remains plausible"/"remains available" — the canonical E2 register (§1.1) uses
      "the architecture still admits a conforming realization", a structural fact; a plausibility
      assertion is an unfalsifiable escape hatch that lets any structural failure be relabelled
      configuration failure indefinitely. (b) architecture_handback_requires includes
      "every_compliant_allowed_realization_route_for_that_property_and_scope_is_exhausted", but no
      artifact defines the compliant-allowed-route set or makes it finite; read as empirical
      enumeration it can never terminate, so ARCHITECTURE_HANDBACK cannot occur. (c) The canonical
      per-E3V handback evidence enumerations (E3V-001: "Reproducible acknowledged loss, duplicate
      effect, stale acceptance, fabricated continuity, or architecture-incapable recovery with no
      conforming C01 realization"; analogous rows for E3V-002..007) are dropped: under E3-002 those
      reproducible violations are hard failures that default to configuration failure unless
      universal impossibility is separately proven. Accepted governance requires disproving the
      ADR's stated architecture assumption for the declared required support class — not proving
      universal impossibility over an unbounded mechanism space — and the E2 register's
      handback trigger is disjunctive ("disproves an indispensable selected interface/property OR
      shows a required hard boundary cannot exist for the declared required support class").
      Combined with the absence of any rule converting repeated materially-distinct-mechanism
      configuration failures into mandatory architecture reconsideration, the burden of proof
      shifts from the accepted architecture to its challenger and PASS/retry becomes the only
      practically reachable path.
    required_fix_direction: >-
      Restate the handback standard in canonical terms: independent, separately verified,
      reproducible disproof of the protocol's stated architecture_assumption for the exact
      declared required support class within its claimed required design envelope. Replace
      "remains plausible" with the canonical structural "still admits a conforming realization"
      and require that any invoked alternate conforming realization be named as a concrete
      candidate class in the correction record, not merely asserted. Define the compliant-route
      set boundedly (e.g. the prospectively frozen candidate mechanism classes for that E3V) or
      make route exhaustion an explicitly structural argument. Add a governed escalation rule
      (owner: Founder/E3-QPA authority; no numeric value invented here) under which repeated
      cross-mechanism IMPLEMENTATION_CONFIGURATION_FAILURE outcomes for the same indispensable
      property trigger mandatory independent architecture review rather than unlimited fresh
      candidate blocks. Note: the verified E3-001 policy carries a similar
      "all_compliant_route_exhaustion_and_structural_impossibility_predicate" binding; the fixer
      should reconcile wording with that policy rather than silently diverging from it, and may
      need a coordinated E3-001-consistent clarification.
  - id: F-E3-002-C02
    severity: MEDIUM
    classification: QPA_VALUE_AND_MECHANISM_PROPOSAL_DUTY_UNFULFILLED_AND_UNSCHEDULED
    artifacts:
      - 06_evaluation/technical_validation/E3_TECHNICAL_VALIDATION_PROTOCOLS.yaml (qpa_binding.value_proposal_created_by_e3_002: false)
      - 99_handoffs/completed/E3-002_handoff.yaml (qpa_and_limits)
      - 01_governance/TASK_REGISTRY.yaml (E3-002 acceptance criterion 5)
    finding: >-
      The independently VERIFIED E3-001 policy assigns protocol-specific QPA value drafting to
      E3-002 (authority_and_separation.e3_qpa_001.protocol_value_draft_tasks includes E3-002) and
      states "Protocol-specific finite values and mechanisms will be proposed by E3-002 or
      E3-003, not here" (policy proposals, line 83). The E3-002 author pass proposed no values
      and no candidate mechanism classes, recorded value_proposal_created_by_e3_002: false, and
      framed the three canonical values and every protocol limit purely as
      FOUNDER_DECISION_REQUIRED with no scheduled E3-002 proposal step. As authored, acceptance
      criterion 5 ("values are prospectively proposed, explicitly Founder-approved, freshly
      challenged and independently verified before ... execution-ready status") cannot be
      satisfied by these artifacts, and the Founder has no exact scope-aware value set to
      acknowledge or approve — a mutual-wait stall on the critical path. Leaving values null in
      the author draft is correct and required; leaving the proposal duty unowned is not.
    required_fix_direction: >-
      Either add a clearly-marked NOT_APPROVED prospective value/mechanism-class proposal
      (per scope, per QPA family, per protocol limit dimension) to the E3-002 artifacts for
      Founder review, or record explicitly in the protocols file, handoff, and registry which
      E3-002 lifecycle step (e.g. a designated post-challenge proposal amendment before
      verification) produces the proposal, so the Founder-approval path defined by E3-001
      §authority_and_separation can actually begin.
  - id: F-E3-002-C03
    severity: MEDIUM
    classification: EXECUTION_READY_SEMANTICS_INCONSISTENT_POTENTIAL_E3_004_DEADLOCK
    artifacts:
      - 99_handoffs/completed/E3-002_handoff.yaml (future_task_contracts.E3_004.input)
      - 06_evaluation/technical_validation/E3_TECHNICAL_VALIDATION_PROTOCOLS.yaml (common_protocol_contract.freeze_timing_rule)
      - 06_evaluation/technical_validation/E3_TECHNICAL_HARNESS_CONTRACT.md (§14)
    finding: >-
      The author artifacts define execution-readiness three inconsistent ways. The handoff makes
      E3-004's input "Both E3-002 and E3-003 independently VERIFIED and execution-ready with
      exact configurations, values, limits, selectors, evidence destinations..."; the protocols'
      freeze_timing_rule makes the execution-ready freeze depend on binding "to the exact future
      E3-004 harness" and lists "harness identity" among the unresolved execution-ready inputs.
      Read together these are circular: E3-004 waits for execution-ready E3-002 while
      execution-ready E3-002 waits for the E3-004 harness identity. Additionally, no registered
      task owns the "resolved exact configuration, host/client/support class, fault order/seed,
      evidence destinations" selection that §14 requires before execution-ready implementation
      (E3-002 may propose but not finally choose; E3-004 builds harnesses only; E3-005 executes
      admitted blocks). The harness contract §14 already states the correct two-phase rule —
      independent VERIFICATION gates the start of E3-004 implementation, and execution-readiness
      (with harness binding) is a later, separately verified state gating admission — but the
      handoff contradicts it, and the registry verifier requirement ("records
      EXECUTION_READY_PROTOCOL only on complete evidence") plus E3 plan §"verified as
      execution-ready" wording invite the wrong one-phase reading, under which either E3-004 can
      never activate or the E3-002 verifier is pressured to stamp EXECUTION_READY_PROTOCOL
      without harness binding.
    required_fix_direction: >-
      Make harness contract §14's two-phase semantics the single controlling definition: state in
      the handoff and, via the registry maintainers, in the E3-002/E3-004 entries that E3-004
      activation requires E3-002 (and E3-003) task VERIFICATION of the protocol contracts only,
      while EXECUTION_READY_PROTOCOL is a distinct later status requiring Founder-approved
      challenged/verified QPA values, resolved exact configurations, and the verified E3-004
      harness binding, checked again at per-block admission. Name the owner of the exact
      configuration/support-class/seed/evidence-destination resolution step.
  - id: F-E3-002-L01
    severity: LOW
    classification: E3V_006_CAPTURE_INVENTORY_NON_REPOSITORY_FILESYSTEM_GAP
    artifacts:
      - 06_evaluation/technical_validation/E3_TECHNICAL_VALIDATION_PROTOCOLS.yaml (E3V-006 oracle_contract.mandatory_capture_surfaces)
      - 06_evaluation/technical_validation/E3_TECHNICAL_HARNESS_CONTRACT.md (§8)
    finding: >-
      The 13 mandatory capture surfaces cover and exceed the canonical
      input/model/provider/tool/terminal/process/log/telemetry/evidence/UI scan list, but the
      only filesystem surface is "repository, worktree, diff, temp, cache, artifact, and
      evidence paths". Ordinary subject-writable non-repository filesystem locations — OS
      temporary directories, home dotfiles, shell history files, crash-dump/spool locations —
      are not named. A marker written there is an ordinary file write, not a "host side channel"
      excluded by the unsupported-scope list, yet it would evade every enumerated scan while the
      success rule reads "no unauthorized surface contains the raw marker". The truthful
      limitation exists (OR-SECRET-MARKER "proves only the frozen marker and observable
      surfaces"), so this is a completeness/claim-precision gap rather than a false guarantee.
    required_fix_direction: >-
      Bind the subject's complete writable filesystem view into the mandatory inventory (or
      require the harness to prove the subject's writable view is restricted to scanned paths),
      or scope the success-rule wording explicitly to the enumerated inventory.
  - id: F-E3-002-L02
    severity: LOW
    classification: CROSS_PROTOCOL_PRECONDITION_WORDING_SELF_REFERENTIAL
    artifacts:
      - 06_evaluation/technical_validation/E3_TECHNICAL_VALIDATION_PROTOCOLS.yaml (cross_protocol_order_and_reuse.preconditions)
    finding: >-
      "E3V-002 containment controls must be verified for any fixture that spawns descendants"
      (and the parallel E3V-003/E3V-006 lines) is ambiguous between (a) E3-004-verified harness
      containment/isolation/capture capability — the reading the harness contract §11 uses
      ("must protect") — and (b) a verified E3V verdict, which would be circular because
      E3V-002's own fixtures spawn descendants, E3V-003's own fixtures mutate workspaces, and
      E3V-006's own fixtures use markers.
    required_fix_direction: >-
      Reword the three preconditions to reference the E3-004-verified harness controls
      explicitly, matching harness contract §11.
  - id: F-E3-002-L03
    severity: LOW
    classification: DEFERRED_CASE_RATIONALE_AGGREGATE_AND_OWNER_VAGUE
    artifacts:
      - 06_evaluation/technical_validation/E3V_E1_TRACEABILITY.csv (CASE-DEFERRED, GE-DEFERRED rows)
    finding: >-
      The 21-case deferred rationale is circular ("Exact complement of the selected union") and
      the owner label "DEFERRED_TO_E5_OR_OTHER_FROZEN_E1_GATE" names no specific later gate. I
      independently inspected all 21 deferred cases and the 13 deferred GE rows: they are product
      task-admission/plan-amendment/optional-capability workflow cases (EP-WF-001/002/005/008/016),
      contributor-lifecycle cases whose E3-relevant slice is carried by EP-CONTRIB-003/006/008,
      and Git-effect rows whose effect classes are represented by selected rows — so no
      E3-002-critical case is wrongly deferred and the deferral is substantively legitimate; the
      recorded justification is nonetheless too thin to audit without redoing that work.
    required_fix_direction: >-
      Record a per-family deferred rationale and the exact expected later owner (E5 release
      execution vs other frozen E1 gate) in the CSV or protocols file.
  - id: F-E3-002-N01
    severity: NOTE
    classification: TOKEN_TYPO
    finding: >-
      E3V-004 fault_schedule injected condition "zero_call_denial_and unknown_usage_or_cost"
      contains an embedded space where every sibling token uses underscores (protocols yaml
      line ~1487). Parses fine; style/consistency only.
  - id: F-E3-002-N02
    severity: NOTE
    classification: COMMON_HARD_FAILURE_CLASS_REWORDED
    finding: >-
      The E3-001 common class "duplicate_or_unresolved_consequential_effect" appears in the
      protocols as "duplicate_or_unresolved_consequential_effect_reported_as_success". The
      qualification is semantically defensible (a truthful UNKNOWN_OUTCOME is a legal state and
      per-protocol hard failures still catch unqualified duplicate effects and blind retries),
      but the divergence from the verified policy wording should be recorded as deliberate.
  - id: F-E3-002-N03
    severity: NOTE
    classification: HANDOFF_COMMIT_STATEMENT_STALE
    finding: >-
      The handoff says "Uncommitted patch ... leave uncommitted for Founder review", but the
      work is committed at bebf9fd (consistent with founder-commit precedent from E3-001). The
      statement is now stale; no content impact.
