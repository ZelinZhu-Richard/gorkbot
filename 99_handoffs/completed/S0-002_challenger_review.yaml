claim_classification:
  - topic: "Product and version context as of 2026-08-21"
    classification: VERIFIED
    baseline_status: PARTIAL_IN_BASELINE
    evidence: "x.ai/news/introducing-grok-bot (Aug 11, 2026; 'in beta'; header label 'Early beta' on the current page); docs site title 'SpaceXAI Docs'; footer 'X.AI LLC'; Cursor help: beta label is expectation-setting, not Cursor Beta Services terms; Cursor help references app version v1.2.0; docs pages dated Aug 11 (10) and Aug 20 (4); plan expansion post Aug 21. Installed build, plan, region for the project account remain UNKNOWN (correctly stated by the baseline)."
  - topic: "Persistent Bot identity"
    classification: VERIFIED
    baseline_status: CORRECT
    evidence: "SRC-002 'A Bot is a durable AI teammate with a name, a job, its own conversation, and working context that develops over time'; SRC-001; SRC-008."
  - topic: "What state actually persists"
    classification: VERIFIED
    baseline_status: CORRECT_BUT_INCOMPLETE
    evidence: "SRC-013 files in /workspace, browser cookies/sessions, command-line credentials, connectors account-wide; 'Files, browser state, and supported sign-ins are designed to survive normal computer updates and recovery'; SRC-002 memory = stable preferences, important facts, summaries; Cursor help computer-recovery: conversation history stored outside the box filesystem; durable copy of synced box data on the server; unsynced work lost on Reset. UNKNOWN: sync boundary/RPO, retention, memory schema (correctly open)."
  - topic: "Cloud-computer ownership and scope"
    classification: VERIFIED
    baseline_status: CORRECT_BUT_INCONSISTENCY_UNRECORDED
    evidence: "SRC-013 'The computer is assigned to your user account, not an individual Bot'; SRC-008 'assigned per user, not per Bot'; SRC-005 'one cloud computer assigned to your user account'; SRC-006 'Each member gets one dedicated cloud computer ... managed Linux virtual machine ... shared by all of their Bots' and 'a computer is shared across every team the member belongs to'. Documented inconsistency: SRC-001 bullet 'It has a computer of its own. Each Bot runs on a persistent cloud VM'."
  - topic: "Computer state scope (user / Bot / task)"
    classification: VERIFIED
    baseline_status: CORRECT
    evidence: "User-level for individuals, member-level for teams; not Bot-level, not task-level; per-Bot screens are 'separate work surfaces, not separate security boundaries' (SRC-013)."
  - topic: "Browser / session / filesystem persistence"
    classification: VERIFIED
    baseline_status: CORRECT_BUT_INCOMPLETE
    evidence: "SRC-013 'Browser sessions persist'; SRC-014 'The browser session persists on your shared Grok Bot computer'; SRC-006 FAQ 'Sign-in sessions inside the computer can drop when the computer is recreated or its network address changes' (not in baseline); SRC-013 sites may expire sessions."
  - topic: "Credentials / session behavior"
    classification: VERIFIED
    baseline_status: CORRECT_BUT_INCOMPLETE
    evidence: "SRC-005 secure secret request 'masked, excluded from the transcript, and not shown to the model' for 'a supported connection'; SRC-006 'Sign-in tokens for hosted MCP servers stay with Cursor's backend ... The computer never stores those tokens' (not in baseline); Cursor help 'the agent doesn't see your password' when the user signs in; plugin connections belong to the account. UNKNOWN: storage, revocation, leakage resistance (correctly open)."
  - topic: "Terminal and file access"
    classification: VERIFIED
    baseline_status: CORRECT
    evidence: "SRC-013 command line, files, /workspace; local computer separate with policy (SRC-005, SRC-006)."
  - topic: "Parallel execution"
    classification: VERIFIED
    baseline_status: CORRECT_BUT_INCOMPLETE
    evidence: "SRC-008/SRC-013 per-Bot screens; one computer-use task per Bot screen at a time; SRC-006 'Cloud Agents ... team-wide toggle controls whether Grok Bot Bots can launch Cursor cloud agents. It is on by default' (not in baseline)."
  - topic: "Agent-to-agent communication and asynchronous handoffs"
    classification: VERIFIED
    baseline_status: CORRECT
    evidence: "SRC-003 'A Bot can send an asynchronous message to another Bot. The receiving Bot wakes, handles the request, and can reply later'; 'Bot-to-group handoff messages are currently text-only'. Ownership/delivery internals UNKNOWN (correctly open)."
  - topic: "Group conversations"
