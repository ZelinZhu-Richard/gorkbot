      why_it_matters: "Reversal-cost class is the field a verifier compares across ADRs and against the reopen-trigger surface; an open vocabulary prevents mechanical consistency checks and invites drift."
      required_fix: "Adopt one closed vocabulary (e.g., REVERSIBLE_EARLY / MODERATELY_COSTLY / FOUNDATIONAL_HIGH_COST, with an optional ' + foundational sub-contract' sentence in the body), define it once in the baseline, and make ADR headers, baseline section 15 and the handoff agree."
