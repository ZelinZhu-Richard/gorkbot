verdict_rationale: >-
  The C01 proposal itself survives adversarial re-derivation: all three candidates recompute from
  the verified matrix as 57 CONFIRMED_SATISFIED_FOR_COMPARISON + 2
  ARCHITECTURE_SEAM_CONFIRMED_E3_VALIDATION_OUTSTANDING (AR-EXE-003 -> E3V-002, AR-SEC-006 ->
  E3V-006) + 0 blocking + 0 violated, so the hard gate is a genuine tie; the tie-break is a stated,
  non-numeric, non-additive proportionality rule (minimize mandatory present structure for the
  D-016 REQUIRED_NOW scope) that is defensible under E2 plan section 15 and the AR-PRF-002/004
  rationale, is applied once, keeps every verified C02/C03 advantage (direct remote-worker seam;
  causal replay/reconstruction) as explicit reopen triggers, discusses all seven verified
  sensitivity profiles, and does not convert the proposal into a selection anywhere in the
  baseline, ADRs, handoff, registry or PROJECT_STATE. The proposed baseline is the verified C01
  record unchanged (every topology/authority/persistence/operation/execution/client/recovery/
  evidence/verification/approval/provider/protected-entry/remote-seam property re-checked against
  C01 f02-f30; no C02 service/lease/worker plane and no C03 journal/reducer/projection authority
  imported; candidate SHA-256 values equal the pins). Coverage recomputes exactly: 127 unique
  frozen E1 rows -> 65 ARs (59 hard / 6 preferences) -> nine ADRs with every AR assigned exactly
  once and every ADR "Primary" line equal to the baseline table; 25/25 domains; 20/20 threat
  boundaries; 19/19 Level-B dispositions equal to C01 f29; all eight canonical E3V obligations
  carry the E2-001 section 9 sources verbatim with question/assumption/prerequisites/owner/
  evidence/scope/gate/failure-split/authorization/handback fields; E3-QPA-001 restates frozen
  release-acceptance rerun/flaky/correction rules with no numeric value; the three E4 bundles are
  preserved as implementation-only deferrals; no technology, product, provider, model, role
  occupant, implementation, spike, evaluation run, benchmark or paid call exists; frozen E1 and
  verified E2-001/E2-002/E2-003/E2-004 artifacts are byte-identical to their verified commits;
  status discipline is exact (9/9 PROPOSED_PENDING_INDEPENDENT_ARCHITECTURE_VERIFICATION, 0
  accepted). Two MEDIUM defects nevertheless prevent acceptance under the rule that no
  BLOCKER/HIGH/MEDIUM issue may remain: (1) the frozen "one ADR handback set per E3V obligation"
  is not closed under the baseline's own primary AR -> ADR assignment (10 rows, e.g. a structural
  E3V-005 failure of AR-CTX-001/002 cannot reopen ADR-E2-006, which owns them), and ADR-E2-006 and
  ADR-E2-009 each list an obligation whose frozen set excludes them; (2) the recovery baseline
