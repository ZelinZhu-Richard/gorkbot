new_findings:
  actionable:
    - finding_id: F-E2-005-01
      severity: MEDIUM
      adr_or_component: "05_architecture/ENGINEERING_PREVIEW_E3_VALIDATION_OBLIGATIONS.md section 2 (frozen handback table) and per-obligation 'Frozen handback' rows; 05_architecture/ENGINEERING_PREVIEW_ARCHITECTURE_BASELINE.md section 13 (primary AR -> ADR) and sections 8/9/18; ADR-E2-006 and ADR-E2-009 'E3 validation obligations' / 'Handback and reopen conditions'; ADR-E2-002/004/007/008/009 as excluded owners; handoff e3_validation_plan.frozen_handback_sets; TASK_REGISTRY author_e3_plan_state.frozen_adr_handback_sets"
      requirement_or_decision: "TASK_REGISTRY E2-005 acceptance criteria 2 (mutually coherent ADRs with E3 obligations) and 4 (ADR linkage and reversal trigger per obligation); E2-001 section 9 handback rule 3 ('reopens the linked E2 ADR'); E3 plan section 1 ARCHITECTURE_HANDBACK ('return to the frozen ADR set'); V-E2-004-N3 carry-forward ('freeze exactly one ADR handback set per E3V obligation') and E2-005 activation_condition_status; E2-006 forbidden action 'unowned E3 obligation'"
      evidence: >-
        The E3 plan freezes one ADR set per obligation and declares "Narrower or wider linkage
        elsewhere is historical provenance, not a second handback set." Joining the baseline's
        own primary AR -> ADR table with the matrix e3_obligation of every C01 hard row shows
        nine hard ARs whose owning ADR is outside the frozen set of the obligation that tests
        them: E3V-005 -> AR-CTX-001, AR-CTX-002 (primary ADR-E2-006; set 002/003/005/007/008)
        and AR-GIT-002 (primary ADR-E2-004); E3V-003 -> AR-DUR-006 (primary ADR-E2-002; set
        001/004/009); E3V-001 -> AR-FAIL-001 (ADR-E2-008), AR-TST-002 (ADR-E2-007), AR-FUT-001
        (ADR-E2-009; set 002/003/004/005); E3V-006 -> AR-FUT-002 (ADR-E2-009; set
        001/004/005/008); E3V-004 -> AR-FUT-003 (ADR-E2-009; set 001/005/006/008); plus preference
        AR-PRF-001 (ADR-E2-001) under E3V-007. E2-001 section 9 lists AR-CTX-001/002 and
        AR-DUR-006 as canonical sources of E3V-005 and E3V-003 respectively, so the gap is not a
        matrix artifact. Conversely ADR-E2-006 lists E3V-005 and ADR-E2-009 lists E3V-006 as their
        own validation obligations while restating frozen sets that exclude them (ADR-006
        handback line: "E3V-005 -> ADR-E2-002/003/005/007/008"; ADR-009: "E3V-006 ->
        ADR-E2-001/004/005/008"). The sets themselves equal the verified closure section 9 sets;
        the primary assignment that makes them non-closed is new E2-005 work.
      why_it_matters: >-
        Under the plan's normative rule, a reproducible structural failure of context/compaction
        (AR-CTX-001/002, D15, owned by ADR-E2-006) found under E3V-005 could not reopen ADR-E2-006;
        a retention/cleanup structural failure (AR-DUR-006) under E3V-003 could not reopen
        ADR-E2-002; a serializable-boundary or ownership-scope failure (AR-FUT-001/002/003) could
        not reopen ADR-E2-009. The ADRs that carry the disproved property would be outside the
        set the plan tells E3 to return to, and ADR-006/009 carry obligations that by rule cannot
        reopen them - an internally inconsistent handback contract that E2-006 must otherwise
        record as an unowned-obligation/ADR-coherence failure and that weakens the reversal
        path AC4 requires. This does not bias the C01 proposal or hide an E1 violation; it is a
        bounded mapping defect.
      required_fix: >-
        In a bounded FIX_TASK_E2-005 pass, choose one of: (a) widen the frozen sets so each
        contains the primary ADR of every hard AR its canonical sources/matrix e3_obligation
        assign to it (minimum: E3V-001 += ADR-E2-007/008/009; E3V-003 += ADR-E2-002; E3V-004 +=
        ADR-E2-009; E3V-005 += ADR-E2-004/006; E3V-006 += ADR-E2-009), state the widening
        rationale once in E3 plan section 2 (the sets remain a superset of the verified closure
        sets, consistent with V-E2-004-N3's "whichever is frozen"), and align every ADR's handback
        section; or (b) keep the sets and add to E3 plan section 2 one explicit rule that
        ARCHITECTURE_HANDBACK reopens the frozen structural set plus the primary ADR of each
        disproved AR (citing baseline section 13 as the join), then either remove ADR-006's
        E3V-005 and ADR-009's E3V-006 listings or annotate them as "validated-by, reopened via
        the primary-ADR rule". Propagate the chosen form to baseline sections 8/9/18, the handoff
        frozen_handback_sets and TASK_REGISTRY author_e3_plan_state.
      verification_method: >-
        Re-run the join: for every C01 hard matrix row, primary ADR (baseline section 13) must be
        in the frozen set of its e3_obligation (or the written primary-ADR rule must exist and be
        cited); scan each ADR's 'E3 validation obligations' list against the sets; grep the
        handoff/registry/baseline strings for the identical sets.
    - finding_id: F-E2-005-02
      severity: MEDIUM
      adr_or_component: "05_architecture/ENGINEERING_PREVIEW_ARCHITECTURE_BASELINE.md section 7 (recovery and reconciliation baseline) and section 9; ADR-E2-003/005/006 'Recovery implications'; handoff baseline_coverage.recovery ('Fifteen scenarios'); TASK_REGISTRY author_validation_results.architecture_surface ('15/15 recovery scenarios'); PROJECT_STATE E2-005 author note"
      requirement_or_decision: "TASK_REGISTRY E2-005 acceptance criterion 3 ('recovery/reconciliation matrix ... explicit in the proposed baseline'); E2 plan section 11 cross-cutting recovery contract (required scenario list and per-row fields: authoritative state, recovery owner, idempotency boundary, readback, legal endpoint, bounded stop/escalation condition, evidence); AR-DUR-003/004, AR-EXE-002/003, AR-SEC-006 (recovery never replays protected input); challenger prompt section 31 minimum list (includes protected-delivery ambiguity)"
      evidence: >-
        Section 7 has 15 rows with three data columns (durable basis / required response /
        permitted terminal knowledge). Within section 7: 'redirect' 0 hits, 'reorder' 0, 'timeout'
        0, 'protected' 0, 'resume' 1 (inside the pause row's "no new productive work" text, not a
        resume row). Across the whole baseline and all ADRs: 'reorder' 0 hits; 'model timeout' /
        'tool timeout' 0 hits. Plan section 11 requires rows for "tool, process, model, worker,
        and orchestrator timeout or loss", "duplicate requests and reordered delivery", "pause,
        cooperative stop, force termination or authority fencing, redirect, and resume", and the
        seven per-row fields; section 7 supplies authoritative state, action and legal endpoint
        but no explicit recovery owner, bounded stop/escalation condition or evidence column.
        The verified C01 f09 enumerates 18 scenarios (adding model_timeout, tool_timeout,
        lost_tool_result, waited_event, protected_entry, agent_retirement) plus seven workspace
        partial-write cases, and the verified comparison section 8 records five fields per cell;
        section 7 is a superset of the comparison's 11 rows but drops six f09 scenarios, does not
        cite f09 or comparison section 8, and protected-entry crash/uncertain-consumption/
        reacquisition appears only as prose in section 9 and ADR-005.
      why_it_matters: >-
        The recovery matrix is what E2-006 must find "credible and testable" and what the E3V-001/
        E3V-002 fault schedules will be frozen from; omitting redirect/resume, timeout,
        reordered-delivery and protected-entry-ambiguity rows and the owner/escalation/evidence
        fields forces E2-006 and E3 to reconstruct them from a candidate record the baseline
        does not incorporate, and the "15/15 recovery scenarios" statements in the handoff,
        registry and PROJECT_STATE overstate completeness against the plan's own contract. C01
        f09 shows the semantics exist, so this is material missing baseline detail rather than a
        design gap.
      required_fix: >-
        Extend section 7 with rows for model/provider timeout or loss, tool/process timeout,
        reordered or out-of-order delivery (including waited-event redelivery), redirect, resume,
        protected-entry crash / uncertain consumption / reacquisition, and agent disable/
        retirement; add per-row recovery owner, idempotency boundary, bounded stop/escalation
        condition and evidence (or adopt the comparison section 8 five-field cell form); state
        that verified C01 f09 (18 scenarios + 7 partial-write cases) is incorporated as the
        normative scenario set with section 7 as its ADR-mapped projection; correct the scenario
        count wherever it is asserted (handoff, TASK_REGISTRY author_validation_results,
        PROJECT_STATE note).
      verification_method: >-
        awk section 7: row set must cover every plan section 11 bullet and every C01 f09 scenario
        key (or an explicit incorporation-by-reference plus delta); grep -i redirect|resume|
        reorder|timeout|protected|retire inside section 7 must all be nonzero; each row must
        carry the plan section 11 field set; scenario counts consistent across baseline,
        handoff, registry and PROJECT_STATE.
    - finding_id: F-E2-005-03
      severity: LOW
      adr_or_component: "05_architecture/ENGINEERING_PREVIEW_ARCHITECTURE_BASELINE.md section 1 decision-rule items 2-3, section 1.2 preamble, section 1.3 profile D row and closing sentence; ADR-E2-001 'Rationale'; handoff decision_rationale.current_scope_precedence / sensitivity_basis"
      requirement_or_decision: "Acceptance criterion 1 ('source-backed rationale'); E2-003 section 3 ('E2-005 ... may preserve an explicit qualitative rationale'); E2-001 section 8 weighting governance; E2 plan section 15; AR-PRF-002 and AR-PRF-004 rationale text; verified sensitivity profile D (comparison section 17.2)"
      evidence: >-
        The tie-break ("minimize the mandatory topology and authority-path burden for the
        confirmed D-016 REQUIRED_NOW scope") is attributed to "Confirmed D-016 scope
        precedence". D-016 fixes local-first/single-user scope and defers cloud; all three
        verified candidates are local-first, single-user and free of mandatory cloud (comparison
        section 4.2 AR-PKG-001 row; section 13 "Local startup/idle"), so D-016 alone does not
        discriminate among them. The verified governance that does support a
        present-proportionality tie-break - plan section 15 ("reject ... speculative ... machinery
        that increases v0.1 complexity without satisfying a current E1 requirement"), AR-PRF-004
        rationale ("v0.1 must not absorb unnecessary distributed-system complexity") and
        AR-PRF-002 description ("prefer fewer independent failure/upgrade/operational surfaces
        and clearer component ownership") - is paraphrased only in ADR-E2-009 and cited nowhere
        in baseline section 1. Decision-rule item 3 says "Sensitivity profiles A and D support
        this current-shape advantage"; the verified profile D gives each candidate a distinct
        contributor advantage ("no single advantage spans all dimensions"), comparison section 5
        says contributor accessibility "is not inferred from component count", and the baseline's
        own section 17 disclaims "fewer components" as justification. The precedence among
        profiles is only implicit across section 1.3.
      why_it_matters: >-
        The hidden-weighting audit passes because the rule is transparent and non-numeric, but
        its authority is under-cited and one of its two claimed supporting profiles is over-read;
        E2-006 must re-derive whether the rule follows from governance and could reasonably read
        it as author preference. Bounded because the rule is defensible under the cited sources.
      required_fix: >-
        State the decision rule in section 1 as one explicit ordered rule (hard non-compensating
        gate -> D-016 REQUIRED_NOW scope -> present-structure proportionality per plan section 15
        and AR-PRF-002/AR-PRF-004 rationale -> profiles B/C/G recorded as reopen triggers, E/F
        neutral), cite those verified sources, and limit the profile-D claim to the
        setup-topology sub-dimension or drop D as "support" (keeping A). Mirror the wording in
        ADR-E2-001 'Rationale' and the handoff decision_rationale.
      verification_method: "Read baseline section 1/1.3, ADR-E2-001 rationale and the handoff; confirm the cited sources resolve to plan section 15 and AR-PRF-002/004 text and that the profile-D sentence matches comparison section 17.2 row D."
