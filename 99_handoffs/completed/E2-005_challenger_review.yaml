      requirement_or_decision: "AR-DAT-001 (distinct authoritative / derived / ephemeral / lossy classes); E2-001 section 3 semantic classes; E3V-005 ('authoritative/derived distinctions'); charter section 6"
      evidence: >-
        E2-001 section 3 defines exactly AUTHORITATIVE STATE, DERIVED PROJECTION, EPHEMERAL
