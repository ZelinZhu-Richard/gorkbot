section_evidence:
  proposal_authority: >-
    No artifact marks C01 selected, an ADR ACCEPTED/VERIFIED/FINAL, the architecture
    authoritative, E3 active, E2-006 bypassed, the E2 gate changed, a model role assigned, or
    application code created. Status semantics are consistent across baseline ("Architecture
    selected: false", "Accepted ADR count: 0"), all nine ADR headers, PROJECT_STATE
    (architecture_selected false; preferred_candidate null; proposed_candidate EP-ARCH-C01 with
    status PROPOSED_PENDING_INDEPENDENT_ARCHITECTURE_VERIFICATION; accepted_architecture_adrs 0;
    E2-005 READY_FOR_REVIEW; E2-006 BACKLOG; gate NOT_EVALUATED), TASK_REGISTRY (status
    READY_FOR_REVIEW; author_result PROPOSE_...; authoritative_preferred_candidate null;
    accepted_adr_count 0; E2-006 blocked_by unchanged) and the handoff. RISK R-030/R-031 and
    A-021 describe C01 as a proposal. The registry allows PROJECT_STATE edits and does not
    prohibit a distinct proposed_candidate field; preferred_candidate remains null.
  c01_proposal_rationale: >-
    Re-derived from verified evidence: hard tie is exact (matrix recompute). "Shortest current
    authority/control path" is supported structurally by comparison section 5 AR-PRF-001 ("fewer
    top-level crossings"), section 6 D01/D08 and section 13 setup/process count; C01's costs
    (broad-core coupling, largest failure blast radius in section 8 core-loss row, costlier
    extraction in D22/section 13, broad trusted core in section 9/profile F) are stated in
    baseline sections 1.1/1.2/17 and ADR-001/002/003/005/009 negatives. C02 service/IPC/lease
    burden and C03 event/reducer/projection burden are the comparison's own section 5/13
    characterizations, not new criticism. Local-topology proportionality is not an invented
    principle: plan section 15 rejects machinery that increases v0.1 complexity without a current
    E1 requirement and AR-PRF-004's rationale says v0.1 must not absorb unnecessary
    distributed-system complexity; the baseline cites D-016 for this rather than those sources
    (F-E2-005-03, LOW). Another reasonable unweighted interpretation (privileging profile B/G or
    C) could propose C03 or C02; the baseline says so and preserves those as reopen triggers, so
    the proposal is defensible without claiming uniqueness.
  hidden_weighting: >-
    Decision rule actually used: (1) hard constraints non-compensating -> tie; (2) D-016
    REQUIRED_NOW scope precedence; (3) within scope, minimize mandatory present
    topology/authority-path structure whose value is mainly reserved/deferred scope; (4) costs
    accepted; (5) missing E3 evidence never favorable. Precedence among profiles is stated
    (A/D decisive; B/C/G acknowledged, overridden by present scope; E/F neutral) though only
    implicitly across section 1.3. No numeric weights, scores, ranks or additive counts; each
    of the six preferences appears once with C02/C03 columns; correlated sets
    (MAINTAINABILITY_PACKAGING_MIGRATION, PERFORMANCE_LOCAL_OVERHEAD_COST) are not summed. E2-001
    section 8 pre-freeze governance binds numeric weighting; E2-003 section 3 explicitly
    delegated an "explicit qualitative rationale" to E2-005, so a rule authored with the result
    is permitted (N-E2-005-02). The tie-break does discount future compatibility below present
    burden, which plan section 15 and AR-PRF-004 authorize while AR-FUT-001/002 keep the hard
    floor. Residual: profile D is over-read as support (F-E2-005-03).
  sensitivity_consistency: >-
    Section 1.3 addresses all seven verified profiles with wording consistent with comparison
    section 17.2: A supports C01 (and C03 avoids a service); B favors C03 and is preserved as a
    replay-driven reopen trigger; C favors C02/C03 and is stated as counting against C01; D
    partly supports C01 (over-read, F-E2-005-03); E and F "no stable advantage"; G no winner.
    Why D-016 authorizes privileging A: baseline section 1 items 2-3 plus ADR-009 rationale
    ("Future optionality cannot override v0.1 scope"), matching comparison profile C's own
    "Future optionality cannot override the v0.1 local-first hard floor or present cost".
  no_hidden_hybrid: >-
    Property-by-property comparison with verified C01: process topology (one task-bound
    integrated core + owned child tree + separate verifier context) = f02/f04; authority
    ownership (single-writer core, owner epoch) = f06; persistence (transactional current state
    + append-only material history + outbox/effect ledgers; no event-sourced authority; no
    content addressing) = f08/f29 LB-02/LB-04; operation model (INTENT->VALIDATED->...->
    OUTCOME_UNCERTAIN; first-outcome dedup; fence epoch) = f07; execution (co-resident supervisor,
    Tier 2 semantic floor, force-or-fence) = f04/f10; client (detachable non-authoritative
    presentation; EP-CTL-016; full-system shutdown distinct) = f02/f03; recovery (new epoch,
    nonterminal scan, no live-owner deadline enforcement) = f04/f09; evidence ownership (core
    evidence builder, immutable artifacts) = f15; verification (fresh least-privilege
    process/context/workspace) = f16; approval/effect (six-state chain, one-shot approval,
    readback-only confirmation) = f12; provider boundary (embedded neutral gateway) = f13;
    protected entry (co-resident controller outside ordinary capture, one-use recipient/use/fence,
    non-secret receipt, fail-to-WAIT) = f04/f18; local/remote seam (versioned executor port,
    extraction required later) = f20. No C02 persistent service, IPC/auth, lease/fence worker
    plane or independently replaceable worker authority; no C03 journal/reducer authority or
    projections-as-recovery-input. Baseline section 3's two compound class labels are
    vocabulary refinements, not structural imports (F-E2-005-04). Candidate SHA-256 equal to pins.
  architecture_baseline_coherence: >-
    Sections 2-4 define system shape, process boundaries, client lifetime, task/control
    authority lifetime, execution ownership, task/operation/approval/effect/evidence state
    authority, workspace ownership, routing authority (section 10), verifier path (section 11),
    protected-entry path (section 9), recovery reconstruction (section 7), packaging boundary
    (sections 16-17) and future remote seam (sections 16, ADR-009). Cross-section check: history
    vs current-state precedence is resolved ("current authoritative records remain normative",
    ADR-002); client detach vs core loss consistent between sections 2/7 and ADR-001/003; no
    global transactionality claimed anywhere (section 7 footer, ADR-002/003/004). No
    contradiction found within the baseline itself.
  e3_outstanding_truth: >-
    Grep of guarantee/ensure/validated/proven/demonstrated across baseline, ADRs and E3 plan:
    every hit is either a negation ("is not proven", "No ... has been ... exercised"), the
    unsupported-host disclaimer, or the phrase "final validated evidence bundle" (a different
    sense). Baseline section 8 bullet 5 and section 9 last two sentences, ADR-003/004/005
    "Missing evidence" sections, E3 plan sections 4 and 8 and the handoff all keep AR-EXE-003 and
    AR-SEC-006 as ARCHITECTURE_SEAM_CONFIRMED / E3 validation outstanding with SPQ-E2-002-03
    "proven: false". Present-tense design descriptions (section 9 "It obtains ... delivers ...")
    are followed immediately by the unselected/unvalidated statement.
  e3v_obligations: >-
    All eight IDs present with: canonical property and source ARs (verbatim equal to E2-001
    section 9), question, selected-architecture assumption, prerequisites (mechanism/config
    dependency), owner, required evidence, supported scope, unsupported scope, hard gate/success,
    configuration failure, missing evidence (fail closed), architecture failure, authorization/
    stop/budget, frozen handback set. Technical (001-007) and model/configuration (008) lanes are
    separated; E3V-004 live calls separately gated; E3V-008 USD 0 / zero calls. No E3V is treated
    as passed ("Execution status: PLAN_ONLY_NOT_AUTHORIZED_NOT_RUN"). Handback sets equal the
    verified closure section 9 sets; their closure defect is F-E2-005-01.
  e3v_002: >-
    Seam exists (owned supervisor, process-tree ownership, descendant accounting; baseline
    section 8, ADR-004); containment and authority fencing kept distinct ("Process-tree
    termination and authority fencing are distinct", E3 plan section 4 assumption); no host
    mechanism chosen or proven; mandatory later with unsupported host classes remaining
    unsupported; missing evidence "Block/fence the class; do not infer whole-tree or force
    feasibility"; architecture failure hands back frozen ADR-E2-003/004. Matches closure
    section 6 and comparison section 18.2.
  e3v_006: >-
    Seam exists (baseline section 9; ADR-005 decision para 3; TB-05/08/20); acquisition path
    stays outside ordinary request/model/transcript/terminal/log/telemetry/screenshot/
    accessibility/evidence capture; exact-recipient one-use delivery specified at architecture
    level; client/carrier mechanism unselected/unvalidated; raw values never in state/history/
    context/projection/log/evidence and never replayed; fail-to-WAITING_FOR_USER/blocked
    required; configuration failure vs architecture failure split explicit; frozen handback
    ADR-E2-001/004/005/008 with SPQ-E2-002-03 attached to ADR-E2-005 (V-E2-004-N9 satisfied;
    ADR-008 lists E3V-006 per V-E2-004-N3). No raw secret in any artifact.
  e3_qpa_001: >-
    E3-QPA-001 is the registration the E2-005 registry contract and plan section 14 required
    (a specific qualification-policy authority + independent-review path + blocking rule). It
    names the Founder as accountable owner, a future E3 author as drafter who may not
    self-approve, a fresh challenger and separate post-fix verifier path, three owned values
    (verification-rerun, deterministic-check-repetition, correction-attempt ceilings), value
    timing before any scored run, and E3_SCORED_EXECUTION_BLOCKED for missing/nonfinite/
    unreviewed/post-result values. Section 11.2 restates, without change, the frozen
    release-acceptance same_revision_verification_rerun_rule, flaky_rule and
    correction_attempt_ceiling ownership (VERSIONED_TASK_OR_QUALIFICATION_POLICY_AUTHORITY) and
    evaluation-suite section 8.1 rules; no numeric value is introduced. It is governance-visible
    (TASK_REGISTRY e3_ceiling_policy_ownership, PROJECT_STATE
    e2_005_e3_ceiling_policy_authority) but not a DECISION_LOG entry (N-E2-005-05).
  e4_deferrals: >-
    E3 plan section 12 and baseline section 18 preserve E4U-C01/C02/C03-IMPLEMENTATION with the
    verified closure section 10.1 item lists; C02/C03 bundles are labelled rejected-candidate
    provenance "not applicable to C01 without E2 reopening"; C01 bundle "applicable only if
    ... independently selected and E4 is separately authorized"; guardrails forbid smuggling
    service/lease or journal/reducer topology. No technology named. E4 not authorized.
  adr_set: >-
    Exactly nine files, IDs ADR-E2-001..009, one per plan section 9 boundary with titles equal to
    the planned decision boundaries; no split/combine; no tenth decision outside the nine areas
    (ADR-006/008/009 add a fourth explicitly rejected non-candidate option, which is not a new
    boundary).
  cross_adr_consistency_table: >-
    ADR-001 detachable client vs ADR-003 core loss = owner loss: CONSISTENT (ADR-001 defers full
    core loss to ADR-003). ADR-002 single source of truth vs ADR-007 evidence: CONSISTENT (bundle
    derived from authority, immutable after binding, cannot manufacture evidence; current
    records normative over history). ADR-004 isolation vs ADR-005 protected entry: CONSISTENT
    (no ambient child inheritance; exact-recipient grant is explicit). ADR-005 effect authority
    vs ADR-003 operation ownership: CONSISTENT (ADR-003 defers effect ambiguity to ADR-005;
    ADR-005 binds owner epoch). ADR-006 context vs ADR-002 authoritative history: CONSISTENT
    (context is a derived projector). ADR-008 telemetry vs evidence authority: CONSISTENT
    (telemetry never authorizes/proves) but ADR-008 class 2 "material audit facts" vs ADR-002
    "material history" ownership is AMBIGUOUS (F-E2-005-06, LOW). ADR-009 future seams vs
    ADR-001 topology: CONSISTENT (same task-bound core, no daemon). ADR obligation lists vs frozen
    handback sets: INCONSISTENT for ADR-006/E3V-005 and ADR-009/E3V-006, and the sets are not
    closed under the primary AR ownership the ADRs declare (F-E2-005-01, MEDIUM). Decision-class
    labels: INCONSISTENT vocabulary across ADR-004/006/008 headers, baseline section 15 and the
    handoff (F-E2-005-05, LOW). Verdict for this section: FAIL on the MEDIUM item.
  recovery_baseline: >-
    15 rows recomputed (client-only exit; core crash; host restart; owner failure; worker/
    coordinator/child failure; duplicate input; duplicate operation; duplicate effect or ack
    loss; partial authoritative write; partial filesystem write; stale workspace; stale
    approval; stale verification; pause/stop/force-stop; full-system shutdown), each with a
    three-way KNOWN_SUCCESS/KNOWN_FAILURE/UNKNOWN_OUTCOME endpoint where applicable and the
    global-transactionality disclaimer. Missing against plan section 11 and the prompt's minimum
    list: model/provider timeout or loss, tool timeout, reordered delivery, redirect, resume,
    protected-delivery ambiguity (prose only in section 9), and the per-row recovery-owner /
    bounded stop-escalation / evidence fields (F-E2-005-02, MEDIUM).
  approval_effect: >-
    Section 6 and ADR-005: durable INTENT (identity, target, policy/version, idempotency, base/
    owner epoch, expected readback) -> APPROVAL/REFUSAL (authenticated, exact scope, one-shot/
    expiring, revocable, mutation-detecting, replay-protected, cannot widen authority) ->
    ATTEMPT (persisted before dispatch; duplicate returns first outcome) -> OBSERVED_EFFECT
    (observation, not proof) -> CONFIRMED_EFFECT (fresh target readback only) | KNOWN_FAILURE |
    UNKNOWN_EFFECT (noncomplete, survives restart, no blind retry); revocation/staleness before
    dispatch denies with zero effect; dispatch/revocation/crash race reconciled from durable
    ordering and readback; restart revalidation never replays approval or protected input.
    Consistent with C01 f12 and the frozen contract.
  testability: >-
    Section 12 maps 170 cases, 18 oracles, 11 fixtures, 23 NEG families, 16 repository
    conditions, 30 Git/effect rows, 9 adequacy variants, 16 dangerous compositions, 8 reliability
    protocols and EP-CTL-016 to C01 seams equal to C01 f25; no ADR closes a seam (ADR-004/007/008
    share D25; ADR-003 requires fault injection at before/after acknowledgement, ownership
    transfer, dispatch, receipt, readback, control and terminal transition). Nothing implemented
    or run.
  contributor_burden: >-
    Baseline section 17 and ADR-009 negatives state the coupling, concept-count, crash-
    reproduction, port-discipline and documentation costs of C01 and explicitly disclaim
    "fewer components" as justification; the AR-PRF-006 row mirrors comparison section 5/13
    and the verified profile D. Fair; no independent rank produced by this review.
  migration_reversibility: >-
    Every ADR carries a commitment class, early-reversible vs foundational split, migration
    evidence and reopen triggers (baseline section 15); C01 -> C02-like extraction is described
    as substantial/costly (ADR-001/003/009; C01 f28 "costly_to_reverse"), consistent with
    comparison D22/section 13; C01 -> C03 requires E2 reopening (ADR-001/002). No understatement
    found beyond the label-vocabulary defect (F-E2-005-05).
  rejected_alternatives: >-
    C02/C03 are "Analytically viable, not proposed" with preserved strengths (baseline 1.1;
    ADR-001..009 rejected-alternative sections), reopen conditions and migration statements;
    the reasons trace to comparison sections 5, 9 (IPC/lease authentication burden), 13 and
    profile C/B; no nonviable/strawman language and no new unverified criticism. ADR-006/008/009
    "option 4" rejections are non-candidate anti-patterns, not C02/C03 strawmen.
  level_b_discipline: >-
    19/19 dispositions equal C01 f29 with E1 reasons; LB-02 content addressing NOT_USED (charter
    section 6.2 respected); no pattern adopted "because Grok Bot did it"; identifier probe over
    the reconstructed audit found 0 Level-C names/paths/schemas in E2-005 artifacts.
  technology_model_implementation: >-
    Scans for client frameworks, languages, databases, event stores, workflow engines, queues,
    containers/VMs, worktree-as-mandatory, cloud providers, Git libraries, agent frameworks,
    SDKs, vector/RAG stacks, telemetry vendors and packaging tools: 0 selections; baseline
    section 2 and every ADR "Unresolved implementation details" keep them open. Model/provider
    names: 0; six logical roles preserved unassigned; MODEL_REGISTRY HYPOTHESIS_ONLY. Tracked
    non-document files: .gitignore only; no spike/benchmark/evaluation artifacts; all counters 0.
  frozen_artifacts: >-
    git diff --stat against c2f7093 (E1 gate commit) for 03_product/, 06_evaluation/,
    10_checkpoints/: empty; against 0d702b8 (E2-001), 1a1c542 (E2-002), e5d541c (E2-003) and
    1f35f73 (E2-004 closure/handoff/reviews): empty; candidate/trace/matrix/closure SHA-256 equal
    to baseline section 20 pins. The E2-005 commit touched only the 16 authorized paths.
  governance_state: >-
    PROJECT_STATE and TASK_REGISTRY reconcile on every expected value (E2-001..004 VERIFIED;
    E2-005 READY_FOR_REVIEW / NOT VERIFIED; E2-006 BACKLOG blocked; gate NOT_EVALUATED;
    architecture not selected; preferred null; proposed C01; ADRs 9 proposed / 0 accepted;
    spikes/code/evaluation/benchmarks/paid calls 0; autonomy NOT_ELIGIBLE / build NO; S1-003
    DEFERRED). One list defect: PROJECT_STATE active_task_ids and ready_task_ids are both empty
    while E2-005 is in review, unlike the c870c83 (E2-003) and 3fc9a46 (E2-004) precedents that
    listed the task under active_task_ids (F-E2-005-07, LOW). README status/next-command block
    remains stale (N-E2-005-01, founder commit-time item).
