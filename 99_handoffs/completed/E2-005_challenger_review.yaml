      why_it_matters: "E3V-005 tests the authoritative/derived distinction; a compound class label leaves the verifier's authority test for the evidence bundle and for model context ambiguous (AR-EVD-001/AR-COR-004 treat the bundle as verification input, not authority). Bounded vocabulary cleanup."
      required_fix: "Map each section 3 row to exactly one canonical class (e.g., bound evidence bundle = AUTHORITATIVE STATE for artifact/evidence identity and verification run, with a note that it is constructed from other authoritative records and cannot manufacture missing evidence; model working context = LOSSY SUMMARY and/or EPHEMERAL WORKING CONTEXT as applicable) and align ADR-E2-002 wording."
