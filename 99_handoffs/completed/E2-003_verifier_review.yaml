section_evidence:
  comparison_baseline: "3 candidates (unique IDs/names, SHA-256 equal to comparison §2 pins and to the E2-002 verified blobs; git log shows no candidate change after 1a1c542); 65 ARs set-equal to the 65 E2-001 headings (59 HARD_CONSTRAINT / 6 WEIGHTED_PREFERENCE by heading class); 25 D-rows, 20 TB-rows, 19 LB-rows, 8 E3V contracts, 195 cells."
  comparison_matrix: "195 rows, 195 unique (candidate_id, criterion_id) pairs, 65 criteria x 3 candidates, 0 missing/duplicate; every source_evidence resolves to REQUIREMENTS.md:AR-* plus EP-ARCH-C0x.yaml:f23:AR-* plus an f-field; class column matches E2-001 per criterion; comparison_result vocabulary is {CONFIRMED_SATISFIED_FOR_COMPARISON, ARCHITECTURE_SEAM_CONFIRMED_E3_VALIDATION_OUTSTANDING, QUALITATIVE_TRADEOFF_NO_SCORE}; input_generation_status preserved as 52/5/2/0 + 6 per candidate; no numeric score, rank or weight column or value."
  hard_constraint_model: "Per candidate 59 hard = 57 CONFIRMED + 2 SEAM_OUTSTANDING + 0 blocking spike + 0 violation (recomputed identically for C01/C02/C03). The two seam-outstanding properties are AR-EXE-003 (E3V-002) and AR-SEC-006 (E3V-006) in every candidate, both already assigned to those obligations by the verified E2-001 register. Vocabulary explicitly denies empirical credit; register architecture_fact and required_e3_evidence are separate; candidate f10 process_termination/f18 protected_entry seams are quoted as structure only."
  s01_reclassification: "A: C01 f04 execution_owner + f10 process_boundary/cancellation/process_termination; C02 f04 execution_owner/control_and_fencing_owner + f10 process/process_termination; C03 f04 execution_owner/control_and_fencing_owner + f10 process/process_termination/process_tree_expectation — each exposes supervisor-owned process tree, cooperative cancel then force-or-fence, descendant accounting, and a separate durable authority fence (epoch / lease-fence / workflow owner-fence). B: the host primitive is identical in all three f10 isolation blocks (same TIER_2 assumption, same 'required host process-tree primitive must account for descendants', same unsupported fail-closed) so no outcome discriminates candidates. C: correctness contract §stop steps 3/5/7 and RR-006 admit 'force-terminate when safe/available and otherwise fence/revoke'; NEG-TERM-01 'force/fence when available'; register and E3V-002 keep force-unavailable classes unsupported and fenced. D: register process_tree_vs_fence field; comparison §4.3/§11/TB-07 state logical fencing is not credited as containment. E: E3V-002 required_evidence lists representative parent/descendant trees, force primitive, survivor discovery on each claimed host class. F: 'Success applies only to tested host/platform/process/configuration classes ... never broaden by analogy'. G: handback only when no conforming realization can satisfy AR-EXE-003 for a linked ADR (E3_HAND_BACK_TO_E2). H: PRODUCT_CLASS_UNSUPPORTED narrows and fails closed; EVIDENCE_MISSING_FAIL_CLOSED cannot broaden scope."
  s02_reclassification: "A: C01 f04 protected_delivery_path + f18 protected_human_entry; C02 f04 protected_delivery_path (scope_validator/persisted_receipt/worker_replacement/replay_rule/revocation_and_fencing) + f18 protected_entry/fail_closed; C03 f04/f18 protected_entry/fail_closed — each has a boundary distinct from ordinary input with capture suspension/exclusion, exact recipient, non-secret receipt, no replay, fail-to-WAIT. B: AR-SEC-006 cells are hard seam-outstanding, not preference. C: TB-05/TB-20 rows and E3V-006 raw-value-absence list. D: UF-11 step 2 quoted in comparison §10; register missing_evidence WAITING_FOR_USER. E: comparison compares protected topology (co-resident gated path / service-bypass direct path / out-of-event broker) without naming a client. F: client surface is ADR-E2-001, unselected; the challenger's observer-completeness argument holds. G: E3V-006 validates 'selected client/execution configuration'. H: register failure_implication and E3V-006 failure/handback split configuration failure / PRODUCT_CLASS_UNSUPPORTED / structural E3_HAND_BACK_TO_E2 (ADR-E2-005)."
  minimal_e2_004_set: "Independent re-derivation: SPQ-01 (host process primitive) and SPQ-02 (client capture surface) are candidate-invariant and fail-closed under frozen E1; SPQ-03/04/05 are candidate-specific delivery mechanisms that presuppose the selected client and cannot be exercised before ADR-E2-001/005 exist; all 57 other hard constraints are design-structural with E3V obligations; the 10 analytic items are bounded structural facts or tradeoffs; E3V-007 measurements and E3V-008 benchmarks affect preferences/eligibility only. No empirical experiment exists whose outcome could differ by candidate and change selection, and none is a system-wide prerequisite unresolved by fail-closed declaration. Minimal set = 0 = NO_PRESELECTION_SPIKE_REQUIRED. Zero was not assumed: the verifier searched for a candidate-discriminating experiment (C02 local authenticated IPC feasibility, C03 deterministic replay/checkpoint feasibility, C01 co-resident secret separation) and found each to be a well-understood design property already verified SATISFIED_BY_DESIGN in E2-002 with E3V-001/003/005/006 validation, not a selection discriminator."
  e2_004_closure_contract: "Comparison §16.1, register e2_004_no_spike_closure_contract, handoff e2_004_contract, and TASK_REGISTRY E2-004 e2_003_fixer_input_contract each list the same nine conditions; pass_output NO_PRESELECTION_SPIKE_REQUIRED, failure_output E2_005_BLOCKED_WITH_EXACT_UNCLOSED_ITEM, bypass_permitted false, technical_spikes_run delta 0; E2-004 forbidden_actions prohibit executing any item not classified E2_PRESELECTION_SPIKE_REQUIRED, so no experiment can run merely because a spike stage exists."
  spq_03_05: "Comparison §16 table rows SPQ-E2-002-01..05 each state original question, why it does not block E2, existing seam, E3 owner/evidence, success/failure/handback/fail-closed; register source_reconciliation maps each SPQ to its normalized record (S01, S02, E3U-C01/C02/C03-PROTECTED-DELIVERY) with source_refs SPQ-E2-002-0x and V-E2-002-02; each delivery record carries original_question, why_not_e2_selection_blocking, architecture_seam, required_e3_evidence, success/failure/missing/e2_adr_handback. No historical question disappeared."
  e3v_002_handoff: "Comparison §18.2 (9 rows) and register E3V-002 cover property, representative validation, process-tree/descendant behavior, stale execution fencing, force-termination availability, failure/recovery, evidence/readback, scope with explicit unsupported/untested classes and no broadening by analogy, and root-cause consequence with E2/ADR handback."
  e3v_006_handoff: "Comparison §18.3 (9 rows) and register E3V-006 separately cover protected acquisition, capture exclusion, exact-recipient delivery, replacement/recovery, no replay, unauthorized-surface exclusion, fail-to-WAIT, root-cause split, and scope; synthetic sentinel only; selected client/execution configuration must be validated; configuration vs class vs structural failure distinguished; handback to ADR-E2-005 explicit."
  analytic_resolution_model: "10 PAPER_RESOLVABLE records: RESOLVED_TRADEOFF x5 (C01-U01, C01-U02, C02-U01, C03-U01, C03-U02), RESOLVED_SUPPORTS_PROPERTY x2 (C02-U02, C03-U03), RESOLVED_ARCHITECTURE_SEAM_PRESENT_E3_VALIDATION_REQUIRED x3 (C01-U03, C02-U03, C03-U04); one vocabulary across register, comparison §16, handoffs, TASK_REGISTRY and PROJECT_STATE; no valence label anywhere in active artifacts; C01 extraction cost, C02 service/protocol lock-in and C03 event lock-in all visible as tradeoffs in §5/§13/§17.2."
