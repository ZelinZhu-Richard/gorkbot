    title: Run priority Grok Bot black-box verification
    stage: 0
    objective: Test the highest-impact documented Grok Bot behaviors on an authorized eligible account with exact build plan region and rollout context.
    why_it_matters: Official documentation does not prove account rollout reliability cancellation approval recovery isolation or false-completion behavior.
    owner_role: AUTHOR
    assigned_model: null
    reviewer_model: null
    status: BLOCKED
    priority: P0
    dependencies:
      - S0-002
    blocked_by:
      - eligible_grok_bot_account_and_plan_not_recorded
      - installed_app_build_and_safe_test_environment_not_recorded
      - S0-002_independent_review_pending
    files_to_read:
      - 02_research/GROK_BOT_BASELINE_2026-08-21.md
      - 00_inbox/prepared_materials/03_GROKBOT_EXAMPLES/
      - 01_governance/SOURCE_LEDGER.csv
      - SECURITY.md
