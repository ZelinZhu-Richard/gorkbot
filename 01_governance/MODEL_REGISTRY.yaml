    - qualification_date_and_window
    - expiry_and_revalidation_triggers
    - supersedes_or_superseded_by
  stale_or_revalidation_triggers:
    - moving_alias_or_served_version_change
    - prompt_tool_context_fallback_or_policy_change
    - account_data_region_or_credential_policy_change
    - role_task_requirement_or_protocol_change
