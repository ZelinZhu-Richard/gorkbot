    gap: "No provider funded API account, balance, entitlement, or minimal authorized call is recorded."
    blocks:
      - benchmark_execution
      - production_provider_selection
  - gap_id: MAG-002
    gap: "Exact founder organization rate limits, quotas, regional availability, and negotiated prices are unknown."
    blocks:
      - throughput_and_cost_baseline
  - gap_id: MAG-003
    gap: "Prototype monthly model and infrastructure budget is not confirmed."
    blocks:
      - benchmark_replication_budget
  - gap_id: MAG-004
    gap: "Required retention, training, residency, and data-classification policy is not selected; Fable 5's documented 30-day retention requirement may be material."
    blocks:
      - sensitive_fixture_use
      - production_suitability
  - gap_id: MAG-005
    gap: "DeepSeek V4 open-weight license, hosting requirements, and commercial-deployment terms were not reviewed."
    blocks:
      - local_or_self_hosted_candidate_status
  - gap_id: MAG-006
    gap: "Whether customers bring provider keys, the platform resells inference, or both is undecided."
    blocks:
      - billing_and_credential_architecture

benchmark_policy:
  role_assignments_locked: false
  provider_reputation_is_evidence: false
  exact_model_and_config_required_per_run: true
  measure_verified_success: true
  measure_false_completion: true
  measure_cost_per_verified_success: true
  measure_latency_distribution: true
  measure_first_pass_structured_output: true
  require_independent_review_for_consequential_roles: true
