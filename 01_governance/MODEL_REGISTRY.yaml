  current_qualification_record_count: 0
  current_eligible_configuration_count: 0
  current_role_assignment_count: 0
  configuration_role_verdict_vocabulary:
    ELIGIBLE: "The exact configuration passes every frozen hard gate and threshold for the named role, task classes, scope and qualification window; classification alone does not authorize use."
    ELIGIBLE_WITH_CONSTRAINTS: "The exact configuration passes only inside explicitly recorded task, capability, tool, data, route, budget, latency/resource, fallback or environment constraints; outside them it is not eligible."
    INELIGIBLE: "Valid evidence fails a hard gate or required threshold for the named role/task/scope."
    INCONCLUSIVE: "Admitted evidence is insufficient, invalid, conflicting, incomplete or too imprecise for a favorable decision."
    NOT_TESTED: "No admitted qualifying block exists; no eligibility or normal-route credit."
  preserved_route_eligibility_vocabulary:
    - PRODUCTION_OR_NORMAL_ELIGIBLE
    - EVALUATION_ONLY
    - USER_CONFIGURED_UNVERIFIED
    - DISALLOWED
  route_separation_rule: "Every E3 benchmark attempt uses route_purpose E3_EVALUATION and route_eligibility EVALUATION_ONLY. Benchmark admission is not normal-task eligibility. USER_CONFIGURED_UNVERIFIED supplies no E3 gate credit; DISALLOWED never runs."
  canonical_logical_roles:
    - AUTONOMOUS_CONTROLLER
    - PLANNER
    - EXECUTOR
    - CODER
    - COMPUTER_CONTROLLER
    - VISION_INTERPRETER
    - VERIFIER
    - SECURITY_REVIEWER
    - MEMORY_EXTRACTOR
    - SUMMARIZER
    - ROUTER
