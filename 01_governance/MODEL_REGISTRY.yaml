    - "A model family name is never eligible without an exact tested configuration."
    - "One configuration needs a separate verdict for each role and task-class envelope."
    - "A fallback is a separately eligible exact configuration; hidden fallback is forbidden."
    - "Superseded and unfavorable records remain append-only evidence."
    - "No eligibility record activates E4 without E3_GATE_PASSED and a separate explicit Founder AUTONOMOUS_BUILD_AUTHORIZED decision."

claim_status_vocabulary:
  VERIFIED_PUBLIC: "Current first-party public source directly supports the claim."
  FOUNDER_ACCOUNT_VERIFIED: "Authorized account evidence or a minimal authorized call supports the claim for the founder's account."
  PUBLIC_BUT_ACCOUNT_UNVERIFIED: "Public availability is documented, but the founder's account, quota, region, balance, and entitlement were not tested."
  INFERENCE: "Reasoned interpretation rather than a direct source statement; never used as account or production proof."
  UNKNOWN: "Evidence is absent, ambiguous, account-specific, or not tested."
  STALE_OR_INCORRECT: "A prior value is contradicted or superseded by the current primary source."

access_dimension_rule:
  dimensions:
    - CONSUMER_PRODUCT_ACCESS
    - PUBLIC_API_AVAILABILITY
    - FOUNDER_ACCOUNT_ACCESS
    - PRODUCTION_SUITABILITY
  rule: "Each provider and candidate records all four dimensions. No dimension may be inferred from another."
  founder_account_verified_claims_in_this_registry: 0

verification_scope:
  claim_status: VERIFIED_PUBLIC
  included:
    - current_public_product_identity
    - current_public_api_availability
    - current_public_model_identifiers_and_release_status
    - current_public_context_and_output_limits
    - current_public_list_and_service_tier_pricing
    - selected_public_capability_data_control_and_jurisdiction_constraints
  excluded:
    - founder_account_login_or_subscription_state
    - funded_api_access_or_balance
    - account_model_entitlements
    - account_rate_limits_or_quotas
    - negotiated_pricing
    - actual_api_responses_or_served_versions
    - benchmark_performance
    - legal_or_security_approval_for_production
  warning: "Founder-reported consumer access and public catalog availability do not prove funded API access, account entitlement, production quotas, contractual suitability, or benchmark fitness. No credentials were inspected or stored; no API model call or paid benchmark was run."

