  f02_system_shape:
    summary: >-
      One persistent local application core owns policy, orchestration, canonical writes,
      embedded durable state, client projections, and recovery. Untrusted execution and
      independent verification run in owned child-process boundaries. Provider and tool
      adapters are reached through explicit gateways, while no external service is required.
    colocated:
      - "Authenticated local interaction controller, task scheduler, policy kernel, state writer, and projection builder share the core process to keep one local authority boundary."
      - "The durable store is embedded and private to the core; it is not directly writable by the client view, models, executors, or verifier."
    separated:
      - "Repository/tool commands execute under an execution supervisor in isolated child process trees."
      - "Verification runs in a separately launched, least-privilege mutable context with its own review workspace and read-only access to authoritative evidence."
      - "Provider-specific behavior is contained behind the provider gateway; protected input is handled by a dedicated acquisition controller."
    end_to_end_flow: >-
      Authenticated intent enters the core, is durably admitted and acknowledged, becomes a
      versioned task/plan, produces validated operation intents, crosses approval and capability
      gates, executes in an isolated workspace, is observed and reconciled, produces evidence,
      and is independently verified before the core may derive a completed disposition.
    lifetime_model:
      CLIENT_LIFETIME: "A presentation session/window may attach, disconnect, close, and reconnect independently of the integrated application runtime. Closing only the presentation surface never means task cancellation."
      CONTROL_AUTHORITY_LIFETIME: "The integrated core is task-bound application authority, not a separately installed permanent service. It may continue headlessly while an admitted task is active or move work to a durable safe wait; deliberate full-application shutdown starts an explicit quiesce/fence/checkpoint sequence."
      EXECUTION_OWNER_LIFETIME: "The in-core supervisor remains alive independently of presentation attachment while productive work runs. If the whole core exits or crashes, no child retains valid authority: the current fence is revoked, bounded process containment applies, and restart reconciliation establishes a new owner epoch before work can resume."
      TASK_LIFETIME: "An admitted task outlives every client session and core process instance until a truthful terminal disposition or an explicit retained blocked/waiting disposition. Completion never depends on a UI process."
      WORKSPACE_LIFETIME: "A task workspace outlives clients and process instances until authoritative task/effect/evidence reconciliation permits scoped cleanup; it is never deleted merely because a presentation client closes."
      relationships: "CLIENT_LIFETIME is strictly shorter and non-authoritative. CONTROL_AUTHORITY_LIFETIME and EXECUTION_OWNER_LIFETIME are co-resident in the task-bound integrated runtime, while TASK_LIFETIME and WORKSPACE_LIFETIME are durable across its loss. This preserves C01's integrated shape and does not introduce C02's permanent service plus replaceable-worker topology."

  f03_client_interaction_boundary:
    conceptual_client: "Integrated local desktop-style interface; technology is unselected and this is a CANDIDATE ASSUMPTION, not a project decision."
    authentication_and_intent: "A local principal session submits stable request IDs and expected task versions to the core policy boundary."
    acknowledgement: "The client receives acceptance only after the authoritative mutation is committed and rereadable; duplicate request IDs return the first outcome."
    reconnect: "The interface reconstructs an axis-qualified derived projection from the core and displays gaps, waits, blockers, controls, effects, verification, and limitations."
    disconnect_and_exit: "Client-only close/disconnect detaches the presentation and leaves the healthy task-bound core/supervisor authoritative. Explicit full-system shutdown is a different authenticated control path that stops new dispatch, safely suspends or fences active work, persists the disposition, and never fabricates cancellation or completion."
    stale_client_rule: "A reconnecting client supplies current authenticated session and observed versions; it receives a fresh projection and never regains prior control authority automatically."
    controls: "Pause, stop, redirect, resume, approval, denial, and revocation are commands to the durable core, never UI-only state."
    approval_display: "The client renders inert, complete normalized action scope and the durable approval identity; display truncation cannot bind executable scope."
    evidence_inspection: "The client can open underlying immutable records, artifact references, exact revision bindings, and verifier results rather than only an executor summary."

  f04_process_boundaries:
    orchestration_owner: "The single-writer local core process owns task scheduling, versions, ownership epochs, controls, and recovery decisions."
    persistence_owner: "Only the core persistence port can commit authoritative records; store utilities operate offline under explicit migration/recovery authority."
    execution_owner: "The co-resident execution supervisor creates bounded process groups, assigns operation/fence identities, captures I/O, cancels descendants, and reports observed state. It survives presentation loss but is not a separate permanent service or replaceable worker authority."
    verification_owner: "A fresh verifier process/context owns a verification run and can read the exact candidate/evidence and rerun checks without author workspace write authority."
    provider_call_owner: "A provider gateway validates route purpose, eligibility, data/network authority, budgets, and explicit fallback before an adapter can dispatch."
    control_and_fencing_owner: "The core durably orders control; the supervisor enforces process cancellation/fencing and the core reconciles any uncertain effect."
    communication_rule: "Every crossing uses versioned request/result envelopes with task, operation, owner epoch, policy, capability, deadline, and correlation identity."
    no_live_owner_semantics: "If no integrated core/supervisor is live, no productive dispatch is authorized and no stale child result may commit. Persisted deadlines remain authoritative but are not claimed to receive real-time enforcement while every owner is absent; the next startup immediately classifies overdue/nonterminal work, fences old authority, and enters RECOVERING, BLOCKED, CANCELLED, or OUTCOME_UNCERTAIN as evidence permits."
    full_system_shutdown: "A deliberate full-system shutdown is distinct from client-only exit: stop intake, persist shutdown intent, quiesce/cancel/fence children, record partial/unknown effects, invalidate live handles, and leave durable tasks/workspaces reconstructable."
    protected_delivery_path: "Protected acquisition and exact-recipient handoff remain inside the integrated trusted application boundary but outside ordinary input, transcript, model, tool-output, telemetry, screenshot, and evidence pipelines. A one-use recipient/use/fence scope carries raw bytes only in transient protected memory; the core persists only the non-secret receipt and reacquires after ambiguity rather than replaying a value."

