  f24_decision_domain_trace:
    D01_CLIENT_INTERACTION_BOUNDARY: {owner: "Integrated client controller; core remains authority", answer: "Durable request IDs/acks, reconnect projections, controls, approval display, evidence drilldown and protected entry are explicit."}
    D02_CORE_APPLICATION_RUNTIME: {owner: "Local core", answer: "One single-writer runtime owns policy/orchestration/recovery; worker/verifier/provider ports remain separate."}
    D03_TASK_WORKFLOW_ORCHESTRATION: {owner: "Core scheduler", answer: "Versioned orthogonal task axes, owner epochs, controls, retries and retirement are durable."}
    D04_DURABLE_STATE_PERSISTENCE: {owner: "Core persistence port", answer: "Transactional current records plus material history/outbox define ack, migration and quarantine."}
    D05_CANONICAL_TASK_CONVERSATION_EVIDENCE_MODEL: {owner: "Core state and evidence builder", answer: "Original messages and task/evidence facts are authoritative; transcript/status/summary are derived."}
    D06_EVENT_OPERATION_HISTORY: {owner: "Core history/effect ledger", answer: "Immutable material mutations and operation/effect chains preserve causal history and gaps."}
    D07_FILESYSTEM_WORKSPACE_ABSTRACTION: {owner: "Workspace broker", answer: "Admission, pinned base, isolated mutable workspace, stale detection and cleanup are centralized."}
    D08_EXECUTION_PROCESS_CONTROL: {owner: "Execution supervisor", answer: "Versioned envelopes, process trees, I/O limits, cancellation and fencing form the boundary."}
    D09_ISOLATION_SANDBOXING: {owner: "Workspace broker plus supervisor", answer: "Path/object, process, secret and network controls are structural; host support is declared."}
    D10_GIT_INTEGRATION: {owner: "Git adapter", answer: "All thirty rows, helper suppression, ref/index/worktree readback and local/remote separation are enforced."}
    D11_APPROVAL_PERMISSION_SYSTEM: {owner: "Policy kernel and approval ledger", answer: "Grants and one-shot approvals bind exact versions/targets; protected input is a separate path."}
    D12_EXTERNAL_EFFECT_RECONCILIATION: {owner: "Effect ledger", answer: "Intent/approval/attempt/observation/readback keep known success, known non-success and unknown distinct."}
    D13_MODEL_PROVIDER_GATEWAY: {owner: "Provider gateway", answer: "Role-neutral normalized contracts contain provider semantics, routing, data policy, failures and usage/cost."}
    D14_ROUTING_CAPABILITY_DISCOVERY: {owner: "Provider/capability gateways", answer: "Purpose, eligibility, capability evidence, fallback and zero-dispatch denial are explicit."}
    D15_CONTEXT_MEMORY_COMPACTION: {owner: "Context assembler", answer: "Bounded manifests derive from durable records; summaries are source-bound, lossy and invalidatable."}
    D16_VERIFICATION_ARCHITECTURE: {owner: "Verifier runtime", answer: "Separate mutable context reads underlying state, reruns checks, judges adequacy and records verifier errors."}
    D17_EVIDENCE_ARTIFACT_SYSTEM: {owner: "Evidence builder/validator", answer: "Profile bundles, exact revision, stable large-output refs, redaction, gaps and dispositions are validated."}
    D18_OBSERVABILITY_LOGGING: {owner: "Observability port", answer: "Correlated diagnostics remain derived and cannot replace mandatory audit/evidence authority."}
    D19_ERROR_FAILURE_MODEL: {owner: "Failure registry and recovery coordinator", answer: "Typed layer/retry/consequence/owner records preserve unknowns and determine safe next actions."}
    D20_SECURITY_BOUNDARIES: {owner: "Policy kernel and named brokers/gateways", answer: "TB-01..20 map every enforcement point; no control rests on model self-restraint."}
    D21_LOCAL_FIRST_PACKAGING: {owner: "Application packaging boundary", answer: "One local package/store/core plus child workers, explicit migrations and no hidden mandatory service."}
    D22_FUTURE_REMOTE_EXECUTION: {owner: "Executor port", answer: "Serializable identity/control/result/evidence contract is reserved; transport is not implemented."}
    D23_FUTURE_CONCURRENCY_MULTI_AGENT: {owner: "Core ownership model", answer: "Scoped IDs/versions/epochs reject cross-owner reuse; actual concurrency and multi-agent scheduling are deferred."}
    D24_EXTENSION_SKILL_CONNECTOR_BOUNDARY: {owner: "Capability gateway", answer: "Versioned provenance/authority/limit/test contract is reserved without loader or ambient power."}
    D25_E1_SUITE_TESTABILITY: {owner: "Test harness ports", answer: "Store, scheduler, supervisor, gateways, effect ledger, evidence and verifier expose injectable clocks/faults/readbacks."}

