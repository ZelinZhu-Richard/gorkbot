  f28_migration_reversibility_profile:
    easy_to_reverse:
      - "Replace provider/tool/Git adapters behind versioned ports."
      - "Replace derived client projections, transcript rendering, telemetry and summary strategy."
      - "Change verifier implementation while retaining run/evidence contracts."
    costly_to_reverse:
      - "Split the integrated core into a persistent service because authority, lifecycle and local IPC must be extracted and migration-tested."
      - "Replace the authoritative persistence/history representation after real task/effect/evidence records exist."
      - "Change identity, approval/effect or evidence semantics because historical references and recovery depend on them."
    data_state_migration: "Versioned export includes all authoritative records, immutable history, artifacts, integrity/gap state and migrations; import validates and invalidates leases/current verification."
    provider_migration: "Provider-neutral logical records survive; adapter-specific request/result evidence remains retained and explicitly nonportable where necessary."
    execution_boundary_migration: "The owned executor port can move to a local service or remote worker, but core scheduling/control assumptions and effect acknowledgement paths must be redesigned and reverified."
    client_replacement: "Client is derived and replaceable; protected-entry and authenticated-control semantics must be reproduced before replacement."
    local_to_remote: "Stable IDs/envelopes help, but extracting the single local authority and defining transport failure/identity/authentication is substantial future work."
    lock_in: "Primary lock-in is to the integrated single-writer core and chosen persistent record semantics, not to a provider/model."
    reversal_triggers: "Failure of process fencing, protected entry, durable ack/recovery, independent verification, or future-floor analysis returns the candidate to E2 rather than being patched by prose."
    confidence: "PROPOSAL_WITH_SELECTION_BLOCKING_UNKNOWNS; no numeric score."

