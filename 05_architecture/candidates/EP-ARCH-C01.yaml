  f26_known_weaknesses_and_assumptions:
    facts:
      - "Frozen E1/E2 inputs specify semantics but no implementation technology, empirical isolation proof, or supported-host matrix."
      - "No architecture spike, evaluation case, benchmark, provider call, or application implementation has run."
    candidate_assumptions:
      - "A supported local platform can provide one reliable single-writer process and a healthy persistent-volume boundary."
      - "A separate verifier process/context and review workspace can meet the verified independence floor."
      - "Safe process-tree, path, network and protected-entry primitives can be declared for a bounded host class."
    known_weaknesses:
      - "A core-process crash affects interaction, scheduling, policy, persistence access and recovery presentation together, although durable truth survives."
      - "The integrated boundary concentrates code and review responsibility; port discipline must prevent it becoming an untestable monolith."
      - "Moving orchestration or persistence across a remote boundary later requires extracting interfaces currently colocated in one process."
      - "Verifier separation is process/context based; project policy must still establish eligible verifier identities/configurations."
      - "Real-time timeout enforcement requires the task-bound integrated owner to remain live; after full core loss, deadlines are enforced during startup reconciliation rather than pretending an absent process acted."
    unsupported_environments:
      - "Fully compromised/privileged host, untrusted persistent media, and process classes that cannot be bounded or authority-fenced."
      - "Repository/filesystem topologies not classified as supported after composition of the sixteen E1 conditions."
      - "Consequential external effects without idempotency evidence or authoritative readback."
    isolation_support_boundary: "C01 supports untrusted execution only where its integrated broker and the declared host together provide Tier 2 descendant filesystem/network/process/credential enforcement; Tier 0/1-only descendant execution is unsupported, while missing protected capture/delivery closes to waiting/blocked."
    correlated_risks:
      - "Colocation couples contributor complexity, failure blast radius, migration cost and future remote adaptation; E2-003 must avoid double-counting."
      - "Isolation, protected entry, packaging and supported-host scope are correlated feasibility questions, not favorable unknowns."

