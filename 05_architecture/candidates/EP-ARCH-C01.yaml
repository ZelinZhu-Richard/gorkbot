      TB-05: {trust_and_assets: "Protected secrets/private data; confidentiality and use scope", authority_source: "Protected-location policy and exact recipient/use grant", allowed_flows: "Opaque one-use delivery to exact authorized recipient", forbidden_flows: "Model/chat/log/evidence/screenshot/clipboard/ambient child exposure", enforcement_point: "Secret classifier and protected-entry controller", failure_behavior: "Do not read; wait/block and record non-secret reason", evidence: "Non-secret receipt identity, recipient, use, time, disposition", recovery: "Reacquire after revalidation; raw value is never persisted or replayed"}
