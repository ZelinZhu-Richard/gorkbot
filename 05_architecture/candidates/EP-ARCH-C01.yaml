  f22_open_source_contributor_burden_accessibility:
    setup_complexity: "One application setup plus declared local build/test toolchain and supported-host prerequisites."
    processes_services: "One task-bound integrated local core may remain headless while admitted work runs or safely suspends; executor/verifier children are bounded under that core and are not replaceable authorities; no external database, queue or permanent daemon."
    required_infrastructure: "Local filesystem, Git for supported repository workflows, declared process controls, and optional separately configured providers."
    platform_assumptions: "Host must support the declared process-tree, path, protected-entry and local durability primitives; unsupported classes are explicit."
    dependency_toolchain_burden: "Core/client/persistence are one distribution boundary, while adapters and workers can be bounded packages; concrete dependency count is UNKNOWN until implementation selection."
    local_tests: "All architecture contracts expose offline fake provider/tool/effect adapters and fault points; no paid service is required for deterministic suite work."
    reproduction_and_debugging: "One correlated local store/history and process tree simplify causal inspection, but core failures can span several colocated responsibilities."
    bounded_component_change: "Adapter, policy, workspace, execution, evidence and verifier ports are explicit even though their orchestration is colocated."
    documentation_burden: "Must document the core authority map, store/recovery invariants, each port, supported hosts, migration and protected-entry limitations."
    preference_status: "AR-PRF-006 characterized only; no score or comparative conclusion."

