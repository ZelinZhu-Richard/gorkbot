  f06_authoritative_state_ownership:
    canonical_writer: "Single-writer core persistence port under an ownership epoch and compare-version precondition."
    authoritative:
      - "Task, request, plan, predicate, policy, authority, ownership and lifecycle axes"
      - "Operation, control, approval, attempt, effect, failure, verification and disposition records"
      - "Original conversation/message records, evidence metadata, artifact identities, routing provenance, retention and migration history"
    derived:
      - "Client status, transcript rendering, indexes, dashboards, aggregate state labels, evidence presentation"
    ephemeral:
      - "Live client session, in-memory scheduler queue, process handles, streaming buffers, prompt assembly cache"
    lossy:
      - "Context summaries and resume briefs with source IDs, versions, trust labels, omissions and invalidation state"
    versioning_and_history: "Every material mutation records expected prior version, new version, actor, owner epoch, cause, time, policy/plan/predicate versions, and immutable history reference."
    stale_writer_rule: "A store compare-version and owner-epoch mismatch rejects the write and any dispatch; rejected stale activity is retained."

  f07_operation_model:
    identity: "Stable request, task, attempt, operation, dispatch, process-tree, effect, and result IDs are distinct."
    scheduling: "The core scheduler claims eligible work under one durable owner epoch and finite prospective limits."
    lifecycle: "INTENT -> VALIDATED -> WAITING_FOR_APPROVAL when needed -> DISPATCHED -> RUNNING/RECONCILING -> terminal known outcome or OUTCOME_UNCERTAIN."
    retries: "Attempts share the original operation/effect identity and retain cumulative count, cost and outcomes; retry requires declared retryability, ceiling, current authority, known effect state, and fresh workspace/provider checks."
    pause_stop_redirect_resume: "Controls commit before acknowledgement, prevent later productive dispatch, quiesce/cancel/fence in-flight work, and resume only after full revalidation."
    cancellation_fence: "The supervisor uses process-group ownership plus a durable fence epoch; post-fence results cannot mutate authority and are retained as stale observations."
    duplicate_delivery: "Stable request identity returns the first durable outcome with provenance and launches no second task, mutation, dispatch, or effect."
    retirement: "Agent disable stops claims; retirement is terminal for new work but preserves identity, in-flight disposition, evidence, and unresolved-effect responsibility."
    result_validation: "Invalid pre-dispatch requests produce zero effect; an invalid or lost post-dispatch result triggers readback/reconciliation rather than zero-effect fiction."

  f08_persistence_semantics:
    candidate_choice: "Embedded transactional current-state records plus append-only material history and durable operation/effect outbox-inbox ledgers. This is a Level B candidate choice, not a project decision."
    acknowledgement_boundary: "Acknowledge only after the current-state mutation, immutable history record, and required outbox/evidence references commit consistently and are rereadable."
    durability_scope: "Process and declared supported host restart on the same healthy persistent volume; device/media loss and fully compromised storage are explicitly unsupported pending backup policy."
    versioning: "Optimistic versions and one core ownership epoch serialize canonical writes and approval/effect consumption."
    partial_write_and_corruption: "Atomic commit yields old or new state; startup integrity checks quarantine corrupt/unmigratable records, preserve original bytes, and block affected authority."
    retention_and_deletion: "Policy-led holds and deletion records distinguish logical removal from physical deletion; evidence required for open effects or verification cannot be silently removed."
    migration: "Forward schema migration uses versioned, restartable steps with pre-migration snapshot, validation, rollback boundary, and retained migration ledger."
    backup_restore_assumption: "Export/restore is a declared local operation; restored state receives a new store instance identity, validates references, invalidates stale leases/verification, and reconciles effects."
    artifact_storage: "Large outputs are immutable bounded local artifacts with stable IDs, integrity metadata, provenance, redaction state and lifecycle references; content addressing is not required."
    transactional_authority_scope: "The word transactional applies only to authoritative records committed through the embedded core persistence boundary: current state, material history, and required local outbox/inbox references. It does not extend across the workspace filesystem, child processes, Git remotes, external APIs, provider dispatch, or any other independently owned effect."
    nontransactional_reality: "For every effect outside that boundary the core records intent before attempt, records the attempt/correlation, performs target readback when available, reconciles against actual state, and retains KNOWN_SUCCEEDED, KNOWN_FAILED, or OUTCOME_UNCERTAIN. No fictional global transaction or rollback is claimed."
    external_effect_recovery_bridge: "A stable operation/effect identity, durable pre-dispatch intent, one-shot authority, attempt record, non-secret receipt, and authoritative readback provide the design-level AR-DUR-003 bridge. Lost acknowledgement never authorizes blind replay and remains unknown when readback cannot establish truth."

  f09_recovery_model:
    startup_sequence: "Acquire a new single-writer epoch, validate store/schema/history integrity, reconstruct all authoritative axes, invalidate live handles, classify every nonterminal operation, reread repository/workspace/authority/approval/effect/verification state, then resume or remain recovering/blocked."
    scenarios:
      client_only_interruption: "Detaching or closing the presentation without a full-system control leaves the task-bound core/supervisor healthy; work continues or reaches its policy-bounded wait and reconnect reconstructs durable truth. This is EP-CTL-016, not an orchestrator crash."
      application_crash: "Transactional state recovers; uncommitted mutation is absent, acknowledged mutation is present; in-flight dispatches enter reconciliation."
      host_restart: "Same startup sequence on the declared persistence volume; processes are rediscovered or treated as fenced/unknown under host support policy."
      worker_failure: "Supervisor records terminal process evidence; known no-effect may retry within ceiling, otherwise reconcile."
      model_timeout: "Record model versus provider/transport timeout, usage uncertainty and cancellation; no hidden fallback."
      tool_timeout: "Request cancellation, enforce process-tree bound, retain output/effects, then terminal or uncertain outcome."
      lost_tool_result: "Treat possible effect as unknown; validate result correlation and perform target-specific readback."
      partial_write: "Recover old/new atomic state or quarantine with original bytes and explicit blocker; never fabricate missing history."
      stale_workspace: "Identity/base/owner mismatch invalidates workspace and verification; reread/recreate only under current authority."
      duplicate_operation: "Dedup by stable request/operation ID and return the first outcome; rejected duplicate is auditable."
      duplicate_effect: "Effect identity/idempotency evidence plus readback prevents a second attempt; uncertainty blocks blind replay."
      external_ack_loss: "Persist OUTCOME_UNCERTAIN until authoritative readback establishes known success or known non-success."
      stop_force_termination: "Durable STOPPING orders cancellation, force/fence after bound, accounts descendants/effects, and closes CANCELLED only."
      stale_approval: "Revalidate principal, owner, task/policy/base/target/scope, expiry and consumption; deny stale/revoked/replayed approval."
      stale_verification: "Any material current-state or revision change preserves old run but sets aggregate UNVERIFIED."
      waited_event: "Reread event identity, version, source and current authority before consuming; duplicate or stale delivery returns prior outcome."
      protected_entry: "Persist only non-secret receipt; restart requires protected reacquisition and never reconstructs raw input."
      agent_retirement: "No new claims; recover in-flight work into terminal/uncertain truthful disposition before releasing ownership."
    workspace_partial_write_recovery:
      process_dies_during_file_write: "On restart, treat the recorded edit as an unconfirmed intent; inventory and reread actual bytes/metadata before any success claim."
      partially_written_file_exists: "Preserve the partial artifact and its observed digest/size as uncertain mutation evidence; do not overwrite user state merely to match intent."
      interrupted_rename_or_replace: "Inspect source, destination, temporary objects and directory metadata; accept neither old nor new state without readback, and report PARTIAL or BLOCKED if ownership/truth is ambiguous."
      multi_file_edit_partially_completes: "Reconcile every intended path individually against the pinned base and operation ledger; retain the achieved subset, invalidate aggregate predicates, and never infer all-or-nothing filesystem atomicity."
      git_index_differs_from_worktree: "Freshly read HEAD, index and working tree; preserve the discrepancy and block/replan rather than staging, resetting, or attributing it to the task without evidence."
      generated_artifact_partial_write: "Mark the artifact incomplete, retain bounded partial-output provenance where safe, and exclude it from evidence/completion until regenerated and integrity-checked."
      uncertain_filesystem_on_recovery: "Enter RECOVERING, invalidate stale verification, compare pinned base plus recorded operations with actual state/canaries, and end BLOCKED, UNVERIFIED, PARTIAL, known failure, or known success only when independently established."
      global_atomicity_claim: false

  f10_workspace_execution_model:
    admission: "Read-only preflight records repository identity, exact revision, topology and all sixteen E1 repository-condition dispositions before mutation."
    base_identity: "A pinned immutable base identity plus inventory of tracked, untracked, ignored, generated, nested and linked-worktree material binds the task."
    isolation: "A workspace broker creates a separate mutable task workspace before any mutating reproduction or command; original user state is never the execution target."
    path_scope: "Normalized roots and object-identity checks are enforced at open/mutate/cleanup; traversal, links, swaps, mounts, devices, FIFOs, sockets, archive escape/bombs and ambiguous ownership fail closed."
    protected_locations: "Known and policy-classified secret/private locations override in-root permission; ambiguous paths are not inspected by the model or ordinary tools."
    process_boundary: "All untrusted code executes through versioned capability envelopes in an owned process tree with cwd, environment, filesystem, network, time, output and descendant limits."
    cancellation: "Cooperative cancel precedes force termination/fencing; killed work is never completion and surviving effect uncertainty is explicit."
    package_scripts_hooks_network: "Package scripts, Git hooks/helpers and network-sensitive tools are separately classified capabilities; repository text cannot grant them."
    reconciliation_and_cleanup: "Fresh identity/canary readback proves task-only change and cleanup scope; unknown ownership or stale topology blocks deletion."
    isolation_classification:
      taxonomy:
        TIER_0_LOGICAL_SCOPE_ONLY: "Identity and policy labels only; no enforceable process, filesystem, network, or secret boundary. Insufficient for untrusted execution."
        TIER_1_BROKERED_PROCESS_PATH_AND_EFFECT_CONTAINMENT: "All supported operations cross accountable brokers with path, process, network, effect and secret checks, but arbitrary descendants are not yet proven confined against bypass."
        TIER_2_OS_ENFORCED_EXECUTION_ISOLATION: "The supported host enforces process-tree, filesystem, network/resource and credential boundaries for the declared workload class, including descendants and loss of owner authority."
        TIER_3_STRONGER_WORKLOAD_BOUNDARY: "A stronger separately administered workload boundary with additional compromise/blast-radius properties beyond frozen E1; not required or assumed for v0.1."
      minimum_required_properties: "TIER_1 is the floor for brokered non-executing operations; untrusted code capable of spawning descendants requires the semantic properties of TIER_2."
      candidate_assumed_tier: TIER_2_OS_ENFORCED_EXECUTION_ISOLATION
      dependent_hard_ars: [AR-WSP-002, AR-WSP-003, AR-EXE-003, AR-EXE-004, AR-SEC-002, AR-SEC-003, AR-SEC-004]
      enforcement_layers:
        path_scope: "Core workspace broker plus required host object-identity/path primitives; unsupported if access-time identity cannot be held or revalidated."
        descendant_filesystem_and_network: "Core capability broker supplies policy and grants; required host execution primitives must make the boundary apply to arbitrary descendants, otherwise untrusted execution is unsupported."
        process_termination: "Integrated supervisor orders cancel/force/fence; required host process-tree primitive must account for descendants. Feasibility remains SPQ-E2-002-01."
        secret_exclusion: "Protected broker and exact-recipient gate exclude ordinary pipelines; required client/host capture-exclusion behavior remains SPQ-E2-002-02/03, and missing exclusion fails closed."
      filesystem_boundary_expectation: "Only the admitted task workspace and explicitly granted objects are reachable; aliases, special files, mounts, archive expansion and cleanup are identity-checked and fail closed."
      network_boundary_expectation: "No egress unless the exact destination/data/credential/purpose grant is present; redirects/effective targets are revalidated and denied paths send zero bytes."
      process_tree_expectation: "Every descendant remains attributable to the operation and loses productive authority on cancel/fence/core loss; logical epoch fencing alone is not evidence of descendant containment."
      secret_boundary_expectation: "No ambient or inherited raw secret; protected delivery targets one exact recipient/use and all other surfaces receive only non-secret metadata."
      not_guaranteed: "No claim against a compromised kernel/administrator/firmware/physical medium, no cross-tenant boundary, no side-channel guarantee, and no TIER_3 property."
      resolution_status: "Tier semantics and required properties are analysis-resolvable; whether the supported host class can enforce descendant containment is shared SPQ-E2-002-01 and remains UNKNOWN_REQUIRING_SPIKE; concrete mechanism choice is deferred implementation detail."
      AQ_003: "Consistently classified across all candidates: semantic tier declaration is present; supported-host descendant/process enforcement is selection-blocking shared SPQ-E2-002-01 E2-004 feasibility; product/technology selection is not made."

  f11_git_model:
    classification: "Every action resolves to one of the frozen thirty Git/effect rows before dispatch; no unclassified Git operation runs."
    authority: "Task scope, repository/base identity, path/ref target, capability class, network/credential scope and any exact approval are bound independently."
    safe_invocation: "The Git adapter prevents implicit hooks, aliases, helpers, filters, signers, external diff/text conversion, submodule/LFS handlers and transports unless separately supported and granted."
    local_remote_separation: "Local reads/writes, destructive actions, external reads and remote effects remain separate classes; approval cannot turn a prohibited v0.1 action into an allowed one."
    readback: "Before/after HEAD, refs, index, worktree, untracked/ignored state and target-specific remote state are freshly reread as applicable."
    review_package: "Draft package is local and NOT_SUBMITTED, bound to exact base/head or patch, changed files, checks, limitations, evidence and approval/effect state."
    unauthorized_action_prevention: "No free-form Git command gains authority from chat, model output or repository instructions; arguments are data under the adapter schema."

  f12_approval_effect_model:
    state_chain: [INTENT, APPROVAL, ATTEMPT, OBSERVED_EFFECT, CONFIRMED_EFFECT, UNKNOWN_EFFECT]
    intent: "Normalized action, full inert display, task/policy/plan/base/target/schema/capability/effect class, limits and effect ID."
    approval: "Authenticated stable one-shot object with issuer, exact scope, versions, expiry, revocation and consumption state; a digest alone is insufficient."
    attempt: "Serialized with approval consumption and dispatch identity; records known non-start, dispatch, adapter and idempotency key."
    observed_effect: "Response/receipt is an observation, not proof; malformed/lost responses retain possible-effect state."
    confirmed_effect: "Only target-specific authoritative readback can establish known success; known failure/non-success is separately terminal."
    unknown_effect: "Acknowledgement loss, ambiguous target or unavailable readback remains explicit and blocks completion/blind retry."
    replay_and_revocation: "Stale, revoked, mutated, recovered-ambiguous or reused approvals fail before dispatch; every denial is durable."
    idempotency_and_reconciliation: "Stable operation/effect identities, provider idempotency where available, first-outcome deduplication and readback yield at most one committed effect."

  f13_model_provider_boundary:
    core_contract: "Logical AUTHOR/CHALLENGER/VERIFIER and task-purpose semantics are provider-neutral; no model or provider is assigned."
    gateway: "An embedded provider gateway owns purpose, capability discovery, eligibility, route policy, data/network/credential authority, budgets and request/result normalization."
    eligibility_classes: [ELIGIBLE_IF_LATER_VERIFIED, EVALUATION_ONLY, DISALLOWED, USER_CONFIGURED_UNVERIFIED_EXPERIMENTAL]
    fallback: "Fallback is explicit, prospectively authorized and linked to the failed route; absence of an eligible fallback yields a typed non-dispatch/failure."
    distinctions: "Provider, model, transport, policy, capability, tool, timeout, cancellation and content/result validation failures remain distinct."
    provenance: "Requested/resolved route, purpose, eligibility, configuration, provider/model/tool versions, latency, token/usage/cost, cancellation and outcome are recorded."
    offline_and_live_calls: "Offline deterministic adapter replays are supported; real or paid calls remain separately gated and are not run by E2-002."

  f14_context_memory_model:
    bounded_context: "Each invocation receives a versioned context manifest with explicit token/output/time bounds and omission list."
    durable_sources: "Original messages, task/plan/predicate/policy, operations/effects, approvals, failures, artifacts, evidence and verification live outside disposable model context."
    summary: "A summary is LOSSY, carries source IDs/versions/trust labels/corrections/omissions, and is rejected if stale, poisoned or inconsistent."
    resume: "The core reconstructs current authoritative facts and selected evidence first, then optionally adds a derived summary; missing facts become visible unknowns."
    non_compactable: "Security policy, authority, approval state, effect certainty, evidence inputs, predicate results, verification and final disposition cannot be compacted away."
    retrieval_assumption: "No vector database or RAG stack is required; bounded deterministic lookup by stable identity is sufficient for the candidate."

  f15_evidence_artifact_model:
    bundle: "Versioned outcome-profile bundle bound to exact task/attempt, candidate store version, workspace, base/head/patch, policy/plan/predicate versions and final disposition."
    provenance: "Records actor, route/model/tool, command/check, bounds, result, retry, approval/effect/readback, failure, artifact, predicate and verifier provenance."
    artifacts: "Stable immutable local IDs reference bounded large outputs with integrity, media/type, size, source, redaction, retention and availability state."
    integrity: "Causal sequence, version checks, manifest validation and independent readback detect gaps, mutation, substitution, reordering and staleness; digest alone is not correctness."
    exact_revision: "Candidate mutation after evidence or verification preserves historical records but invalidates current aggregate verification."
    redaction_and_limits: "Raw protected values and prohibited private data never enter evidence; exclusions and unavailable/unknown fields carry disposition consequences."
    final_disposition: "Bundle validates required fields/predicates/operations/effects/verification and truthfully distinguishes completed, partial, blocked, failed, cancelled and unverified."

  f16_independent_verification_path:
    separation: "A fresh verifier process/context uses a separate review workspace and least-privilege authority; high-risk work cannot be verified by the author session."
    input: "Verifier receives the exact candidate identity/revision, bounded context manifest, predicates, evidence references and underlying authoritative read access, not hidden reasoning."
    actions: "Verifier independently rereads state/effects, reruns deterministic checks where possible, evaluates predicate adequacy and records disagreements."
    lifecycle: "Runs are immutable and sequential; crash/timeout becomes VERIFICATION_ERROR with aggregate UNVERIFIED, never a substantive verdict."
    reruns_and_corrections: "Finite rerun ceiling owner is a policy interface to be registered by E2-005; corrections create linked attempts/revisions and require fresh verification."
    stale_invalidation: "Any material candidate/effect/predicate/policy mutation invalidates current pass while retaining the old run for its old revision."

  f17_observability_failure_model:
    structured_state: "Correlated records expose current axes, owners, operations, controls, waits/blockers, approvals/effects, route, budgets, evidence, verification and limitations."
    telemetry_boundary: "Operational logs/metrics are derived diagnostics; mandatory audit/evidence records are unsampled and telemetry cannot grant authority or prove completion."
    failure_contract: "Typed failures identify layer, code/class, retryability, cause, affected operation/effect/predicates, authority consequence, recovery owner and next safe action."
    ambiguity: "Unknown remains UNKNOWN; a visible symptom does not collapse provider/model/transport/policy/tool/process/storage/effect/verification layers."
    explanations: "User/reviewer explanations cite durable evidence and limitations without requiring private chain-of-thought."
    observability_loss: "Loss or gap is itself recorded; missing mandatory audit/evidence blocks affected verification/completion."

  f18_security_control_ownership:
    policy_kernel: "Core-owned deterministic policy validates authority precedence, capability scope, action/effect class, limits and approval before dispatch; model judgment cannot override it."
    workspace_broker: "Owns repository admission, path/object identity, original-state protection and cleanup scope."
    execution_supervisor: "Owns process trees, I/O bounds, environment/network exposure, cancellation, force/fence and descendant evidence."
    gateways: "Capability, Git, network, provider and evidence gateways validate versioned inputs/results at every crossing."
    protected_human_entry: >-
      A dedicated controller leaves ordinary chat/model/telemetry capture, authenticates a
      takeover, suspends or excludes ordinary observation, sends the raw value only to one
      exact authorized recipient/use, emits a non-secret receipt, then clears transient
      buffers. If exclusion cannot be guaranteed, the task enters WAITING_FOR_USER or a hard
      blocker. Recovery revalidates and reacquires; it never replays the value.
    structural_fail_closed_rule: "Unavailable enforcement capability makes the operation unsupported/waiting/blocked; the architecture does not ask the model to behave safely in lieu of a control."

  f19_packaging_local_first_behavior:
    candidate_assumption: "One user-local application package with an embedded state store and bundled/declared worker entrypoints; concrete client/runtime/package technology remains unselected."
    long_running_components: "One task-bound integrated application core may remain headless after presentation close while active work safely continues or suspends; execution and verification children are bounded, not independently replaceable authorities or hidden permanent services. Explicit full-application shutdown fences/suspends them."
    setup: "A supported-host manifest, local data/workspace roots, prerequisite checker, migration version and security limitations are visible."
    operation: "Core workflow, local repositories, evidence and offline fixtures work without undeclared cloud control state; provider work naturally requires separately authorized network access."
    update_migration_cleanup: "Updates stop/fence work, snapshot/migrate/validate state, support declared rollback limits and preserve evidence; uninstall distinguishes application, state, task workspaces and held artifacts."
    contributor_workflow: "A contributor can run deterministic offline adapters, store/recovery tests, fixture injection and verifier flows locally using the declared toolchain."
    unsupported: "Unsupported host security/process classes and device/media failure remain explicit and block claims that depend on them."

