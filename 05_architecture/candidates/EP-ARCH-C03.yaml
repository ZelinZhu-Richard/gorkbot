  f02_system_shape:
    summary: >-
      An embedded user-local durable workflow core treats an append-only material event journal
      and immutable referenced payloads as authoritative history. Deterministic reducers create
      rebuildable task/read projections and snapshots. A coordinator invocation may stay active
      for work or restart from the journal; process lifetime is not task identity. Execution,
      provider, protected-entry and verification adapters consume or append only through typed,
      policy-checked commands.
    components:
      command_policy_boundary: "Validates principal, expected stream/version, task authority, capability, approval, limits and operation identity before an event can append."
      event_workflow_core: "Owns ordered event append, deterministic transition reducer, timers/control scheduling, ownership/fence events and recovery."
      projection_layer: "Builds client/status/transcript/search views and disposable snapshots; never authoritative."
      execution_adapters: "Claim durable dispatch work with lease/fence, supervise process trees and append typed observations/readbacks through the command boundary."
      verifier_adapter: "Uses a distinct context/workspace and restricted append path for immutable verification events after independent reread/replay."
      artifact_payload_store: "Stores original messages, evidence and large outputs under stable IDs with provenance/integrity/redaction; journal references them."
    end_to_end_flow: "Intent command -> validated accepted event/first outcome -> reducer derives task/operation -> durable dispatch event -> fenced adapter -> observation/readback events -> evidence projection -> independent verification events -> derived disposition."
    lifetime_model:
      CLIENT_LIFETIME: "A presentation client may attach, disconnect, close, and later reconnect to a reconstructed projection. Its disappearance is neither a workflow event nor cancellation unless an authenticated control command was durably admitted first."
      CONTROL_AUTHORITY_LIFETIME: "Durable workflow authority is the validated journal plus event-admission and reducer rules and therefore outlives every client, coordinator, and executor process. A live append gate is required to admit new mutations, but absence of a live process does not erase authority or task state."
      EXECUTION_OWNER_LIFETIME: "A task-bound coordinator/executor lease may continue after every presentation client disconnects. It is replaceable rather than permanent: loss, expiry, or full shutdown fences that lease; a new coordinator must replay the authoritative head and reconcile every nonterminal dispatch before acquiring a new epoch."
      TASK_LIFETIME: "A task is the durable workflow history and survives client, coordinator, executor, and projection loss until a truthful terminal or retained waiting/blocked/unknown disposition. Completion never depends on a UI process or projection cache."
      WORKSPACE_LIFETIME: "A task workspace remains bound by durable identity and operation history across clients and coordinator instances until actual filesystem/effect state is reconciled and scoped cleanup is authorized. Projection or client loss cannot delete it."
      relationships: "CLIENT_LIFETIME is shorter and non-authoritative; live CONTROL and EXECUTION components may be absent, while durable workflow authority, TASK_LIFETIME, and WORKSPACE_LIFETIME remain. A task-bound coordinator may run detached, but C03 does not require a hidden always-on platform or C02's permanent control-service/replaceable-worker topology."

  f03_client_interaction_boundary:
    conceptual_client: "Local client subscribed to rebuildable projections; concrete integrated/thin/CLI/web technology remains an unselected CANDIDATE ASSUMPTION."
    intent_and_ack: "Client sends stable command ID and expected stream/task version; acknowledgement follows durable event/payload commit and duplicates return the original result event."
    reconnect: "Projection is rebuilt or resumed from a known event position with visible lag, gap, unknown and source sequence; client loss has no authority effect."
    disconnect_and_exit: "Client-only close/disconnect removes a subscriber and never silently cancels, pauses, or destroys a task. A policy-bounded task-bound coordinator may continue, or work may enter a durable safe wait if no eligible executor remains."
    stale_client_rule: "A returning client reauthenticates and submits the stream/task version it observed; the current journal head and rebuilt projection govern. The client never regains an old lease, approval, or control authority automatically."
    controls: "Pause/stop/redirect/resume/approval/revocation are commands producing durable ordered events before any user acknowledgement."
    approval_evidence: "Client renders complete normalized intent and can inspect event/payload/projection lineage, target readbacks and verifier events."
    protected_entry: "A separate protected broker bypasses ordinary event/chat capture, delivers raw input to an exact recipient and appends only a non-secret receipt event."

  f04_process_boundaries:
    orchestration_owner: "The validated journal head plus deterministic normative reducer defines workflow authority under one current stream-owner epoch; a live coordinator process is replaceable and may be absent."
    persistence_owner: "Journal append gate and payload store; no client/adapter/projection writes storage directly."
    execution_owner: "A fenced task-bound executor adapter owns one process tree under a coordinator-granted lease. Durable workflow state owns dispatch eligibility and deadline facts, but real-time timeout/termination enforcement requires a live eligible coordinator/executor."
    verification_owner: "Separate verifier adapter/context/workspace; restricted command path can append run/error/verdict evidence but cannot rewrite source history."
    provider_call_owner: "Provider gateway adapter receives a durable eligible route command and returns typed provider/model/transport observations."
    control_and_fencing_owner: "Control event is authoritative order; reducer stops later dispatch and advances fence; adapters enforce process control and late events are rejected/stale."
    boundary_contract: "Versioned commands/events bind stream/task/attempt/operation/effect, prior sequence, owner/fence, policy/capability, deadline, causal parent and correlation."
    event_admission_authority: "Only the current append gate may validate and append a material event against the current stream sequence, owner/fence, policy, capability, approval and correlation. An adapter observation is not authoritative until admitted."
    reducer_and_projection_authority: "The deterministic normative reducer interprets the validated authoritative journal head to decide legal transitions. Cached task/read/search/transcript projections are derived and disposable; no unsafe external action may be authorized from a stale projection alone."
    no_live_coordinator_semantics: "With no active coordinator, no new dispatch or unsafe effect is authorized and no real-time deadline enforcement is claimed. Durable deadlines and nonterminal facts remain; the next coordinator immediately classifies overdue work, advances/fences ownership, reconciles actual process/workspace/effect state, and then resumes or records RECOVERING, WAITING, BLOCKED, CANCELLED, or OUTCOME_UNCERTAIN."
    full_system_shutdown: "Deliberate full-system shutdown is a distinct authenticated workflow: stop event admission except shutdown/reconciliation records, stop new dispatch, cancel/fence active executors, preserve partial/unknown effects, checkpoint only as a validated optimization, and leave journal/payload/workspace state reconstructable."

  f05_trust_boundaries_and_threat_model:
    unsupported_host_compromise_assumption: "Fully compromised kernel/root/firmware/physical media is unsupported. Journal integrity is tamper detection within declared application/storage boundaries, not protection from privileged host control. Missing enforcement narrows support and fails closed."
    boundaries:
      TB-01: {trust_and_assets: "Authenticated fallible user/founder; authority/approvals", authority_source: "Authenticated principal plus governance", allowed_flows: "Bounded commands, controls, exact approvals/recipient", forbidden_flows: "Conversation granting scope or waiving policy", enforcement_point: "Command policy boundary", failure_behavior: "Reject/wait with zero dispatch", evidence: "Rejected/accepted command event and authority version", recovery: "Reauthenticate/revalidate; no inferred consent"}
      TB-02: {trust_and_assets: "Untrusted repository; code/user state", authority_source: "Admitted root/task event", allowed_flows: "Bounded reads/isolated writes", forbidden_flows: "Repository-created authority/network/secret/approval", enforcement_point: "Admission command and workspace adapter", failure_behavior: "Deny/quarantine/block condition", evidence: "Identity/condition/base/canary events", recovery: "Reread and append stale/recovery events"}
      TB-03: {trust_and_assets: "Untrusted instruction files", authority_source: "Versioned higher policy", allowed_flows: "Narrow paths/style/checks/procedure", forbidden_flows: "Expand capabilities/effects/credentials/routes or weaken predicates", enforcement_point: "Instruction-policy command validator", failure_behavior: "Conflict event/wait/block", evidence: "Source/trust/version/decision event", recovery: "Reload source; invalidate projections/summaries"}
      TB-04: {trust_and_assets: "Filesystem; repo/workspace/payloads/user data", authority_source: "Pinned root/object/ownership events", allowed_flows: "Scoped object-bound access", forbidden_flows: "Escape/special/ambiguous/destructive access", enforcement_point: "Workspace adapter", failure_behavior: "Preaccess deny", evidence: "Object resolution and mutation/readback events", recovery: "Reresolve; reconcile task-owned only"}
      TB-05: {trust_and_assets: "Protected secrets/private data", authority_source: "Protected policy and exact recipient/use event", allowed_flows: "One-use out-of-band delivery", forbidden_flows: "Journal/payload/projection/model/log/evidence exposure", enforcement_point: "Protected broker and recipient gate", failure_behavior: "Do not read; wait/block", evidence: "Non-secret receipt event", recovery: "Reacquire; never replay raw input"}
      TB-06: {trust_and_assets: "Traversal/link/topology races", authority_source: "Pinned root/object identities", allowed_flows: "Resolved in-scope objects", forbidden_flows: "Traversal/link/mount/device/archive/swap escape", enforcement_point: "Workspace adapter at every access/cleanup", failure_behavior: "Deny/preserve canary", evidence: "Resolution/canary events", recovery: "Reresolve; stale topology event blocks"}
      TB-07: {trust_and_assets: "Untrusted subprocess; host/effects", authority_source: "Durable dispatch/capability/fence event", allowed_flows: "Bounded declared process tree", forbidden_flows: "Orphans/escape/undeclared effects/noninterruptibility", enforcement_point: "Executor supervisor plus workflow fence", failure_behavior: "Cancel/force/fence/unknown event", evidence: "Process/control/outcome event chain", recovery: "Discover/fence old owner and reconcile"}
      TB-08: {trust_and_assets: "Terminal I/O/protected input", authority_source: "Operation or protected recipient grant", allowed_flows: "Bounded event-referenced output/exact input", forbidden_flows: "Output as authority/raw input in ordinary event capture", enforcement_point: "I/O adapter and protected broker", failure_behavior: "Truncate/deny/wait closed", evidence: "I/O provenance/bounds and receipt event", recovery: "No raw replay; new grant"}
      TB-09: {trust_and_assets: "Package/lifecycle scripts", authority_source: "Separate execution/network capability event", allowed_flows: "Classified bounded script", forbidden_flows: "Retrieval implying execution/egress/secret access", enforcement_point: "Capability command plus executor", failure_behavior: "Deny/unsupported event", evidence: "Provenance/grant/process/network events", recovery: "Revalidate; ambiguous effect reconciles"}
      TB-10: {trust_and_assets: "Git hooks/helpers/filters/signers/transports", authority_source: "GE row/capability/approval event", allowed_flows: "Classified helper-free Git or exact effect", forbidden_flows: "Implicit helper/network/credential/prohibited action", enforcement_point: "Git command adapter", failure_behavior: "Zero dispatch/effect event", evidence: "GE/action/state-readback chain", recovery: "Fresh readback; remote unknown blocks"}
      TB-11: {trust_and_assets: "Network destinations/data/credentials/cost", authority_source: "Exact route/data/credential/budget event", allowed_flows: "Authorized revalidated effective target", forbidden_flows: "Undeclared/proxy/private/metadata egress", enforcement_point: "Network capability adapter", failure_behavior: "Zero bytes/calls event", evidence: "Target/bytes/calls/cost events", recovery: "Revalidate/reconcile possible dispatch"}
      TB-12: {trust_and_assets: "Remote Git refs/data/credentials", authority_source: "GE plus one-shot approval event", allowed_flows: "Supported read/effect/readback", forbidden_flows: "Force/merge/rebase/delete/tag/hidden credential", enforcement_point: "Git/network/approval adapters", failure_behavior: "Deny or unknown-effect event", evidence: "Intent-to-readback event chain", recovery: "No blind retry; remote truth event"}
      TB-13: {trust_and_assets: "External APIs/state/data/credentials/cost", authority_source: "Capability/effect/approval events", allowed_flows: "Versioned bounded adapter request", forbidden_flows: "Ambient mutation/hidden retry/fallback", enforcement_point: "Capability gateway/effect workflow", failure_behavior: "Deny or uncertainty event", evidence: "Request/idempotency/response/readback/usage events", recovery: "Target readback; known/unknown preserved"}
      TB-14: {trust_and_assets: "Model/provider output/service", authority_source: "Role-neutral route/eligibility events", allowed_flows: "Explicit eligible/experimental purpose route", forbidden_flows: "Self-promotion/hidden fallback/output as authority", enforcement_point: "Provider gateway and result validator", failure_behavior: "Zero dispatch or typed failure event", evidence: "Requested/resolved route/latency/usage/cost chain", recovery: "Explicit fallback command only"}
      TB-15: {trust_and_assets: "Tools/capabilities/results", authority_source: "Versioned schema/scoped receipt event", allowed_flows: "Validated exact request/result", forbidden_flows: "Unknown schema/target substitution/ambient power", enforcement_point: "Command and result validators", failure_behavior: "Deny; invalid effectful result reconciles", evidence: "Grant/request/result/effect events", recovery: "Do not consume; readback event"}
      TB-16: {trust_and_assets: "Approval authority", authority_source: "Authenticated exact approval event", allowed_flows: "One current matching consumption", forbidden_flows: "Chat/replay/mutation/stale/revoked/hidden target", enforcement_point: "Approval reducer serialized before dispatch", failure_behavior: "Zero dispatch or ambiguity event", evidence: "Approval lifecycle/consumption events", recovery: "Replay reducer and revalidate; ambiguity blocks"}
      TB-17: {trust_and_assets: "External effect/target truth", authority_source: "Approved operation plus target readback", allowed_flows: "One attempt and reconciliation", forbidden_flows: "Guessed success/blind retry/duplicate/response proof", enforcement_point: "Effect workflow reducer and adapter", failure_behavior: "Known failure or unknown blocks completion", evidence: "Intent/approval/attempt/observed/readback events", recovery: "First outcome and readback"}
      TB-18: {trust_and_assets: "Evidence/integrity/revision", authority_source: "Journal/payload schema and independent readback", allowed_flows: "Validated secret-safe refs/immutable runs", forbidden_flows: "Projection/telemetry/executor summary/self-hash as proof", enforcement_point: "Evidence reducer/validator/verifier", failure_behavior: "Gap/tamper/stale blocks", evidence: "Sequence/integrity/manifest/verifier events", recovery: "Replay from trusted point; preserve gap/tamper"}
      TB-19: {trust_and_assets: "Recovery/replay/ownership/effects", authority_source: "Validated ordered journal, first result and current policy", allowed_flows: "Deterministic replay/reconciliation", forbidden_flows: "Stale owner/event, duplicate effect, fabricated continuity, secret replay", enforcement_point: "Recovery reducer and append gate", failure_behavior: "Recovering/blocked/failed/unknown", evidence: "Replay/checkpoint/gap/revalidation events", recovery: "New owner epoch; reconcile nonterminal workflows"}
      TB-20: {trust_and_assets: "Protected human entry", authority_source: "Authenticated takeover/recipient/use command", allowed_flows: "Suspend ordinary capture and direct one-use delivery", forbidden_flows: "Journal/payload/projection/chat/model/log raw capture", enforcement_point: "Protected broker outside normal command/event path", failure_behavior: "WAITING_FOR_USER/closed", evidence: "Capture-state and non-secret receipt event", recovery: "Receipt remains; raw input reacquired"}

  f06_authoritative_state_ownership:
    canonical_writer: "Journal append gate under current stream-owner epoch and expected sequence. A required non-secret payload becomes durable and integrity-addressable before a referencing event may append; the two structures are not claimed globally atomic, and an unreferenced orphan is not workflow authority."
    authoritative: ["Immutable material domain/workflow/command/approval/effect/verification events", "Original message/evidence/artifact payloads and identity/provenance/integrity metadata", "Current policy/schema/migration/retention and event-stream ownership"]
    derived: ["Task/current-state reducers", "Client/transcript/search/evidence presentation", "Disposable validated snapshots/checkpoints"]
    ephemeral: ["Coordinator/client/adapter processes", "Subscriptions", "Process handles/streaming/prompt buffers"]
    lossy: ["Provenanced summaries/resume blocks"]
    history_and_versions: "Each event records stream, sequence, entity version, actor/owner, causal/correlation parents, task/policy/plan/predicate/schema versions and payload refs."
    stale_writer_rule: "Expected sequence/owner/fence mismatch rejects event and effect authority; rejected stale command/event is retained in a denial stream."
    reducer_rule: "The normative reducer is a deterministic interpretation of the validated journal head, not a separately mutable projection. Any command or effect admission rereads/validates the current head and reducer result; cached projections may inform presentation but never independently authorize an action."

  f07_operation_model:
    identity_schedule: "Stable command/task/attempt/operation/dispatch/effect IDs; reducer emits durable eligible-work state and coordinator grants one lease/fence."
    lifecycle: "Intent/validation/approval/dispatch/run/reconciliation/terminal facts are separate events; projection shows but does not own state."
    retries: "New attempt events link original operation/effect, prior outcomes/cost and declared ceiling; reducer permits only under current authority and effect certainty."
    controls: "Accepted control event is ordered before later work; reducer suppresses dispatch, advances fence, coordinates cancellation/reconciliation and revalidation."
    duplicates: "Command result event indexed by stable ID returns first result; duplicate append/dispatch/effect is rejected."
    retirement: "Disable/retire events prevent new claims; in-flight workflows/effects/history persist until truthful disposition."
    result_rule: "Adapter response is an observed event subject to schema/correlation/fence validation; invalid/lost effectful result transitions to reconciliation."
    coordinator_loss_and_deadlines: "Deadline facts remain durable when no coordinator exists, but elapsed time is not itself evidence that cancellation/termination occurred. The next eligible coordinator advances the clock-derived transition, fences the old owner, discovers actual descendants/effects, and records the truthful result before redispatch."

  f08_persistence_semantics:
    candidate_choice: "Append-only ordered material event journal plus immutable referenced payload/artifact store, validated snapshots and rebuildable projections. This Level B event/workflow choice is not a project decision."
    acknowledgement_boundary: "A required non-secret payload is durable and rereadable before the referencing event is appended; the event is then durably admitted at one stream version and both are rereadable before acknowledgement. An event referencing an undurable payload is never appended or acknowledged."
    durability_scope: "Coordinator/process and supported host restart on one healthy local persistence volume; privileged host/media loss unsupported."
    versioning: "Expected stream/entity sequence and owner/fence serialize commands, approval consumption and effect dispatch."
    partial_write_corruption: "Record framing/integrity/sequence validation yields complete append or detectable tail/gap; preserve bytes, quarantine affected stream and rebuild from trusted checkpoint only."
    evolution: "Events are immutable; versioned readers/migrations produce new snapshots or corrective events, never silent historical rewrite."
    retention_deletion: "Holds/deletion/redaction are linked events; payload physical deletion is distinct and cannot erase open-effect/evidence obligations silently."
    restore: "New store/stream-owner identity, full sequence/payload validation, projection rebuild, lease/verification invalidation and effect reconciliation."
    content_addressing: "Not used as authority; stable payload IDs plus integrity metadata are sufficient."
    external_effect_recovery_bridge: "Stable command/operation/effect identities, a durable pre-dispatch intent event, fenced one-attempt authority, admitted observation, target readback where available, and known/failed/unknown reducer outcomes constitute the design-level AR-DUR-003 bridge. It is a workflow protocol, not a claim of atomic external commit."
    protected_and_external_payload_ordering:
      raw_protected_payload_in_durable_history: false
      metadata_before_delivery: "The journal may durably admit protected-entry intent, authenticated principal, exact recipient/use, operation/correlation identity, expiry and capture-state metadata, but never the raw protected value or a reversibly encoded substitute."
      ordinary_payload_before_event: "For non-secret immutable payloads that must be durable, payload integrity and stable identity are established before the referencing event is admitted; an unreferenced partial/orphan payload is quarantined and is not workflow authority."
      intent_persisted_delivery_fails: "If intent is durable and delivery is provably not performed, append a known delivery-failed event. If whether delivery began or completed cannot be established, append/reconstruct OUTCOME_UNCERTAIN and require reconciliation or reacquisition; never infer non-delivery from a missing receipt."
      delivery_succeeds_receipt_persistence_fails: "The recipient-side operation/correlation/fence identity and protected broker observation are reconciled. Until a non-secret receipt can be admitted or recipient state proves the outcome, the workflow is OUTCOME_UNCERTAIN, further use is fenced, and the raw value is not replayed."
      correlation_identity: "One stable protected-intent and delivery-attempt identity binds broker, exact recipient/use, owner/fence and any non-secret receipt without deriving identity from protected bytes."
      retry_and_replay: "A retry is a new protected acquisition and new attempt linked to the original intent only after current policy and recipient state are revalidated. Raw protected bytes are never reconstructed or replayed from history."
      crash_recovery: "Recovery reads the durable intent/receipt events, broker/recipient non-secret state and current fence. It classifies delivery as KNOWN_NOT_DELIVERED, KNOWN_DELIVERED, or OUTCOME_UNCERTAIN; absence of an event is not proof of absence of delivery."
      cross_boundary_atomicity_claim: false
      atomicity_limit: "C03 does not claim atomicity between event append and protected or external delivery. Intent, attempt, non-secret receipt, readback and explicit unknown are the required truthful bridge."

  f09_recovery_model:
    client_only_interruption: "Dropping every presentation subscription changes no workflow authority or execution lease. A healthy task-bound coordinator continues or durably waits under policy; reconnect rebuilds the projection from the current journal head. This is EP-CTL-016."
    startup: "Acquire new owner epoch, validate journal/payload/schema/checkpoint integrity, replay reducers, rebuild/verify projections, invalidate handles/leases, classify nonterminal workflows, reread repo/workspace/authority/approval/effect/verification and then dispatch or remain recovering/blocked."
    application_crash: "Durable event exists or not; any dispatch without terminal readback enters reconciliation."
    host_restart: "Replay on declared volume; old fences cannot append/act."
    worker_failure: "Lease/fence and process observation events; readback before retry."
    model_timeout: "Typed model/provider/transport/cancel/usage events; explicit fallback command only."
    tool_timeout: "Cancel/force/fence events; terminal or explicit unknown effect."
    lost_tool_result: "Possible effect event plus target readback; no zero-effect inference."
    partial_write: "Detect tail/gap/integrity fault, quarantine/preserve and block or replay trusted prefix; no fabricated event. A payload written before a failed event append is quarantined as an orphan, retained while crash/effect/retention reconciliation is open, then linked by a later valid event or garbage-collected only through the declared retention/deletion process."
    stale_workspace: "Identity/base/owner mismatch event invalidates workspace/projection/verification."
    duplicate_operation: "Command ID returns first result event; no new dispatch."
    duplicate_effect: "Effect reducer/idempotency/readback rejects second attempt."
    external_ack_loss: "Unknown-effect event until readback confirms success/non-success."
    stop_force: "Ordered stop/fence/process/readback events; terminal CANCELLED only."
    stale_approval: "Reducer replays expiry/revocation/consumption and current target versions; deny stale."
    stale_verification: "Mutation event retains old run but derives aggregate UNVERIFIED."
    waited_event: "External event ID/version/source/current authority validated before append; duplicate returns first result."
    protected_entry: "Only non-secret receipt event exists; raw input reacquired."
    retirement: "Retire event stops claims; in-flight/effect responsibility remains."
    workspace_partial_write_recovery:
      process_dies_during_file_write: "Treat the edit command/event as intent and possible attempt only. Reopen and reread actual bytes, metadata and operation correlation before admitting any success observation."
      partially_written_file_exists: "Preserve and identify the partial object as uncertain mutation evidence; do not overwrite, hide, or project intended content as actual state."
      interrupted_rename_or_replace: "Inspect source, destination, temporary objects and directory state. Append actual observations and classify PARTIAL or BLOCKED when neither old nor new state can be safely established."
      multi_file_edit_partially_completes: "Observe each intended path independently against the pinned base and event sequence; record the achieved subset, invalidate aggregate predicates/verification, and never infer a filesystem-wide transaction."
      git_index_differs_from_worktree: "Freshly observe HEAD, index, working tree, untracked and ignored state. Preserve an unexplained discrepancy and block or replan rather than staging/resetting or attributing it from an intent event."
      generated_artifact_partial_write: "Retain bounded partial-output provenance where safe, mark the payload/artifact incomplete, and prevent it from becoming evidence or completion input until regenerated and integrity-validated."
      uncertain_filesystem_on_recovery: "Rebuild workflow state, then compare pinned base plus admitted operation history with actual workspace/Git/canary state. Append the discrepancy, invalidate stale projections and verification, and end BLOCKED, UNVERIFIED, PARTIAL, known failure, or known success only when readback establishes it."
      global_atomicity_claim: false

  f10_workspace_execution_model:
    admission_base: "Read-only admission events capture identity/topology and sixteen condition dispositions; pin base and original state inventory."
    isolation: "Workspace-created/bound event precedes any mutating command; lease binds exact mutable task workspace and path scope."
    defenses: "Workspace adapter checks objects at access/cleanup and rejects traversal/link/swap/mount/device/FIFO/socket/archive/secret/ambiguous ownership."
    process: "Executor adapter owns bounded process tree while workflow fence owns authority; cwd/env/fs/network/time/output/descendants explicit."
    scripts_hooks_network: "Separate capability/approval events are required; repo content cannot create them."
    reconciliation_cleanup: "Before/after inventory/canary/readback events prove task-only mutation; stale/ambiguous cleanup blocks."
    isolation_classification:
      taxonomy:
        TIER_0_LOGICAL_SCOPE_ONLY: "Identity and policy labels only; no enforceable process, filesystem, network, or secret boundary. Insufficient for untrusted execution."
        TIER_1_BROKERED_PROCESS_PATH_AND_EFFECT_CONTAINMENT: "All supported operations cross accountable brokers with path, process, network, effect and secret checks, but arbitrary descendants are not yet proven confined against bypass."
        TIER_2_OS_ENFORCED_EXECUTION_ISOLATION: "The supported host enforces process-tree, filesystem, network/resource and credential boundaries for the declared workload class, including descendants and loss of owner authority."
        TIER_3_STRONGER_WORKLOAD_BOUNDARY: "A stronger separately administered workload boundary with additional compromise/blast-radius properties beyond frozen E1; not required or assumed for v0.1."
      minimum_required_properties: "TIER_1 is the floor for brokered non-executing operations; untrusted code capable of spawning descendants requires the semantic properties of TIER_2."
      candidate_assumed_tier: TIER_2_OS_ENFORCED_EXECUTION_ISOLATION
      dependent_hard_ars: [AR-WSP-002, AR-WSP-003, AR-EXE-003, AR-EXE-004, AR-SEC-002, AR-SEC-003, AR-SEC-004]
      enforcement_layers:
        path_scope: "Workspace-admission events authorize scope, while adapter plus required host object-identity/path primitives enforce it; unsupported if access-time identity cannot be held or revalidated."
        descendant_filesystem_and_network: "Durable capabilities/fences supply policy; required executor-host primitives must bind arbitrary descendants, otherwise that workload class is unsupported."
        process_termination: "Coordinator/control events and executor supervisor order cancel/force/fence; required host process-tree primitive must account for descendants. Workflow fencing alone is insufficient and SPQ-E2-002-01 remains open."
        secret_exclusion: "Out-of-event protected broker and exact recipient gate exclude journal/payload/projection paths; capture/delivery feasibility remains SPQ-E2-002-02/05 and missing exclusion fails closed."
      filesystem_boundary_expectation: "Only the admitted task workspace and explicitly granted objects are reachable; aliases, special files, mounts, archive expansion and cleanup are identity-checked and fail closed."
      network_boundary_expectation: "No egress unless the exact destination/data/credential/purpose event and current capability are valid; redirects/effective targets are revalidated and denied paths send zero bytes."
      process_tree_expectation: "Every descendant remains attributable to the dispatch and loses productive authority on cancel/fence/coordinator loss; workflow fencing alone is not evidence of local descendant containment."
      secret_boundary_expectation: "No ambient or inherited raw secret; protected delivery targets one exact recipient/use outside event/payload/projection capture and all other surfaces receive only non-secret metadata."
      not_guaranteed: "No claim against a compromised kernel/administrator/firmware/physical medium, no cross-tenant boundary, no side-channel guarantee, and no TIER_3 property."
      resolution_status: "Tier semantics and required properties are analysis-resolvable; whether the supported host class can enforce descendant containment is shared SPQ-E2-002-01 and remains UNKNOWN_REQUIRING_SPIKE; concrete mechanism choice is deferred implementation detail."
      AQ_003: "Consistently classified across all candidates: semantic tier declaration is present; supported-host descendant/process enforcement is selection-blocking shared SPQ-E2-002-01 E2-004 feasibility; product/technology selection is not made."

  f11_git_model:
    model: "Typed Git command/event maps one-to-one to thirty frozen classifications before an adapter can run."
    controls: "Exact repo/base/ref/path/effect/network/credential/approval; hooks/aliases/helpers/filters/signers/diff/submodule/LFS/transports suppressed unless separately supported."
    readback: "Authoritative Git observation events freshly record HEAD/refs/index/worktree/untracked/ignored and authorized remote target."
    separation: "Local/destructive/external-read/remote effects remain distinct; prohibited rows never become approvable."
    review_package: "Projection over exact base/head/patch, changes/checks/limits/evidence/verification/effect events; status NOT_SUBMITTED."

  f12_approval_effect_model:
    distinct_concepts: [INTENT, APPROVAL, ATTEMPT, OBSERVED_EFFECT, CONFIRMED_EFFECT, UNKNOWN_EFFECT]
    approval: "Authenticated immutable grant/revoke/expire/consume events bind full normalized scope, versions, target, effect ID and inert display; digest alone insufficient."
    dispatch: "Approval-consumed and effect-dispatch authorization are ordered in workflow history before adapter action; lease/fence required."
    observation_confirmation: "Response event is observation; target-specific readback event establishes confirmed success or known non-success."
    ambiguity: "Lost acknowledgement/invalid result/unavailable readback creates UNKNOWN_EFFECT and suppresses completion/retry."
    idempotency: "Command/operation/effect IDs, reducer first outcome, target idempotency and readback permit at most one effect."

  f13_model_provider_boundary:
    contract: "Provider-neutral logical roles and workflow events; no role occupant/provider selection."
    gateway: "Validates purpose, eligibility/capabilities, data/network/credential/budget and creates explicit route events."
    eligibility: [ELIGIBLE_IF_LATER_VERIFIED, EVALUATION_ONLY, DISALLOWED, USER_CONFIGURED_UNVERIFIED_EXPERIMENTAL]
    fallback: "Explicit causal fallback command/event only; no eligible route -> zero dispatch."
    failures: "Provider/model/transport/policy/capability/tool/timeout/cancel/result events distinct."
    provenance: "Requested/resolved route/config/tool/eligibility/latency/usage/cost/fallback/cancel/outcome."
    calls: "Offline deterministic event replays; no E2-002 live/paid calls."

  f14_context_memory_model:
    model: "Context assembler projects a bounded versioned manifest from journal/payload truth for each invocation."
    durable: "Original messages, authority, workflows/effects, evidence and verification remain event/payload records outside context."
    summary: "Lossy event-referenced block with source ranges/versions/trust/corrections/omissions; stale/poisoned block invalidated."
    resume: "Replay current reducer state and retrieve decisive payload/evidence before optional summary; projection gaps are visible."
    non_compactable: "Authority/security/approval/effect/evidence/predicate/verification/disposition records cannot be compacted away."
    technology: "Sequence/identity retrieval; no vector/RAG requirement."

  f15_evidence_artifact_model:
    bundle: "Deterministic evidence projection/profile over exact event position, task/attempt/workspace/base/head/patch/policy/plan/predicate and disposition."
    provenance: "Actor/owner/fence, route/model/tool, commands/checks/bounds/results/retries, approvals/effects/readbacks, failures, predicates and verifier event refs."
    artifacts: "Immutable bounded stable payload IDs with integrity/type/size/source/redaction/retention; protected raw values excluded."
    integrity: "Event sequence/causal/payload/schema validation and independent readback detect gap/tamper/substitution/reorder/stale; self-hash is not correctness."
    binding: "New material event preserves old bundle/run but derives current UNVERIFIED."
    limitations: "Missing/unknown/unavailable event/payload/reference is explicit and blocks dependent result."

  f16_independent_verification_path:
    separation: "Verifier adapter has distinct identity/config/context/workspace/capabilities and cannot reuse author approval or rewrite journal history."
    access: "Reads/replays underlying journal/payload/candidate/target state, not only execution projection."
    work: "Rebuilds projection, reruns deterministic checks/readbacks, evaluates adequacy and appends immutable run evidence/verdict through restricted commands."
    lifecycle: "Crash/timeout -> VERIFICATION_ERROR event and aggregate UNVERIFIED; sequential runs; correction events create linked attempt/revision."
    ceiling: "Finite policy owner registered by E2-005; no value chosen."
    stale: "Any material candidate/effect/predicate/policy event invalidates current pass."

  f17_observability_failure_model:
    observability: "Projection answers axes, owner/leases, commands/events, controls/waits, approvals/effects, routes/budgets, evidence/verification and limitations with causal refs/lag."
    separation: "Telemetry is a derived event stream/projection; mandatory material audit/evidence journal is unsampled authority/evidence."
    failures: "Typed layer/retry/cause/affected operation/effect/predicate/recovery owner/next action events; unknown remains unknown."
    explanations: "Cite event/payload/readback evidence; no chain-of-thought."
    gaps: "Journal/payload/projection gap visible; authority/evidence gap blocks verification/completion."

  f18_security_control_ownership:
    command_policy: "Deterministic authority/capability/limit/approval/effect/route validation before append/dispatch, outside model judgment."
    adapters_and_fences: "Workspace/process/Git/network/provider/tool adapters enforce host/effect boundaries; owner/fence rejects stale action/events."
    evidence_integrity: "Append/payload validators and independent verifier enforce sequence/provenance/gap/stale rules."
    protected_entry: "Dedicated broker outside ordinary command/event/model/telemetry pipelines authenticates takeover, suspends/excludes capture, sends raw value only to exact recipient/use, appends non-secret receipt, clears transient state, waits/blocks if exclusion is unavailable and never replays raw data after restart."
    fail_closed: "No structural enforcement -> unsupported/waiting/blocked; model intent cannot substitute."

  f19_packaging_local_first_behavior:
    candidate_assumption: "One local workflow runtime/library and local journal/payload roots, launchable by a local client and active coordinator when work runs; execution/verifier adapters are bounded entrypoints. Technologies unselected."
    long_running_components: "No mandatory separate daemon or distributed platform; one task-bound coordinator may remain active without a presentation client while current policy permits work. If it exits, durable workflow authority survives, active leases are fenced/expired, no new effects dispatch, and restart replay/reconciliation replaces it."
    setup: "Supported-host/runtime/storage/schema/projection version, roots, migration/rebuild/recovery tools and security limits declared."
    offline: "Journal/reducer/fixtures/local repos/evidence/provider fakes run without hidden service; real providers require gated network."
    update_cleanup: "Fence work, validate/snapshot journal/payload, migrate readers/projections, rebuild/compare, declare rollback; cleanup uses retention events/readback."
    contributor: "Local deterministic event fixtures reproduce crashes/reorder/gaps/replay and inspect reducers without paid infrastructure."

