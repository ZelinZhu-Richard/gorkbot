      TB-02: {trust_and_assets: "Untrusted repository; code and user-owned state", authority_source: "Admitted root/task policy", allowed_flows: "Bounded admission reads and isolated writes", forbidden_flows: "Repository-granted capabilities/network/secrets/approval", enforcement_point: "Service workspace broker", failure_behavior: "Deny/quarantine/block unsupported condition", evidence: "Identity, condition row, scope, canaries", recovery: "Reread topology and invalidate stale workspace"}
      TB-03: {trust_and_assets: "Untrusted instructions; workflow guidance", authority_source: "Higher policy precedence", allowed_flows: "Narrow paths/style/checks/procedure", forbidden_flows: "Expand authority, roots, effects, credentials, routes or weaken predicates", enforcement_point: "Service instruction-policy evaluator", failure_behavior: "Typed denial or unmet-precondition wait", evidence: "Source/trust/conflict/applied restriction", recovery: "Reload versions; discard poisoned projections"}
      TB-04: {trust_and_assets: "Filesystem; repo/workspace/artifacts/user data", authority_source: "Pinned roots and ownership", allowed_flows: "Descriptor/object-bound scoped access", forbidden_flows: "Escape, special-file, ambiguous-owner/destructive access", enforcement_point: "Workspace broker in service and worker", failure_behavior: "Fail before access", evidence: "Object/path decision and canaries", recovery: "Reresolve and reconcile task-owned material only"}
      TB-05: {trust_and_assets: "Protected secrets/private data", authority_source: "Service-validated exact recipient/use/operation plus current worker lease/fence; service issues the opaque one-use authorization but never receives raw bytes", allowed_flows: "Protected client broker directly hands off through the authorization to the exact current worker recipient", forbidden_flows: "Ordinary client IPC, service API/store/scheduler/log, model/chat/context, telemetry/evidence or ambient worker exposure", enforcement_point: "Client protected broker, lease/fence-bound protected delivery endpoint and worker recipient gate", failure_behavior: "Do not read; revoke/wait/block", evidence: "Non-secret receipt only", recovery: "Fence old endpoint, reacquire; never persist/replay raw value"}
      TB-06: {trust_and_assets: "Links/traversal/topology races; root integrity", authority_source: "Pinned root/object identity", allowed_flows: "Resolved object inside scope", forbidden_flows: "Traversal, link/mount/device/archive/swap escape", enforcement_point: "Workspace broker at open/mutate/cleanup", failure_behavior: "Deny and preserve canary", evidence: "Resolution/object identity", recovery: "Reresolve; stale topology blocks"}
      TB-07: {trust_and_assets: "Untrusted subprocess; host/task effects", authority_source: "Leased capability envelope", allowed_flows: "Bounded declared process tree", forbidden_flows: "Orphans, escape, undeclared effects or noninterruptibility", enforcement_point: "Execution-worker supervisor plus service fence", failure_behavior: "Cancel/force/fence and mark uncertainty", evidence: "Tree/limits/timeline/outcome/fence", recovery: "Discover/fence stale lease; reconcile effects"}
      TB-08: {trust_and_assets: "Terminal I/O/protected input", authority_source: "Operation or protected recipient grant", allowed_flows: "Bounded output and exact protected input", forbidden_flows: "Output as authority or protected value in ordinary capture", enforcement_point: "Worker I/O broker and client protected broker", failure_behavior: "Truncate/deny/wait closed", evidence: "I/O provenance/bounds and non-secret receipt", recovery: "No raw replay; fresh grant required"}
      TB-09: {trust_and_assets: "Package/lifecycle scripts; process/fs/network", authority_source: "Separate execution/network grants", allowed_flows: "Classified bounded script", forbidden_flows: "Retrieval implying execution/egress/secret access", enforcement_point: "Service capability gate and worker supervisor", failure_behavior: "Deny or visible unsupported state", evidence: "Provenance/grant/process/network outcome", recovery: "Revalidate workspace; reconcile ambiguity"}
      TB-10: {trust_and_assets: "Git hooks/helpers/filters/signers/transports", authority_source: "GE matrix and exact grants", allowed_flows: "Classified helper-free Git or supported exact effect", forbidden_flows: "Implicit helper/network/credential/prohibited action", enforcement_point: "Service Git adapter and worker invocation policy", failure_behavior: "Zero dispatch/effect", evidence: "GE row, sanitized action, state readback", recovery: "Fresh readback; uncertain remote effect blocks"}
      TB-11: {trust_and_assets: "Network destinations/redirects; data/credentials/cost", authority_source: "Exact destination/data/credential/budget grant", allowed_flows: "Authorized effective target only", forbidden_flows: "Undeclared egress/proxy/private/metadata route", enforcement_point: "Service network gate plus worker network policy", failure_behavior: "Zero bytes/calls", evidence: "Requested/effective target, bytes/calls/cost", recovery: "Revalidate and reconcile dispatched uncertainty"}
      TB-12: {trust_and_assets: "Remote Git; refs/data/credentials", authority_source: "GE matrix plus exact one-shot approval", allowed_flows: "Supported read/effect with receipt/readback", forbidden_flows: "Force/merge/rebase/deletion/tag/hidden credential action", enforcement_point: "Git adapter, approval ledger, network gate", failure_behavior: "Deny or UNKNOWN_EFFECT", evidence: "Intent/approval/attempt/receipt/readback", recovery: "Never blind retry; reconcile remote truth"}
      TB-13: {trust_and_assets: "External APIs; state/data/credentials/cost", authority_source: "Capability and exact effect authority", allowed_flows: "Versioned bounded adapter request", forbidden_flows: "Ambient mutation/hidden retry/fallback", enforcement_point: "Service capability gateway and effect ledger", failure_behavior: "Deny or explicit uncertainty", evidence: "Request/idempotency/response/readback/usage", recovery: "Target readback; known success/failure/unknown"}
      TB-14: {trust_and_assets: "Model/provider output/service", authority_source: "Role-neutral route/eligibility policy", allowed_flows: "Authorized purpose-specific explicit route", forbidden_flows: "Self-promotion, hidden fallback, output as authority/proof", enforcement_point: "Service provider gateway and result validator", failure_behavior: "Zero dispatch or typed layer failure", evidence: "Requested/resolved route, eligibility, latency/usage/cost", recovery: "Explicit fallback only; no hidden replay"}
      TB-15: {trust_and_assets: "Tools/capabilities/results", authority_source: "Versioned schema/scoped receipt", allowed_flows: "Validated exact request/result", forbidden_flows: "Unknown schema, target substitution, ambient power", enforcement_point: "Service gateway and worker boundary validators", failure_behavior: "Deny; invalid post-dispatch result reconciles", evidence: "Schema/grant/request/result/effect state", recovery: "Do not consume invalid result; read back"}
      TB-16: {trust_and_assets: "Approval; consequential authority", authority_source: "Authenticated durable exact object", allowed_flows: "One current matching use", forbidden_flows: "Chat/replay/mutation/stale/revoked/hidden target use", enforcement_point: "Service approval ledger serialized with dispatch", failure_behavior: "Zero dispatch or crash reconciliation", evidence: "Identity/scope/display/revocation/consumption", recovery: "Revalidate ownership/scope; ambiguity blocks"}
      TB-17: {trust_and_assets: "External effect; target truth", authority_source: "Approved operation plus target readback", allowed_flows: "One bounded attempt and reconciliation", forbidden_flows: "Guessed success/blind retry/duplicate/response proof", enforcement_point: "Service effect ledger and adapter", failure_behavior: "Known failure or unknown blocks completion", evidence: "Intent-to-confirmation chain", recovery: "First-outcome dedup and readback"}
      TB-18: {trust_and_assets: "Evidence/integrity; proof/artifacts/revision", authority_source: "Schema, service records, independent readback", allowed_flows: "Validated secret-safe refs and immutable runs", forbidden_flows: "Telemetry/worker summary/self-hash as proof; stale/gapped evidence", enforcement_point: "Service evidence validator and verifier worker", failure_behavior: "Invalid/incomplete blocks completion", evidence: "Manifest/provenance/integrity/gap/stale results", recovery: "Rebuild projection; preserve tamper fact"}
      TB-19: {trust_and_assets: "Recovery/replay; leases/effects/controls", authority_source: "History, first outcome, service epoch/current policy", allowed_flows: "Deterministic reconstruction/reconciliation", forbidden_flows: "Stale lease/write, duplicate effect, fabricated continuity, secret replay", enforcement_point: "Service recovery coordinator", failure_behavior: "Recovering/blocked/failed/unknown", evidence: "Epoch/lease scan/revalidation/stale rejection", recovery: "New epoch; reconcile all nonterminal work"}
      TB-20: {trust_and_assets: "Client-to-worker protected-entry boundary", authority_source: "Authenticated takeover plus service-validated recipient/use/operation and current lease/fence-bound one-use authorization", allowed_flows: "Suspend ordinary capture; direct protected broker-to-current-recipient handoff that bypasses ordinary service data handling", forbidden_flows: "Ordinary client/service IPC, service store/scheduler/log, chat/model/context, telemetry/evidence or stale worker raw capture", enforcement_point: "Client protected broker, service authorization issuer without raw access, protected endpoint and worker recipient gate", failure_behavior: "Revoke authorization; WAITING_FOR_USER/closed", evidence: "Capture transition and non-secret receipt", recovery: "Receipt/ambiguity survives; endpoint is fenced and raw input is freshly reacquired"}

  f06_authoritative_state_ownership:
    canonical_writer: "Control service owns one store epoch; all writes use expected entity version and principal/task/lease scope."
    authoritative: ["Task/plan/predicate/policy/authority/ownership/lifecycle", "Commands, operations, leases/fences, approvals, effects, failures, verification", "Original conversation, artifacts/evidence, routing, retention/migration"]
    derived: ["Client views/transcripts/search", "Worker caches", "Dashboards and aggregate labels"]
    ephemeral: ["Client sessions", "IPC connections", "Worker processes/handles", "Streaming/prompt buffers"]
    lossy: ["Source/version/trust-bound summaries and resume briefs"]
    history: "Every material mutation appends causal audit under the same transactional boundary as current state and durable dispatch/inbox references."
    stale_writer_rule: "Entity version, store epoch and lease/fence mismatch reject state mutation and effect authority; late results remain stale observations."

  f07_operation_model:
    identity_and_schedule: "Stable command/task/attempt/operation/dispatch/effect IDs; service scheduler grants one bounded worker lease with fence token."
    lifecycle: "INTENT -> VALIDATED -> optional WAITING_FOR_APPROVAL -> DURABLE_DISPATCH -> worker RUNNING/RECONCILING -> known terminal or OUTCOME_UNCERTAIN."
    retries: "Original operation/effect identity, attempt history/cost and explicit retryability/ceiling; retry requires current lease/authority/workspace/effect certainty."
    controls: "Service commits pause/stop/redirect before ack, stops new dispatch, revokes/advances leases, orders cancellation/fence and resumes after full revalidation."
    duplicates: "Command inbox retains first outcome; duplicate delivery returns it and produces no second task/dispatch/effect."
    retirement: "Agent/service identity refuses new claims while in-flight leases/effects reconcile; history and unresolved responsibility stay addressable."
    result_rule: "Worker output is an observation validated against operation/lease/schema; invalid/lost effectful results enter reconciliation."
    fencing_distinctions:
      CONTROL_PLANE_LEASE_FENCING: "The service rejects stale commands, renewals, results and canonical writes after lease/fence or service-epoch advance. This is logical authority control only."
      LOCAL_PROCESS_TREE_CONTAINMENT: "A host enforcement mechanism must account for and cancel/force/contain the worker's descendants. This is not implied by lease revocation and remains shared SPQ-E2-002-01 / AR-EXE-003 UNKNOWN_REQUIRING_SPIKE."
      REMOTE_EFFECT_FENCING: "Capability/idempotency/revocation identities can reject future dispatch and duplicate acceptance where a target supports them; they cannot undo an already committed remote effect, which still requires readback and known/failed/unknown reconciliation."

  f08_persistence_semantics:
    candidate_choice: "Service-owned transactional current state plus append-only material history, durable command inbox, dispatch outbox, result inbox and effect ledger; Level B candidate choice only."
    acknowledgement_boundary: "Commit current state, history and required inbox/outbox/evidence links, then reread before client/worker acknowledgement."
    durability_scope: "Service/process and supported host restart on one healthy local persistence volume; media/privileged-host loss unsupported."
    corruption_partial_write: "Atomic old/new commit; integrity/schema checks quarantine original bytes and block authority on corruption or incomplete migration."
    retention_migration: "Versioned holds/deletion and restartable snapshot-backed migrations preserve open-effect/evidence history and declare rollback limits."
    restore: "Restored service instance gets new store epoch, invalidates leases/current verification and reconciles external effects/artifact references."
    artifacts: "Immutable bounded local artifact IDs with integrity/provenance/redaction/retention; content addressing optional and not used."
    external_effect_recovery_bridge: "Service transactions durably establish command, dispatch and effect intent before a worker attempt. Stable operation/effect identity, lease/fence validation, result inbox, target-specific readback and first-outcome reconciliation provide the design-level AR-DUR-003 bridge; no atomicity across worker IPC or an external target is claimed."
    nontransactional_reality: "Workspace mutations, worker/process activity, Git remotes, external APIs and provider calls are outside the service-store transaction. They use intent, attempt, observed receipt, authoritative readback and KNOWN_SUCCEEDED/KNOWN_FAILED/OUTCOME_UNCERTAIN semantics."

  f09_recovery_model:
    client_only_interruption: "A client disconnect removes no service or worker authority and appends no cancellation by itself. The service continues or safely waits under policy; reconnect reauthenticates and reconstructs current truth. This is EP-CTL-016."
    startup: "Service acquires new store epoch, validates/migrates state, reconstructs axes/history, invalidates old IPC/leases, classifies dispatches/results/effects, rereads repo/workspace/authority/approval/verification and only then reschedules."
    application_crash: "Committed ack survives; uncertain worker dispatch/result reconciles through outbox/inbox/effect state."
    host_restart: "Same sequence; stale workers/processes cannot write under old epoch/fence."
    worker_failure: "Lease expires/revokes; process outcome and possible effect are read back before bounded retry."
    model_timeout: "Typed model/provider/transport state with usage/cancel uncertainty; explicit fallback only."
    tool_timeout: "Cancel/force/fence worker tree; terminal or explicit uncertainty."
    lost_tool_result: "Possible effect remains unknown until correlated target readback."
    partial_write: "Old/new atomic record or quarantine/block; no inferred history."
    stale_workspace: "Base/identity/owner mismatch invalidates lease/workspace/verification and requires reread/recreation."
    duplicate_operation: "Durable command inbox returns first outcome; no second dispatch."
    duplicate_effect: "Effect identity/idempotency/readback prevents blind second attempt."
    external_ack_loss: "UNKNOWN_EFFECT until authoritative readback yields known success/non-success."
    stop_force: "Durable STOPPING advances fence, accounts descendants/effects and closes CANCELLED only."
    stale_approval: "Current principal/task/policy/base/target/expiry/consumption revalidated; stale use denied."
    stale_verification: "Material mutation retains old run but aggregate becomes UNVERIFIED."
    waited_event: "Event ID/version/current authority reread; duplicate returns prior result."
    protected_entry: "Only non-secret receipt persists; client must reacquire after restart."
    retirement: "No new leases; reconcile in-flight and preserve unresolved effect owner."
    workspace_partial_write_recovery:
      process_dies_during_file_write: "The service treats the worker's recorded edit as intent/attempt only and rereads actual task-workspace bytes before result acceptance."
      partially_written_file_exists: "Preserve bounded partial bytes/metadata/digest as mutation evidence; do not let a replacement worker silently overwrite or report success."
      interrupted_rename_or_replace: "Inventory temporary/source/destination objects and directory state; classify actual old/new/partial/ambiguous state, never assume atomic replace globally."
      multi_file_edit_partially_completes: "Reconcile every path and worker operation result against pinned base; retain partial achieved state, invalidate aggregate verification and return PARTIAL/BLOCKED when necessary."
      git_index_differs_from_worktree: "Service independently rereads HEAD/index/worktree, preserves unexpected divergence and blocks/replans without attributing or resetting it."
      generated_artifact_partial_write: "Artifact stays incomplete and ineligible for evidence until integrity/readback succeeds; safe partial provenance is retained."
      uncertain_filesystem_on_recovery: "Replacement worker receives no authority until service reconstruction compares actual workspace/canaries with operation ledger and pinned base; outcome is BLOCKED, UNVERIFIED, PARTIAL, known failure or proven success."
      global_atomicity_claim: false

  f10_workspace_execution_model:
    admission_base: "Service performs read-only identity/topology inventory and classifies all sixteen repository conditions; pins base and original tracked/untracked/ignored/generated/nested/worktree state."
    isolation: "Workspace broker provisions a task-owned mutable workspace before mutating reproduction; worker lease binds exact workspace/base/path scope."
    defenses: "Object/descriptor-relative path checks reject traversal, links/swaps, mounts/devices/FIFO/socket, archive escape/bombs and secret/private locations."
    process: "Worker owns bounded process group with cwd/env/fs/network/time/output/descendant contract; service lease/fence remains authority."
    scripts_hooks_network: "Package scripts, Git hooks/helpers and network are separately classified/gated; repository text grants none."
    reconciliation_cleanup: "Fresh inventories/canaries prove task-only changes; stale or ambiguous ownership blocks cleanup and future task reuse."
    isolation_classification:
      taxonomy:
        TIER_0_LOGICAL_SCOPE_ONLY: "Identity/policy labels only; insufficient for untrusted execution."
        TIER_1_BROKERED_PROCESS_PATH_AND_EFFECT_CONTAINMENT: "Service/worker brokers enforce declared paths, actions, network and secret flows, without yet proving arbitrary descendant confinement."
        TIER_2_OS_ENFORCED_EXECUTION_ISOLATION: "Supported host enforces process-tree, filesystem, network/resource and credential boundaries for the declared workload class, including descendants and stale-worker loss of authority."
        TIER_3_STRONGER_WORKLOAD_BOUNDARY: "Stronger separately administered boundary beyond frozen E1; not required or assumed."
      minimum_required_properties: "TIER_1 for brokered non-executing operations; TIER_2 semantic properties for untrusted code able to launch descendants."
      candidate_assumed_tier: TIER_2_OS_ENFORCED_EXECUTION_ISOLATION
      dependent_hard_ars: [AR-WSP-002, AR-WSP-003, AR-EXE-003, AR-EXE-004, AR-SEC-002, AR-SEC-003, AR-SEC-004]
      enforcement_layers:
        path_scope: "Service workspace broker plus worker-side required host object-identity/path primitives; unsupported if access-time identity cannot be held or revalidated."
        descendant_filesystem_and_network: "Service capabilities/leases supply policy; required worker-host execution primitives must bind arbitrary descendants, otherwise that workload class is unsupported."
        process_termination: "Worker supervisor attempts cancel/force and service fence rejects stale results; required host process-tree primitive must account for descendants. Lease fencing alone is insufficient and SPQ-E2-002-01 remains open."
        secret_exclusion: "Client protected broker, service-issued non-secret one-use authorization and worker recipient gate exclude ordinary paths; capture/delivery feasibility remains SPQ-E2-002-02/04 and missing exclusion fails closed."
      filesystem_boundary_expectation: "Lease binds the exact task workspace; broker/worker identity checks deny out-of-root, link/special/archive and ambiguous cleanup targets."
      network_boundary_expectation: "Default deny; exact effective destination/data/credential/purpose grant, with service decision and worker enforcement."
      process_tree_expectation: "Worker supervisor accounts for descendants; service lease fence prevents stale commits but does not itself prove containment."
      secret_boundary_expectation: "No ambient worker secret; exact one-use direct protected delivery bypasses the service's ordinary data plane."
      not_guaranteed: "No compromised-host, cross-tenant, side-channel or TIER_3 guarantee."
      resolution_status: "Tier semantics are analysis-resolvable; descendant containment is shared SPQ-E2-002-01 and UNKNOWN_REQUIRING_SPIKE; product/technology selection is deferred."
      AQ_003: "Same classification as C01/C03: tier declared, descendant host feasibility is shared SPQ-E2-002-01 selection-blocking E2-004 feasibility, and the mechanism is unselected."

  f11_git_model:
    model: "Service Git capability maps every action to one of thirty frozen rows and issues a worker-safe structured invocation; no free-form/model authority."
    controls: "Exact repo/base/ref/path/effect/network/credential/approval scope; hooks, aliases, helpers, filters, signers, external diff, submodule/LFS and transports disabled unless separately supported."
    readback: "Service independently rereads HEAD/refs/index/worktree/untracked/ignored and target remote state where authorized."
    separation: "Local, destructive, external-read and remote-effect classes remain distinct; prohibited v0.1 actions stay prohibited even with approval."
    review_package: "Local NOT_SUBMITTED package binds exact base/head/patch, changes, checks, limitations, evidence, verification and effect state."

  f12_approval_effect_model:
    distinct_concepts: [INTENT, APPROVAL, ATTEMPT, OBSERVED_EFFECT, CONFIRMED_EFFECT, UNKNOWN_EFFECT]
    approval: "Service stores authenticated exact full normalized scope, issuer, task/policy/plan/base/target/schema/capability/effect ID, expiry, revocation and one-shot consumption."
    dispatch: "Approval consumption and dispatch-outbox record serialize; worker must present current lease/fence and action binding."
    observation_confirmation: "Worker receipt is observed only; service/adapter authoritative readback establishes confirmed success or known non-success."
    ambiguity: "Lost worker/service/external acknowledgement produces UNKNOWN_EFFECT, blocks completion and prevents blind replay."
    replay_idempotency: "Stable command/operation/effect IDs, target idempotency where available, first-outcome inbox and readback yield at most one effect."

  f13_model_provider_boundary:
    contract: "Service gateway keeps logical roles/provider-neutral semantics; no model/provider assignment."
    routing: "Purpose, eligibility/capability discovery, data/network/credential/budget policy and result normalization precede dispatch."
    eligibility: [ELIGIBLE_IF_LATER_VERIFIED, EVALUATION_ONLY, DISALLOWED, USER_CONFIGURED_UNVERIFIED_EXPERIMENTAL]
    fallback: "Explicit authorized parent/resolved route only; no eligible route yields zero dispatch."
    failures: "Provider/model/transport/policy/capability/tool/timeout/cancel/result failures stay typed."
    provenance: "Requested/resolved route/config/tool, eligibility, latency, usage/cost, fallback, cancellation and outcome."
    calls: "Offline adapter replays supported; E2-002 runs no live/paid call."

  f14_context_memory_model:
    model: "Service stores original conversation/task/evidence outside prompts and builds bounded versioned manifests for each worker/model/verifier invocation."
    summary: "Lossy summary includes source IDs/versions/trust/corrections/omissions and is invalidated on conflict; it grants no authority."
    resume: "Fresh service retrieval restores current authority, approvals/effects/failures/evidence/verification before optional summary."
    protected_facts: "Security, completion, approval/effect and evidence facts cannot be compacted away."
    technology: "Stable-ID retrieval suffices; no vector/RAG stack is required."

  f15_evidence_artifact_model:
    bundle: "Service builds versioned outcome-profile bundle bound to exact task/attempt/store/workspace/base/head/patch/policy/plan/predicate and disposition."
    provenance: "Actors, client/worker/lease, route/model/tool, commands/checks, bounds/results/retries, approval/effect/readback, failures, predicates and verifier."
    artifacts: "Immutable bounded local refs with integrity/type/size/source/redaction/retention; raw protected data excluded."
    integrity: "Causal versions, manifest validation and independent reread detect gap/tamper/substitution/reorder/stale; digest alone proves no correctness."
    verification_binding: "Candidate mutation preserves history and invalidates current aggregate pass."
    limitations: "Missing/unknown/unavailable fields are explicit and block dependent disposition."

  f16_independent_verification_path:
    separation: "Verifier worker is separately leased with distinct identity/config/context/workspace and no author workspace write or inherited approval."
    access: "Reads underlying authoritative service records, exact candidate and effect state; not restricted to executor/author summary."
    work: "Reruns deterministic checks/readbacks and adequacy evaluation under least privilege."
    lifecycle: "Immutable sequential run; crash/timeout -> VERIFICATION_ERROR and UNVERIFIED; correction -> linked attempt/revision/fresh run."
    ceilings: "Finite rerun owner interface registered by E2-005; no value chosen here."
    stale: "Material service/repo/effect/predicate/policy change invalidates current run."

  f17_observability_failure_model:
    records: "Service exposes correlated axes, clients/workers/leases, operations/controls/waits, approvals/effects, routes/budgets, evidence/verification and limitations."
    separation: "Telemetry/client status are derived; mandatory audit/evidence are unsampled authority/evidence classes."
    failures: "Typed layer, retryability, cause, task/operation/effect/predicate consequence, recovery owner and next action; unknown stays unknown."
    explanations: "Evidence-linked, no chain-of-thought requirement."
    loss: "Mandatory audit/evidence gap is visible and blocks affected verification/completion."

  f18_security_control_ownership:
    service_policy_kernel: "Deterministic precedence, capability, limits, approval/effect and route decisions outside model judgment."
    workspace_and_worker: "Workspace broker controls objects/roots; worker supervisor controls process/I/O/network; leases/fences prevent stale authority."
    gateways: "Git/capability/provider/network/evidence boundaries validate requests and results."
    protected_entry: "Client protected broker suspends/excludes ordinary capture and authenticates takeover. The service validates recipient/use/operation and the current worker lease/fence and issues a non-secret one-use authorization without seeing raw bytes; a protected endpoint carries the value directly to the exact worker/tool recipient. Ordinary service/IPC/store/log/model/evidence paths are forbidden, transient buffers clear, unavailable exclusion waits/blocks, and recovery fences then reacquires rather than replaying."
    fail_closed: "Unavailable structural control makes the capability unsupported/waiting/blocked."

  f19_packaging_local_first_behavior:
    candidate_assumption: "User-local control service plus one or more thin local clients and bundled/declared worker entrypoints; technologies unselected."
    long_running_components: "One persistent user-local control service independent of all client sessions; zero or more clients may attach, and bounded replaceable workers/verifiers exist only under leases. No external database/queue/cloud control state."
    setup_operation: "Supported-host/runtime manifest, service lifecycle/IPC identity, state/workspace roots, prerequisites, migration and security limitations are visible."
    offline: "Local repository/evidence/fake-provider workflows operate offline; authorized provider/network features naturally do not."
    update_cleanup: "Quiesce/fence workers, snapshot/migrate/validate service state, declare rollback; uninstall distinguishes binaries, state, workspaces and held evidence."
    contributor: "Local service/client/worker fixture environment reproduces IPC loss, lease races and worker faults without paid infrastructure."

