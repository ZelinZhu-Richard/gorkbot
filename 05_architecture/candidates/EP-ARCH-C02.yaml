  f02_system_shape:
    summary: >-
      A persistent user-local control service is the sole authority for tasks, policy,
      persistence, scheduling, recovery, approvals, effects, routing and evidence. Authenticated
      thin local clients render projections and submit commands. Disposable execution and
      verification workers cross explicit versioned service boundaries. No cloud service or
      remote worker is implemented.
    components:
      control_service: "Single canonical writer, durable scheduler, policy/recovery/effect coordinator, provider/capability gateway and evidence owner."
      thin_client: "Authenticated local interaction, control/approval display, protected-entry takeover and evidence inspection; never canonical authority."
      execution_worker: "Leased, fenced, least-authority worker supervising one bounded task process tree in one isolated workspace."
      verifier_worker: "Separately leased, least-privilege worker with a distinct review workspace and underlying readback access."
      embedded_state: "Private local transactional state/history and artifact boundary owned only by the service."
    end_to_end_flow: "Client intent -> durable service admission/ack -> scheduled fenced worker operation -> approval/capability/effect boundary -> observation/readback -> evidence -> separate verifier -> service-derived disposition."
    lifetime_model:
      CLIENT_LIFETIME: "Any thin-client session may attach, disconnect, close and reconnect; client disappearance is never task cancellation or service shutdown."
      CONTROL_AUTHORITY_LIFETIME: "The user-local control service persists independently of client sessions and retains the sole canonical-writer/recovery epoch until explicit full-system shutdown or service failure."
      EXECUTION_OWNER_LIFETIME: "A replaceable worker owns one leased operation/process tree only while its current lease/fence is valid; the service durably owns assignment and reconciliation across worker loss."
      TASK_LIFETIME: "An admitted task persists independently of every client and worker until truthful terminal or retained blocked/waiting disposition."
      WORKSPACE_LIFETIME: "The task workspace persists across client and worker replacement until service reconciliation authorizes scoped cleanup."
      relationships: "CLIENT_LIFETIME and individual WORKER_LIFETIME are shorter than CONTROL_AUTHORITY_LIFETIME; TASK_LIFETIME and WORKSPACE_LIFETIME survive all three. This explicit independent service/replaceable-worker topology is C02's defining distinction."

  f03_client_interaction_boundary:
    conceptual_client: "Thin local client over authenticated local IPC; concrete UI/CLI/web technology is a CANDIDATE ASSUMPTION and remains unselected."
    intent_and_ack: "Commands carry stable request ID and expected task version; service acks only after durable commit and duplicate IDs receive the first outcome."
    reconnect: "Any client session rebuilds an axis-qualified projection from service read APIs; disconnect never changes task truth."
    controls: "Pause, stop, redirect, resume, approval, denial and revocation are versioned service commands with durable results."
    approval_and_evidence: "Client displays exact inert scope and can inspect source records/artifacts/verifier evidence, not only worker narration."
    protected_entry: "Client switches to a distinct capture-excluded takeover path and passes an opaque one-use recipient handle; the service stores only a non-secret receipt."
    disconnect_and_exit: "Client-only exit only drops the session; the service and valid workers continue within policy. Explicit full-system shutdown is a different authenticated command that stops intake, revokes/fences leases, reconciles effects and persists safe task/workspace dispositions."
    stale_client_rule: "Reconnect creates a new authenticated session and projection cursor; old session authority and cached versions never revive automatically."

  f04_process_boundaries:
    orchestration_owner: "Persistent control service with one canonical-writer epoch."
    persistence_owner: "Service persistence port; clients/workers/verifier have no direct canonical write access."
    execution_owner: "Leased execution worker plus its process-tree supervisor; the service issues lease/fence tokens and owns reconciliation."
    verification_owner: "Distinct verifier worker/run identity, context and workspace; service records the immutable run but cannot turn worker self-report into pass."
    provider_call_owner: "Service provider gateway validates route; a bounded adapter worker may perform the call and return typed observations."
    control_and_fencing_owner: "Service durably orders control and advances fence epoch; worker enforces cancellation while late/stale results are rejected."
    boundary_contract: "Authenticated local IPC envelopes bind principal, task/operation, expected version, lease/fence, policy/capability, deadline, effect identity and correlation."
    protected_delivery_path:
      protected_entry_begins: "At authenticated takeover inside the thin client's protected broker, after ordinary UI/model/tool capture has been suspended or excluded."
      ordinary_capture_stops: "Before any raw byte enters the ordinary command, transcript, clipboard, screenshot/accessibility, terminal, telemetry, IPC-log or service-request pipelines."
      scope_validator: "The control service validates authenticated principal, task/operation, exact recipient/process/tool, purpose, policy/capability version, lease/fence, expiry and one-use state without receiving the raw value."
      delivery: "The service issues an opaque one-use delivery authorization. The protected client broker uses it to establish a direct exact-recipient handoff that bypasses ordinary service data handling; transport technology is unselected."
      forbidden_raw_observers: ["ordinary client/UI code", "control-service API/store/logs", "scheduler and worker orchestration", "model/context/transcript", "telemetry/evidence/artifacts", "unintended worker processes"]
      persisted_receipt: "Only non-secret acquisition/delivery identity, task/operation, recipient/use, lease/fence, time, denial/attempt/disposition and reconciliation status."
      worker_replacement: "Advancing the lease/fence revokes any unused handle and clears transient raw state; a replacement worker requires a new exact scope and fresh human acquisition."
      crash_semantics: "Before recipient acceptance the result is known-not-delivered when provable; during/after ambiguous handoff it is DELIVERY_UNKNOWN, the old handle is revoked, and raw input is never replayed."
      replay_rule: "A handle is single-use, expiry- and fence-bound; retries reacquire from the human under a new identity rather than storing or replaying the value."
      revocation_and_fencing: "Consumption, expiry, denial, control, worker replacement, service epoch change or full shutdown revokes the authorization; the recipient rejects stale fence/use identities."
    no_live_service_semantics: "Without the service no productive worker authority may renew or commit; finite leases/fences bound stale work. Restart establishes a new service epoch, rejects old clients/workers, classifies overdue operations and reconciles before rescheduling."
    full_system_shutdown: "Explicitly quiesces intake, persists intent, revokes leases, cancels/fences process trees, reconciles external effects and leaves tasks/workspaces durable; it is not inferred from the last client disconnecting."

