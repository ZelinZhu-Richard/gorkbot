  f22_open_source_contributor_burden_accessibility:
    setup_complexity: "Service lifecycle plus thin client and worker toolchain; local IPC/state directories must be understood."
    processes_services: "One long-running local service, one active client, bounded executor/verifier workers; no external infra."
    platform_assumptions: "Supported local IPC authentication, service lifecycle, process fencing, path and protected-entry primitives."
    dependency_burden: "Separate service/client/worker packages or build targets; concrete technologies/count unknown."
    local_tests: "Offline service harness can run clients/workers/fakes and all deterministic fault paths without paid providers."
    reproduction_debugging: "Correlation spans IPC and worker leases; durable service history offers one inspection source while stale-client/worker races add cases."
    bounded_subsystem: "Client, policy, persistence, scheduler, workspace, worker, gateway, evidence and verifier contracts are independently modifiable."
    documentation: "Service installation/lifecycle, IPC/auth, lease/fence semantics, worker support, migrations and recovery require explicit docs."
    preference_status: "AR-PRF-006 characterized only; no score or conclusion."

