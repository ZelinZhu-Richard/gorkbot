    D03_TASK_WORKFLOW_ORCHESTRATION: {owner: SERVICE_SCHEDULER, answer: "Durable axes, commands, leases/fences, retries, controls and retirement."}
    D04_DURABLE_STATE_PERSISTENCE: {owner: SERVICE_PERSISTENCE, answer: "Transactional state/history plus inbox/outbox/effect ledgers."}
    D05_CANONICAL_TASK_CONVERSATION_EVIDENCE_MODEL: {owner: CONTROL_SERVICE, answer: "Original messages/state/evidence authoritative; client/worker views derived."}
    D06_EVENT_OPERATION_HISTORY: {owner: SERVICE_HISTORY, answer: "Causal append history and command/dispatch/result/effect records."}
    D07_FILESYSTEM_WORKSPACE_ABSTRACTION: {owner: WORKSPACE_BROKER, answer: "Admission, pinned base, isolated lease-bound workspace, stale cleanup."}
    D08_EXECUTION_PROCESS_CONTROL: {owner: EXECUTION_WORKER_AND_SERVICE_FENCE, answer: "Worker supervises process tree; service lease/fence owns authority."}
    D09_ISOLATION_SANDBOXING: {owner: WORKSPACE_AND_WORKER_BOUNDARIES, answer: "Path/process/secret/network structural controls with support matrix."}
    D10_GIT_INTEGRATION: {owner: SERVICE_GIT_ADAPTER, answer: "Thirty rows, safe invocation and independent readback."}
    D11_APPROVAL_PERMISSION_SYSTEM: {owner: SERVICE_POLICY_APPROVAL_LEDGER, answer: "Exact grants/approvals consumed with dispatch; protected path separate."}
    D12_EXTERNAL_EFFECT_RECONCILIATION: {owner: SERVICE_EFFECT_LEDGER, answer: "Outbox/worker observation/readback and explicit unknown."}
