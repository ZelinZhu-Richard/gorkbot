consequence_model:
  terms:
    CANDIDATE_NONVIABLE: >-
      Current evidence proves one candidate has a structural contradiction with a hard AR.
      The candidate leaves the survivor set; no other candidate is selected by default.
    E2_005_BLOCKED: >-
      A verified selection-blocking uncertainty or repository lifecycle gate prevents E2-005.
      Currently the lifecycle blocks E2-005 pending E2-003 verification and E2-004 closure.
    ARCHITECTURE_REVISION_REQUIRED: >-
      A proposed baseline must change; this does not by itself identify one candidate as nonviable.
    E3_HAND_BACK_TO_E2: >-
      E3 evidence structurally disproves a required assumption/property in a linked proposed or accepted ADR.
      E3 stops and returns evidence to E2; it does not redesign silently.
    IMPLEMENTATION_CONFIGURATION_FAILURE: >-
      A mechanism, adapter, fixture, wiring, or supported configuration fails while an alternate conforming
      realization remains possible. Correct or replace it and revalidate without automatic ADR reopening.
    PRODUCT_CLASS_UNSUPPORTED: >-
      No demonstrated safe mechanism exists for a host/client/workload class. Narrow support and fail closed;
      hand back only if a linked ADR requires that class/property and no conforming alternative remains.
    EVIDENCE_MISSING_FAIL_CLOSED: >-
      Missing, invalid, incomplete, or inconclusive evidence grants no success credit and cannot broaden scope.
  profiles:
    ANALYSIS_CLOSED:
      success: The bounded architecture fact/tradeoff is recorded without empirical or ranking credit.
      failure: A contrary hard fact would be CANDIDATE_NONVIABLE or ARCHITECTURE_REVISION_REQUIRED; none was found.
      missing: The item would remain unresolved and E2_005_BLOCKED; no favorable inference is permitted.
      invalidates_candidate: Only a proven candidate-specific hard contradiction.
      e2_progression: Closed items do not independently block the required E2-004 closure.
      adr_reopen: Not applicable before an ADR; later contrary evidence follows E3_HAND_BACK_TO_E2 when linked.
      alternate_implementation: Architecture facts do not prove a concrete implementation.
    E3_HARD_PROPERTY:
      success: Validates only the exact selected mechanism/configuration/tested scope.
      failure: Root-cause as IMPLEMENTATION_CONFIGURATION_FAILURE, PRODUCT_CLASS_UNSUPPORTED, or E3_HAND_BACK_TO_E2.
      missing: EVIDENCE_MISSING_FAIL_CLOSED; the protected operation/support claim stays waiting, blocked, or unsupported.
      invalidates_candidate: Only structural impossibility for a required hard property, not one failed mechanism.
      e2_progression: Does not block E2-005 after verified no-spike closure because every candidate exposes the seam.
      adr_reopen: Required only when the failure disproves a linked ADR assumption/property and no alternate remains.
      alternate_implementation: Permitted when it conforms to the same boundary and is independently revalidated.
    E3_MODEL_ELIGIBILITY:
      success: Qualifies only the tested logical-role occupant/provider/configuration within tested scope.
      failure: Leaves the role/configuration ineligible; it does not invalidate the architecture gateway by itself.
      missing: Role remains unassigned and no paid call or benchmark is inferred.
      invalidates_candidate: No, unless later evidence proves the provider-neutral architecture contract structurally impossible.
      e2_progression: Does not block E2-005 architecture comparison.
      adr_reopen: Only on structural contradiction with the linked routing ADR.
      alternate_implementation: Alternate eligible model/provider/configuration may be evaluated under separate authority.
    E4_IMPLEMENTATION_CHOICE:
      success: A later authorized implementation conforms to E2/E3 contracts.
      failure: Correct or replace the implementation; hand back only on structural architecture contradiction.
      missing: No application construction or autonomous build is authorized.
      invalidates_candidate: No automatic invalidation.
      e2_progression: Does not block E2-005.
      adr_reopen: Only with evidence of structural contradiction.
      alternate_implementation: Explicitly permitted after authorization.
    FUTURE_SCOPE_POLICY:
      success: A later registered decision may authorize bounded future scope.
      failure: Scope remains deferred; v0.1 architecture compatibility seam is unaffected.
      missing: No future product is inferred or implemented.
      invalidates_candidate: No.
      e2_progression: Does not block E2-005 beyond the hard compatibility floor.
      adr_reopen: Only a later authorized governance decision can change scope.
      alternate_implementation: Not applicable before scope authorization.
    PREFERENCE_AUTHORITY:
      success: E2-005 records an explicit qualitative priority rationale or prospectively governed weights.
      failure: No overall score/rank may be produced; hard-gate comparison remains available.
      missing: No weights, scores, preferred candidate, or favorable inference.
      invalidates_candidate: Never; preferences cannot compensate for or create a hard result.
      e2_progression: Does not block E2-004 hard/no-spike closure.
      adr_reopen: Not applicable until a later accountable decision records its rationale.
      alternate_implementation: Not applicable.

