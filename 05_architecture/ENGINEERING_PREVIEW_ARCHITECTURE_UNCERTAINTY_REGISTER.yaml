uncertainties:
  - uncertainty_id: E2U-PAPER-C01-U01
    classification: PAPER_RESOLVABLE
    state: RESOLVED
    source_refs: ["EP-ARCH-C01:f27:C01-U01"]
    candidates: [EP-ARCH-C01]
    affected_criteria: [AR-PRF-002, AR-PRF-006]
    owner: E2-003_AUTHOR_ANALYSIS
    question: Can the broad integrated core remain modular enough for independent testing and bounded contributor ownership?
    rationale: >-
      C01 exposes explicit policy, execution, gateway, evidence, and verifier ports and therefore has
      testable ownership seams, while the integrated authority still creates broad-core coupling and
      a larger contributor blast radius. The evidence is mixed and supplies no rank.
    evidence: EP-ARCH-C01 f02, f04, f16, f22, f25, f26 and f28.
    resolution: RESOLVED_NEUTRAL
    decision_linkage: E2-003 preference comparison; E2-005 may weigh the tradeoff after E2-004.
    blocking_consequence: NONE_AFTER_RESOLUTION; contributor ease remains unscored and later observable.

  - uncertainty_id: E2U-PAPER-C01-U02
    classification: PAPER_RESOLVABLE
    state: RESOLVED
    source_refs: ["EP-ARCH-C01:f27:C01-U02"]
    candidates: [EP-ARCH-C01]
    affected_criteria: [AR-PRF-003, AR-PRF-004]
    owner: E2-003_AUTHOR_ANALYSIS
    question: What preference cost and reversibility burden follows from later extracting C01 remote/concurrency seams?
    rationale: >-
      The versioned executor/provider/capability ports preserve the hard compatibility floor, but a later
      remote control plane or multiple-owner design must extract authority from the integrated single-writer
      core and migrate its store/history/effect semantics. That is a material C01 preference weakness.
    evidence: EP-ARCH-C01 f20, f23 AR-FUT-001/002 and AR-PRF-003/004, f26 and f28.
    resolution: RESOLVED_UNFAVORABLE
    decision_linkage: E2-003 reversibility/sensitivity; no architecture selection.
    blocking_consequence: NONE; hard compatibility remains confirmed and the result is preference-only.

