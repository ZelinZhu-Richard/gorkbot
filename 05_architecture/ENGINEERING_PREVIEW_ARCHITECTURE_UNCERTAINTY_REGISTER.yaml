e3_obligation_contracts:
  E3V-001:
    property: Selected persistence/recovery mechanism preserves canonical truth, partial-write safety, migration, quarantine, and ambiguity.
    required_evidence: Versioned recovery/corruption/partial-write/migration fixtures and authoritative readback for the selected state model.
    success: Validates exact tested persistence configuration only.
    failure: Correct/replace mechanism unless structural impossibility requires E3_HAND_BACK_TO_E2 for ADR-E2-002/003/004.
    missing: EVIDENCE_MISSING_FAIL_CLOSED; recovery claim remains unvalidated.
  E3V-002:
    property: >-
      Selected containment plus authority fencing accounts for descendants, provides bounded cooperative/force-stop
      behavior where claimed, rejects stale results/effects, and fails closed where force termination is unavailable.
    required_evidence:
      - Exact host/platform/process/configuration support declaration and versions.
      - Representative parent/child/descendant identity, accounting, cancellation, force-stop, owner-loss, and recovery observations.
      - Durable epoch/lease/workflow fence and rejection of stale result, approval, and effect authority.
      - Force-termination primitive, permissions, bounds, unavailable behavior, survivor/orphan discovery, and limitations.
      - Commands/configuration, ordered observations/timestamps, authority/effect records, readback, and explicit unsupported scope.
    success: Validates only tested host/platform/process/configuration classes; never generalize beyond them.
    failure: IMPLEMENTATION_CONFIGURATION_FAILURE or PRODUCT_CLASS_UNSUPPORTED unless structural impossibility requires E3_HAND_BACK_TO_E2.
    missing: EVIDENCE_MISSING_FAIL_CLOSED; execution remains blocked/fenced and support scope cannot broaden.
    handback: Reopen the linked ADR only when no conforming realization can satisfy required AR-EXE-003 semantics.
  E3V-003:
    property: Selected local packaging, workspace, Git, startup/recovery, and contributor workflow is operable on each claimed platform.
    required_evidence: Clean supported-host setup, workspace/path/Git scenarios, interruption/recovery, inspectability, and exact limitations.
    success: Validates tested package/toolchain/platform scope only.
    failure: Correct packaging/configuration or narrow support; structural support-boundary contradiction hands back to ADR-E2-001/004/009.
    missing: EVIDENCE_MISSING_FAIL_CLOSED; platform remains unsupported.
  E3V-004:
    property: Selected capability, approval, gateway, audit, redaction, and unauthorized-adapter controls enforce policy.
    required_evidence: Deny/allow, stale approval, takeover/revocation, redaction, gateway bypass, audit/readback, and scope fixtures.
    success: Validates tested policy/gateway configuration only.
    failure: Correct/replace configuration; structural authority-boundary contradiction hands back to ADR-E2-001/005/008.
    missing: EVIDENCE_MISSING_FAIL_CLOSED; effect remains denied or waiting.
  E3V-005:
    property: Selected orchestration/effect mechanism preserves idempotency, truthful ambiguity, reconciliation, and noncompensating completion.
    required_evidence: Duplicate input/operation/effect, lost acknowledgement, stale verification, crash/recovery, reconciliation, and readback fixtures.
    success: Validates tested mechanism/effect class only.
    failure: Correct/replace mechanism or narrow effect support; structural contradiction hands back to ADR-E2-003/005.
    missing: EVIDENCE_MISSING_FAIL_CLOSED with UNKNOWN_OUTCOME where outcome cannot be proven.
  E3V-006:
    property: >-
      Selected client/execution configuration provides protected acquisition, complete capture exclusion, exact-recipient
      one-use delivery, replacement/recovery revocation, no raw replay, unauthorized-surface exclusion, and fail-to-WAIT.
    required_evidence:
      - Synthetic sentinel only; no real secret.
      - Complete named observer/capture-surface inventory for the selected client/execution configuration.
      - Exact task/operation/recipient/purpose/lease-or-fence/expiry binding and one-use delivery.
      - Crash, cancellation, replacement, revocation, expiry, receipt, recovery, and reacquisition behavior.
      - Raw-value absence from transcript, model context, logs, telemetry, evidence, caches/history, journal/payload/projections, and all other unauthorized surfaces.
      - Exact supported and unsupported client/platform/configuration scope and independent readback/scans.
    success: Validates only the tested client/execution configuration; no architecture-wide generalization.
    failure: IMPLEMENTATION_CONFIGURATION_FAILURE or PRODUCT_CLASS_UNSUPPORTED unless no conforming seam realization remains.
    missing: EVIDENCE_MISSING_FAIL_CLOSED; task remains WAITING_FOR_USER/blocked and never falls back to ordinary capture.
    handback: Reopen ADR-E2-005 only for structural inability to realize a required protected-entry property.
  E3V-007:
    property: Selected evidence/artifact/provenance/integrity mechanism binds exact state, independently verifies, detects drift, and preserves typed failures.
    required_evidence: Manifest, drift, corruption, large-output, verifier-independence, provenance, and readback fixtures.
    success: Validates tested evidence/storage configuration only.
    failure: Correct/replace mechanism; structural evidence-boundary contradiction hands back to ADR-E2-002/007/008.
    missing: EVIDENCE_MISSING_FAIL_CLOSED; verification/completion remains unsatisfied.
  E3V-008:
    property: Only independently benchmarked eligible logical-role occupants/providers/configurations may be assigned.
    required_evidence: Separate authorized benchmark plan execution, raw results, eligibility gates, cost/scope, and independent verification.
    success: Qualifies only tested role/provider/configuration scope.
    failure: Leaves that configuration unassigned; does not choose another or invalidate architecture automatically.
    missing: No assignment, no benchmark inference, and no paid call.
    handback: Only a structural provider-neutral routing contradiction can return ADR-E2-006 to E2.

e2_004_no_spike_closure_contract:
  lifecycle_step_required: true
  current_status: NOT_RUN_BLOCKED_PENDING_E2_003_INDEPENDENT_VERIFICATION
  retained_preselection_spike_ids: []
  verifier_must_confirm:
    - Every E2-003 PAPER_RESOLVABLE item is resolved.
    - No architecture-blocking empirical uncertainty remains.
    - All empirical residuals are legitimately assigned to E3 or E4.
    - Every deferred hard property has a structural architecture seam.
    - Every E3 deferral has explicit evidence and tested-scope requirements.
    - Every E3 deferral has fail-closed behavior.
    - Every E3 deferral has an E2/ADR handback trigger.
    - No candidate receives favorable credit from missing evidence.
    - No spike was skipped merely to save effort.
  pass_output: NO_PRESELECTION_SPIKE_REQUIRED
  failure_output: E2_005_BLOCKED_WITH_EXACT_UNCLOSED_ITEM
  bypass_permitted: false

candidate_readiness:
  EP-ARCH-C01: ANALYTICALLY_VIABLE_READY_FOR_E2_005_AFTER_INDEPENDENTLY_VERIFIED_E2_004_NO_SPIKE_CLOSURE
  EP-ARCH-C02: ANALYTICALLY_VIABLE_READY_FOR_E2_005_AFTER_INDEPENDENTLY_VERIFIED_E2_004_NO_SPIKE_CLOSURE
  EP-ARCH-C03: ANALYTICALLY_VIABLE_READY_FOR_E2_005_AFTER_INDEPENDENTLY_VERIFIED_E2_004_NO_SPIKE_CLOSURE

e2_e3_boundary:
  e2_decides:
    - system structure and authority ownership
    - interfaces and trust boundaries
    - required containment and protected-entry seams
    - recovery, evidence, and verification architecture
  e3_validates:
    - concrete mechanism feasibility
    - selected platform and client behavior
    - model, provider, and configuration eligibility
    - bounded empirical obligations E3V-001 through E3V-008
  handback_rule: >-
    E3 hands back only when evidence disproves an assumption/property required by a linked proposed or accepted ADR
    and no conforming realization remains. E3 may not silently redesign E2.

