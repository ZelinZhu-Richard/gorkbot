    candidates: [EP-ARCH-C01, EP-ARCH-C02, EP-ARCH-C03]
    affected_criteria: [AR-SEC-006]
    owner: E2-004_AUTHOR_WITH_INDEPENDENT_CHALLENGER_AND_VERIFIER
    question: >-
      Can a supported local human-acquisition boundary exclude every ordinary observation/capture surface,
      return only a non-secret receipt, fail closed when protection is unavailable, and avoid raw replay after recovery?
    rationale: >-
      A design diagram cannot demonstrate client/host capture exclusion. AR-SEC-006 is a hard property, and a
      missing observer cannot be inferred clean. The question is shared before candidate-specific delivery.
    decision_linkage: E2-004 must close this blocker before any candidate enters E2-005 consideration.
    blocking_consequence: BLOCKS_E2_005_FOR_ALL_THREE_CANDIDATES_UNTIL_PASS; fail or inconclusive remains blocking.
    sp_c_reuse:
      reused: [SP-C04, SP-C05]
      reuse_detail: >-
        Reuse SP-C04 exact authorization, one-use receipt, revocation, and readback concepts plus SP-C05 takeover,
        recovery, cancellation, and explicit unsupported-capability behavior. Narrow to shared acquisition/capture;
        do not execute broad capability or execution-provider spikes.
    spike_contract:
      question: >-
        Can one local synthetic protected-entry harness prove exact protected-recipient acquisition while every
        mandatory ordinary observer is complete and clean, without persisting raw protected material?
      hypothesis: >-
        A protected acquisition broker can suspend ordinary capture, deliver an ephemeral synthetic marker only
        to a controlled protected sink, return a non-secret one-use receipt, and fail to wait/block when exclusion
        is unavailable or recovery makes delivery ambiguous.
      alternatives:
        - Acquisition succeeds with complete capture exclusion and exact one-use protected receipt.
        - Protection is unavailable and the operation fails closed to WAITING_FOR_USER or a blocker with zero delivery.
        - The declared client/host class is unsupported because capture exclusion cannot be demonstrated.
      minimal_prototype: >-
        One local protected-acquisition adapter, one in-memory ephemeral synthetic-marker generator, one controlled
        exact-recipient sink, one non-secret receipt sink, and complete observers for ordinary capture surfaces.
        Raw marker bytes are compared in memory and are prohibited from every persisted artifact.
      workload:
        frozen_case_count: 4
        seed_identity: E2-004-S02-FIXED-001
        cases:
          - protected_entry_success_exactly_once
          - protection_unavailable_fail_closed
          - crash_before_nonsecret_receipt_no_raw_replay
          - revocation_or_resume_revalidation_before_second_use
        mandatory_observers:
          - keystroke
          - clipboard
          - screen_and_screenshot
          - accessibility_state
          - terminal_input_output_and_history
          - model_prompt_and_working_context
          - transcript_and_summary
          - application_log_and_crash_surface
          - telemetry_and_intermediate_trace
          - tool_arguments_results_and_environment
          - temporary_cache_and_artifact
          - evidence_bundle_and_user_visible_status
        execution_rule: Each case runs exactly once with every observer reporting capture completeness.
        repetition_rule: >-
          No favorable rerun. An independently confirmed harness defect invalidates the entire versioned workload
          and requires a prospective corrected contract/version before any rerun.
      success_criteria:
        - In the success case the ephemeral marker is consumed exactly once by the protected sink and zero times by every ordinary observer.
        - Every mandatory observer reports complete coverage; missing capture is not a clean result.
        - Unavailable protection produces WAITING_FOR_USER or an explicit blocker, zero delivery, and a non-secret reason.
        - Crash/revocation/resume yields no raw replay; ambiguity requires reacquisition and a new exact authorization.
        - Persisted evidence contains only observer identities, counts/booleans, capture completeness, receipt identity/scope/outcome, and safe failures—never raw marker bytes or a recreatable digest.
      failure_criteria:
        - Any raw marker exposure, persistence, ordinary capture, second consumption, replay, or bypass.
        - Any protection-unavailable path that accepts ordinary entry or reports success.
        - Any missing observer, guessed clean result, raw/digest echo, or receipt that contains protected content.
      security_checks:
        - Synthetic local marker only; no real secret, credential, provider/model call, network, screenshot of real user state, or external effect.
        - Raw marker bytes exist only in ephemeral harness memory and the controlled sink and are destroyed after in-memory comparison.
        - Artifact, history, process/environment, temp/cache, log, evidence, and repository scans must find no raw marker.
        - Capture-unavailable, crash, revocation, stale receipt, and replay paths fail closed.
      finite_budget:
        external_spend_usd: 0
        paid_calls: 0
        network_access: DENIED
        wall_clock_minutes: 150
        cpu_minutes: 90
        disk_mib: 256
        launched_cases: 4
        dependencies_or_installations: 0
      stop_condition:
        - Stop immediately on any marker leak, raw persistence, missing mandatory observer, or fail-open path; preserve the blocker as FAIL.
        - Stop at the first budget ceiling, unsafe capture condition, or request to inspect real user/secret data.
        - Never add an observer, exception, client class, or success relaxation after seeing a result.
      artifact:
        directory: 05_architecture/spikes/E2-004-S02/
        required_files:
          - frozen_manifest.yaml
          - observer_completeness_and_counts.csv
          - nonsecret_receipt_and_recovery_evidence.yaml
          - decision_consequence.yaml
        raw_protected_material_retention: PROHIBITED
        required_content: >-
          Exact local environment/support declaration, adapter identity, case order, observer completeness and
          unauthorized-count facts, non-secret receipt/recovery results, failures, resource/cost accounting,
          scans, limitations, and candidate consequences. No marker or recreatable marker digest is retained.
      decision_rule:
        PASS: >-
          All four cases and every observer satisfy every success criterion with no failure; all candidates clear
          the shared acquisition/capture blocker for later E2-005 consideration, without ranking.
        FAIL: >-
          Any leak, persistence, replay, bypass, incomplete observer, or fail-open condition blocks all candidates
          for the declared client/host class until the support boundary or architecture is prospectively revised.
        INCONCLUSIVE_BLOCKING: >-
          Missing/invalid observation, harness ambiguity, or budget exhaustion yields no credit and blocks E2-005.
      no_go_result: >-
        If capture exclusion cannot be demonstrated without using ordinary chat, terminal, screenshots, logs,
        accessibility capture, model context, or artifacts, protected entry is unsupported for the declared class
        and no current candidate may proceed to selection on a favorable assumption.
      adr_linkage: >-
        Evidence will link to the E2-005 client/protected-entry/security ADR decisions only after independent
        E2-004 verification; this contract neither selects a client mechanism nor creates an ADR.

