  - uncertainty_id: E2U-S01-DESCENDANT-CONTAINMENT
    classification: E2_PRESELECTION_SPIKE_REQUIRED
    state: NOT_RUN_BLOCKING
    source_refs:
      - SPQ-E2-002-01
      - EP-ARCH-C01:f27:SPQ-E2-002-01
      - EP-ARCH-C02:f27:SPQ-E2-002-01
      - EP-ARCH-C03:f27:SPQ-E2-002-01
    candidates: [EP-ARCH-C01, EP-ARCH-C02, EP-ARCH-C03]
    affected_criteria: [AR-EXE-003]
    owner: E2-004_AUTHOR_WITH_INDEPENDENT_CHALLENGER_AND_VERIFIER
    question: >-
      Can the declared supported local host class terminate or durably deprive every descendant of productive
      and effect authority after cooperative cancel, force-stop deadline, owner loss, and fence installation,
      while rejecting stale results through each candidate topology?
    rationale: >-
      Epochs, leases, and workflow fences prove logical ownership only. Repository evidence cannot prove actual
      descendant/process-tree behavior, post-fence canary exclusion, or whole-tree accounting on a supported host.
    decision_linkage: E2-004 must close this blocker before any candidate enters E2-005 consideration.
    blocking_consequence: BLOCKS_E2_005_FOR_ALL_THREE_CANDIDATES_UNTIL_PASS; fail or inconclusive remains blocking.
    sp_c_reuse:
      reused: [SP-C01, SP-C05]
      reuse_detail: >-
        Reuse SP-C01 deterministic crash/fault scheduling and preserved effect ledger, plus SP-C05 lifecycle,
        cancellation, orphan, and capability-attestation material. Narrow to local synthetic descendant control;
        do not run the broad SP-C contracts or choose an execution technology.
    spike_contract:
      question: >-
        Does one technology-neutral process-tree adapter, exercised through C01/C02/C03 topology wrappers,
        satisfy AR-EXE-003 on the prospectively declared supported local host class?
      hypothesis: >-
        A host-enforced process-tree primitive combined with durable candidate-specific owner/fence state can
        terminate or authority-fence every descendant, prevent post-fence effects, and reject stale results.
      alternatives:
        - Host primitive provides whole-tree cooperative and force termination plus accounting.
        - Host primitive plus capability/effect fence provides termination-or-durable-deprivation semantics.
        - The host/workload class is unsupported because neither alternative can satisfy the hard property.
      minimal_prototype: >-
        One local synthetic parent-child-grandchild workload, one effect canary, one stale-result sink, one
        technology-neutral process-tree adapter, and three thin topology wrappers using the already-declared
        C01 owner epoch, C02 service lease/fence, and C03 workflow owner/fence. No application feature is built.
      workload:
        frozen_case_count: 15
        seed: E2-004-S01-FIXED-001
        topologies: [EP-ARCH-C01, EP-ARCH-C02, EP-ARCH-C03]
        fault_schedules:
          - cooperative_cancel_after_grandchild_start
          - force_stop_at_declared_deadline
          - execution_owner_loss_before_result
          - fence_then_stale_result_delivery
          - fence_then_descendant_effect_attempt
        execution_rule: Each of the 3 topology wrappers runs each of the 5 schedules exactly once.
        repetition_rule: >-
          No favorable rerun. An independently confirmed harness defect invalidates the complete versioned
          workload for all candidates and requires a prospective corrected contract/version before rerun.
      success_criteria:
        - Every descendant is terminal or durably unable to perform a productive/effect action within the declared bound.
        - Effect-canary count after fence is exactly zero and stale-result commit count is exactly zero.
        - Every process/descendant, control transition, fence, result, and possible effect is accounted once.
        - Candidate authority records and host observations agree; no killed/fenced work is described as complete.
      failure_criteria:
        - Any unaccounted or reachable productive descendant after the bound.
        - Any post-fence effect-canary mutation, stale result commit, duplicate effect, or topology bypass.
        - Any missing tree/effect observation or inferred clean result.
      security_checks:
        - Synthetic data and canaries only; no credential, provider/model call, network, package install, or external runtime.
        - Deny filesystem/network/effect authority to descendants except the controlled local canary sink.
        - Confirm stale owner/worker/workflow identity cannot reacquire authority after the fence.
        - Scan artifacts for secrets, private data, external code, and forbidden reconstruction identifiers.
      finite_budget:
        external_spend_usd: 0
        paid_calls: 0
        network_access: DENIED
        wall_clock_minutes: 180
        cpu_minutes: 120
        disk_mib: 512
        launched_cases: 15
        dependencies_or_installations: 0
      stop_condition:
        - Stop immediately on any hard failure; preserve remaining cases as NOT_RUN and the blocker as FAIL.
        - Stop at the first budget ceiling, missing observation, unsafe host behavior, or scope expansion request.
        - Never add a new fault schedule, mechanism, or candidate variant after inspecting a result.
      artifact:
        directory: 05_architecture/spikes/E2-004-S01/
        required_files:
          - frozen_manifest.yaml
          - raw_case_results.csv
