  - uncertainty_id: E2U-S01-DESCENDANT-CONTAINMENT
    classification: E3_POSTSELECTION_TECHNICAL_VALIDATION
    state: RECLASSIFIED_NOT_RUN_POSTSELECTION
    resolution: RECLASSIFIED_TO_E3
    consequence_profile: E3_HARD_PROPERTY
    source_refs:
      - SPQ-E2-002-01
      - EP-ARCH-C01:f27:SPQ-E2-002-01
      - EP-ARCH-C02:f27:SPQ-E2-002-01
      - EP-ARCH-C03:f27:SPQ-E2-002-01
      - E2-003_challenger_review:F-E2-003-01
    candidates: [EP-ARCH-C01, EP-ARCH-C02, EP-ARCH-C03]
    affected_criteria: [AR-EXE-003]
    owner: E3V-002_OWNER_AFTER_VERIFIED_E2_AND_SEPARATE_E3_AUTHORIZATION
    original_question: >-
      Can the declared supported host class terminate or durably deprive every descendant of productive/effect
      authority after cancellation, force-stop deadline, owner loss, and fence installation?
    architecture_fact: >-
      Every candidate exposes process-tree identity/control and a distinct durable authority fence: C01 epoch,
      C02 lease/fence, C03 workflow owner/fence. Unsupported force-termination classes fail closed.
    why_not_e2_selection_blocking: >-
      The concrete host primitive is provider/platform/process-class dependent, is not selected, and cannot
      distinguish the three architectures because all use the same structural contract and E3V-002 obligation.
    required_e3_evidence: >-
      For every claimed supported host/platform/process/configuration class: representative parent/descendant tree;
      cancellation, forced stop, owner loss, stale-result and post-fence effect schedules; force primitive/permissions;
      survivor/orphan discovery; bounded timelines; fence/result/effect rejection; recovery readback; exact limitations.
    process_tree_vs_fence: >-
      Process-tree containment proves descendant termination/accounting; authority fencing proves stale work cannot
      publish authoritative results or effects. Neither is substituted for the other.
    success_implication: Validates only the exact tested scope and does not create comparative E2 credit.
    failure_implication: Root-cause under E3_HARD_PROPERTY; force-unavailable scope remains unsupported and fenced.
    missing_evidence: EVIDENCE_MISSING_FAIL_CLOSED; never infer whole-tree feasibility.
    e2_adr_handback: >-
      E3_HAND_BACK_TO_E2 only if evidence shows the proposed/accepted execution/isolation ADR cannot realize
      AR-EXE-003 for a required supported class and no conforming mechanism remains.
