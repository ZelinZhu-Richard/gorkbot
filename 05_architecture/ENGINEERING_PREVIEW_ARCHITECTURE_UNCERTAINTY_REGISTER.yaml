  unknown_receives_favorable_credit: false
  hard_failure_compensation_permitted: false
  e2_004_execution_authorized_by_this_artifact: false
  e3_execution_authorized_by_this_artifact: false
  architecture_selection_authorized_by_this_artifact: false
  selection_blocker_reclassification_test: >-
    Under E2 plan section 13, empirical work remains preselection only when its outcome can
    distinguish candidates or establish a system-wide prerequisite without which no candidate
    can responsibly be proposed. A provider-, platform-, client-, or selected-mechanism question
    with an architecture seam in every candidate is postselection E3 validation when its scope,
    fail-closed behavior, and E2/ADR handback rule are explicit.
  rule: >-
    PAPER_RESOLVABLE closes only a bounded architecture fact or tradeoff.
    E3_POSTSELECTION_TECHNICAL_VALIDATION supplies no favorable E2 empirical credit.
    E3_MODEL_OR_CONFIGURATION_BENCHMARK assigns no model/provider/configuration in E2.
    DEFERRED_OUT_OF_SCOPE cannot be guessed. Missing or inconclusive evidence always fails closed.

