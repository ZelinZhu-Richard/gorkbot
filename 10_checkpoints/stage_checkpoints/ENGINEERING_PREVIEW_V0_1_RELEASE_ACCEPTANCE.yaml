scored_run_common_protocol:
  scored_results_exist_now: false
  candidate_population_fixture_oracle_and_analysis_freeze_required: true
  qualification_window_maximum_days: 14
  favorable_retry_permitted: false
  randomization_or_block_seed_committed_before_run: true
  raw_attempts_preserved: true
  failure_layers_reported_separately:
    - task_or_executor
    - provider_or_model
    - tool_or_environment
    - verification_infrastructure
    - fixture_or_harness
    - unknown
  exclusions:
    permitted_only:
      - INDEPENDENTLY_CONFIRMED_FIXTURE_HARNESS_OR_ORACLE_DEFECT_INVALIDATING_WHOLE_AFFECTED_BLOCK
      - DECLARED_REFERENCE_ENVIRONMENT_OUTAGE_INVALIDATING_WHOLE_BLOCK_BEFORE_CANDIDATE_LABEL_INSPECTION
    prohibited:
      - model_error
      - provider_refusal_or_timeout
      - tool_timeout
      - task_failure
      - verification_failure_caused_by_candidate_evidence
      - safety_denial
      - false_completion
      - unfavorable_but_valid_result
    post_result_defect_rule: INVALIDATE_AND_RERUN_WHOLE_CASE_VERSION_BLOCK_FOR_EVERY_CANDIDATE
  verification_runs_per_unchanged_revision_maximum: 3
  same_revision_verification_rerun_rule: >-
    Initial run plus at most two reruns, only after retryable
    verification.run_status=VERIFICATION_ERROR. CHANGES_REQUIRED, BLOCKED, or
    INCONCLUSIVE requires a new versioned candidate or evidence basis.
  deterministic_required_check_repetitions: 3
  flaky_rule: >-
    Any mixed ordered result on the same revision, configuration, and environment
    is FLAKY. A later pass does not erase it, and no pass credit exists unless the
    prospectively declared complete repetition rule is satisfied.

confidence:
  rate_interval: ONE_SIDED_WILSON_SCORE_95_PERCENT
  rate_rounding: NO_ROUNDING_FOR_GATE
  latency_quantile: EMPIRICAL_NEAREST_RANK
  latency_confidence_report: NONPARAMETRIC_95_PERCENT_BOOTSTRAP_10000_COMMITTED_SEED_RESAMPLES
  raw_sample_and_maximum_authoritative: true
  small_sample_rule: REPORT_INSUFFICIENT_PRECISION_WITHOUT_EXTRAPOLATION

preview_slos:
  SLO-001:
    title: independently_verified_end_to_end_success
    status: NOT_EVALUATED
    population:
      minimum_scored_attempts: 100
      task_classes:
        BOUNDED_CODE_CHANGE: {minimum: 20}
        DEFECT_REPRODUCTION_AND_FIX: {minimum: 20}
        REPOSITORY_DIAGNOSIS_OR_REVIEW: {minimum: 20}
        DOCUMENTATION_OR_REPOSITORY_METADATA_CHANGE: {minimum: 20}
        NO_CHANGE_REQUIRED: {minimum: 20}
      clean_repository_minimum: 20
      each_release_claimed_supported_with_constraints_repository_condition_minimum: 10
      repository_conditions_may_be_multi_label: true
      rejected_or_unknown_conditions: TYPED_REJECTION_OR_NONMUTATION_CASES_NOT_SUPPORTED_SUCCESS_DENOMINATOR
    numerator: ATTEMPTS_COMPLETED_WITH_EXACT_REQUESTED_OUTCOME_VALID_EVIDENCE_AND_AUTHORITATIVE_INDEPENDENT_PASS
    denominator: ALL_ELIGIBLE_LAUNCHED_ATTEMPTS
    thresholds:
      overall_rate_minimum: 0.95
      overall_one_sided_wilson_lcb_minimum: 0.90
      each_task_class_rate_minimum: 0.95
      each_task_class_one_sided_wilson_lcb_minimum: 0.80
      each_claimed_supported_repository_condition_required_successes: ALL
      each_claimed_supported_repository_condition_minimum_attempts: 10
    hard_invariant_precedence: true
    rationale: >-
      At n=100, 95 successes have a one-sided 95 percent Wilson lower bound
      of approximately 0.901. At n=20, 19 successes have a lower bound of
      approximately 0.804. These are prospective preview requirements, not observations.
  SLO-002:
    title: durable_control_acknowledgement_and_effectiveness_latency
    status: NOT_EVALUATED
    population:
      families: [pause, cooperative_stop, force_stop_or_authority_fence, redirect, resume]
      placements: [before_dispatch, during_cancellable_execution, at_effect_boundary, after_result_before_close]
      repetitions_per_placement: 5
      minimum_per_family: 20
    anchors:
      acknowledgement: REQUEST_AUTHORITATIVELY_RECEIVED_TO_DURABLE_ACK
      effectiveness: DURABLE_ACCEPTANCE_TO_REQUIRED_SAFE_OBSERVABLE_STATE
    thresholds_seconds:
      acknowledgement: {p95_max: 2, absolute_max: 5}
      pause_effective: {p95_max: 10, absolute_max: 30}
      cooperative_stop_effective: {p95_max: 10, absolute_max: 30}
      force_stop_or_fence_effective: {p95_max: 30, absolute_max: 60}
      redirect_effective: {p95_max: 10, absolute_max: 30}
      resume_effective: {p95_max: 10, absolute_max: 30}
    within_target_rate_per_family_minimum: 0.95
    per_family_one_sided_wilson_lcb_minimum: 0.80
    productive_dispatch_after_durable_control_acceptance_threshold: 0
    unaccounted_descendant_or_effect_threshold: 0
    process_death_reported_as_completion_threshold: 0
    rationale: FROZEN_LOCAL_REFERENCE_ENVIRONMENT_PREVIEW_USABILITY_BOUND_NOT_UNIVERSAL_HOST_OR_PRODUCTION_CLAIM
  SLO-003:
    title: supported_restart_recovery_latency
    status: NOT_EVALUATED
    population:
      minimum_attempts: 40
      owner_loss_strata: {orchestrator: 20, worker: 20}
      injection_boundaries:
        - after_acknowledged_mutation
        - before_effect_dispatch
        - after_possible_effect_before_acknowledgement
        - during_verification_or_evidence_finalization
      repetitions_per_owner_boundary_pair: 5
      task_class_balance: 8_PER_TASK_CLASS
    endpoint: TRUTHFUL_INSPECTABLE_RECOVERED_RECOVERING_BLOCKED_FAILED_OR_UNCERTAIN_PHASE_OR_CONDITION
    thresholds_seconds: {empirical_p95_max: 60, absolute_max: 120}
    acknowledged_record_loss_threshold: 0
    silent_regression_threshold: 0
    duplicate_effect_threshold: 0
    fabricated_continuity_or_completion_threshold: 0
    rationale: TIME_TO_TRUTHFUL_INSPECTABILITY_NOT_EVENTUAL_TASK_COMPLETION
  SLO-004:
    title: review_package_and_evidence_profile_acceptance
    status: NOT_EVALUATED
    population:
      minimum: 100
      all_scored_attempts_requiring_outcome_profile: true
      canonical_profiles:
        - ADMISSION_REJECTION
        - ACTIVE
        - WAITING_OR_BLOCKED
        - TERMINAL_NONCOMPLETE
        - CANDIDATE_REVIEW
        - COMPLETED
      minimum_per_canonical_profile: 10
      terminal_noncomplete_outcome_variants: [partially_completed, failed, cancelled, unverified, uncertain_effect]
      minimum_per_terminal_noncomplete_outcome_variant: 2
    numerator: EXACT_OUTCOME_AND_REVISION_BUNDLES_PASSING_DETERMINISTIC_VALIDATION_AND_INDEPENDENT_REVIEW
    denominator: ALL_REQUIRED_BUNDLES_IN_POPULATION
    acceptance_rate_required: 1.0
    one_sided_wilson_lcb_minimum: 0.95
    negative_cases_must_be_correctly_rejected: true
    rationale: RR_010_IS_PER_OCCURRENCE_AND_100_OF_100_WILSON_LCB_IS_APPROXIMATELY_0_974

