    universal_numeric_value: null
    state: FINITE_CASE_OR_TASK_POLICY_VALUE_REQUIRED_BEFORE_RUN
    owner: VERSIONED_TASK_OR_QUALIFICATION_POLICY_AUTHORITY
    frozen_before_initial_verification_run: true
    missing_value_consequence: BLOCKED
  same_revision_verification_rerun_rule: >-
    Rerun only after retryable verification.run_status=VERIFICATION_ERROR and only
    within the prospectively frozen finite case/task ceiling. CHANGES_REQUIRED,
    BLOCKED, or INCONCLUSIVE requires a new versioned candidate or evidence basis.
  deterministic_required_check_repetition_rule:
    universal_numeric_value: null
    state: FINITE_CHECK_SPECIFIC_POLICY_VALUE_REQUIRED_BEFORE_RUN
    owner: VERSIONED_TASK_OR_QUALIFICATION_POLICY_AUTHORITY
    missing_value_consequence: BLOCKED
  flaky_rule: >-
    Any mixed ordered result on the same revision, configuration, and environment
    is FLAKY. A later pass does not erase it, and no pass credit exists unless the
    prospectively declared complete repetition rule is satisfied.
  correction_attempt_ceiling:
    universal_numeric_value: null
    state: FINITE_PER_TASK_OR_CASE_VALUE_REQUIRED_BEFORE_RUN
    owner: VERSIONED_TASK_OR_QUALIFICATION_POLICY_AUTHORITY
