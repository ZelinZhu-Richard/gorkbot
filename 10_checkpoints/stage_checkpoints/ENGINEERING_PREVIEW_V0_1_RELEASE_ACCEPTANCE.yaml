  exclusions:
    permitted_only:
      - INDEPENDENTLY_CONFIRMED_FIXTURE_HARNESS_OR_ORACLE_DEFECT_INVALIDATING_WHOLE_AFFECTED_BLOCK
      - DECLARED_REFERENCE_ENVIRONMENT_OUTAGE_INVALIDATING_WHOLE_BLOCK_BEFORE_CANDIDATE_LABEL_INSPECTION
    prohibited:
      - model_error
      - provider_refusal_or_timeout
      - tool_timeout
      - task_failure
      - verification_failure_caused_by_candidate_evidence
      - safety_denial
      - false_completion
      - unfavorable_but_valid_result
