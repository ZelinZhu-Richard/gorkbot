      separately_preauthorized_bounded_safety_control_readback_evidence_reserve_only: true
      verification_status: UNVERIFIED
      final_truthful_state: WAITING_BLOCKED_FAILED_OR_PARTIALLY_COMPLETED_NEVER_COMPLETED
    exhaustion_evidence_required:
