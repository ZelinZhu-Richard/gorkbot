    Searched for requirements loose enough that two architectures could claim compliance while
    implementing different product semantics. Candidates examined and rejected: (a) 'isolated
    workspace or E2-selected equivalent' is bound to the objective non-interference test
    (OR-REPO-CANARY/OR-GIT-STATE, RR-007) and the bind-before-mutating-reproduction ordering
    (EP-WF-019); (b) 'declared supported local persistence boundary' is declared by the candidate
    manifest but tested by RR-001/SLO-003 fault injection at every acknowledgement/effect boundary;
    (c) 'authentication mechanism is an E2 decision' leaves the semantic (stable authenticated
    principal; wrong/stale identity denies admission/approval) fixed; (d) same-model low-risk
    verification policy is undefined in E1-001 but the suite classifies every scored task HIGH
    with no same-model credit until a versioned policy is independently verified; (e) stop
    deadline value is candidate-declared but SLO-002 bounds effectiveness (10/30 s, 30/60 s) and
    RR-006 forbids indefinite STOPPING. Each remaining freedom is mechanism-level, not semantic.

