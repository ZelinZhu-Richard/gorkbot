e3_qpa_001:
  purpose: >-
    Supply prospectively frozen, Founder-approved, independently challenged and independently verified
    scope-aware limits for verification reruns, deterministic required-check repetitions, and correction attempts.
  canonical_value_families:
    finite_verification_rerun_ceiling_per_case_or_task:
      scope_kind: CASE_OR_TASK
      default_value: null
      assignments: null
      completeness_status: FOUNDER_DECISION_REQUIRED
      approval_status: FOUNDER_DECISION_REQUIRED
      approval_ref: null
      challenge_ref: null
      verification_ref: null
      missing_consequence: DO_NOT_RUN_E3_SCORED_EXECUTION_BLOCKED
    finite_deterministic_required_check_repetition_rule_per_check_or_class:
      scope_kind: CHECK_OR_CLASS
      default_value: null
      assignments: null
      completeness_status: FOUNDER_DECISION_REQUIRED
      approval_status: FOUNDER_DECISION_REQUIRED
      approval_ref: null
      challenge_ref: null
      verification_ref: null
      missing_consequence: DO_NOT_RUN_E3_SCORED_EXECUTION_BLOCKED
    finite_correction_attempt_ceiling_per_case_or_task:
      scope_kind: CASE_OR_TASK
      default_value: null
      assignments: null
      completeness_status: FOUNDER_DECISION_REQUIRED
      approval_status: FOUNDER_DECISION_REQUIRED
      approval_ref: null
      challenge_ref: null
      verification_ref: null
      missing_consequence: DO_NOT_RUN_E3_SCORED_EXECUTION_BLOCKED
  resolution_rule: >-
    Every applicable case, task, check, or class must resolve to a finite positive integer assignment under one
    frozen QPA version. Missing, null, zero, negative, non-integer, nonfinite, incomplete, unapproved,
    unchallenged, unverified, stale, conflicting, or post-result-selected assignments produce DO_NOT_RUN.
  resolution_and_consumption_set_rule:
    exactly_one_nonconflicting_assignment_per_applicable_scope_ref: true
    exactly_one_resolution_and_consumption_entry_per_applicable_scope_ref: true
    assignment_and_resolution_scope_sets_must_be_equal: true
    canonical_assignment_set_digest_must_equal_founder_approved_exact_value_set_digest: true
    assignment_value_must_equal_resolution_resolved_value_for_same_family_and_scope: true
    scored_correction_binding_scope_and_value_must_equal_correction_assignment_and_resolution: true
    deterministic_check_reserved_count_must_equal_frozen_resolved_value: true
    verification_error_rerun_reserves_one_for_every_affected_case_or_task_scope: true
    correction_reserves_one_for_every_affected_case_or_task_scope: true
    verification_rerun_or_correction_reservation_is_one_iff_scope_is_in_operation_basis_affected_scope_set_otherwise_zero: true
    inactive_qpa_family_reservation_must_be_zero: true
  family_specific_ledger_semantics:
    VERIFICATION_RERUN:
      accounting_mode: CUMULATIVE_EXACT_REVISION_CEILING
      ledger_key_formula: GLOBAL_PROFILE_HASH_OF_TASK_QPA_FAMILY_SCOPE_AND_BLOCK_EQUIVALENCE
      block_equivalence_required: true
      correction_lineage_key_required: false
      attempt_requirement_id_required: false
    DETERMINISTIC_CHECK_REPETITION:
      accounting_mode: PER_SCHEDULED_ATTEMPT_REQUIREMENT
      ledger_key_formula: GLOBAL_PROFILE_HASH_OF_TASK_QPA_FAMILY_SCOPE_BLOCK_EQUIVALENCE_AND_OPERATION_SCHEDULE_ENTRY
      consumed_before_for_each_attempt: 0
      reserve_exactly_resolved_value_for_every_admitted_attempt: true
      prior_attempt_repetitions_do_not_decrement_a_lifetime_ceiling: true
      attempt_requirement_id_required: true
    CORRECTION_ATTEMPT:
      accounting_mode: CUMULATIVE_STABLE_CORRECTION_LINEAGE_CEILING
      ledger_key_formula: GLOBAL_PROFILE_HASH_OF_TASK_QPA_FAMILY_SCOPE_AND_STABLE_CORRECTION_SCOPE_MEMBER_SUBJECT
      stable_lineage_key_formula: GLOBAL_PROFILE_HASH_OF_TASK_AND_STABLE_CORRECTION_SERIES_SUBJECT
      stable_subject_registry_key_formula: GLOBAL_PROFILE_HASH_OF_PROJECT_STAGE_TASK_AND_CORRECTION_SERIES_ID
      stable_scope_member_registry_key_formula: GLOBAL_PROFILE_HASH_OF_PROJECT_STAGE_TASK_SCOPE_KIND_AND_SCOPE_REF
      correction_series_id_selected_by: E3_004_VERIFIED_HARNESS_AND_ORIGIN_FROZEN_PROTOCOL_NOT_MANIFEST
      authoritative_stable_subject_registry_selected_by: E3_004_VERIFIED_HARNESS_CONFIGURATION_NOT_MANIFEST
      exactly_one_current_stable_subject_per_registry_key: true
      complete_cross_key_registry_search_and_history_required: true
      typed_current_scope_members_required_in_every_membership_snapshot: true
      complete_cross_set_overlap_search_required_for_every_member_scope: true
      alternate_lineage_count_for_any_member_scope: 0
      overlapping_member_scopes_must_preserve_their_prior_stable_subject_and_ledger: true
      only_truly_new_member_scopes_may_initialize_new_subject_and_ledger_state: true
      one_immutable_membership_snapshot_per_series_and_block: true
      membership_snapshot_records_exact_predecessor_added_removed_unchanged_reused_readded_and_truly_new_member_sets: true
      primary_added_removed_and_unchanged_member_sets_are_pairwise_disjoint: true
      reused_added_and_truly_new_member_sets_are_a_pairwise_disjoint_partition_of_added_members: true
      readded_members_equal_reused_added_members: true
      membership_snapshot_is_not_lineage_or_ledger_reset_authority: true
      removed_member_mappings_and_ledgers_remain_authoritative: true
      readded_members_reuse_prior_subject_and_consumption: true
      initial_snapshot_has_no_series_predecessor_but_must_reuse_and_classify_any_member_found_by_the_global_cross_set_search: true
      only_members_with_no_prior_authoritative_mapping_initialize_state: true
      stable_lineage_is_inherited_across_protocol_configuration_block_manifest_and_attempt_versions: true
      membership_scope_set_qpa_protocol_configuration_block_manifest_run_attempt_ids_and_digests_are_excluded_from_lineage_identity: true
      lineage_registration_precedes_and_excludes_origin_block_plan_schedule_manifest_and_reservation_digests: true
      fresh_manifest_block_or_identifier_may_not_create_a_replacement_lineage_or_ledger: true
      authoritative_cross_block_lineage_attempt_history_required: true
  canonical_assignment_set_binding:
    digest_profile: MANIFEST_GLOBAL_INTEGRITY_PROFILE
    closed_payload_fields:
      - qpa_id
      - qpa_version
      - qpa_digest
      - all_three_canonical_family_names
      - each_family_scope_kind
      - each_family_explicit_null_default
      - each_family_exact_assignments_sorted_by_scope_ref
      - each_family_all_applicable_scopes_resolved
    manifest_digest_must_equal: founder_value_approval_ref.exact_value_set_digest
    mismatch_consequence: DO_NOT_RUN
  values_selected_by_e3_001: false
  protocol_owned_limits_not_qpa_values:
    - execution_retry_eligibility_and_ceiling
    - maximum_repeated_failure_rule_and_ceiling
    - run_repetition_rule
    - run_termination_rule
    - cost_ceiling
    - time_ceiling
    - latency_and_resource_ceilings
    - evidence_sufficiency_rule
    - output_process_disk_and_network_limits
  non_inference_rules:
    - Frozen E1 SLO populations, repetitions, thresholds, bootstrap settings, and qualification windows remain source-specific facts and do not populate QPA nulls.
    - MODEL_ROLE_BENCHMARK_PLAN numeric proposals are not Founder-approved E3 values.
    - No task author, operator, admission checker, or verifier may infer a missing value from a default or prior run.

