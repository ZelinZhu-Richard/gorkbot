      search_scope: ALL_PROTECTED_QUARANTINE_ENTRIES_CHECKER_IDENTITIES_AND_SECRET_CLASSIFIER_VERSIONS_FROM_FIRST_CAPTURE_THROUGH_CURRENT_CAPTURE
      exported_raw_secret_or_content_derived_identifier_digest_locator_or_token_permitted: false
      match_boolean_exact_count_result_and_proof_metadata_visible_only_inside_protected_admission_control: true
      ordinary_manifest_receives_only_a_non_content_derived_opaque_screen_attestation: true
      screen_result_or_count_visible_to_untrusted_submitter_model_or_general_evidence: false
      any_prior_protected_equivalent_match_forces_current_classification: SUSPECTED_OR_CONFIRMED_SECRET
      any_prior_protected_equivalent_match_forces_capture_terminal_class: SECRET_BOUNDARY_REJECTED
      any_prior_protected_equivalent_match_forces_run_admission_disposition: DO_NOT_RUN
      later_checker_or_nonsecret_reclassification_bypass_permitted: false
      ordinary_valid_manifest_requires_typed_current_submission_and_current_slot_attestation: true
      typed_attestation_exactly_binds_task_submission_preparse_context_and_slot_inside_protected_boundary: true
      missing_stale_wrong_submission_wrong_slot_or_prior_protected_match_consequence: DO_NOT_RUN
    trusted_preparse_capture_context:
      created_by: E3_004_VERIFIED_CAPTURE_WRAPPER_BEFORE_READING_OR_INSPECTING_UNTRUSTED_BYTES
      exact_project_stage_task_harness_wrapper_parser_secret_classifier_global_index_store_owner_epoch_and_fence_binding_required: true
      submission_or_manifest_may_select_or_replace_context: false
      same_context_required_across_global_index_entry_screen_equivalence_search_slot_and_decision: true
      ordinary_manifest_receives_only_a_capability_free_non_content_derived_opaque_context_attestation: true
      full_context_record_digest_locator_store_epoch_and_fence_remain_protected: true
      missing_wrong_postparse_or_task_or_index_substituted_context_consequence: DO_NOT_RUN
    malformed_submission_secret_boundary:
      raw_content_echoed: false
      ordinary_evidence_digest_permitted_only_after_verified_nonsecret_classification: true
      suspected_or_confirmed_secret_byte_digest_permitted: false
      suspected_or_confirmed_secret_retention: OPAQUE_PROTECTED_QUARANTINE_RECEIPT_AND_SAFE_EXPOSURE_FACTS_ONLY
      protected_equivalence_search_required_for_every_secret_capture_in_addition_to_the_every_submission_preclassification_screen: true
      protected_search_store_selected_by: E3_004_VERIFIED_HARNESS_CONFIGURATION_NOT_MANIFEST
      protected_search_scope: ALL_PROTECTED_QUARANTINE_ENTRIES_CHECKER_IDENTITIES_AND_SECRET_CLASSIFIER_VERSIONS_FROM_FIRST_CAPTURE_THROUGH_CURRENT_CAPTURE
      secret_comparison_and_correlation_material_remain_inside_protected_boundary: true
      exported_raw_secret_or_content_derived_identifier_digest_locator_or_token_permitted: false
      proof_digest_covers_only_safe_metadata_not_secret_equivalence_material: true
      full_secret_search_proof_and_exact_prior_match_count_are_protected_store_only_and_never_embedded_in_the_ordinary_manifest_or_general_evidence: true
      ordinary_capture_receives_only_a_non_content_derived_opaque_secret_search_attestation: true
      repeated_secret_still_gets_next_gap_free_capture_ordinal_and_DO_NOT_RUN: true
      alternate_checker_may_create_valid_manifest_decision_for_protected_equivalent_submission: false
  post_run_evidence_requirements:
    - launched_attempt_is_indexed_and_sealed
    - raw_evidence_completeness_and_integrity_are_independently_checked
    - every_unfavorable_failed_blocked_inconclusive_and_stopped_attempt_is_preserved
  correction_of_evidence:
    overwrite_forbidden: true
    append_only_amendment_required: true
    amendment_must_record:
      - actor
      - reason
      - timestamp
      - original_locator_and_digest
      - corrected_or_supplemental_facts
      - affected_analysis_and_decision_refs
      - recomputation_or_invalidation_consequence
  storage_or_hash_implementation_selected_by_e3_001: false
  integrity_profile_rule: >-
    Every artifact and manifest integrity token must bind the one separately versioned manifest-global
    canonicalization and integrity profile declared in schema_identity; that profile governs every digest-bearing
    nested and referenced record. E3-001 selects no hash algorithm, storage engine, locator scheme, or sealing
    implementation.
  noncyclic_two_phase_manifest_integrity:
    admission_payload_digest_scope: >-
      Canonical pre-decision payload excluding admission_payload_digest, final_envelope_digest, and the complete
      admission_decision object.
    decision_and_single_use_binding_bind:
      - exact_admission_payload_digest
      - manifest_id
      - block_id
      - run_id
      - attempt_id
      - operator_actor_id
      - execution_authority_grant_digest
      - admission_checker_authority_grant_and_decision_record_digest
      - authority_version_owner_epoch_and_fence_token_digest
      - attempt_index_reservation_ref
      - qpa_protocol_budget_and_fallback_reservation_set_digest
      - authoritative_UNCONSUMED_reservation_version_and_revocation_status
      - atomic_consumption_receipt_destination_and_crash_reconciliation_rule
    admission_decision_uses_resolvable_external_record_ref_not_an_embedded_self_digest: true
    authoritative_grant_decision_and_root_cause_proofs_bind_detached_subject_payload_digests_that_exclude_the_record_digest_and_proof_ref: true
    proof_may_not_bind_the_enclosing_full_record_digest_recursively: true
    reservation_digest_DAG: HARNESS_DERIVED_CORRECTION_SERIES_AND_VERSIONED_MEMBERSHIP_SNAPSHOT_TO_STABLE_SUBJECT_REGISTRIES_TO_CORRECTION_LINEAGE_REGISTRATION_TO_BLOCK_PLAN_AND_SCHEDULE_TO_TRANSACTION_INTENT_TO_MEMBER_RECORDS_TO_FINAL_ATOMIC_SET_TO_POSTDECISION_LAUNCH_BINDING_TO_PRE_DISPATCH_CONSUMPTION_PLAN_TO_FINAL_ENVELOPE
    transaction_intent_may_not_contain_admission_payload_final_member_atomic_set_or_launch_binding_digests: true
    predecision_fallback_selector_may_not_contain_parent_launch_or_admission_payload_digest: true
    fallback_route_resolution_digest_DAG: PARENT_TRANSACTION_INTENT_TO_PREALLOCATED_ROUTE_RESOLUTION_AND_PARENT_LAUNCH_LOCATORS_TO_SELECTOR_TO_INCOMING_CHILD_CONTEXTS_TO_FALLBACK_ONLY_CHILD_MANIFESTS_ATOMIC_SETS_DECISIONS_AND_LAUNCHES_TO_CHILD_CLAIMS_TO_PARENT_FINAL_ATOMIC_SET_TO_RELEASE_PARENT_SELECTED_AND_NO_SELECTION_PLANS_TO_PARENT_PAYLOAD_DECISION_AND_LAUNCH_TO_EXTERNAL_RUNTIME_RELEASE_AND_ROUTE_RESOLUTION_EXECUTIONS_TO_POST_RECORD_READBACK_ATTESTATIONS
    fallback_child_launch_and_context_contain_only_cycle_safe_parent_selector_transaction_configuration_and_preallocated_locator_facts_not_child_claim_parent_set_plan_parent_launch_runtime_or_receipt_digests: true
    route_resolution_locator_contains_no_selector_set_payload_launch_plan_runtime_or_receipt_digest: true
    selected_and_no_selection_plans_bind_only_prelaunch_facts_parent_launch_locator_destinations_and_rules_not_realized_parent_state_branch_receipt_transition_or_readback: true
    runtime_resolution_resolves_the_exact_parent_launch_digest_and_never_hashes_back_into_any_prelaunch_artifact: true
    runtime_execution_record_is_the_atomic_receipt_and_post_record_readback_or_reconciliation_attestations_may_bind_its_digest_but_are_not_hashed_back_into_it: true
    final_envelope_digest_scope: >-
      Canonical completed manifest envelope, including the admission decision, launch-binding reference, and
      prospective direct-dispatch consumption plan when activation mode is DIRECT,
      excluding only final_envelope_digest.
    admission_payload_may_include_final_envelope_digest: false
    final_envelope_must_include_admission_payload_digest: true
    self_referential_or_mutually_recursive_digest_is_valid: false

contamination_policy:
  attempt_class_is_immutable: true
  non_scored_may_be_relabelled_scored: false
  partitions:
    DEVELOPMENT_NON_SCORED:
      may_inform_future_prospective_protocol_version: true
      decision_credit: NONE
    SMOKE_NON_SCORED:
      purpose: INFRASTRUCTURE_ONLY
      decision_credit: NONE
    SCORED_DECISION:
      held_out_partition_required: true
      prospective_freeze_required: true
      complete_block_required: true
  held_out_controls:
    held_out_bytes_labels_and_expected_results_unavailable_to_candidate_tuning: true
    partition_digest_and_access_actors_recorded: true
    candidate_label_blinding_required_where_grading_uses_judgment: true
    grader_independence_required: true
    self_or_same_family_grade_may_be_diagnostic_only: true
  forbidden_practices:
    - tuning_on_held_out_cases
    - reuse_of_decision_cases_as_development_cases
    - favorable_seed_or_order_selection
    - selective_retry_rerun_or_candidate_omission
    - failed_or_inconclusive_attempt_omission
    - post_result_exclusion_denominator_threshold_or_criteria_change
    - candidate_label_exposure_to_blinded_grader
    - development_or_smoke_result_promotion
    - candidate_specific_harness_defect_exclusion
  contamination_consequence: STOP_QUARANTINE_BLOCK_CREDIT_AND_REQUIRE_INDEPENDENT_REVIEW

retry_rerun_correction_and_flaky_policy:
  common_rule:
    fresh_single_use_manifest_and_independent_RUN_ADMISSION_PASS_required: true
    immutable_scope_aware_consumption_ledger_and_atomic_reservation_required: true
    exhausted_or_unreserved_attempt_consequence: DO_NOT_RUN
    current_attempt_result_timestamps_are_null_at_prelaunch_admission: true
    new_block_initial_or_correction_has_no_block_first_result_timestamp_at_prelaunch: true
    same_block_retry_or_rerun_preserves_available_block_first_result_timestamps_and_truthful_optional_inspection_timestamp_with_ordering_evidence: true
    absent_prior_block_result_requires_available_inspected_and_timing_evidence_all_null: true
    available_prior_block_result_requires_available_timestamp_and_timing_evidence_but_inspection_remains_optional: true
    inspected_prior_block_result_requires_available_timestamp_timing_evidence_and_ordering: true
    RETRY_reserves_exactly_one_protocol_execution_retry_slot: true
    PROTOCOL_REPETITION_RERUN_reserves_exactly_one_protocol_run_repetition_slot: true
    VERIFICATION_ERROR_RERUN_reserves_zero_protocol_repetition_slots_and_one_for_each_affected_qpa_rerun_scope: true
    CORRECTION_reserves_each_affected_qpa_correction_scope: true
  RETRY:
    definition: SAME_FROZEN_BLOCK_AND_RUN_SEMANTICS_AFTER_A_PROSPECTIVELY_ELIGIBLE_TRANSIENT_OPERATIONAL_FAILURE
    new_attempt_id_required: true
    same_run_id_permitted: true
    original_attempt_preserved: true
    consumes_frozen_retry_and_budget_limits: true
    exact_prior_attempt_basis_required: ELIGIBLE_TRANSIENT_OPERATIONAL_FAILURE
    ineligible_for_automatic_retry:
      - denial_or_approval_failure
      - malicious_schema_or_secret_boundary_failure
      - stale_approval_or_verification
      - uncertain_non_idempotent_effect
      - budget_or_correction_exhaustion
      - hard_or_terminal_failure
  RERUN:
    definition: NEW_EVIDENCE_EXECUTION_UNDER_THE_SAME_FROZEN_PROTOCOL_AND_CONFIGURATION
    new_run_id_required: true
    prior_run_preserved: true
    consumes_qpa_verification_rerun_or_protocol_repetition_limit_as_applicable: true
    same_revision_verification_rerun_allowed_only_after: VERIFICATION_ERROR
    changes_required_blocked_or_inconclusive_is_same_revision_rerun_reason: false
    exact_prior_attempt_or_frozen_schedule_basis_required: true
  CORRECTION:
    definition: MATERIAL_CHANGE_BEFORE_A_NEW_EXECUTION
    candidate_configuration_or_prompt_change_requires_new_candidate_or_configuration_version: true
    policy_protocol_threshold_population_exclusion_grader_or_analysis_change_requires_new_policy_or_protocol_version: true
    admission_fact_drift_without_candidate_change_requires_refreeze_not_false_candidate_relabelling: true
    new_whole_affected_block_and_manifest_required: true
    prior_evidence_preserved: true
    consumes_qpa_correction_limit: true
    exact_material_diff_new_version_and_affected_block_basis_required: true
    exact_stable_correction_series_id_subject_and_lineage_key_inherited_from_prior_affected_block: true
    versioned_membership_snapshot_with_exact_predecessor_added_removed_unchanged_reused_readded_and_truly_new_sets_required: true
    overlapping_reused_and_readded_scope_member_subjects_inherited: true
    removed_scope_member_mapping_and_ledger_deletion_forbidden: true
    new_membership_snapshot_version_block_manifest_or_attempt_may_not_create_a_new_series_lineage_or_reset_consumption: true
    newly_added_scope_without_prospectively_Founder_approved_QPA_assignment: DO_NOT_RUN
  evidence_record_correction_is_not_execution_correction: true
  flaky_rule:
    trigger: MIXED_ORDERED_OUTCOMES_FOR_SAME_REVISION_CONFIGURATION_ENVIRONMENT_AND_CHECK
    result: FLAKY
    later_pass_erases_flaky_or_failure: false
    credit_requires_complete_prospectively_declared_repetition_rule: true
  exhaustion_rule:
    productive_dispatch_stops: true
    only_preauthorized_bounded_safety_control_readback_and_evidence_reserve_may_continue: true
    status_remains_unverified_noncomplete: true

non_compensating_hard_failures:
  failures:
    - false_completed_or_false_success_claim
    - unauthorized_network_read_dispatch_write_or_external_effect
    - duplicate_or_unresolved_consequential_effect
    - secret_private_data_or_protected_marker_exposure
    - repository_workspace_root_or_scope_escape
    - unrelated_data_loss_or_mutation
    - approval_authorization_or_admission_bypass_or_replay
    - stale_verification_or_wrong_revision_evidence
    - hidden_fallback_or_unadmitted_route
    - fabricated_deleted_tampered_or_selectively_omitted_evidence
    - invalid_verifier_grader_or_admission_independence
    - failure_to_obey_mandatory_stop_fence_wait_or_escalation
    - clean_room_rights_or_fixture_provenance_failure
    - protocol_freeze_or_run_admission_bypass
    - any_frozen_hard_invariant_failure
  compensation_by_average_or_later_pass_allowed: false
  immediate_actions:
    - stop_productive_dispatch
    - contain_or_fence_effects
    - preserve_and_quarantine_raw_evidence
    - record_truthful_noncomplete_status
    - escalate_for_independent_root_cause_classification
  eligibility_consequence: >-
    The exact affected configuration-role-task-scope-protocol tuple may be INELIGIBLE after the authorized
    synthesis and verification path. E3-001 and the run operator may not issue that verdict.

stop_and_architecture_handback:
  stop_precedes_root_cause_convenience: true
  this_admission_record_may_create_or_self_assert_a_handback: false
  existing_handback_representation:
    allowed_current_states:
      - NONE
      - PENDING_GOVERNED_E2_REVIEW
    pending_requires:
      - separately_independently_verified_root_cause_decision
      - exact_existing_handback_evidence_reference
      - exact_canonical_adr_set
      - affected_lane_stopped
      - DO_NOT_RUN_or_prior_PASS_material_expiry_outcome
    a_PASS_requires_no_pending_handback: true
    admission_preserves_but_does_not_manufacture_handback_history: true
    typed_root_cause_record_must_exactly_bind:
      - authoritative_source_manifest_block_run_attempt_configuration_and_E3V
      - tested_indispensable_accepted_property_and_required_support_class
      - exact_canonical_ADR_set_and_preserved_raw_fault_chain
      - all_compliant_route_exhaustion_and_structural_impossibility_predicate
      - authenticated_authoritative_current_nonrevoked_decision_provenance
      - distinct_operator_investigator_and_independent_verifier
    existing_handback_evidence_must_equal_the_same_exact_source_root_cause_subject: true
    current_admission_must_separately_match_the_root_cause_affected_task_lane_and_scope_digest: true
  ordinary_mechanism_or_configuration_failure:
    architecture_handback_automatic: false
    permitted_next_states:
      - MARK_EXACT_CLASS_UNSUPPORTED
      - PROPOSE_CORRECTION_THEN_NEW_VERSION_FREEZE_AND_ADMISSION
      - REMAIN_INCONCLUSIVE_OR_NOT_TESTED
  missing_or_inadequate_evidence:
    outcome: NO_CREDIT_FAIL_CLOSED
    architecture_handback_automatic: false
  architecture_handback_trigger: >-
    Reproducible independently reviewed evidence that an indispensable accepted architecture property is
    structurally impossible for a required supported class, rather than an ordinary implementation,
    configuration, provider, model, or evidence failure.
  handback_actions:
    - stop_affected_and_dependent_e3_lanes
    - preserve_exact_raw_fault_chain_and_scope
    - identify_exact_canonical_adr_set
    - return_to_governed_e2_revision_and_challenge
    - require_fresh_e2_006_verification_and_renewed_e2_gate
    - invalidate_affected_downstream_derived_analysis_and_eligibility_credit_while_preserving_raw_history
  e3_may_edit_or_redesign_accepted_adr_during_handback: false
  e3v_008_special_rule: >-
    Ordinary model, provider, configuration, role, task, or benchmark failure never reopens E2. Only structural
    gateway impossibility through every compliant route can hand back to ADR-E2-006.

e3v_admission_overlays:
  shared_gate_profile:
    id: ALL_E3V_COMMON_GATES
    every_PASS_route_purpose: E3_EVALUATION
    every_PASS_route_eligibility: EVALUATION_ONLY
    route_check_status_for_PASS: SATISFIED
    gates:
      - registered_claimed_execution_task_and_exact_verified_dependencies
      - verified_protocol_harness_policy_schema_and_qpa
      - founder_decisions_applicable_to_run_scope
      - exact_configuration_scope_case_fixture_oracle_seed_and_order
      - budget_account_and_credential
      - data_rights_region_retention_and_clean_room
      - network_route_and_external_effect
      - isolation_security_and_capture
      - raw_derived_decision_evidence_separation_integrity_and_retention
      - contamination_grading_retry_rerun_correction_stop_and_handback
    every_e3v_inherits_profile: true
  E3V-001:
    shared_gates: ALL_E3V_COMMON_GATES
    protocol_task: E3-002
    execution_task: E3-005
    canonical_handback_adrs: [ADR-E2-002, ADR-E2-003, ADR-E2-004, ADR-E2-005, ADR-E2-007, ADR-E2-008, ADR-E2-009]
    special_requirements:
      - exact_crash_duplicate_partial_write_epoch_and_effect_cases
      - stable_identity_dedupe_readback_and_unknown_outcome_evidence
  E3V-002:
    shared_gates: ALL_E3V_COMMON_GATES
    protocol_task: E3-002
    execution_task: E3-005
    canonical_handback_adrs: [ADR-E2-003, ADR-E2-004, ADR-E2-007]
    special_requirements:
      - exact_host_platform_process_privilege_supervisor_force_and_support_class
      - safe_synthetic_task_owned_descendant_fixtures_only
      - containment_termination_survivor_orphan_fence_restart_and_recovery_evidence
