  dimensions:
    - execution_task_registration_claim_and_exact_dependency_status
    - protocol_and_harness_verification
    - architecture_and_e3v_binding
    - exact_configuration_and_scope
    - qpa_and_protocol_limits
    - route
    - budget_and_account
    - credential_and_protected_entry
    - data_fixture_rights_region_and_retention
    - network_and_external_effects
    - isolation_and_security
    - evidence_destinations_integrity_retention_and_lineage
    - contamination_and_grading
    - retry_rerun_correction_and_attempt_semantics
    - stop_hard_failure_and_handback
    - freshness_and_expiry
  pass_semantics:
    launch_permitted: true
    launch_count: SINGLE_USE
    binds_exact_admission_payload_digest_manifest_block_run_attempt_and_operator: true
    binds_current_authenticated_execution_and_admission_checker_authority_grants: true
    authority_grant_subject_owner_epoch_fence_scope_and_revocation_are_rechecked_at_dispatch: true
    launch_reservation_state_at_admission: UNCONSUMED_RESERVED
    dispatch_transition: ATOMIC_COMPARE_AND_SET_UNCONSUMED_RESERVED_TO_CONSUMED
    dispatch_transition_precedes_process_start_network_use_credential_use_or_external_effect: true
    launch_attempt_index_qpa_protocol_budget_and_fallback_reservations_commit_as_one_atomic_set: true
    atomic_reservation_set_contract:
      canonical_member_order: ATTEMPT_INDEX_THEN_QPA_FAMILY_SCOPE_THEN_PROTOCOL_DIMENSION_THEN_BUDGET_THEN_FALLBACK_ROUTE_THEN_FALLBACK_CHILD_CONFIGURATION
      exact_member_set_and_digest_recomputed: true
      acyclic_commit_order:
        - freeze_one_canonical_transaction_intent_from_raw_member_descriptors_without_final_member_payload_or_launch_digests
        - create_each_attempt_QPA_protocol_budget_selector_and_child_claim_reservation_binding_only_the_intent_digest_and_transaction_id
        - compute_one_final_atomic_set_over_the_completed_member_record_digests
        - create_the_postdecision_launch_binding_over_payload_intent_final_set_and_decision
      members_share_predecision_intent_digest_and_transaction_not_final_set_digest: true
      final_atomic_set_alone_owns_completed_member_record_digests: true
      one_current_owner_epoch_and_fence_across_authoritative_reservations_and_final_set: true
      partial_commit_permitted: false
      every_qpa_protocol_and_budget_ledger_is_authoritative_append_only_and_complete_from_first_applicable_attempt: true
      qpa_ledger_identity_uses_the_exact_family_specific_formula_frozen_above: true
      deterministic_repetition_is_a_per_scheduled_attempt_requirement_not_a_lifetime_cumulative_ceiling: true
      correction_consumption_uses_one_stable_authoritative_scope_member_subject_per_case_or_task_across_membership_snapshot_and_cross_version_changes_and_cannot_reset_on_add_remove_readd_new_block_or_new_version: true
      protocol_limit_dimensions_have_distinct_ledgers_and_reservations_for_retry_repetition_repeated_failure_elapsed_time_output_process_disk_and_network: true
      manifest_or_fresh_identifier_may_not_reset_a_ledger: true
      ledger_attempt_history_must_equal_the_exact_family_specific_projection_of_authoritative_attempt_indices: true
      verification_and_cumulative_protocol_projection_scope: CURRENT_BLOCK_APPLICABLE_ATTEMPTS
      deterministic_and_per_attempt_resource_projection_scope: EXACT_SCHEDULED_ATTEMPT
      correction_projection_scope: STABLE_CORRECTION_SCOPE_MEMBER_ALL_BLOCKS
      budget_projection_scope: STAGE_ALL_APPLICABLE_ATTEMPTS
    dispatch_atomic_predicate_contract:
      one_atomic_predicate_must_observe_and_bind:
        - current_execution_grant_id_version_digest_status_revocation_owner_epoch_and_fence
        - current_admission_checker_grant_id_version_digest_status_revocation_owner_epoch_and_fence
        - exact_current_admission_decision_id_version_digest
        - exact_capability_free_index_slot_preparse_context_and_protected_history_screen_attestations_resolved_inside_the_protected_boundary_to_a_terminal_valid_manifest_slot_with_PASS_and_zero_conflicting_terminal_decisions
        - exact_transaction_intent_final_atomic_set_version_state_and_revocation
        - exact_authoritative_material_admission_fact_set_digest_epoch_fence_zero_drift_state_and_current_readback
      prospective_direct_dispatch_consumption_plan_binds_exact_launch_final_set_attempt_index_every_QPA_scope_all_eight_protocol_dimensions_budget_and_fallback_member_disposition: true
      same_atomic_transaction_consumes_launch_final_set_attempt_index_every_QPA_scope_all_eight_protocol_dimensions_and_budget_members: true
      fallback_enabled_primary_dispatch_leaves_selector_and_child_claims_reserved_only_for_later_route_resolution: true
      fallback_disabled_primary_dispatch_has_no_selector_or_child_claim_members: true
      authoritative_runtime_execution_record_is_the_atomic_consumption_receipt: true
      post_execution_readback_attestation_must_rederive_the_exact_terminal_member_tuple: true
      partial_mismatched_separate_or_unreceipted_member_transition_consequence: DO_NOT_RUN
      authority_transfer_atomically_fences_or_revokes_every_old_reservation: true
      any_material_fact_transition_atomically_advances_the_fact_epoch_and_fences_every_prior_PASS_and_reservation_before_the_changed_fact_becomes_current: true
      receipt_records_the_observed_authority_decision_evaluation_and_reservation_tuple: true
    durable_consumption_execution_record_and_post_record_readback_required: true
    crash_or_unknown_consumption_outcome_requires_reconciliation_before_any_retry: true
    concurrent_replay_stale_revoked_unknown_or_consumed_launch_is_rejected: true
    final_manifest_envelope_is_separately_sealed_after_decision_and_binding_records: true
    every_mandatory_dimension_must_be_satisfied: true
    execution_task_must_be_registered_claimed_and_prelaunch_authorized: true
    execution_task_is_not_required_or_permitted_to_claim_post_run_verification_before_launch: true
    not_applicable_requires_explicit_policy_basis: true
    route_is_never_not_applicable_for_an_empirical_e3_pass: true
    exact_route_purpose: E3_EVALUATION
    exact_route_eligibility: EVALUATION_ONLY
    creates_technical_or_eligibility_credit: false
    qualifies_configuration_or_role: false
    promotes_route: false
    authorizes_later_or_different_run: false
  do_not_run_semantics:
    launch_permitted: false
    trigger: ANY_ABSENT_UNKNOWN_UNAPPROVED_INVALID_CONFLICTING_OR_NOT_YET_VERIFIED_REQUIRED_FACT
    blocker_reasons_required: true
  expired_semantics:
    launch_permitted: false
    applies_only_to_previously_passing_manifest: true
    prior_pass_and_evidence_remain_historical_facts: true
    trigger_and_prior_pass_ref_required: true
    new_freeze_and_new_manifest_required: true
  expiry_model:
    calendar_ttl_invented_by_e3_001: false
    inherited_e1_qualification_window_is_not_generic_manifest_ttl: true
    material_change_triggers:
      - policy_schema_protocol_or_qpa_version_or_digest_change
      - task_dependency_harness_fixture_or_oracle_status_change
      - configuration_prompt_tool_fallback_context_or_served_version_change
      - role_task_scope_support_class_host_client_or_environment_change
      - budget_account_entitlement_quota_or_billing_change
      - credential_scope_validity_revocation_or_protected_entry_change
      - data_rights_class_region_retention_or_training_policy_change
      - network_destination_redirect_or_external_effect_scope_change
      - isolation_security_capture_or_threat_boundary_change
      - architecture_adr_or_canonical_handback_change
      - evidence_destination_integrity_retention_or_contamination_change
      - material_security_finding_provider_drift_or_independence_failure
      - prior_single_use_pass_already_consumed
    authoritative_material_fact_currentness_contract:
      closed_material_fact_set_digest_required: true
      authoritative_monotonic_epoch_and_fence_required: true
      epoch_key_contract:
        integrity_profile: MANIFEST_GLOBAL_INTEGRITY_PROFILE
        exact_ordered_inputs: [project_id, stage, task_id]
        material_source_identity_or_component_digests_are_key_inputs: false
        mutable_record_store_ledger_manifest_block_run_attempt_admission_or_reservation_identifiers_are_key_inputs: false
        verified_harness_resolves_exactly_one_current_authoritative_epoch_ledger_by_fixed_key: true
        manifest_may_select_replace_fork_or_reset_the_epoch_key_or_ledger: false
      material_fact_set_digest_includes_source_identity_set_and_all_nine_closed_component_digests: true
      any_source_identity_or_component_change_reuses_same_key_and_atomically_advances_epoch_and_fence_before_publish: true
      exact_fact_set_epoch_and_fence_bind_both_grants_decision_final_reservation_set_launch_and_dispatch_predicate: true
      dispatch_requires_zero_material_change_triggers_and_current_authenticated_readback: true
      fact_change_commit_must_atomically_advance_epoch_and_fence_prior_admission_before_publish: true
      stale_or_unknown_epoch_fence_or_readback_consequence: USE_EXACT_THREE_OUTCOME_PRECEDENCE_RULE_BELOW
  precedence:
    - A hard stop during a valid launch does not rewrite the historical PASS; it stops the attempt and makes affected subsequent admission DO_NOT_RUN or EXPIRED_REQUIRES_REFREEZE.
    - A prior PASS plus material drift yields EXPIRED_REQUIRES_REFREEZE; missing approval without a prior PASS yields DO_NOT_RUN.
    - When stop facts and a qualifying prior-PASS expiry trigger coexist, EXPIRED_REQUIRES_REFREEZE takes precedence for the new admission; otherwise unresolved stop facts yield DO_NOT_RUN.
    - Architecture handback is a governed root-cause consequence, not a fourth admission outcome.
  admission_check_applicability:
    every_check_status_must_be_supported_by_resolvable_evidence: true
    route_check_must_be_SATISFIED_for_every_PASS: true
    credential_check_must_be_SATISFIED_when_credentials_are_REQUIRED: true
    network_and_effect_check_must_be_SATISFIED_when_network_is_active_or_an_exact_controlled_effect_is_planned: true
    policy_not_applicable_requires_resolvable_policy_basis_and_reason_code: true

