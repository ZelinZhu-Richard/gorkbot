    parser_and_secret_capture_classes_each_record_run_admission_disposition_DO_NOT_RUN: true
    secret_boundary_entry_ids_and_receipt_digests_are_opaque_safe_metadata_not_content_derived: true
    ordered_history_bucket_counts_are_two_capture_rejection_classes_plus_three_valid_manifest_dispositions_and_must_sum_exactly_to_total_submissions: true
    full_ordered_history_prior_entries_bucket_counts_protected_match_result_count_and_secret_equivalence_material_remain_only_in_the_access_controlled_protected_store: true
    ordinary_manifest_embeds_only_capability_free_non_content_derived_opaque_current_index_slot_preparse_context_and_protected_history_screen_attestations_not_any_protected_record_or_digest: true
    ordinary_manifest_exposes_no_global_ordinal_index_or_slot_version_slot_identity_ledger_version_owner_epoch_fence_history_multiplicity_protected_locator_store_configuration_or_access_handle: true
    ordinary_attestation_wire_shapes_and_value_distributions_are_indistinguishable_across_histories_that_differ_only_in_prior_protected_captures: true
    ordinary_manifest_or_general_evidence_may_not_expose_prior_secret_boundary_count_membership_multiplicity_or_protected_entry_correlation_material: true
    every_capture_ordinal_has_exactly_one_terminal_class_and_one_run_admission_disposition: true
    every_valid_manifest_slot_has_exactly_one_matching_terminal_decision: true
    conflicting_terminal_outcome_consequence: DO_NOT_RUN
    prior_ordered_entries_counts_and_gap_detection_recomputed_from_authoritative_append_only_store: true
