run_admission:
  default_outcome: DO_NOT_RUN
  only_outcomes:
    - PASS
    - DO_NOT_RUN
    - EXPIRED_REQUIRES_REFREEZE
  capture_terminal_class_is_distinct_from_run_admission_outcome: true
  capture_terminal_class_mapping:
    VALID_MANIFEST_DECISION_RECORDED: USE_EXACT_RECORDED_RUN_ADMISSION_DISPOSITION
    PARSE_OR_SCHEMA_REJECTED: DO_NOT_RUN
    SECRET_BOUNDARY_REJECTED: DO_NOT_RUN
  parser_or_secret_capture_classes_do_not_expand_the_three_outcome_vocabulary: true
  unit: IMMUTABLE_EXACT_BLOCK_AND_SINGLE_LAUNCH_ATTEMPT
  every_empirical_block_including_development_and_smoke_requires_manifest: true
  every_initial_retry_rerun_and_correction_requires_fresh_manifest_and_independent_pass: true
