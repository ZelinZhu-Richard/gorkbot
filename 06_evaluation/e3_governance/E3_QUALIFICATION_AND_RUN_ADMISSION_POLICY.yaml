model_benchmark_and_eligibility_policy:
  benchmark_route:
    route_purpose: E3_EVALUATION
    route_eligibility: EVALUATION_ONLY
  wrong_route_consequence: DO_NOT_RUN
  family_name_or_moving_alias_is_exact_configuration: false
  configuration_identity_requires:
    - system_and_provider
    - model_id_and_served_version
    - reasoning_mode_and_parameters
    - tools_permissions_and_gateway
    - fallback_policy_and_every_fallback_configuration
    - context_policy_and_prompt_or_instruction_version
    - grader_and_verifier_configuration
  eligibility_key:
    - exact_configuration_id
    - logical_role
    - task_class_and_tested_scope
    - protocol_fixture_harness_and_grader_versions
    - qualification_window
  requested_envelope_key_shared_by_primary_and_fallback:
    - logical_role
    - task_class_and_tested_scope
    - protocol_fixture_harness_and_grader_versions
    - qualification_window
    - provider_neutral_capability_data_cost_effect_and_security_posture
  authorization_envelope_key_shared_or_no_weaker_for_fallback:
    - maximum_cost_and_resource_posture
    - credential_capability_and_protected_entry_posture
    - data_class_rights_region_retention_and_training_posture
    - network_redirect_destination_class_and_external_effect_posture
    - isolation_capture_and_security_posture
  key_digest_binding:
    integrity_profile: MANIFEST_GLOBAL_INTEGRITY_PROFILE
    requested_envelope_payload_is_exactly: requested_envelope_key_shared_by_primary_and_fallback
    authorization_envelope_payload_is_exactly: authorization_envelope_key_shared_or_no_weaker_for_fallback
    full_eligibility_payload_is_exactly:
      - exact_configuration_id_version_and_digest
      - requested_envelope_key_digest
      - exact_protocol_fixture_harness_grader_and_qualification_window_versions
    parent_and_every_fallback_recompute_each_digest_from_actual_closed_manifest_fields_before_comparison: true
    copied_arbitrary_or_noncanonical_digest_consequence: DO_NOT_RUN
  fallback_identity_rule:
    enabled_fallback_permitted_only_for: [E3V-004, E3V-008]
    requested_envelope_key_must_equal_parent: true
    authorization_envelope_must_equal_or_be_stricter_than_parent: true
    exact_provider_account_credential_destination_and_effect_subjects_must_be_separately_authorized: true
    exact_configuration_and_full_eligibility_key_must_differ_from_parent_and_every_sibling: true
    each_exact_configuration_separately_admitted: true
    inbound_launch_activation_mode_is_orthogonal_to_outbound_fallback_enabled: true
    every_separately_admitted_child_full_manifest_declares_FALLBACK_ONLY_with_typed_incoming_parent_selector_transaction_configuration_and_preallocated_route_resolution_context: true
    fallback_graph_maximum_depth: 1
    FALLBACK_ONLY_child_outbound_fallback_enabled: false
    FALLBACK_ONLY_child_must_have_no_outbound_selector_claim_or_child_configuration_reservations: true
    self_reference_duplicate_and_cycle_forbidden: true
    activation_is_not_an_unbounded_extra_attempt: true
    trigger_parent_identity_allowed_failure_class_and_ordering_are_prospectively_frozen: true
    authoritative_parent_state_must_match_trigger_before_single_child_activation: true
    result_inspection_or_primary_success_before_activation_forbids_child_launch: true
    unused_child_claims_launches_sets_and_execution_members_require_atomic_release_execution_receipt_and_post_record_readback: true
    one_predecision_route_selection_reservation_must_bind_exact_parent_manifest_block_run_attempt_configuration_execution_grant_transaction_intent_graph_recomputed_ordered_complete_sibling_set_and_preallocated_route_resolution_locator: true
    deterministic_selection_rule: FIRST_MATCH_IN_FROZEN_ORDER
    frozen_ordered_trigger_plan_set_must_exactly_match_ordered_child_configuration_set: true
    postdecision_parent_launch_and_final_atomic_set_bind_the_selector_digest_one_way: true
    selector_must_not_bind_parent_launch_or_admission_payload_digest: true
    every_child_requires_one_unique_authoritative_claim_over_the_exact_child_launch_id_version_and_digest: true
    child_claim_key_is_recomputed_and_one_current_claim_registry_proves_no_other_active_parent_claim: true
    child_claim_registry_selected_by: E3_004_VERIFIED_HARNESS_CONFIGURATION_NOT_MANIFEST
    manifest_selected_fresh_claim_registry_is_authoritative: false
    every_child_claim_binds_the_same_selector_intent_transaction_owner_epoch_and_fence_and_the_final_atomic_set_commits_each_claim_digest_one_way: true
    parent_launch_activation_mode: DIRECT
    child_launch_activation_mode: FALLBACK_ONLY
    fallback_child_launch_has_no_valid_direct_dispatch_path: true
    every_child_launch_and_dispatch_predicate_are_FALLBACK_ONLY_and_bind_only_the_preallocated_route_resolution_execution_locator_id_version_and_trusted_store_currentness_locator: true
    child_launch_or_predicate_may_not_embed_child_claim_parent_atomic_set_selected_or_no_selection_plan_parent_launch_runtime_or_receipt_digest: true
    one_prospective_selected_child_activation_plan_per_child_binds_exact_parent_selector_trigger_candidate_child_claim_launch_atomic_set_complete_sibling_release_plan_set_and_shared_runtime_locator: true
    one_prospective_no_selection_plan_per_enabled_route_contains_exactly_four_parent_terminal_branch_plans_and_the_complete_all_child_release_plan_set: true
    selected_and_no_selection_plans_are_sealed_before_parent_launch_and_embed_no_realized_parent_state_selection_result_receipt_transition_or_readback: true
    parent_launch_digest_is_resolved_only_during_runtime_route_resolution_to_avoid_a_digest_backedge: true
    predispatch_parent_supersession_requires_UNCONSUMED_RESERVED_AT_ADMISSION: true
    consumed_parent_activation_requires_CONSUMED_ELIGIBLE_FAILURE_and_authenticated_terminal_readback: true
    parent_transition_plans_project_the_exact_parent_atomic_set_attempt_index_three_QPA_families_eight_protocol_dimensions_budget_selector_and_complete_child_claim_set: true
    predispatch_parent_supersession_releases_parent_attempt_index_QPA_protocol_and_budget_members_with_receipt_and_readback: true
    consumed_parent_activation_observes_consumed_parent_set_and_members_without_refund_release_or_reuse: true
    fallback_child_dispatch_compare_and_set_is_valid_only_inside_the_atomic_runtime_route_resolution_transaction: true
    selected_child_runtime_route_resolution_must_use_authenticated_trigger_evaluations_proving_every_earlier_child_NOT_MATCHED_and_the_selected_child_MATCHED: true
    selected_child_route_resolution_transaction_must_atomically:
      - select_and_consume_exactly_one_child
      - terminalize_the_parent_as_predispatch_superseded_or_consumed_eligible_failure_activated
      - transition_the_exact_parent_atomic_set_and_execution_members_as_predispatch_released_or_consumed_no_refund
      - consume_the_selected_child_claim_and_launch_token
      - release_all_and_only_unselected_sibling_claims_without_consuming_their_launch_tokens
      - release_each_unselected_sibling_launch_atomic_set_and_all_attempt_index_QPA_protocol_and_budget_member_reservations_with_nested_fallback_members_structurally_empty
      - commit_one_runtime_route_resolution_execution_record_as_the_atomic_receipt_then_read_back_post_record
    no_selection_closure_plan_required_for_every_enabled_fallback: true
    no_selection_runtime_resolution_requires_an_exact_all_child_trigger_evaluation_vector_with_every_result_NOT_MATCHED: true
    no_selection_runtime_resolution_handles_no_dispatch_primary_success_terminal_nonmatching_failure_or_hard_stop: true
    no_selection_runtime_resolution_atomically_terminalizes_or_observes_the_parent_transitions_the_selector_and_releases_every_child_claim_launch_atomic_set_attempt_index_QPA_protocol_and_budget_member: true
    no_selection_release_execution_child_set_must_equal_the_route_fallback_configuration_selector_and_plan_ordered_child_set: true
    no_selection_parent_predispatch_members_are_released_but_consumed_parent_members_are_never_refunded_released_or_reused: true
    no_selection_runtime_resolution_requires_committed_execution_receipt_post_record_readback_and_unknown_outcome_reconciliation_before_terminal_visibility: true
    selected_child_is_never_released_as_unused: true
    any_unknown_selection_terminalization_consumption_or_release_outcome_requires_reconciliation_before_child_dispatch_or_parent_terminal_visibility: true
  verdict_vocabulary:
    - ELIGIBLE
    - ELIGIBLE_WITH_CONSTRAINTS
    - INELIGIBLE
    - INCONCLUSIVE
    - NOT_TESTED
  route_eligibility_is_distinct_from_qualification_verdict: true
  no_global_family_eligibility: true
  e3_006_produces_eligibility_verdict: false
  e3_007_proposes_only: true
  e3_008_verifies_or_rejects_without_fixing: true
  stage_gate_may_establish_only: AUTONOMY_ELIGIBLE
  normal_route_promotion_automatic: false
  current_registry_state:
    qualification_records: 0
    eligible_configurations: 0
    role_assignments: 0
    candidates: HYPOTHESIS_ONLY_NOT_RUN

