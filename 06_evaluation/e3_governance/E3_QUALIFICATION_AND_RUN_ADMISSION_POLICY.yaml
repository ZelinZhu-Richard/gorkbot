claim_classes:
  facts:
    - EP-ARCH-C01 and ADR-E2-001..009 are accepted by the independently verified E2 gate.
    - E3-QPA-001 has exactly three canonical scope-aware value families and all are currently unset.
    - Current paid validation authority is USD 0 and no paid or external run is authorized.
    - E3 empirical run, benchmark, paid-call, credential-access, model-role-assignment, and application-code counters are zero.
  inferences:
    - A complete fail-closed admission contract is necessary before empirical evidence could be trustworthy.
    - Material drift after a PASS makes that prior launch permission unusable for a future launch.
  proposals:
    - The manifest shape and common semantic checks in this file are proposed for independent challenge and verification.
    - Protocol-specific finite values and mechanisms will be proposed by E3-002 or E3-003, not here.
  unknowns:
    - Exact Founder-approved QPA assignments.
    - Exact no-cost local resource ceilings.
    - Any future provider, account, credential, data region, paid cap, or external-run scope.

