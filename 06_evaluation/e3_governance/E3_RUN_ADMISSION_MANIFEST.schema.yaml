    allOf:
      - if:
          properties: {protocol_limit_dimension: {enum: [EXECUTION_RETRY, RUN_REPETITION, REPEATED_FAILURE]}}
          required: [protocol_limit_dimension]
        then:
          properties:
            unit: {const: COUNT}
            accounting_scope: {const: CUMULATIVE_PROTOCOL_DIMENSION}
      - if:
          properties: {protocol_limit_dimension: {enum: [ELAPSED_TIME_SECONDS, OUTPUT_BYTES, PROCESS_COUNT, DISK_BYTES, NETWORK_CALL]}}
          required: [protocol_limit_dimension]
        then:
