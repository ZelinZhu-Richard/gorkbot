      canonical_descriptor_set_digest: {$ref: "#/$defs/digest"}
      expected_final_member_count:
        type: integer
        minimum: 13
      contains_final_member_record_digest: {const: false}
      contains_admission_payload_or_launch_digest: {const: false}
      immutable: {const: true}
      current_status: {const: CURRENT_FROZEN_NOT_REVOKED}
