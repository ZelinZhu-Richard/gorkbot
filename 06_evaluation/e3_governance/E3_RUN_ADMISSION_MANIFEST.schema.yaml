$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:gorkbot:e3:run-admission-manifest:0.1.0-author-draft"
title: Engineering Preview E3 Run Admission Manifest
description: >-
  Closed structural schema for one immutable E3 empirical block and one single-use launch admission.
  Schema validity is necessary but never sufficient for PASS. Parse failure, duplicate keys, schema failure,
  missing semantic proof, stale facts, or failed independent checks all resolve to DO_NOT_RUN under
  E3-QPA-POLICY-001.
type: object
additionalProperties: false
required:
  - schema_identity
  - manifest_identity
  - block_and_attempt_identity
  - authority_and_dependencies
  - architecture_and_e3v_binding
  - protocol_and_freeze
  - configuration_and_scope
  - e3v_specialization
  - route
  - qpa_and_limits
  - budget
  - account_and_credentials
  - data_and_fixtures
  - network_and_external_effects
  - isolation_and_security
  - evidence_destinations_and_lineage
  - contamination_and_grading
  - attempt_semantics
  - stop_and_handback
  - freshness_and_expiry
  - admission_checks
  - admission_decision
properties:
  schema_identity:
    type: object
    additionalProperties: false
    required:
      - schema_id
      - schema_version
      - schema_digest
      - integrity_profile_ref
      - integrity_profile_scope
      - policy_id
      - policy_version
      - policy_digest
    properties:
      schema_id:
        const: E3_RUN_ADMISSION_MANIFEST
      schema_version:
        const: 0.1.0-author-draft
      schema_digest:
        $ref: "#/$defs/digest"
      integrity_profile_ref:
        $ref: "#/$defs/artifact_ref"
      integrity_profile_scope:
        const: EVERY_DIGEST_AND_INTEGRITY_TOKEN_IN_MANIFEST_AND_REFERENCED_RECORDS
      policy_id:
        const: E3-QPA-POLICY-001
      policy_version:
        const: 0.1.0-author-draft
      policy_digest:
        $ref: "#/$defs/digest"
  manifest_identity:
    type: object
    additionalProperties: false
    required:
      - manifest_id
      - manifest_version
      - admission_payload_digest
      - admission_payload_digest_scope
      - final_envelope_digest
      - final_envelope_digest_scope
      - manifest_integrity_profile_ref
      - created_at
      - created_by_actor_id
      - immutable
      - single_use
    properties:
      manifest_id:
        $ref: "#/$defs/id"
      manifest_version:
        $ref: "#/$defs/version"
      admission_payload_digest:
        $ref: "#/$defs/digest"
      admission_payload_digest_scope:
        const: DETACHED_CANONICAL_PRE_DECISION_PAYLOAD_EXCLUDING_BOTH_DIGEST_FIELDS_AND_ADMISSION_DECISION
      final_envelope_digest:
        $ref: "#/$defs/digest"
      final_envelope_digest_scope:
        const: DETACHED_CANONICAL_FINAL_ENVELOPE_EXCLUDING_FINAL_ENVELOPE_DIGEST
      manifest_integrity_profile_ref:
        $ref: "#/$defs/artifact_ref"
      created_at:
        $ref: "#/$defs/timestamp"
      created_by_actor_id:
        $ref: "#/$defs/id"
      immutable:
        const: true
      single_use:
        const: true
  block_and_attempt_identity:
    type: object
    additionalProperties: false
    required:
      - block_id
      - run_id
      - attempt_id
      - attempt_class
      - launch_ordinal
      - canonical_block_plan_ref
      - block_equivalence_key_digest
      - operation_schedule_entry_ref
      - correction_lineage_ref
      - prior_block_id
      - prior_attempt_id
      - prior_run_id
    properties:
      block_id:
        $ref: "#/$defs/id"
      run_id:
        $ref: "#/$defs/id"
      attempt_id:
        $ref: "#/$defs/id"
      attempt_class:
        enum: [DEVELOPMENT_NON_SCORED, SMOKE_NON_SCORED, SCORED_DECISION]
      launch_ordinal:
        type: integer
        minimum: 1
      canonical_block_plan_ref:
        oneOf:
          - $ref: "#/$defs/block_plan_ref"
          - type: "null"
      block_equivalence_key_digest:
        oneOf:
          - $ref: "#/$defs/digest"
          - type: "null"
      operation_schedule_entry_ref:
        oneOf:
          - $ref: "#/$defs/operation_schedule_entry_ref"
          - type: "null"
      correction_lineage_ref:
        oneOf:
          - $ref: "#/$defs/correction_lineage_ref"
          - type: "null"
      prior_block_id:
        oneOf:
          - $ref: "#/$defs/id"
          - type: "null"
      prior_attempt_id:
        oneOf:
          - $ref: "#/$defs/id"
          - type: "null"
      prior_run_id:
        oneOf:
          - $ref: "#/$defs/id"
          - type: "null"
  authority_and_dependencies:
    type: object
    additionalProperties: false
    required:
      - task_id
      - task_status
      - task_registry_state_ref
      - material_fact_currentness_ref
      - execution_authorization_ref
      - admission_checker_authority_ref
      - e3_001_governance_verification_ref
      - protocol_task_verification_ref
      - e3_004_harness_task_verification_ref
      - dependency_verification_refs
      - operator_actor_id
      - admission_checker_actor_id
      - admission_checker_independent
      - author_or_operator_self_admission
      - founder_qpa_accountable_owner
    properties:
      task_id:
        enum: [E3-005, E3-006]
      task_status:
        enum: [BACKLOG, BACKLOG_DO_NOT_RUN, READY, CLAIMED, READY_FOR_REVIEW, VERIFIED]
      task_registry_state_ref:
        $ref: "#/$defs/artifact_ref"
      material_fact_currentness_ref:
        oneOf:
          - $ref: "#/$defs/material_fact_currentness_ref"
          - type: "null"
      execution_authorization_ref:
        oneOf:
          - $ref: "#/$defs/authority_grant_ref"
          - type: "null"
      admission_checker_authority_ref:
        oneOf:
          - $ref: "#/$defs/authority_grant_ref"
          - type: "null"
      e3_001_governance_verification_ref:
        oneOf:
          - $ref: "#/$defs/governance_subject_verification_ref"
          - type: "null"
      protocol_task_verification_ref:
        oneOf:
          - $ref: "#/$defs/verified_ref"
          - type: "null"
      e3_004_harness_task_verification_ref:
        oneOf:
          - $ref: "#/$defs/verified_ref"
          - type: "null"
      dependency_verification_refs:
        type: array
        items:
          $ref: "#/$defs/verified_ref"
        uniqueItems: true
      operator_actor_id:
        $ref: "#/$defs/id"
      admission_checker_actor_id:
        $ref: "#/$defs/id"
      admission_checker_independent:
        type: boolean
      author_or_operator_self_admission:
        type: boolean
      founder_qpa_accountable_owner:
        const: Founder
  architecture_and_e3v_binding:
    type: object
    additionalProperties: false
    required:
      - architecture_id
      - architecture_status
      - architecture_gate_ref
      - accepted_adr_ids
      - accepted_adr_set_digest
      - e3v_id
      - canonical_handback_adr_ids
      - canonical_e3v_contract_ref
      - tested_property_digest
      - supported_scope_digest
      - unsupported_scope_digest
      - canonical_handback_set_digest
      - tested_property
      - supported_scope
      - unsupported_scope
      - failure_classification_rule_ref
      - ordinary_failure_is_architecture_handback
    properties:
      architecture_id:
        const: EP-ARCH-C01
      architecture_status:
        const: SELECTED_VERIFIED_ACCEPTED_E2_GATE_PASSED
      architecture_gate_ref:
        $ref: "#/$defs/architecture_gate_subject_ref"
      accepted_adr_ids:
        type: array
        const:
          - ADR-E2-001
          - ADR-E2-002
          - ADR-E2-003
          - ADR-E2-004
          - ADR-E2-005
          - ADR-E2-006
          - ADR-E2-007
          - ADR-E2-008
          - ADR-E2-009
      accepted_adr_set_digest:
        $ref: "#/$defs/digest"
      e3v_id:
        enum: [E3V-001, E3V-002, E3V-003, E3V-004, E3V-005, E3V-006, E3V-007, E3V-008]
      canonical_handback_adr_ids:
        type: array
        items:
          enum:
            - ADR-E2-001
            - ADR-E2-002
            - ADR-E2-003
            - ADR-E2-004
            - ADR-E2-005
            - ADR-E2-006
            - ADR-E2-007
            - ADR-E2-008
            - ADR-E2-009
      canonical_e3v_contract_ref:
        oneOf:
          - $ref: "#/$defs/e3v_contract_ref"
          - type: "null"
      tested_property_digest:
        oneOf:
          - $ref: "#/$defs/digest"
          - type: "null"
      supported_scope_digest:
        oneOf:
          - $ref: "#/$defs/digest"
          - type: "null"
      unsupported_scope_digest:
        oneOf:
          - $ref: "#/$defs/digest"
          - type: "null"
      canonical_handback_set_digest:
        oneOf:
          - $ref: "#/$defs/digest"
          - type: "null"
        uniqueItems: true
      tested_property:
        $ref: "#/$defs/nonempty"
      supported_scope:
        $ref: "#/$defs/nonempty_array"
      unsupported_scope:
        type: array
        items:
          $ref: "#/$defs/nonempty"
        uniqueItems: true
      failure_classification_rule_ref:
        $ref: "#/$defs/artifact_ref"
      ordinary_failure_is_architecture_handback:
        const: false
  protocol_and_freeze:
    type: object
    additionalProperties: false
    required:
      - protocol_task_id
      - protocol_id
      - protocol_version
      - protocol_digest
      - protocol_status
      - protocol_verification_ref
      - harness_id
      - harness_version
      - harness_digest
      - harness_status
      - harness_verification_ref
      - frozen_suite_token
      - frozen_suite_digest
      - selected_case_ids
      - selected_case_set_ref
      - fixture_set_ref
      - oracle_ids
      - oracle_set_ref
      - seed_set_ref
      - execution_order_policy_ref
      - freeze_recorded_at
      - freeze_ordering_evidence_ref
      - block_first_result_available_at
      - block_first_result_inspected_at
      - block_first_result_timing_evidence_ref
      - current_attempt_result_available_at
      - current_attempt_result_inspected_at
      - freeze_precedes_result_inspection
      - candidate_labels_uninspected_by_blinded_grader_at_freeze
      - frozen_field_set_digest
      - success_rule_ref
      - failure_rule_ref
      - inconclusive_rule_ref
      - exclusion_rule_ref
      - analysis_rule_ref
    properties:
      protocol_task_id:
        enum: [E3-002, E3-003]
      protocol_id:
        $ref: "#/$defs/id"
      protocol_version:
        $ref: "#/$defs/version"
      protocol_digest:
        $ref: "#/$defs/digest"
      protocol_status:
        enum: [DRAFT, READY_FOR_REVIEW, VERIFIED, EXECUTION_READY_VERIFIED]
      protocol_verification_ref:
        oneOf:
          - $ref: "#/$defs/protocol_subject_verification_ref"
          - type: "null"
      harness_id:
        $ref: "#/$defs/id"
      harness_version:
        $ref: "#/$defs/version"
      harness_digest:
        $ref: "#/$defs/digest"
      harness_status:
        enum: [NOT_BUILT, DRAFT, READY_FOR_REVIEW, VERIFIED]
      harness_verification_ref:
        oneOf:
          - $ref: "#/$defs/harness_subject_verification_ref"
          - type: "null"
      frozen_suite_token:
        const: EP-EVAL-0.2
      frozen_suite_digest:
        $ref: "#/$defs/digest"
      selected_case_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/id"
      selected_case_set_ref:
        $ref: "#/$defs/artifact_ref"
      fixture_set_ref:
        $ref: "#/$defs/artifact_ref"
      oracle_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/id"
      oracle_set_ref:
        $ref: "#/$defs/artifact_ref"
      seed_set_ref:
        $ref: "#/$defs/artifact_ref"
      execution_order_policy_ref:
        $ref: "#/$defs/artifact_ref"
      freeze_recorded_at:
        $ref: "#/$defs/timestamp"
      freeze_ordering_evidence_ref:
        $ref: "#/$defs/artifact_ref"
      block_first_result_available_at:
        oneOf:
          - $ref: "#/$defs/timestamp"
          - type: "null"
      block_first_result_inspected_at:
        oneOf:
          - $ref: "#/$defs/timestamp"
          - type: "null"
      block_first_result_timing_evidence_ref:
        oneOf:
          - $ref: "#/$defs/artifact_ref"
          - type: "null"
      current_attempt_result_available_at:
        type: "null"
      current_attempt_result_inspected_at:
        type: "null"
      freeze_precedes_result_inspection:
        type: boolean
      candidate_labels_uninspected_by_blinded_grader_at_freeze:
        type: boolean
      frozen_field_set_digest:
        $ref: "#/$defs/digest"
      success_rule_ref:
        $ref: "#/$defs/artifact_ref"
      failure_rule_ref:
        $ref: "#/$defs/artifact_ref"
      inconclusive_rule_ref:
        $ref: "#/$defs/artifact_ref"
      exclusion_rule_ref:
        $ref: "#/$defs/artifact_ref"
      analysis_rule_ref:
        $ref: "#/$defs/artifact_ref"
  configuration_and_scope:
    type: object
    additionalProperties: false
    required:
      - configuration_kind
      - configuration_id
      - configuration_version
      - configuration_digest
      - mechanism_or_system
      - transport_mode
      - provider
      - model_id
      - served_model_version
      - reasoning_configuration
      - tool_configuration
      - fallback_configurations
      - requested_envelope_key_digest
      - authorization_envelope_key_digest
      - eligibility_key_digest
      - context_policy_version
      - prompt_or_instruction_version
      - logical_role
      - task_class
      - tested_scope
      - support_class
      - host_platform
      - client_configuration
      - environment_digest
    properties:
      configuration_kind:
        enum: [TECHNICAL_MECHANISM, MODEL_SYSTEM_CONFIGURATION]
      configuration_id:
        $ref: "#/$defs/id"
      configuration_version:
        $ref: "#/$defs/version"
      configuration_digest:
        $ref: "#/$defs/digest"
      mechanism_or_system:
        $ref: "#/$defs/nonempty"
      transport_mode:
        enum: [LOCAL_OFFLINE, REMOTE_EXTERNAL]
      provider:
        oneOf:
          - $ref: "#/$defs/nonempty"
          - type: "null"
      model_id:
        oneOf:
          - $ref: "#/$defs/nonempty"
          - type: "null"
      served_model_version:
        oneOf:
          - $ref: "#/$defs/nonempty"
          - type: "null"
      reasoning_configuration:
        oneOf:
          - $ref: "#/$defs/artifact_ref"
          - type: "null"
      tool_configuration:
        oneOf:
          - $ref: "#/$defs/artifact_ref"
          - type: "null"
      fallback_configurations:
        type: array
        items:
          $ref: "#/$defs/fallback_configuration"
        uniqueItems: true
      requested_envelope_key_digest:
        oneOf:
          - $ref: "#/$defs/digest"
          - type: "null"
      authorization_envelope_key_digest:
        oneOf:
          - $ref: "#/$defs/digest"
          - type: "null"
      eligibility_key_digest:
        oneOf:
          - $ref: "#/$defs/digest"
          - type: "null"
      context_policy_version:
        oneOf:
          - $ref: "#/$defs/version"
          - type: "null"
      prompt_or_instruction_version:
        oneOf:
          - $ref: "#/$defs/version"
          - type: "null"
      logical_role:
        oneOf:
          - enum:
              - AUTONOMOUS_CONTROLLER
              - PLANNER
              - EXECUTOR
              - CODER
              - COMPUTER_CONTROLLER
              - VISION_INTERPRETER
              - VERIFIER
              - SECURITY_REVIEWER
              - MEMORY_EXTRACTOR
              - SUMMARIZER
              - ROUTER
          - type: "null"
      task_class:
        $ref: "#/$defs/nonempty"
      tested_scope:
        $ref: "#/$defs/nonempty_array"
      support_class:
        $ref: "#/$defs/nonempty"
      host_platform:
        $ref: "#/$defs/artifact_ref"
      client_configuration:
        $ref: "#/$defs/artifact_ref"
      environment_digest:
        $ref: "#/$defs/digest"
  e3v_specialization:
    type: object
    additionalProperties: false
    required: [e3v_002, e3v_006]
    properties:
      e3v_002:
        oneOf:
          - type: "null"
          - $ref: "#/$defs/e3v_002_specialization"
      e3v_006:
        oneOf:
          - type: "null"
          - $ref: "#/$defs/e3v_006_specialization"
  route:
    type: object
    additionalProperties: false
    required:
      - applicable
      - route_purpose
      - route_eligibility
      - route_policy_version
      - fallback_enabled
      - launch_activation_mode
      - incoming_fallback_activation_context_ref
      - every_fallback_separately_admitted
      - hidden_fallback_forbidden
      - fallback_route_selection_ref
      - fallback_no_selection_closure_plan_ref
    properties:
      applicable:
        type: boolean
      route_purpose:
        oneOf:
          - const: E3_EVALUATION
          - type: "null"
      route_eligibility:
        oneOf:
          - enum: [PRODUCTION_OR_NORMAL_ELIGIBLE, EVALUATION_ONLY, USER_CONFIGURED_UNVERIFIED, DISALLOWED]
          - type: "null"
      route_policy_version:
        oneOf:
          - $ref: "#/$defs/version"
          - type: "null"
      fallback_enabled:
        type: boolean
      launch_activation_mode:
        enum: [DIRECT, FALLBACK_ONLY]
      incoming_fallback_activation_context_ref:
        oneOf:
          - $ref: "#/$defs/incoming_fallback_activation_context_ref"
          - type: "null"
      every_fallback_separately_admitted:
        type: boolean
      hidden_fallback_forbidden:
        const: true
      fallback_route_selection_ref:
        oneOf:
          - $ref: "#/$defs/fallback_route_selection_ref"
          - type: "null"
      fallback_no_selection_closure_plan_ref:
        oneOf:
          - $ref: "#/$defs/fallback_no_selection_closure_plan_ref"
          - type: "null"
    allOf:
      - if:
          properties: {launch_activation_mode: {const: DIRECT}}
          required: [launch_activation_mode]
        then:
          properties:
            incoming_fallback_activation_context_ref: {type: "null"}
      - if:
          properties: {launch_activation_mode: {const: FALLBACK_ONLY}}
          required: [launch_activation_mode]
        then:
          properties:
            incoming_fallback_activation_context_ref: {$ref: "#/$defs/incoming_fallback_activation_context_ref"}
  qpa_and_limits:
    type: object
    additionalProperties: false
    required:
      - qpa_id
      - qpa_version
      - qpa_digest
      - canonical_assignment_set_digest
      - founder_acknowledgement_status
      - founder_acknowledgement_ref
      - founder_value_approval_status
      - founder_value_approval_ref
      - independent_challenge_ref
      - independent_verification_ref
      - verification_rerun_assignments
      - verification_rerun_resolution
      - deterministic_check_repetition_assignments
      - deterministic_check_repetition_resolution
      - correction_attempt_assignments
      - correction_attempt_resolution
      - assignment_coverage_complete
      - values_selected_before_results
      - value_freeze_ordering_evidence_ref
      - risk_and_correction_bindings
      - protocol_limits
      - protocol_limit_consumption
    properties:
      qpa_id:
        const: E3-QPA-001
      qpa_version:
        oneOf:
          - $ref: "#/$defs/version"
          - type: "null"
      qpa_digest:
        oneOf:
          - $ref: "#/$defs/digest"
          - type: "null"
      canonical_assignment_set_digest:
        description: >-
          Digest under manifest_identity.integrity_profile_ref of the closed canonical QPA assignment payload:
          qpa_id, qpa_version, qpa_digest, and exactly the three named family objects containing scope_kind,
          explicit-null default_value, assignments sorted by scope_ref, and all_applicable_scopes_resolved.
          Semantic validation must prove equality to founder_value_approval_ref.exact_value_set_digest.
        oneOf:
          - $ref: "#/$defs/digest"
          - type: "null"
      founder_acknowledgement_status:
        enum: [FOUNDER_DECISION_REQUIRED, ACKNOWLEDGED]
      founder_acknowledgement_ref:
        oneOf:
          - $ref: "#/$defs/founder_qpa_decision_ref"
          - type: "null"
      founder_value_approval_status:
        enum: [FOUNDER_DECISION_REQUIRED, APPROVED]
      founder_value_approval_ref:
        oneOf:
          - $ref: "#/$defs/founder_qpa_decision_ref"
          - type: "null"
      independent_challenge_ref:
        oneOf:
          - $ref: "#/$defs/qpa_review_ref"
          - type: "null"
      independent_verification_ref:
        oneOf:
          - $ref: "#/$defs/qpa_review_ref"
          - type: "null"
      verification_rerun_assignments:
        oneOf:
          - type: "null"
          - $ref: "#/$defs/qpa_assignments"
      verification_rerun_resolution:
        oneOf:
          - type: "null"
          - $ref: "#/$defs/verification_qpa_resolution_set"
      deterministic_check_repetition_assignments:
        oneOf:
          - type: "null"
          - $ref: "#/$defs/qpa_assignments"
      deterministic_check_repetition_resolution:
        oneOf:
          - type: "null"
          - $ref: "#/$defs/deterministic_check_qpa_resolution_set"
      correction_attempt_assignments:
        oneOf:
          - type: "null"
          - $ref: "#/$defs/qpa_assignments"
      correction_attempt_resolution:
        oneOf:
          - type: "null"
          - $ref: "#/$defs/correction_qpa_resolution_set"
      assignment_coverage_complete:
        type: boolean
      values_selected_before_results:
        type: boolean
      value_freeze_ordering_evidence_ref:
        oneOf:
          - $ref: "#/$defs/artifact_ref"
          - type: "null"
      risk_and_correction_bindings:
        $ref: "#/$defs/risk_and_correction_binding_set"
      protocol_limits:
        type: object
        additionalProperties: false
        required:
          - execution_retry_ceiling
          - maximum_repeated_failure_ceiling
          - run_repetition_count
          - elapsed_time_ceiling_seconds
          - output_ceiling_bytes
          - process_ceiling_count
          - disk_ceiling_bytes
          - network_call_ceiling
          - cost_ceiling_usd
          - evidence_sufficiency_rule_ref
          - termination_rule_ref
        properties:
          execution_retry_ceiling:
            $ref: "#/$defs/nullable_nonnegative_integer"
          maximum_repeated_failure_ceiling:
            $ref: "#/$defs/nullable_positive_integer"
          run_repetition_count:
            $ref: "#/$defs/nullable_positive_integer"
          elapsed_time_ceiling_seconds:
            $ref: "#/$defs/nullable_positive_integer"
          output_ceiling_bytes:
            $ref: "#/$defs/nullable_positive_integer"
          process_ceiling_count:
            $ref: "#/$defs/nullable_positive_integer"
          disk_ceiling_bytes:
            $ref: "#/$defs/nullable_positive_integer"
          network_call_ceiling:
            $ref: "#/$defs/nullable_nonnegative_integer"
          cost_ceiling_usd:
            $ref: "#/$defs/nullable_nonnegative_number"
          evidence_sufficiency_rule_ref:
            oneOf:
