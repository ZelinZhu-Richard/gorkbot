              const: true
            parser_wrapper_rejections_recorded:
              const: true
            locator_separation_verified:
              const: true
            prior_launched_attempts_indexed:
              const: true
            prior_unfavorable_attempts_preserved:
              const: true
            raw_append_only_and_delete_deny_controls_verified:
              const: true
            independent_seal_and_readback_controls_verified:
              const: true
            integrity_status:
              const: VERIFIED
        contamination_and_grading:
          properties:
            attempt_class_matches_partition:
              const: true
            frozen_seed_and_order:
              const: true
            result_verifier_actor_id:
              $ref: "#/$defs/id"
            result_verifier_configuration_ref:
              $ref: "#/$defs/artifact_ref"
            result_verifier_independent:
              const: true
        freshness_and_expiry:
          properties:
            prior_pass_consumed:
              const: false
            material_change_triggers:
              maxItems: 0
            all_required_facts_current:
              const: true
            refreeze_required:
              const: false
        stop_and_handback:
          properties:
            hard_failure_status:
              const: NONE
            hard_failure_evidence_ref:
              type: "null"
            correction_ceiling_exhausted:
              const: false
            repeated_failure_ceiling_exhausted:
              const: false
            budget_exhausted:
              const: false
            all_stop_conditions_clear:
              const: true
            root_cause_status:
              const: NOT_APPLICABLE_PRE_RUN
            root_cause_decision_ref:
              type: "null"
            existing_architecture_handback_status:
              const: NONE
            existing_architecture_handback_evidence_ref:
              type: "null"
            affected_lane_stopped:
              const: false
        admission_checks:
          $ref: "#/$defs/all_pass_checks"
        admission_decision:
          properties:
            launch_permitted:
              const: true
            blocker_reason_codes:
              maxItems: 0
            expired_prior_pass_ref:
              type: "null"
            single_use_launch_binding:
              $ref: "#/$defs/launch_binding_ref"
            decision_record_ref:
              $ref: "#/$defs/admission_decision_record_ref"
  - if:
      allOf:
        - properties:
            admission_decision:
              properties:
                outcome:
                  const: PASS
              required: [outcome]
          required: [admission_decision]
        - properties:
            account_and_credentials:
              properties:
                applicability:
                  const: REQUIRED
              required: [applicability]
          required: [account_and_credentials]
    then:
      properties:
        admission_checks:
          properties:
            credential_and_protected_entry:
              $ref: "#/$defs/satisfied_check"
  - if:
      allOf:
        - properties:
            admission_decision:
              properties:
                outcome:
                  const: PASS
              required: [outcome]
          required: [admission_decision]
        - anyOf:
            - properties:
                network_and_external_effects:
                  properties:
                    network_mode:
                      const: AUTHORIZED_EXTERNAL_READ_OR_PROVIDER_INVOCATION
                  required: [network_mode]
              required: [network_and_external_effects]
            - properties:
                network_and_external_effects:
                  properties:
                    external_effect_mode:
                      const: EXACT_CONTROLLED_EFFECT
                  required: [external_effect_mode]
              required: [network_and_external_effects]
    then:
      properties:
        admission_checks:
          properties:
            network_and_external_effects:
              $ref: "#/$defs/satisfied_check"
  - if:
      allOf:
        - properties:
            admission_decision:
              properties:
                outcome:
                  const: PASS
              required: [outcome]
          required: [admission_decision]
        - properties:
            attempt_semantics:
              properties:
                operation_kind:
                  enum: [INITIAL, CORRECTION]
              required: [operation_kind]
          required: [attempt_semantics]
    then:
      properties:
        qpa_and_limits:
          properties:
            protocol_limit_consumption:
              properties:
                dimension_resolutions:
                  allOf:
                    - $ref: "#/$defs/protocol_limit_dimension_resolution_set"
                    - contains:
                        properties:
                          protocol_limit_dimension: {const: EXECUTION_RETRY}
                          reserved_for_this_attempt: {const: 0}
                        required: [protocol_limit_dimension, reserved_for_this_attempt]
                      minContains: 1
                      maxContains: 1
                    - contains:
                        properties:
                          protocol_limit_dimension: {const: RUN_REPETITION}
                          reserved_for_this_attempt: {const: 0}
                        required: [protocol_limit_dimension, reserved_for_this_attempt]
                      minContains: 1
                      maxContains: 1
  - if:
      allOf:
        - properties:
            admission_decision:
              properties:
                outcome:
                  const: PASS
              required: [outcome]
          required: [admission_decision]
        - properties:
            attempt_semantics:
              properties:
                operation_kind:
                  const: RETRY
              required: [operation_kind]
          required: [attempt_semantics]
    then:
      properties:
        qpa_and_limits:
          properties:
            protocol_limit_consumption:
              properties:
                dimension_resolutions:
                  allOf:
                    - $ref: "#/$defs/protocol_limit_dimension_resolution_set"
                    - contains:
                        properties:
                          protocol_limit_dimension: {const: EXECUTION_RETRY}
                          reserved_for_this_attempt: {const: 1}
                        required: [protocol_limit_dimension, reserved_for_this_attempt]
                      minContains: 1
                      maxContains: 1
                    - contains:
                        properties:
                          protocol_limit_dimension: {const: RUN_REPETITION}
                          reserved_for_this_attempt: {const: 0}
                        required: [protocol_limit_dimension, reserved_for_this_attempt]
                      minContains: 1
                      maxContains: 1
  - if:
      allOf:
        - properties:
            admission_decision:
              properties:
                outcome:
                  const: PASS
              required: [outcome]
          required: [admission_decision]
        - properties:
            attempt_semantics:
              properties:
                operation_kind:
                  const: RERUN
                rerun_basis:
                  const: PROTOCOL_REPETITION
              required: [operation_kind, rerun_basis]
          required: [attempt_semantics]
    then:
      properties:
        qpa_and_limits:
          properties:
            protocol_limit_consumption:
              properties:
                dimension_resolutions:
                  allOf:
                    - $ref: "#/$defs/protocol_limit_dimension_resolution_set"
                    - contains:
                        properties:
                          protocol_limit_dimension: {const: EXECUTION_RETRY}
                          reserved_for_this_attempt: {const: 0}
                        required: [protocol_limit_dimension, reserved_for_this_attempt]
                      minContains: 1
                      maxContains: 1
                    - contains:
                        properties:
                          protocol_limit_dimension: {const: RUN_REPETITION}
                          reserved_for_this_attempt: {const: 1}
                        required: [protocol_limit_dimension, reserved_for_this_attempt]
                      minContains: 1
                      maxContains: 1
  - if:
      allOf:
        - properties:
            admission_decision:
              properties:
                outcome:
                  const: PASS
              required: [outcome]
          required: [admission_decision]
        - properties:
            attempt_semantics:
              properties:
                operation_kind:
                  const: RERUN
                rerun_basis:
                  const: VERIFICATION_ERROR
              required: [operation_kind, rerun_basis]
          required: [attempt_semantics]
    then:
      properties:
        qpa_and_limits:
          properties:
            protocol_limit_consumption:
              properties:
                dimension_resolutions:
                  allOf:
                    - $ref: "#/$defs/protocol_limit_dimension_resolution_set"
                    - contains:
                        properties:
                          protocol_limit_dimension: {const: EXECUTION_RETRY}
                          reserved_for_this_attempt: {const: 0}
                        required: [protocol_limit_dimension, reserved_for_this_attempt]
                      minContains: 1
                      maxContains: 1
                    - contains:
                        properties:
                          protocol_limit_dimension: {const: RUN_REPETITION}
                          reserved_for_this_attempt: {const: 0}
                        required: [protocol_limit_dimension, reserved_for_this_attempt]
                      minContains: 1
                      maxContains: 1
            verification_rerun_resolution:
              items:
                properties:
                  reserved_for_this_attempt:
                    enum: [0, 1]
                required: [reserved_for_this_attempt]
  - if:
      allOf:
        - properties:
            admission_decision:
              properties:
                outcome:
                  const: PASS
              required: [outcome]
          required: [admission_decision]
        - properties:
            attempt_semantics:
              properties:
                operation_kind:
                  not:
                    const: RERUN
              required: [operation_kind]
          required: [attempt_semantics]
    then:
      properties:
        qpa_and_limits:
          properties:
            verification_rerun_resolution:
              items:
                properties:
                  reserved_for_this_attempt:
                    const: 0
                required: [reserved_for_this_attempt]
  - if:
      allOf:
        - properties:
            admission_decision:
              properties:
                outcome:
                  const: PASS
              required: [outcome]
          required: [admission_decision]
        - properties:
            attempt_semantics:
              properties:
                operation_kind:
                  const: RERUN
                rerun_basis:
                  const: PROTOCOL_REPETITION
              required: [operation_kind, rerun_basis]
          required: [attempt_semantics]
    then:
      properties:
        qpa_and_limits:
          properties:
            verification_rerun_resolution:
              items:
                properties:
                  reserved_for_this_attempt:
                    const: 0
                required: [reserved_for_this_attempt]
  - if:
      allOf:
        - properties:
            admission_decision:
              properties:
                outcome:
                  const: PASS
              required: [outcome]
          required: [admission_decision]
        - properties:
            attempt_semantics:
              properties:
                operation_kind:
                  const: CORRECTION
              required: [operation_kind]
          required: [attempt_semantics]
    then:
      properties:
        qpa_and_limits:
          properties:
            correction_attempt_resolution:
              items:
                properties:
                  reserved_for_this_attempt:
                    enum: [0, 1]
                required: [reserved_for_this_attempt]
  - if:
      allOf:
        - properties:
            admission_decision:
              properties:
                outcome:
                  const: PASS
              required: [outcome]
          required: [admission_decision]
        - properties:
            attempt_semantics:
              properties:
                operation_kind:
                  not:
                    const: CORRECTION
              required: [operation_kind]
          required: [attempt_semantics]
    then:
      properties:
        qpa_and_limits:
          properties:
            correction_attempt_resolution:
              items:
                properties:
                  reserved_for_this_attempt:
                    const: 0
                required: [reserved_for_this_attempt]
  - if:
      properties:
        stop_and_handback:
          anyOf:
            - properties:
                hard_failure_status:
                  const: UNRESOLVED_AFFECTED_TUPLE
              required: [hard_failure_status]
            - properties:
                correction_ceiling_exhausted:
                  const: true
              required: [correction_ceiling_exhausted]
            - properties:
                repeated_failure_ceiling_exhausted:
                  const: true
              required: [repeated_failure_ceiling_exhausted]
            - properties:
                budget_exhausted:
                  const: true
              required: [budget_exhausted]
            - properties:
                all_stop_conditions_clear:
                  const: false
              required: [all_stop_conditions_clear]
      required: [stop_and_handback]
    then:
      properties:
        stop_and_handback:
          properties:
            affected_lane_stopped:
              const: true
        admission_decision:
          properties:
            outcome:
              enum: [DO_NOT_RUN, EXPIRED_REQUIRES_REFREEZE]
            launch_permitted:
              const: false
  - if:
      properties:
        stop_and_handback:
          properties:
            hard_failure_status:
              const: NONE
          required: [hard_failure_status]
      required: [stop_and_handback]
    then:
      properties:
        stop_and_handback:
          properties:
            hard_failure_evidence_ref:
              type: "null"
  - if:
      properties:
        stop_and_handback:
          properties:
            hard_failure_status:
              const: UNRESOLVED_AFFECTED_TUPLE
          required: [hard_failure_status]
      required: [stop_and_handback]
    then:
      properties:
        stop_and_handback:
          properties:
            hard_failure_evidence_ref:
              $ref: "#/$defs/artifact_ref"
  - if:
      properties:
        stop_and_handback:
          properties:
            root_cause_status:
              const: NOT_APPLICABLE_PRE_RUN
          required: [root_cause_status]
      required: [stop_and_handback]
    then:
      properties:
        stop_and_handback:
          properties:
            root_cause_decision_ref:
              type: "null"
  - if:
      properties:
        stop_and_handback:
          properties:
            root_cause_status:
              not:
                const: NOT_APPLICABLE_PRE_RUN
          required: [root_cause_status]
      required: [stop_and_handback]
    then:
      properties:
        stop_and_handback:
          properties:
            root_cause_decision_ref:
              $ref: "#/$defs/root_cause_decision_ref"
  - if:
      properties:
        stop_and_handback:
          properties:
            existing_architecture_handback_status:
              const: NONE
          required: [existing_architecture_handback_status]
      required: [stop_and_handback]
    then:
      properties:
        stop_and_handback:
          properties:
            existing_architecture_handback_evidence_ref:
              type: "null"
  - if:
      properties:
        stop_and_handback:
          properties:
            existing_architecture_handback_status:
              const: PENDING_GOVERNED_E2_REVIEW
          required: [existing_architecture_handback_status]
      required: [stop_and_handback]
    then:
      properties:
        stop_and_handback:
          properties:
            root_cause_status:
              const: ARCHITECTURE_HANDBACK
            root_cause_decision_ref:
              allOf:
                - $ref: "#/$defs/root_cause_decision_ref"
                - properties:
                    classification: {const: ARCHITECTURE_HANDBACK}
                    all_compliant_routes_exhaustively_tested: {const: true}
                    indispensable_accepted_property_structurally_impossible: {const: true}
                    ordinary_implementation_configuration_provider_or_evidence_failure: {const: false}
                  required: [classification, all_compliant_routes_exhaustively_tested, indispensable_accepted_property_structurally_impossible, ordinary_implementation_configuration_provider_or_evidence_failure]
            existing_architecture_handback_evidence_ref:
              allOf:
                - $ref: "#/$defs/root_cause_decision_ref"
                - properties:
                    classification: {const: ARCHITECTURE_HANDBACK}
                  required: [classification]
            affected_lane_stopped:
              const: true
            all_stop_conditions_clear:
              const: false
        admission_decision:
          properties:
            outcome:
              enum: [DO_NOT_RUN, EXPIRED_REQUIRES_REFREEZE]
            launch_permitted:
              const: false
  - if:
      properties:
        stop_and_handback:
          properties:
            root_cause_status:
              const: ARCHITECTURE_HANDBACK
          required: [root_cause_status]
      required: [stop_and_handback]
    then:
      properties:
        stop_and_handback:
          properties:
            existing_architecture_handback_status:
              const: PENDING_GOVERNED_E2_REVIEW
  - if:
      allOf:
        - properties:
            freshness_and_expiry:
              properties:
                prior_pass_manifest_ref:
                  $ref: "#/$defs/artifact_ref"
              required: [prior_pass_manifest_ref]
          required: [freshness_and_expiry]
        - anyOf:
            - properties:
                freshness_and_expiry:
                  properties:
                    material_change_triggers:
                      minItems: 1
                  required: [material_change_triggers]
              required: [freshness_and_expiry]
            - properties:
                freshness_and_expiry:
                  properties:
                    prior_pass_consumed:
                      const: true
                  required: [prior_pass_consumed]
              required: [freshness_and_expiry]
    then:
      properties:
        freshness_and_expiry:
          properties:
            refreeze_required:
              const: true
        admission_decision:
          properties:
            outcome:
              const: EXPIRED_REQUIRES_REFREEZE
            launch_permitted:
              const: false
  - if:
      properties:
        freshness_and_expiry:
          properties:
            prior_pass_manifest_ref:
              type: "null"
            material_change_triggers:
              minItems: 1
          required: [prior_pass_manifest_ref, material_change_triggers]
      required: [freshness_and_expiry]
    then:
      properties:
        admission_decision:
          properties:
            outcome:
              const: DO_NOT_RUN
            launch_permitted:
              const: false
  - if:
      properties:
        admission_decision:
          properties:
            outcome:
              const: DO_NOT_RUN
          required: [outcome]
      required: [admission_decision]
    then:
      properties:
        admission_decision:
          properties:
            launch_permitted:
              const: false
            blocker_reason_codes:
              minItems: 1
            expired_prior_pass_ref:
              type: "null"
            single_use_launch_binding:
              type: "null"
            direct_dispatch_consumption_plan_ref:
              type: "null"
  - if:
      properties:
        admission_decision:
          properties:
            outcome:
              const: EXPIRED_REQUIRES_REFREEZE
          required: [outcome]
      required: [admission_decision]
    then:
      properties:
        freshness_and_expiry:
          properties:
            prior_pass_manifest_ref:
              $ref: "#/$defs/artifact_ref"
            material_change_triggers:
              minItems: 1
            refreeze_required:
              const: true
        admission_decision:
          properties:
            launch_permitted:
              const: false
            blocker_reason_codes:
              minItems: 1
            expired_prior_pass_ref:
              $ref: "#/$defs/artifact_ref"
            single_use_launch_binding:
              type: "null"
            direct_dispatch_consumption_plan_ref:
              type: "null"

$defs:
  nonempty:
    type: string
    minLength: 1
  id:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
    minLength: 2
  version:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9._+-]*$"
  digest:
    type: string
    pattern: "^[A-Za-z][A-Za-z0-9._+-]*:[A-Za-z0-9_-]{16,}$"
  timestamp:
    type: string
    format: date-time
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]+)?(?:Z|[+-][0-9]{2}:[0-9]{2})$"
  nonempty_array:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/nonempty"
  nullable_positive_integer:
    oneOf:
      - type: integer
        minimum: 1
      - type: "null"
  nullable_nonnegative_integer:
    oneOf:
      - type: integer
        minimum: 0
      - type: "null"
  nullable_nonnegative_number:
    oneOf:
      - type: number
        minimum: 0
      - type: "null"
  artifact_ref:
    type: object
    additionalProperties: false
    required: [record_id, version, digest]
    properties:
      record_id:
        $ref: "#/$defs/id"
      version:
        $ref: "#/$defs/version"
      digest:
        $ref: "#/$defs/digest"
  opaque_protected_attestation_receipt_ref:
    type: object
    additionalProperties: false
    required:
      - record_id
      - version
      - digest
      - capability_bearing
      - protected_record_dereference_permitted
      - identifier_and_digest_are_non_content_derived
      - value_distribution_independent_of_protected_history
      - untrusted_submitter_model_or_general_evidence_visibility
    properties:
      record_id: {$ref: "#/$defs/id"}
      version: {$ref: "#/$defs/version"}
      digest: {$ref: "#/$defs/digest"}
      capability_bearing: {const: false}
      protected_record_dereference_permitted: {const: false}
      identifier_and_digest_are_non_content_derived: {const: true}
      value_distribution_independent_of_protected_history: {const: true}
      untrusted_submitter_model_or_general_evidence_visibility: {const: true}
  verified_ref:
    type: object
    additionalProperties: false
    required: [record_id, version, digest, status, verified_at, verifier_actor_id]
    properties:
      record_id:
        $ref: "#/$defs/id"
      version:
        $ref: "#/$defs/version"
      digest:
        $ref: "#/$defs/digest"
      status:
        const: VERIFIED
      verified_at:
        $ref: "#/$defs/timestamp"
      verifier_actor_id:
        $ref: "#/$defs/id"
  governance_subject_verification_ref:
    type: object
    additionalProperties: false
    required:
      - record_id
      - version
      - digest
      - status
      - verified_at
      - verifier_actor_id
      - task_id
      - policy_id
      - policy_version
      - policy_digest
      - schema_id
      - schema_version
      - schema_digest
      - combined_governance_subject_digest
      - current_status
    properties:
      record_id: {const: E3-001}
      version: {$ref: "#/$defs/version"}
      digest: {$ref: "#/$defs/digest"}
      status: {const: VERIFIED}
      verified_at: {$ref: "#/$defs/timestamp"}
      verifier_actor_id: {$ref: "#/$defs/id"}
      task_id: {const: E3-001}
      policy_id: {const: E3-QPA-POLICY-001}
      policy_version: {$ref: "#/$defs/version"}
      policy_digest: {$ref: "#/$defs/digest"}
      schema_id: {const: E3_RUN_ADMISSION_MANIFEST}
      schema_version: {$ref: "#/$defs/version"}
      schema_digest: {$ref: "#/$defs/digest"}
      combined_governance_subject_digest: {$ref: "#/$defs/digest"}
      current_status: {const: CURRENT_NOT_REVOKED}
  architecture_gate_subject_ref:
    type: object
    additionalProperties: false
    required:
      - record_id
      - version
      - digest
      - status
      - verified_at
      - verifier_actor_id
      - gate_id
      - gate_verdict
      - architecture_id
      - architecture_version
      - architecture_digest
      - architecture_status
      - accepted_adr_set_digest
      - current_status
    properties:
      record_id: {const: E2-GATE}
      version: {$ref: "#/$defs/version"}
      digest: {$ref: "#/$defs/digest"}
      status: {const: VERIFIED}
      verified_at: {$ref: "#/$defs/timestamp"}
      verifier_actor_id: {$ref: "#/$defs/id"}
      gate_id: {const: E2-GATE}
      gate_verdict: {const: PASSED}
      architecture_id: {const: EP-ARCH-C01}
      architecture_version: {$ref: "#/$defs/version"}
      architecture_digest: {$ref: "#/$defs/digest"}
      architecture_status: {const: SELECTED_VERIFIED_ACCEPTED_E2_GATE_PASSED}
      accepted_adr_set_digest: {$ref: "#/$defs/digest"}
      current_status: {const: CURRENT_NOT_REVOKED}
  stable_correction_scope_member_ref:
    type: object
    additionalProperties: false
    required:
      - record_id
      - version
      - digest
      - project_id
      - stage
      - task_id
      - scope_kind
      - scope_ref
      - member_registry_key_digest
      - member_registry_key_derivation
      - member_stable_lineage_subject_digest
      - authoritative_member_registry_ref
      - trusted_store_configuration_ref
      - store_selection_source
      - complete_member_registry_history_ref
      - complete_cross_set_overlap_search_ref
      - alternate_lineage_count_for_member_scope
      - mapping_initialized_before_first_scope_attempt
      - overlapping_set_versions_preserve_this_mapping
      - only_truly_new_scope_may_initialize_new_mapping
      - removal_cannot_delete_or_reset_mapping_or_ledger
      - readdition_reuses_existing_mapping_and_ledger
      - currentness_readback_ref
      - immutable
      - current_status
    properties:
      record_id: {$ref: "#/$defs/id"}
      version: {$ref: "#/$defs/version"}
      digest: {$ref: "#/$defs/digest"}
