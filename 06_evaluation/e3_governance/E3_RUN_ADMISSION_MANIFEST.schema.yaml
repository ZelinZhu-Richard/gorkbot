                - type: "null"
            ledger_key_digest: {$ref: "#/$defs/digest"}
            requested_amount:
              type: number
              minimum: 0
          allOf:
            - if:
                properties: {limit_family: {const: VERIFICATION_RERUN}}
                required: [limit_family]
              then:
                properties:
                  accounting_scope: {const: CUMULATIVE_PER_PROTOCOL_REVISION_AND_BLOCK}
                  block_equivalence_key_digest: {$ref: "#/$defs/digest"}
                  operation_schedule_entry_digest: {type: "null"}
                  correction_series_lineage_key_digest: {type: "null"}
