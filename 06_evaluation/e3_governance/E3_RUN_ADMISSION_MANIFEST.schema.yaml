            operation_schedule_entry_digest: {$ref: "#/$defs/digest"}
            correction_lineage_ref: {type: "null"}
            consumed_before: {const: 0}
            remaining_after_reservation: {const: 0}
      - if:
          properties: {limit_family: {const: CORRECTION_ATTEMPT}}
          required: [limit_family]
        then:
          properties:
            accounting_scope: {const: CUMULATIVE_ACROSS_STABLE_CROSS_VERSION_CORRECTION_LINEAGE}
            block_equivalence_key_digest: {type: "null"}
            operation_schedule_entry_digest: {type: "null"}
