            - scope_ref
            - accounting_scope
            - block_equivalence_key_digest
            - operation_schedule_entry_digest
            - correction_series_lineage_key_digest
            - correction_scope_member_subject_digest
            - ledger_key_digest
            - requested_amount
          properties:
            limit_family: {enum: [VERIFICATION_RERUN, DETERMINISTIC_CHECK_REPETITION, CORRECTION_ATTEMPT]}
            scope_kind: {enum: [CASE_OR_TASK, CHECK_OR_CLASS]}
            scope_ref: {$ref: "#/$defs/id"}
            accounting_scope:
              enum:
                - CUMULATIVE_PER_PROTOCOL_REVISION_AND_BLOCK
                - PER_EXACT_SCHEDULED_ATTEMPT
                - CUMULATIVE_ACROSS_STABLE_CROSS_VERSION_CORRECTION_LINEAGE
