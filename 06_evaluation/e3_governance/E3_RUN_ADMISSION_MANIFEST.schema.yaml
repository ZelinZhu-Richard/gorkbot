                required: [limit_family]
              then:
                properties:
                  accounting_scope: {const: PER_EXACT_SCHEDULED_ATTEMPT}
                  block_equivalence_key_digest: {$ref: "#/$defs/digest"}
                  operation_schedule_entry_digest: {$ref: "#/$defs/digest"}
                  correction_series_lineage_key_digest: {type: "null"}
                  correction_scope_member_subject_digest: {type: "null"}
            - if:
                properties: {limit_family: {const: CORRECTION_ATTEMPT}}
                required: [limit_family]
              then:
                properties:
                  accounting_scope: {const: CUMULATIVE_ACROSS_STABLE_CROSS_VERSION_CORRECTION_LINEAGE}
                  block_equivalence_key_digest: {type: "null"}
                  operation_schedule_entry_digest: {type: "null"}
                  correction_series_lineage_key_digest: {$ref: "#/$defs/digest"}
                  correction_scope_member_subject_digest: {$ref: "#/$defs/digest"}
      protocol_member_descriptors:
        type: array
        minItems: 8
        maxItems: 8
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required: [limit_family, protocol_limit_dimension, scope_ref, ledger_key_digest, requested_amount]
          properties:
            limit_family: {const: PROTOCOL_LIMIT_DIMENSION}
            protocol_limit_dimension: {$ref: "#/$defs/protocol_limit_dimension"}
            scope_ref: {$ref: "#/$defs/id"}
            ledger_key_digest: {$ref: "#/$defs/digest"}
            requested_amount:
              type: number
              minimum: 0
        allOf:
          - contains: {properties: {protocol_limit_dimension: {const: EXECUTION_RETRY}}, required: [protocol_limit_dimension]}
            minContains: 1
            maxContains: 1
          - contains: {properties: {protocol_limit_dimension: {const: RUN_REPETITION}}, required: [protocol_limit_dimension]}
            minContains: 1
            maxContains: 1
          - contains: {properties: {protocol_limit_dimension: {const: REPEATED_FAILURE}}, required: [protocol_limit_dimension]}
            minContains: 1
            maxContains: 1
          - contains: {properties: {protocol_limit_dimension: {const: ELAPSED_TIME_SECONDS}}, required: [protocol_limit_dimension]}
            minContains: 1
            maxContains: 1
          - contains: {properties: {protocol_limit_dimension: {const: OUTPUT_BYTES}}, required: [protocol_limit_dimension]}
            minContains: 1
            maxContains: 1
          - contains: {properties: {protocol_limit_dimension: {const: PROCESS_COUNT}}, required: [protocol_limit_dimension]}
            minContains: 1
            maxContains: 1
          - contains: {properties: {protocol_limit_dimension: {const: DISK_BYTES}}, required: [protocol_limit_dimension]}
            minContains: 1
            maxContains: 1
          - contains: {properties: {protocol_limit_dimension: {const: NETWORK_CALL}}, required: [protocol_limit_dimension]}
            minContains: 1
            maxContains: 1
      budget_member_descriptor:
        type: object
        additionalProperties: false
        required: [limit_family, scope_ref, ledger_key_digest, maximum_amount_usd]
