      atomic_reservation_ref:
        $ref: "#/$defs/limit_reservation_ref"
      atomic_reservation_intent_digest:
        $ref: "#/$defs/digest"
      reservation_transaction_id:
        $ref: "#/$defs/id"
    allOf:
      - if:
          properties: {limit_family: {const: VERIFICATION_RERUN}}
          required: [limit_family]
        then:
          properties:
            accounting_scope: {const: CUMULATIVE_PER_PROTOCOL_REVISION_AND_BLOCK}
            block_equivalence_key_digest: {$ref: "#/$defs/digest"}
            operation_schedule_entry_digest: {type: "null"}
            correction_lineage_ref: {type: "null"}
      - if:
          properties: {limit_family: {const: DETERMINISTIC_CHECK_REPETITION}}
          required: [limit_family]
        then:
          properties:
            accounting_scope: {const: PER_EXACT_SCHEDULED_ATTEMPT}
