common_evidence_contract:
  layers:
    - RAW_RUN_EVIDENCE
    - DERIVED_ANALYSIS
    - ELIGIBILITY_DECISION
  raw_evidence_rule: >-
    Append-only immutable raw evidence retains every admitted attempt, including failure,
    inconclusive, exclusion, retry, rerun, correction, stop, hard failure, and unknown outcome.
    It binds exact task, E3V, protocol, configuration, environment, host/client/support class,
    case/fixture/oracle/fault/order, operation/effect/readback, timestamps, resource/cost usage,
    stop reason, actor, tool, provider if applicable, and integrity status.
  derived_analysis_rule: >-
    Versioned analysis references immutable raw records and the prospectively frozen analysis,
    exclusion, denominator, missingness, and uncertainty rules. It cannot overwrite raw evidence,
    omit unfavorable attempts, invent missing values, or generalize beyond the tested scope.
  eligibility_decision_rule: >-
    E3-002 creates no eligibility decision. Later decisions are separate, versioned, independently
    re-derived, and cannot be inferred from admission PASS or one E3V result.
  evidence_destinations_selected_now: false
  evidence_reuse_rule: >-
    A raw record may be referenced by several derived analyses only when its exact protocol,
    configuration, case/fault, oracle, capture boundary, integrity, contamination class, and
    support scope are applicable to each analysis. Reuse never duplicates attempt credit and
    never substitutes one E3V verdict for another.
  amendment_policy: APPEND_ONLY_AMENDMENT_NO_OVERWRITE

