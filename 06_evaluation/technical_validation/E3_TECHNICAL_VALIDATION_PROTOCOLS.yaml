      e1_protocol_ids:
        - PROT-SLO-003
        - PROT-SLO-004
        - PROT-MET-002
        - PROT-MET-004
    fault_schedule:
      frozen_boundaries:
        - before_authoritative_mutation_acceptance
        - after_acknowledgement_before_follow_on_visibility
        - during_owner_transfer_and_fence_installation
        - before_and_after_operation_intent_persistence
        - after_possible_effect_before_receipt
        - after_receipt_before_terminal_readback
        - during_partial_filesystem_replacement
        - during_projection_or_evidence_finalization
        - after_verification_before_post_verification_mutation_detection
      injected_conditions:
        - duplicate_or_reordered_intake
        - stale_writer_and_stale_approval
        - missing_or_corrupt_projection
        - incomplete_or_incompatible_authoritative_record
        - lost_process_or_client_with_healthy_owner_distinguished
      schedule_order_and_seed: null
      freeze_status: REQUIRED_BEFORE_EXECUTION
    success_rule: >-
      Every admitted matrix cell ends in a legal truthful state; every acknowledged authoritative
      mutation remains recoverable; every stale writer and stale approval is rejected; every
      controlled effect is observed no more than its authorized intent and reconciled by readback;
      derived views are rebuildable and never authority; no hard failure occurs. The only positive
      root-cause outcome is VALIDATED_FOR_TESTED_SCOPE_ONLY for the exact frozen scope.
    implementation_configuration_failure_rule: >-
      IMPLEMENTATION_CONFIGURATION_FAILURE requires reproducible evidence localizing the defect to
      the selected store, adapter, codec, migration, ownership, fencing, fixture, or recovery
