qpa_author_proposal_for_founder_review:
  proposal_package_id: E3-002-QPA-PROP-001
  proposal_version: 0.1.0
  proposal_status: AUTHOR_PROPOSAL_FOR_FOUNDER_REVIEW_NOT_APPROVED
  proposal_basis: ENGINEERING_REASONING_FROM_FROZEN_REQUIREMENTS_WITH_ZERO_EMPIRICAL_E3_RESULTS
  applies_to_protocols: [E3V-001, E3V-002, E3V-003, E3V-004, E3V-005, E3V-006, E3V-007]
  authoritative_E3_QPA_001_values_remain_null: true
  founder_acknowledgement_recorded: false
  founder_value_approval_recorded: false
  proposals:
    - proposal_id: E3-002-QPA-PROP-001-A
      qpa_family: finite_verification_rerun_ceiling_per_case_or_task
      proposed_value: 1
      approved_value: null
      unit_and_scope: >-
        At most one same-revision verification-error rerun for every exact scored E3V-001..007
        case-or-task scope; the ceiling is cumulative across equivalent blocks and does not reset
        with a new manifest, configuration label, protocol version, removal, or re-addition.
      rationale: >-
        One bounded rerun permits recovery from a genuine VERIFICATION_ERROR while preventing
        favorable repeated checking of unchanged evidence. It never permits rerun after
        CHANGES_REQUIRED, BLOCKED, INCONCLUSIVE, a hard failure, or a changed candidate.
      source_constraints:
        - E3_QPA_001_requires_a_finite_positive_integer_for_every_applicable_scope
        - E3_001_allows_same_revision_verification_rerun_only_after_VERIFICATION_ERROR
        - E1_mixed_ordered_results_remain_FLAKY_and_prior_results_are_immutable
      affected_protocols: [E3V-001, E3V-002, E3V-003, E3V-004, E3V-005, E3V-006, E3V-007]
      expected_effect_on_evidence_sufficiency: >-
        Allows one independently admitted recovery from verifier infrastructure failure; it adds
        no credit unless the complete frozen verification subject is rerun and every result remains visible.
      expected_cost_and_runtime_effect: >-
        Worst-case verifier work for an affected exact scope can be repeated once; no monetary or
        elapsed-time estimate is claimed before an exact harness and environment exist.
      contamination_implications: >-
        Same revision and frozen subject only, fresh single-use admission required, no result-based
        check selection, and the failed verification record remains immutable.
      retry_rerun_correction_implications: >-
        Consumes the global verification-rerun ledger only; it is not an execution retry, protocol
        repetition, or correction and cannot be relabelled as one.
      failure_mode_if_too_low: >-
        A single genuine verifier infrastructure error could permanently prevent decisive evidence
        even when the unchanged subject remains independently checkable.
      failure_mode_if_too_high: >-
        Repeated verifier attempts would increase favorable-outcome shopping, runtime, and the chance
        that changing ambient state is mistaken for unchanged evidence.
      alternatives_considered:
        - "No rerun: rejected as too brittle for genuine VERIFICATION_ERROR."
        - "More than one rerun: rejected absent empirical need because it weakens anti-shopping governance."
      founder_decision_required: true
      approval_status: NOT_APPROVED
      downstream_tasks_blocked_pending_approval: [PHASE_B_EXECUTION_BLOCK_FREEZE, E3-005, ANY_RUN_ADMISSION_PASS]
    - proposal_id: E3-002-QPA-PROP-001-B
      qpa_family: finite_deterministic_required_check_repetition_rule_per_check_or_class
      proposed_value: 3
      proposed_rule: >-
        Execute each applicable required deterministic check exactly three ordered times per
        scheduled scored attempt against the same frozen subject and environment. Every ordered
        outcome is retained; any mixed outcome is FLAKY with no pass credit. A stricter frozen E1
        source-specific protocol remains additionally binding and is never reduced to three.
      approved_value: null
      unit_and_scope: >-
        Three ordered invocations per applicable required deterministic check in every scored
        E3V-001..007 scheduled attempt; no lower-risk class is proposed because E3-001 retains HIGH
        as the frozen default risk class.
      rationale: >-
        Three invocations are the smallest proposed odd finite sequence that can expose one-off
        nondeterminism without treating majority vote as correctness. Unanimity is still required.
      source_constraints:
        - E3_QPA_001_requires_a_finite_positive_integer_for_every_applicable_check_or_class
        - E1_requires_mixed_equivalent_results_to_be_FLAKY_and_forbids_pass_once_credit
        - frozen_E1_protocol_repetitions_remain_source_specific_and_are_not_replaced
      affected_protocols: [E3V-001, E3V-002, E3V-003, E3V-004, E3V-005, E3V-006, E3V-007]
      expected_effect_on_evidence_sufficiency: >-
        Supplies a uniform minimum nondeterminism probe for deterministic checks while requiring
        all three ordered results and every stricter source-specific rule for favorable credit.
      expected_cost_and_runtime_effect: >-
        Triples each applicable deterministic check invocation relative to a single run; exact
        elapsed, process, disk, output, network, and cost bounds remain Phase-B inputs.
      contamination_implications: >-
        Order, subject, environment, seed where applicable, and expected result are frozen before
        execution; majority voting, selective retention, and rerunning only a failure are forbidden.
      retry_rerun_correction_implications: >-
        The three invocations are one scheduled-attempt requirement, not three retries or lifetime
        correction consumption; a mixed result is FLAKY and cannot be repaired by omitting an outcome.
      failure_mode_if_too_low: >-
        A pass-once intermittent defect could appear deterministic and receive false favorable credit.
      failure_mode_if_too_high: >-
        Repetition cost and resource pressure could dominate focused validation without providing
        commensurate evidence in the absence of an empirical variance basis.
      alternatives_considered:
        - "Two invocations: rejected because one pass/one fail exposes flakiness but provides less repeated-state evidence."
        - "Five or more invocations: rejected absent empirical variance evidence; a future prospective amendment may propose it."
      founder_decision_required: true
      approval_status: NOT_APPROVED
      downstream_tasks_blocked_pending_approval: [PHASE_B_EXECUTION_BLOCK_FREEZE, E3-005, ANY_RUN_ADMISSION_PASS]
    - proposal_id: E3-002-QPA-PROP-001-C
      qpa_family: finite_correction_attempt_ceiling_per_case_or_task
      proposed_value: 2
      approved_value: null
      unit_and_scope: >-
        At most two material CORRECTION attempts after the initial block for every stable scored
        E3V-001..007 case-or-task scope across protocol, mechanism, configuration, and block versions;
        each correction creates a new whole affected block and preserves all prior evidence.
      rationale: >-
        Two corrections allow one direct remediation and one independently reviewed follow-up while
        bounding mechanism shopping. The stable scope-member lineage prevents renamed or repackaged
        variants from receiving a fresh allowance.
      source_constraints:
        - E3_001_correction_accounting_is_cumulative_non_resettable_and_membership_independent
        - every_material_change_requires_a_new_version_whole_block_and_manifest
        - E2_distinguishes_implementation_correction_from_governed_architecture_handback
      affected_protocols: [E3V-001, E3V-002, E3V-003, E3V-004, E3V-005, E3V-006, E3V-007]
      expected_effect_on_evidence_sufficiency: >-
        Permits bounded evidence that a localized realization defect was corrected while retaining
        failed blocks and forcing escalation when the finite correction envelope ends.
      expected_cost_and_runtime_effect: >-
        Allows at most two additional corrected whole blocks per stable scope beyond the initial
        block; exact block cost and runtime remain unknown until Phase B.
      contamination_implications: >-
        Correction may respond to a known failure only through an explicit material diff and new
        version; prior failures remain evidence and the new block cannot retroactively rescue them.
      retry_rerun_correction_implications: >-
        Every mechanism/configuration replacement for the same property/scope consumes correction
        allowance; new names, packaging, or trivial policy/prompt changes do not reset the ledger.
      failure_mode_if_too_low: >-
        One imperfect remediation could end the authorized engineering learning path before a
        separately reviewed correction can be evaluated.
      failure_mode_if_too_high: >-
        Additional corrected blocks increase cost and invite candidate shopping or repeated local
        optimization against frozen fixtures.
      alternatives_considered:
        - "One correction: rejected as too brittle for a first bounded mechanism realization."
        - "Three or more corrections: rejected absent empirical justification because it expands shopping opportunity."
      founder_decision_required: true
      approval_status: NOT_APPROVED
      downstream_tasks_blocked_pending_approval: [PHASE_B_EXECUTION_BLOCK_FREEZE, E3-005, ANY_RUN_ADMISSION_PASS]
  founder_decision_required: true
  approval_status: NOT_APPROVED
  fresh_challenge_status: PENDING_POST_FIX_CHALLENGE_OR_VERIFICATION_REVIEW
  independent_verification_status: NOT_VERIFIED
  proposal_does_not_authorize_execution: true

