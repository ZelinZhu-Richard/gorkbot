      use the preserved fault chain to disprove a named accepted persistence/ownership/effect
      assumption, or show that the indispensable accepted recovery property cannot be satisfied in
      EP-ARCH-C01's claimed design envelope for the exact tested support class. Exhausting every
      imaginable implementation is not required; the canonical ADR set remains mandatory.
    missing_or_inconclusive_rule: >-
