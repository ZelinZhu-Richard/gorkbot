      - required_raw_protocol_input_missing_but_metric_or_pass_reported
      - unknown_missing_or_unavailable_value_fabricated_or_imputed_without_rule
      - favorable_exclusion_denominator_seed_order_or_threshold_change_after_result
      - telemetry_projection_or_derived_metric_used_as_authoritative_state
      - wrong_subject_revision_configuration_environment_or_protocol_attribution
