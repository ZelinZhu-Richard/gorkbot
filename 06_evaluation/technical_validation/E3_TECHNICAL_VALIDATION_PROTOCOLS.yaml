    A candidate is materially distinct only when its property-relevant enforcement, authority,
    capture, observation, or recovery primitive differs in a way that could change the decisive
    oracle result. A renamed, repackaged, trivially reconfigured, prompt-only, or nominal variant
    is the same correction lineage and cannot enlarge the authorized envelope.
  phase_A_output: CANDIDATE_METADATA_AND_SELECTION_CRITERIA_ONLY
  phase_B_resolution_owner: >-
    The registered E3-005 prelaunch execution-block preparer, acting for the accountable technical,
    security, or measurement validation owner and distinct from the run operator/admission checker,
    must select the exact candidate from a prospectively reviewed finite envelope after E3-004 is
    VERIFIED and before any launch result exists.
  e3_004_duty: >-
    E3-004 implements and verifies the parameterized candidate metadata interface, fixtures,
    observers, oracles, QPA/limit enforcement points, and harness identity; it does not select a
    final production mechanism or create an empirical result.
  protocol_limit_resolution_duty: >-
    The Phase-B execution-block preparer must propose exact mechanism/environment-calibrated values
    for every protocol-owned retry, repetition, repeated-failure, elapsed-time, output, process,
    disk, network, and cost dimension; identify rationale, failure modes, and affected scope; obtain
    Founder approval where the task contract requires it; and receive fresh independent review and
    verification before execution readiness. Current values remain null and no default applies.
  protocol_limit_proposal_schedule:
    status: DESIGNATED_PHASE_B_STEP_NOT_YET_RUN_VALUES_NULL
    owner: E3_005_PRELAUNCH_EXECUTION_BLOCK_PREPARER_ACTING_FOR_ACCOUNTABLE_VALIDATION_OWNER
    prerequisite: E3_004_INDEPENDENTLY_VERIFIED_EXACT_HARNESS_AND_TARGET_MECHANISM_ENVIRONMENT_KNOWN
    why_values_cannot_be_responsibly_fixed_in_phase_A: >-
      Exact retry, repetition, failure, time, output, process, disk, network, cost, control,
      verifier-context and evidence-sufficiency values depend on the selected candidate's observed
      enforcement/readback granularity and the exact verified harness/host/reference environment.
      Guessing them before those identities and capabilities exist would create pseudo-thresholds
      with no evidence basis and could silently admit unsafe or infeasible blocks.
    missing_evidence_before_proposal:
      - independently_verified_E3_004_limiter_clock_meter_capture_and_readback_resolution
      - exact_candidate_configuration_host_client_runtime_reference_environment_and_support_scope
      - bounded_E3_004_meta_test_evidence_for_limit_enforcement_denial_overhead_and_safety_reserve_behavior
      - applicable_declared_resource_cost_network_and_context_capacity_constraints_with_provenance
    exact_downstream_proposal_step: >-
      After E3-004 is independently VERIFIED and before any scored result exists, the registered
      E3-005 prelaunch execution-block preparer acting for the accountable validation owner records
      one exact value/rule and complete rationale package for every applicable dimension; Founder
      approval where required, fresh challenge, independent Phase B verification, and admission follow.
    dimensions:
      common: [execution_retry_ceiling, run_repetition_count, maximum_repeated_failure_ceiling, elapsed_time_ceiling_seconds, output_ceiling_bytes, process_ceiling_count, disk_ceiling_bytes, network_call_ceiling, cost_ceiling_usd]
      E3V-002: [control_acknowledgement_ceiling, cooperative_termination_ceiling, force_or_fence_effectiveness_ceiling]
      E3V-005: [verifier_context_ceiling]
      E3V-007: [evidence_sufficiency_rule_ref]
    required_record_per_dimension: [exact_finite_value_and_unit, scope, mechanism_environment_basis, evidence_sufficiency_effect, cost_runtime_effect, contamination_and_retry_implications, too_low_failure_mode, too_high_failure_mode, alternatives, approval_and_review_refs]
    completion_gate: ALL_APPLICABLE_VALUES_EXACT_PROSPECTIVE_AND_INDEPENDENTLY_VERIFIED_BEFORE_PHASE_B_EXECUTION_READY

common_run_admission:
