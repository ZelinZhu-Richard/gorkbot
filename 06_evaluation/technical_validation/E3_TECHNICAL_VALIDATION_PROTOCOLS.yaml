common_protocol_contract:
  applicability: E3V-001_THROUGH_E3V-007
  required_per_protocol_fields:
    - exact_question
    - tested_property
    - linked_architecture_requirements
    - canonical_handback_adr_ids
    - architecture_assumption
    - hypotheses
