      output_ceiling_bytes: null
      process_ceiling_count: null
      disk_ceiling_bytes: null
      network_call_ceiling: null
      cost_ceiling_usd: null
      evidence_sufficiency_rule_ref: null
      status: FOUNDER_DECISION_REQUIRED_AND_HARNESS_CONFIGURATION_REQUIRED
