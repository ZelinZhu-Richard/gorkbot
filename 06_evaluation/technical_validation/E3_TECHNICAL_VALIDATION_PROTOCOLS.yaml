    protocol_version: 0.1.0-author-draft
    status: READY_FOR_REVIEW_EXECUTION_BLOCKED
    owner_classification: E3_SECURITY_VALIDATION_OWNER
    exact_question: >-
      For one exact later-selected client, host, protected carrier, runtime recipient, capture
      boundary, approval, and revocation configuration, can a synthetic protected marker be acquired
      without entering ordinary chat/repository/command/environment/UI/evidence paths, delivered for
      one exact use to one exact recipient, denied on replay or wrong recipient, and safely reacquired
      after crash/replacement with only a non-secret receipt and fail-to-WAITING_FOR_USER behavior?
    tested_property: >-
      Protected acquisition, storage reference, delivery, use, revocation, fencing, capture exclusion,
      replacement/recovery, and receipts remain structurally enforced outside model judgment. The raw
      synthetic marker appears only inside the explicitly authorized protected recipient boundary and
      never on any other mandatory observable surface.
