contamination_policy:
  development_smoke_and_scored_partitions_remain_distinct: true
  development_or_smoke_may_be_relabelled_scored: false
  held_out_bytes_labels_expected_results_and_candidate_labels_unavailable_to_tuning: true
  favorable_seed_order_case_retry_rerun_or_omission_forbidden: true
  post_result_threshold_exclusion_denominator_or_analysis_change_forbidden: true
  all_unfavorable_attempts_preserved: true
  harness_defect_rule: INDEPENDENTLY_CONFIRMED_DEFECT_INVALIDATES_WHOLE_AFFECTED_BLOCK
  contaminated_evidence_credit: NONE

architecture_failure_classification:
  classification_status: FINITE_PROSPECTIVE_CLASSIFICATION_RULE_SPECIFIED_ZERO_EMPIRICAL_RESULTS
  ordinary_failure_is_not_automatically_configuration_failure: true
  implementation_configuration_failure_requires:
    - evidence_localizes_the_defect_to_the_exact_selected_realization_or_configuration
    - at_least_one_concrete_materially_distinct_candidate_was_identified_before_result_inspection
    - accepted_architecture_admits_that_candidate_for_the_same_property_and_declared_support_scope
    - candidate_record_satisfies_mechanism_candidate_governance_required_fields
  concrete_architecture_support_evidence_required: >-
    The candidate record must cite the accepted AR/ADR property, exact typed port or enforcement/
    observation seam that can realize it, declared semantics and limitations, and the decisive
    oracle observation available for the same support scope. A mechanism name or architecture
    compatibility assertion without those concrete links is not sufficient.
  mere_plausibility_is_sufficient: false
  unsupported_declared_boundary: PRODUCT_CLASS_UNSUPPORTED
  missing_or_invalid_evidence: EVIDENCE_MISSING_FAIL_CLOSED
  classification_when_no_concrete_alternate_and_no_handback_evidence: EVIDENCE_MISSING_FAIL_CLOSED_PENDING_INDEPENDENT_ARCHITECTURE_REVIEW
  architecture_handback_requires:
    - indispensable_accepted_property_is_in_the_exact_tested_scope
    - exact_configuration_and_support_class_were_prospectively_frozen_and_admitted
    - complete_raw_fault_chain_and_decisive_oracle_evidence_are_preserved
    - evidence_disproves_a_named_accepted_architecture_assumption_or_shows_a_required_accepted_property_cannot_be_satisfied_in_the_claimed_design_envelope
    - the_handback_predicate_is_independently_investigated_and_separately_verified
    - canonical_ADR_handback_set_is_set_equal
  handback_does_not_require:
    - enumeration_or_exhaustion_of_every_imaginable_implementation
    - mathematical_proof_over_unknown_future_technologies
    - repeated_trials_until_no_route_remains_plausible
  e3_001_route_exhaustion_binding_interpretation: >-
    E3-001's all_compliant_route_exhaustion_and_structural_impossibility_predicate is bound here to
    the exact prospectively frozen, materially distinct finite candidate envelope for the same
    accepted property and declared support scope—not an open-ended search over imaginable future
    implementations. A separately verified disproof of the named accepted assumption, or proof that
    the required property cannot be satisfied anywhere inside the architecture's claimed design
    envelope, may establish the structural predicate without executing nominal variants; otherwise
    finite envelope exhaustion triggers classification but does not by itself prove handback.
  finite_candidate_envelope_rule: >-
    Candidate identities and their property-relevant primitives must be frozen prospectively for
    the exact property and support scope. Only materially distinct candidates under
    mechanism_candidate_governance may enter the envelope. Renamed, repackaged, prompt-only,
    nominal, or trivially reconfigured variants remain one correction lineage. Every replacement
    consumes the Founder-approved cumulative correction ceiling; versions, removals, re-additions,
    and new manifests never reset it.
  exhaustion_and_escalation_rule: >-
    When the prospectively frozen candidate envelope or approved correction ceiling is exhausted,
    or no concrete accepted-architecture candidate exists, the lane stops and receives mandatory
    independent architecture classification. Exhaustion alone does not prove architecture failure:
    reviewed evidence that meets the architecture handback predicate produces ARCHITECTURE_HANDBACK;
    reviewed evidence that localizes a defect and names a still-admitted material alternative
    produces IMPLEMENTATION_CONFIGURATION_FAILURE; insufficient evidence produces
    EVIDENCE_MISSING_FAIL_CLOSED. No path authorizes indefinite implementation retry.
  independent_review_must_record:
    - named_accepted_assumption_and_exact_property_scope
    - exact_realization_defect_if_localized
    - prospectively_frozen_candidate_envelope_and_material_distinctness
    - consumed_and_remaining_correction_allowance
    - evidence_for_configuration_handback_unsupported_or_inconclusive_outcome
    - canonical_ADR_set_if_handback
  protocol_author_may_create_handback: false
  e3_may_edit_accepted_adr: false
  handback_action: >-
    Stop the affected lane, preserve the exact raw evidence and provenance, open the exact
    canonical ADR set through governed E2 challenge/fix, obtain fresh E2 architecture verification
    and a renewed E2 gate, then refreeze affected E3 protocols before resuming.

cross_protocol_order_and_reuse:
  e3_004_harness_verification_precedes_any_empirical_attempt: true
  precondition_source: E3_004_VERIFIED_HARNESS_CAPABILITIES_NOT_EMPIRICAL_E3V_VERDICTS
  preconditions:
    - >-
      Before any mutating fixture, E3-004 must have independently verified the harness isolation
      setup/teardown, path confinement, unrelated-state canaries, and mutation observation controls
      required by E3V-003. No E3V-003 empirical verdict is a prerequisite to run E3V-003 or another protocol.
    - >-
      Before any descendant-spawning fixture, E3-004 must have independently verified the harness
      descendant discovery, control, fencing, survivor detection, and cleanup controls required by
      E3V-002. No E3V-002 empirical verdict is a prerequisite to run E3V-002 or another protocol.
    - >-
      Before any protected-marker fixture, E3-004 must have independently verified the harness
      synthetic-marker generation, capture-surface inventory, marker scan, evidence redaction, and
      exact-recipient controls required by E3V-006. No E3V-006 empirical verdict is a prerequisite.
  prospective_dependency_dag:
    PHASE_A_E3_002_AND_E3_003_VERIFIED: E3_004_BUILD_AND_INDEPENDENT_VERIFICATION
    E3_004_BUILD_AND_INDEPENDENT_VERIFICATION: E3_004_VERIFIED
    E3_004_VERIFIED: PHASE_B_EXECUTION_BLOCK_BINDING_AND_INDEPENDENT_VERIFICATION
    PHASE_B_EXECUTION_BLOCK_BINDING_AND_INDEPENDENT_VERIFICATION: PHASE_B_VERIFIED_AND_QPA_APPROVED
    PHASE_B_VERIFIED_AND_QPA_APPROVED: E3_005_PER_LAUNCH_ADMISSION
    E3_005_PER_LAUNCH_ADMISSION: E3_005_RUN_ADMISSION_PASS
    E3_005_RUN_ADMISSION_PASS: ADMITTED_E3V_001_THROUGH_E3V_007_ATTEMPT
    ADMITTED_E3V_001_THROUGH_E3V_007_ATTEMPT: ADMITTED_RAW_RECORDS
    ADMITTED_RAW_RECORDS: E3V_005_CROSS_PROTOCOL_EVIDENCE_CREDIT_CHECK
    E3V_005_CROSS_PROTOCOL_EVIDENCE_CREDIT_CHECK: VERIFIED_DECISIVE_RESULTS
    VERIFIED_DECISIVE_RESULTS: LATER_E3_007_DERIVATION_OR_E3_GATE_SYNTHESIS
  dag_self_dependency_present: false
  empirical_protocol_verdict_required_to_admit_itself: false
  evidence_credit_gate: >-
    Raw records may be collected only after admission, but no cross-protocol synthesis credit is
    granted unless E3V-005 independently validates the applicable evidence and verifier path.
    E3V-005 itself is judged by harness-held state/readback and immutable evidence canaries, not by
    product self-report, avoiding a circular oracle.
  e3v_007_rule: >-
    E3V-007 tests measurement representability and derivation using synthetic protocol-shaped
    records for all eight E1 reliability protocols. It may later reference admitted immutable
    records from other E3V blocks after integrity and contamination checks, but it does not require,
    run, or claim an E3V-008 model benchmark in this task.
  failure_propagation:
    E3V-002_containment_failure: PROCESS_GENERATED_RECORDS_AFTER_LOSS_OF_CONTROL_ARE_UNTRUSTED_AND_AFFECTED_LANE_STOPS
    E3V-003_isolation_failure: MUTATING_FIXTURE_LANE_STOPS_AND_AFFECTED_SCOPE_EVIDENCE_IS_QUARANTINED
    E3V-005_evidence_failure: NO_AFFECTED_E3V_CREDIT_UNTIL_CORRECTED_NEW_BLOCK
    E3V-006_marker_or_capture_failure: SECURITY_HARD_FAILURE_STOPS_ALL_AFFECTED_CAPTURE_OR_PROTECTED_ENTRY_LANES
    E3V-007_measurement_failure: NO_METRIC_OR_THRESHOLD_CREDIT_BUT_OTHER_PROTOCOL_RAW_FACTS_REMAIN_PRESERVED

protocols:
  - e3v_id: E3V-001
    protocol_id: E3V-001-PERSISTENCE-RECOVERY-VALIDATION
    protocol_version: 0.2.0-fixer-draft
    status: READY_FOR_REVIEW_EXECUTION_BLOCKED
    owner_classification: E3_TECHNICAL_VALIDATION_OWNER
    exact_question: >-
      For one exact, later-selected EP-ARCH-C01 persistence/ownership/effect configuration, can
      acknowledged authoritative mutations and effect intent survive the frozen recovery faults
      without stale acceptance, blind replay, duplicate consequential effect, fabricated continuity,
      or transcript/projection authority?
    tested_property: >-
      Acknowledged task, ownership, effect, approval, artifact, evidence, and verification facts
      recover to a legal truthful state after partial write, duplicate intake, owner loss, process
      restart, and ambiguous effect boundaries, while rebuildable or lossy views never become authority.
    linked_architecture_requirements:
      - AR-COR-001
      - AR-COR-007
      - AR-DUR-001
      - AR-DUR-002
      - AR-DUR-003
      - AR-DUR-005
      - AR-APR-002
      - AR-FAIL-001
      - AR-TST-001
