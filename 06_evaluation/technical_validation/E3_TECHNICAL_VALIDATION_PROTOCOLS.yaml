        A selected flush/codec configuration reproducibly loses an acknowledged record, the defect
        is localized to that realization, and a prospectively recorded materially distinct durable
        acknowledgement candidate is admitted by EP-ARCH-C01 for the same scope.
      architecture_classification_required_evidence: >-
        Reproducible acknowledgement loss, duplicate consequential effect, stale authority, or
        fabricated continuity contradicts an indispensable accepted property and requires an
        independent root-cause review rather than automatic configuration labeling.
      canonical_architecture_handback_evidence: >-
        Independent reviewed evidence disproves the accepted sole-writer acknowledgement/effect
        assumption or shows required recovery cannot be satisfied in the claimed EP-ARCH-C01
        design envelope for the frozen class, with the set-equal canonical ADR handback.
      inconclusive_evidence: >-
        A missing acknowledgement/effect/readback segment or integrity failure prevents either
        localization or the handback predicate, yielding EVIDENCE_MISSING_FAIL_CLOSED.
      unsupported_scope_evidence: >-
