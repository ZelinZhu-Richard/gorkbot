      - ADR-E2-008
      - ADR-E2-009
    architecture_assumption: >-
      The accepted system/client/core, execution, capability/approval, evidence, observability, and
      packaging boundaries can provide an exact protected-entry carrier/recipient seam whose authority
      is non-exportable, single-use, revocable, fenced, observable without content exposure, and not
