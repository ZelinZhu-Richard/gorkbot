      conforming EP-ARCH-C01 realization remains plausible. It creates no architecture handback.
    architecture_failure_rule: >-
      ARCHITECTURE_HANDBACK is available only after independent proof that the indispensable accepted
      persistence/ownership/effect property is structurally unrealizable for the exact required
      support class across every compliant route, with the canonical ADR set and raw fault chain.
    missing_or_inconclusive_rule: >-
