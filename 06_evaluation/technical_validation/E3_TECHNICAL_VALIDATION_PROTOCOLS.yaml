  post_result_threshold_exclusion_denominator_or_analysis_change_forbidden: true
  all_unfavorable_attempts_preserved: true
  harness_defect_rule: INDEPENDENTLY_CONFIRMED_DEFECT_INVALIDATES_WHOLE_AFFECTED_BLOCK
  contaminated_evidence_credit: NONE

architecture_failure_classification:
  ordinary_failure_default: IMPLEMENTATION_CONFIGURATION_FAILURE
  unsupported_declared_boundary: PRODUCT_CLASS_UNSUPPORTED
  missing_or_invalid_evidence: EVIDENCE_MISSING_FAIL_CLOSED
  architecture_handback_requires:
    - indispensable_accepted_property_is_in_the_exact_tested_scope
    - exact_configuration_and_support_class_were_prospectively_frozen_and_admitted
    - complete_raw_fault_chain_and_decisive_oracle_evidence_are_preserved
    - every_compliant_allowed_realization_route_for_that_property_and_scope_is_exhausted
    - structural_impossibility_is_independently_investigated_and_separately_verified
    - canonical_ADR_handback_set_is_set_equal
  protocol_author_may_create_handback: false
  e3_may_edit_accepted_adr: false
  handback_action: >-
    Stop the affected lane, preserve the exact raw evidence and provenance, open the exact
    canonical ADR set through governed E2 challenge/fix, obtain fresh E2 architecture verification
    and a renewed E2 gate, then refreeze affected E3 protocols before resuming.

cross_protocol_order_and_reuse:
  e3_004_harness_verification_precedes_any_empirical_attempt: true
  preconditions:
    - E3V-003 isolation controls must be verified for any fixture that mutates a workspace.
    - E3V-002 containment controls must be verified for any fixture that spawns descendants.
    - E3V-006 capture and protected-entry controls must be verified before any protected-marker fixture.
  evidence_credit_gate: >-
    Raw records may be collected only after admission, but no cross-protocol synthesis credit is
    granted unless E3V-005 independently validates the applicable evidence and verifier path.
    E3V-005 itself is judged by harness-held state/readback and immutable evidence canaries, not by
    product self-report, avoiding a circular oracle.
  e3v_007_rule: >-
    E3V-007 tests measurement representability and derivation using synthetic protocol-shaped
    records for all eight E1 reliability protocols. It may later reference admitted immutable
    records from other E3V blocks after integrity and contamination checks, but it does not require,
    run, or claim an E3V-008 model benchmark in this task.
  failure_propagation:
    E3V-002_containment_failure: PROCESS_GENERATED_RECORDS_AFTER_LOSS_OF_CONTROL_ARE_UNTRUSTED_AND_AFFECTED_LANE_STOPS
    E3V-003_isolation_failure: MUTATING_FIXTURE_LANE_STOPS_AND_AFFECTED_SCOPE_EVIDENCE_IS_QUARANTINED
    E3V-005_evidence_failure: NO_AFFECTED_E3V_CREDIT_UNTIL_CORRECTED_NEW_BLOCK
    E3V-006_marker_or_capture_failure: SECURITY_HARD_FAILURE_STOPS_ALL_AFFECTED_CAPTURE_OR_PROTECTED_ENTRY_LANES
    E3V-007_measurement_failure: NO_METRIC_OR_THRESHOLD_CREDIT_BUT_OTHER_PROTOCOL_RAW_FACTS_REMAIN_PRESERVED

protocols:
  - e3v_id: E3V-001
    protocol_id: E3V-001-PERSISTENCE-RECOVERY-VALIDATION
    protocol_version: 0.1.0-author-draft
    status: READY_FOR_REVIEW_EXECUTION_BLOCKED
    owner_classification: E3_TECHNICAL_VALIDATION_OWNER
    exact_question: >-
      For one exact, later-selected EP-ARCH-C01 persistence/ownership/effect configuration, can
      acknowledged authoritative mutations and effect intent survive the frozen recovery faults
      without stale acceptance, blind replay, duplicate consequential effect, fabricated continuity,
      or transcript/projection authority?
    tested_property: >-
      Acknowledged task, ownership, effect, approval, artifact, evidence, and verification facts
      recover to a legal truthful state after partial write, duplicate intake, owner loss, process
      restart, and ambiguous effect boundaries, while rebuildable or lossy views never become authority.
    linked_architecture_requirements:
      - AR-COR-001
      - AR-COR-007
      - AR-DUR-001
      - AR-DUR-002
      - AR-DUR-003
      - AR-DUR-005
      - AR-APR-002
      - AR-FAIL-001
      - AR-TST-001
      - AR-TST-002
      - AR-FUT-001
      - AR-PRF-003
    canonical_handback_adr_ids:
      - ADR-E2-002
      - ADR-E2-003
      - ADR-E2-004
      - ADR-E2-005
      - ADR-E2-007
      - ADR-E2-008
      - ADR-E2-009
    architecture_assumption: >-
      The integrated local core can provide one authoritative writer relationship with explicit
      expected versions, ownership epochs/fences, durable operation/effect intent, receipt and
      readback, and truthful recovery despite non-transactional filesystem or external-effect edges.
    hypotheses:
      primary: >-
        At least one conforming later-selected configuration can reject stale writers, preserve
        every acknowledged authoritative mutation, and reconcile each ambiguous effect without
        duplicate dispatch or false terminal completion.
      null_or_disconfirming: >-
        A required fault loses acknowledged truth, accepts a stale mutation, duplicates an effect,
        uses a derived view as recovery authority, or cannot represent a truthful known/unknown state.
    mechanism_configuration_identity:
      selection_status: NOT_SELECTED_BY_E3_002
      configuration_id: null
      configuration_version: null
      configuration_digest: null
      persistence_mechanism: null
      ownership_and_fencing_mechanism: null
      effect_reconciliation_mechanism: null
      codec_and_migration_configuration: null
