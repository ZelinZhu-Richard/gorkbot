    - architecture_failure_rule
    - missing_or_inconclusive_rule
    - root_cause_decision_rule
    - outcome_reachability_sanity_test
    - qpa_bindings
    - retry_rerun_correction_semantics
    - time_resource_and_cost_limits
    - evidence_contract
    - hard_failures
    - stop_rule
    - run_admission_rule
    - architecture_handback_rule
    - downstream_consumers
    - e4_remainder
    - e5_remainder
    - protocol_execution_contract
  required_protocol_execution_contract_fields:
    - linked_architecture_decisions
    - setup_and_preconditions
    - controlled_inputs
    - intervention_and_actions
    - required_observations
    - fail_closed_disposition
    - contamination_considerations
    - safety_conditions
    - harness_requirements
    - environment_and_currentness_binding
    - protocol_amendment_and_versioning
  prospectively_frozen_fields:
    - protocol_id_version_and_digest
    - tested_property_and_question
    - exact_mechanism_configuration_environment_host_client_and_support_class
    - selected_case_fixture_oracle_seed_composition_and_protocol_sets
    - fault_boundaries_and_execution_order
    - success_failure_inconclusive_exclusion_and_analysis_rules
    - qpa_assignments_and_all_protocol_limits
    - evidence_destinations_integrity_retention_redaction_and_quarantine
    - stop_hard_failure_contamination_and_handback_rules
    - supported_and_unsupported_scope
  freeze_timing_rule: >-
    Freeze is two phase. PHASE_A_PROTOCOL_CRITERIA_FROZEN_HARNESS_IMPLEMENTABLE independently
    verifies the question, required fixtures and observations, oracle and outcome semantics,
    hard failures, support/evidence/handback contracts, QPA binding points, and mechanism metadata
    interface. Phase A is sufficient for E3-004 to implement and verify a parameterized harness;
    it does not require or imply an exact harness digest, selected mechanism, approved QPA values,
    final limits, admission, or execution readiness. Only after E3-004 is independently VERIFIED
    may PHASE_B_EXECUTION_BLOCK_FROZEN_EXECUTION_READINESS_CANDIDATE bind the exact harness,
    mechanism/configuration/environment/support class, Founder-approved QPA values, all limits,
    selectors/order, evidence destinations, and other material run inputs. Phase B then requires
    its own independent verification and per-launch admission before any result exists or is inspected.
  amendment_rule: >-
    Any material change creates a new protocol or configuration version, a new complete affected
    block and single-use manifest, and a new prospective freeze. Prior raw evidence and unfavorable
    outcomes remain immutable and separately reported. A passing result may never be combined with
    a later case, oracle, seed, order, threshold, exclusion, grader, or analysis change.
  result_informed_change_forbidden: true

outcome_vocabulary:
  canonical_root_cause_outcomes:
    - VALIDATED_FOR_TESTED_SCOPE_ONLY
    - IMPLEMENTATION_CONFIGURATION_FAILURE
    - PRODUCT_CLASS_UNSUPPORTED
    - EVIDENCE_MISSING_FAIL_CLOSED
    - ARCHITECTURE_HANDBACK
  protocol_matrix:
    PASS_SUPPORTED_SCOPE: VALIDATED_FOR_TESTED_SCOPE_ONLY
    FAIL_CONFIGURATION: IMPLEMENTATION_CONFIGURATION_FAILURE
    UNSUPPORTED_DECLARED_SCOPE: PRODUCT_CLASS_UNSUPPORTED
    INCONCLUSIVE_OR_MISSING_EVIDENCE: EVIDENCE_MISSING_FAIL_CLOSED
    INDEPENDENT_STRUCTURAL_IMPOSSIBILITY: ARCHITECTURE_HANDBACK
  hard_failure_is_root_cause_outcome: false
  hard_failure_rule: >-
    HARD_FAILURE is an orthogonal non-compensating stop condition. It immediately stops and fences
    the affected tuple, preserves and quarantines evidence, and blocks credit. A separate independent
    root-cause decision must still classify the affected tuple using the canonical root-cause outcomes.
  no_average_or_later_pass_can_compensate: true
  no_cross_protocol_verdict_substitution: true

