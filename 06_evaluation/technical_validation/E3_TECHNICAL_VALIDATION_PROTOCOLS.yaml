    success_rule: >-
      Every required input for all eight frozen E1 protocols is representable and truthfully
      attributable; missingness remains explicit; each future frozen finite limit denies disallowed
      dispatch and stops productive work; raw and independent derived results match; protocol
      populations and thresholds remain unchanged; telemetry remains non-authoritative; no hard failure occurs.
    implementation_configuration_failure_rule: >-
      A defect in the selected clock, observer, correlation, resource meter, limiter, derivation,
      fixture, or reference-environment configuration is IMPLEMENTATION_CONFIGURATION_FAILURE when a
      conforming allowed EP-ARCH-C01 realization remains available.
    architecture_failure_rule: >-
      ARCHITECTURE_HANDBACK is available only if an indispensable frozen protocol input is structurally
      unrepresentable or a mandatory finite ceiling is structurally unenforceable across every
      compliant realization for the required class, independently proven against ADR-E2-001/002/007/008/009.
    missing_or_inconclusive_rule: >-
      Missing raw inputs, environment identity, clock basis, limit decision, resource use, derivation,
      or contamination evidence yields EVIDENCE_MISSING_FAIL_CLOSED. An unbound observable boundary
      or resource class is PRODUCT_CLASS_UNSUPPORTED. Unknown values remain unknown, never estimated.
    root_cause_decision_rule:
      operator_may_decide: false
      independent_measurement_investigator_required: true
      separate_verifier_required_for_handback: true
      telemetry_or_metric_self_consistency_is_architecture_proof: false
    qpa_bindings:
      verification_rerun_ceiling_per_case_or_task: null
      deterministic_required_check_repetition_rule_per_check_or_class: null
      correction_attempt_ceiling_per_case_or_task: null
      status: FOUNDER_DECISION_REQUIRED
    retry_rerun_correction_semantics:
      execution_retry_ceiling: null
      run_repetition_count: null
      maximum_repeated_failure_ceiling: null
      retry_rule: ONLY_FROZEN_TRANSIENT_CAPTURE_FAILURE_NEVER_MISSING_RAW_OR_LIMIT_BYPASS
      rerun_rule: NEW_RUN_FRESH_ADMISSION_UNCHANGED_POPULATION_THRESHOLD_DERIVATION_AND_ORDER
      correction_rule: NEW_INSTRUMENTATION_PROTOCOL_OR_ENVIRONMENT_VERSION_AND_NEW_WHOLE_BLOCK
      mixed_equivalent_results: FLAKY_NO_PASS_CREDIT_AND_REPORTED_AS_MEASUREMENT
    time_resource_and_cost_limits:
