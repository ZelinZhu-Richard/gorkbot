    tested_property: >-
      Protected acquisition, storage reference, delivery, use, revocation, fencing, capture exclusion,
      replacement/recovery, and receipts remain structurally enforced outside model judgment. The raw
      synthetic marker appears only inside the explicitly authorized protected recipient boundary and
      never on any other mandatory observable surface.
